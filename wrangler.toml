# Cloudflare Pages configuration — seek landing page
# Used by the Git-integrated Pages project.
# Dashboard config mirror: output directory = "examples", build command = empty.

name = "seek"
compatibility_date = "2025-01-01"

[pages]
# The examples/ directory is self-contained static content (no build step).
# Go source, binaries, and docs/ are excluded from the deployment.
output_dir = "examples"

[env.production]
route = { pattern = "seek.whyiyhw.com", zone_name = "whyiyhw.com" }
