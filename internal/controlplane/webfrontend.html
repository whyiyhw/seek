<!doctype html>
<!-- seek web MVP (card c_qucxtu) — single page, zero build chain.
     Message rendering: minimal markdown per feature-web-frontend §2.6
     — fenced ``` blocks → <pre>, `inline` → <code>, everything else
     verbatim plain text; DOM API only (§5.5), no HTML-parsing sink.
     Conversation identity (W1.3, D-W3): uuid minted by the browser,
     persisted in localStorage, carried as X-Seek-Conversation on
     fetches and ?conv= on the SSE stream (EventSource cannot set
     headers); the server keeps zero session state.
     Auth (W1.2): the /?token= first hop 303-exchanges the token into
     an HttpOnly cookie and scrubs the URL; this page rides the cookie
     (fetch/EventSource send it same-origin) — the token never reaches
     JS. The write side clears the server's Origin gate for free
     (browsers attach Origin to every POST).
     Sessions browser (W4.4, asset plane UI #1): a master-detail view
     over POST /rpc — session/list drives the list pane, a click opens
     session/get (meta line) + session/messages walked page by page via
     next_cursor (50/page, "load more" appends; the DOM only ever holds
     what was paged in, so a long transcript stays at virtual-scroll
     order of magnitude). Same textContent-only discipline as chat.
     Memory browser + stats view (W4.5, asset plane UI #2): memory/
     projects drives the project picker, memory/list the entry list,
     memory/get the detail (rendered by the chat renderer); the stats
     view rides stats/cache (session picker from session/list) — the
     cache/cost card shows hit ratio + cost_usd, priced SERVER-side
     (the client never prices; §2.5).
     Deliberately out of scope: multi-tab sync, history persistence,
     FULL markdown rendering (P3 §4.2 vendor evaluation), task panels,
     mobile, real auth (design card c_7pptol owns the full UI). -->
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>seek</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 ui-monospace, Menlo, monospace;
         background: #14161a; color: #d7dae0; display: flex; flex-direction: column;
         height: 100vh; }
  #status { padding: 8px 14px; background: #1b1e24; border-bottom: 1px solid #2a2e36;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #status .ok { color: #7ec699; }
  #status .warn { color: #d8a657; }
  #list { flex: 1; overflow-y: auto; padding: 14px; }
  .msg { max-width: 86%; margin: 4px 0; padding: 8px 12px; border-radius: 8px;
         white-space: pre-wrap; word-break: break-word; }
  .msg pre { background: #14161a; border: 1px solid #2a2e36; border-radius: 6px;
             padding: 8px 10px; margin: 6px 0; overflow-x: auto;
             white-space: pre; font: inherit; }
  .msg code { background: #1b1e24; border-radius: 4px; padding: 0 4px; }
  .you { margin-left: auto; background: #2c3d5f; }
  .seek { background: #242830; }
  .hint { color: #7a8089; font-style: italic; }
  form { display: flex; gap: 8px; padding: 10px 14px; background: #1b1e24;
         border-top: 1px solid #2a2e36; }
  #input { flex: 1; background: #14161a; color: inherit; border: 1px solid #2a2e36;
           border-radius: 6px; padding: 8px 10px; font: inherit; outline: none; }
  #input:focus { border-color: #4a5568; }
  button { background: #2c3d5f; color: inherit; border: 0; border-radius: 6px;
           padding: 8px 16px; font: inherit; cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }

  /* ---- 会话浏览器（W4.4 资产面 UI·一）---- */
  #bar { display: flex; gap: 8px; padding: 6px 14px; background: #1b1e24;
         border-bottom: 1px solid #2a2e36; }
  #bar button { padding: 4px 12px; font-size: 13px; }
  /* 三个资产面板共用「browsing 隐聊天」总闸；各自的 *-view 类挑一个面板亮 */
  #browser { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  body:not(.sess-view) #browser { display: none; }
  body.browsing #list, body.browsing form { display: none; }
  #browser-body { flex: 1; display: flex; min-height: 0; }
  #sess-list { width: 320px; flex: none; overflow-y: auto;
               border-right: 1px solid #2a2e36; }
  .sess-row { display: block; width: 100%; text-align: left; border-radius: 0;
              border-bottom: 1px solid #22252c; padding: 8px 12px; }
  .sess-row .t1 { display: block; overflow: hidden; text-overflow: ellipsis;
                  white-space: nowrap; }
  .sess-row .t2 { display: block; color: #7a8089; font-size: 12px;
                  margin-top: 2px; }
  .sess-row.cur { background: #2c3d5f; }
  #sess-detail { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #sess-meta { padding: 6px 14px; border-bottom: 1px solid #2a2e36;
               color: #7a8089; white-space: nowrap; overflow: hidden;
               text-overflow: ellipsis; }
  #sess-msgs { flex: 1; overflow-y: auto; padding: 14px; }
  .smsg { margin: 6px 0; padding: 8px 12px; border-radius: 8px;
          background: #242830; white-space: pre-wrap; word-break: break-word; }
  .smsg.user { background: #2c3d5f; }
  .smsg.tool { background: #1b1e24; color: #9aa0a8; }
  .smsg.tool pre { background: #14161a; }
  .swho { font-size: 11px; color: #7a8089; margin-bottom: 4px; }
  .stool { color: #d8a657; }
  /* 工具结果限高：单条大输出不把整页 paint 撑爆（分页外的第二道界） */
  .smsg.tool .sbody { max-height: 260px; overflow-y: auto; }
  #sess-foot { padding: 8px 14px; text-align: center; border-top: 1px solid #2a2e36;
               color: #7a8089; }
  #sess-foot button { width: 100%; }
  .pane-hint { color: #7a8089; font-style: italic; padding: 14px; }

  /* ---- 记忆浏览器 + 统计视图（W4.5 资产面 UI·二）---- */
  .pane { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  body:not(.mem-view) #memory { display: none; }
  body:not(.stat-view) #stats { display: none; }
  .pane-head { display: flex; gap: 8px; align-items: center; padding: 6px 14px;
               border-bottom: 1px solid #2a2e36; }
  .pane-head select { background: #14161a; color: inherit; border: 1px solid #2a2e36;
                      border-radius: 6px; padding: 4px 8px; font: inherit;
                      max-width: 60%; }
  .pane-head .cnt { color: #7a8089; font-size: 12px; }
  #mem-body { flex: 1; display: flex; min-height: 0; }
  #mem-list { width: 320px; flex: none; overflow-y: auto;
              border-right: 1px solid #2a2e36; }
  .mem-row { display: block; width: 100%; text-align: left; border-radius: 0;
             border-bottom: 1px solid #22252c; padding: 8px 12px; }
  .mem-row.cur { background: #2c3d5f; }
  .mem-row .t1 { display: block; overflow: hidden; text-overflow: ellipsis;
                 white-space: nowrap; }
  .mem-row .t2 { display: block; color: #7a8089; font-size: 12px; margin-top: 2px;
                 overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #mem-detail { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #mem-meta { padding: 6px 14px; border-bottom: 1px solid #2a2e36; color: #7a8089; }
  #mem-tags { padding: 4px 14px; border-bottom: 1px solid #2a2e36; }
  #mem-tags .chip { display: inline-block; background: #1b1e24; border: 1px solid #2a2e36;
                    border-radius: 10px; padding: 0 8px; margin: 2px 4px 2px 0;
                    font-size: 12px; color: #9aa0a8; }
  #mem-content { flex: 1; overflow-y: auto; padding: 14px;
                 white-space: pre-wrap; word-break: break-word; }
  #mem-content pre { background: #14161a; border: 1px solid #2a2e36; border-radius: 6px;
                     padding: 8px 10px; margin: 6px 0; overflow-x: auto;
                     white-space: pre; font: inherit; }
  #mem-content code { background: #1b1e24; border-radius: 4px; padding: 0 4px; }
  #stat-body { flex: 1; overflow-y: auto; padding: 14px; }
  .stat-card { background: #242830; border-radius: 8px; padding: 12px 14px;
               margin-bottom: 12px; }
  .stat-card h3 { margin: 0 0 8px; font-size: 13px; color: #9aa0a8; font-weight: normal; }
  .stat-row { display: flex; justify-content: space-between; gap: 12px;
              padding: 3px 0; }
  .stat-row .v { color: #d7dae0; }
  .stat-row .v.usd { color: #7ec699; }
  .stat-bar { height: 10px; border-radius: 5px; background: #2c3d5f; overflow: hidden;
              margin-top: 8px; }
  .stat-bar .hit { height: 100%; background: #7ec699; }
</style>
</head>
<body>
<header id="status" class="warn">连接中…</header>
<nav id="bar">
  <button id="browse-btn" type="button">📚 会话</button>
  <button id="mem-btn" type="button">🧠 记忆</button>
  <button id="stat-btn" type="button">📊 统计</button>
</nav>
<main id="list"></main>
<section id="browser">
  <div id="browser-body">
    <div id="sess-list"></div>
    <div id="sess-detail">
      <div id="sess-meta"></div>
      <div id="sess-msgs"></div>
      <div id="sess-foot"></div>
    </div>
  </div>
</section>
<section id="memory" class="pane">
  <div class="pane-head">
    <select id="mem-proj" aria-label="项目"></select>
    <span class="cnt" id="mem-cnt"></span>
  </div>
  <div id="mem-body">
    <div id="mem-list"></div>
    <div id="mem-detail">
      <div id="mem-meta"></div>
      <div id="mem-tags"></div>
      <div id="mem-content"></div>
    </div>
  </div>
</section>
<section id="stats" class="pane">
  <div class="pane-head">
    <select id="stat-sess" aria-label="会话"></select>
  </div>
  <div id="stat-body"></div>
</section>
<form id="form">
  <input id="input" autocomplete="off" placeholder="/bind <项目路径> 或直接发消息" autofocus>
  <button id="send">发送</button>
</form>
<script>
'use strict';
// W1.2 换票：/?token= 首跳被服务端 303 换成 HttpOnly cookie，本页落在
// 干净的 / 上——正常路径 TOKEN 恒为空，鉴权靠 cookie（fetch/EventSource
// 同源自带）。仍读 URL 是给未换票直开的形态兜底（能读到的只会是错 token）。
const TOKEN = new URLSearchParams(location.search).get('token') || '';
const q = s => s + (s.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(TOKEN);

// 会话身份（W1.3，D-W3）：uuid 浏览器自铸、localStorage 持久；服务端
// 零会话状态——它只是 bindings 表的键（web:<uuid>）。localStorage 不可
// 用（隐私模式抛异常）时退化为本次页面加载的临时 uuid。
const CONV_KEY = 'seek-web-conv';
function mintConv() {
  // crypto.randomUUID 仅 secure context（localhost/https）可用；经
  // tailnet IP 直连是 http，退到 getRandomValues 拼 uuid v4。
  if (crypto.randomUUID) return crypto.randomUUID();
  const b = crypto.getRandomValues(new Uint8Array(16));
  b[6] = (b[6] & 0x0f) | 0x40;
  b[8] = (b[8] & 0x3f) | 0x80;
  const h = [...b].map(x => x.toString(16).padStart(2, '0')).join('');
  return [h.slice(0,8), h.slice(8,12), h.slice(12,16), h.slice(16,20), h.slice(20)].join('-');
}
let CONV = null;
try {
  CONV = localStorage.getItem(CONV_KEY);
  if (!CONV || !/^[A-Za-z0-9._-]{1,64}$/.test(CONV)) {
    CONV = mintConv();
    localStorage.setItem(CONV_KEY, CONV);
  }
} catch (e) { CONV = mintConv(); }
const status = document.getElementById('status');
const list = document.getElementById('list');
const form = document.getElementById('form');
const input = document.getElementById('input');
const send = document.getElementById('send');

function setStatus(text, ok) {
  status.textContent = text;
  status.className = ok ? 'ok' : 'warn';
}
// 行内码：`code` → <code>，未配对反引号原样保留。文本只走
// createTextNode/textContent——模型输出永远不被当 HTML 解析（§5.5）。
function appendInline(parent, text) {
  for (;;) {
    const i = text.indexOf('`');
    if (i < 0) break;
    if (i > 0) parent.appendChild(document.createTextNode(text.slice(0, i)));
    const j = text.indexOf('`', i + 1);
    if (j < 0) { parent.appendChild(document.createTextNode(text.slice(i))); return; }
    const code = document.createElement('code');
    code.textContent = text.slice(i + 1, j);
    parent.appendChild(code);
    text = text.slice(j + 1);
  }
  if (text) parent.appendChild(document.createTextNode(text));
}

// 最小 markdown 渲染（§2.6 MVP，卡 c_iha3fr）：行首 ``` 围栏 → <pre>，
// 其余纯文本原样（换行交给 .msg 的 pre-wrap）。未闭合围栏吞到文本末尾。
// 只用 createElement/createTextNode——整页不存在 HTML 字符串解析路径。
function renderBody(el, text) {
  const lines = text.split('\n');
  let i = 0, plain = '';
  const flush = () => { if (plain) { appendInline(el, plain); plain = ''; } };
  while (i < lines.length) {
    if (lines[i].startsWith('```')) {
      flush();
      const buf = [];
      i++;
      while (i < lines.length && !lines[i].startsWith('```')) { buf.push(lines[i]); i++; }
      i++;  // 越过闭合围栏；到 EOF 即未闭合——吞到末尾（已定义行为）
      const pre = document.createElement('pre');
      pre.textContent = buf.join('\n');
      el.appendChild(pre);
    } else {
      plain += lines[i] + (i < lines.length - 1 ? '\n' : '');
      i++;
    }
  }
  flush();
}

function addMsg(who, text) {
  const el = document.createElement('div');
  el.className = 'msg ' + who;
  renderBody(el, text);                // 纯 DOM 构建：无 HTML 注入面
  list.appendChild(el);
  list.scrollTop = list.scrollHeight;  // 流式追加：贴底滚动
}

// 绑定状态一行：GET /state（本 conv 的 binding，头携带会话身份）。返回
// 是否已鉴权——启动时据此决定挂不挂 SSE（W1.2：凭证可能是 cookie，页内
// 无从预判，探测是唯一权威）。
async function refreshState() {
  try {
    const r = await fetch(q('/state'), { headers: { 'X-Seek-Conversation': CONV } });
    if (r.status === 401) {
      setStatus('token 无效或未带——用 /?token=<serve 启动时打印的值> 打开', false);
      return false;
    }
    const s = await r.json();
    setStatus(s.bound ? '已绑定 ' + s.project + (s.session ? ' · 会话 ' + s.session.slice(0, 8) : '')
                      : '未绑定——发 /bind <项目路径>（或 /projects 看候选）', s.bound);
    return true;
  } catch (e) { setStatus('连不上 /state：' + e, false); return false; }
}

// SSE 下行：seek 的回复逐条追加。EventSource 不能设头，conv 走查询参数；
// 鉴权走 cookie（换票后）或 TOKEN 查询参数（旧形态），两者服务端同权。
function listen() {
  const es = new EventSource(q('/events?conv=' + encodeURIComponent(CONV)));
  es.onmessage = ev => {
    try {
      const m = JSON.parse(ev.data);
      if (m.text) addMsg('seek', m.text);
      refreshState();                   // 回复可能改了绑定（/bind 等）
    } catch (e) { addMsg('hint', '（无法解析的回复）'); }
  };
  es.onerror = () => setStatus('SSE 断开，自动重连中…', false);
}

// 上行：POST /msg，指令原样透传给路由（/bind /projects /switch /new /cancel）。
form.addEventListener('submit', async ev => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text || send.disabled) return;
  addMsg('you', text);
  input.value = '';
  send.disabled = true;
  try {
    const r = await fetch(q('/msg'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Seek-Conversation': CONV },
      body: JSON.stringify({ text }),
    });
    if (r.status === 401) addMsg('hint', '（token 无效，消息未送达——用带 ?token= 的地址打开）');
    else if (!r.ok) addMsg('hint', '（发送失败：HTTP ' + r.status + '）');
  } catch (e) { addMsg('hint', '（发送失败：' + e + '）'); }
  send.disabled = false;
  input.focus();
});

// ---- 会话浏览器（W4.4 资产面 UI·一）----
// 消费 W4.2 已合并的 /rpc method 集：session/list 驱动列表、session/get
// 出元信息行、session/messages 沿 next_cursor 逐页翻（50/页，「加载更多」
// 追加）。DOM 只装已翻进的页——长 transcript 的常驻渲染量级与虚拟滚动同
// 级，服务端与页面都不整读。渲染纪律与聊天面同源：textContent-only。
const browseBtn = document.getElementById('browse-btn');
const sessList = document.getElementById('sess-list');
const sessMeta = document.getElementById('sess-meta');
const sessMsgs = document.getElementById('sess-msgs');
const sessFoot = document.getElementById('sess-foot');
const MSG_PAGE = 50;
let sel = null;  // 打开中的会话分页游标 {sid, next, done, busy}

// JSON-RPC 2.0 envelope（W4.1）：一次 POST 一个调用；错误以异常上抛，
// 由各窗格自行展示。id 用自增整数——浏览器不重投，无需全局唯一。
let rpcSeq = 1;
async function rpc(method, params) {
  const r = await fetch(q('/rpc'), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ jsonrpc: '2.0', id: rpcSeq++, method, params }),
  });
  if (r.status === 401) throw new Error('token 无效——用带 ?token= 的地址打开');
  const j = await r.json();
  if (j.error) throw new Error('[' + j.error.code + '] ' + j.error.message);
  return j.result;
}

function paneHint(el, text) {
  const d = document.createElement('div');
  d.className = 'pane-hint';
  d.textContent = text;
  el.replaceChildren(d);
}

async function loadSessions() {
  paneHint(sessList, '加载中…');
  try {
    const res = await rpc('session/list', {});
    sessList.replaceChildren();
    if (!res.sessions.length) return paneHint(sessList, '（没有历史会话）');
    for (const s of res.sessions) {
      const row = document.createElement('button');
      row.type = 'button';
      row.className = 'sess-row';
      row.dataset.sid = s.sid;
      if (sel && sel.sid === s.sid) row.classList.add('cur');
      const t1 = document.createElement('span');
      t1.className = 't1';
      t1.textContent = s.title || '（无标题）';
      const t2 = document.createElement('span');
      t2.className = 't2';
      const when = s.last_at ? new Date(s.last_at).toLocaleString() : '';
      t2.textContent = when + ' · ' + s.turns + ' turns · ' + (s.model || '?');
      row.appendChild(t1);
      row.appendChild(t2);
      row.addEventListener('click', () => openSession(s.sid));
      sessList.appendChild(row);
    }
  } catch (e) { paneHint(sessList, 'session/list 失败：' + e.message); }
}

async function openSession(sid) {
  sel = { sid, next: '', done: false, busy: false };
  sessMeta.textContent = '';
  sessMsgs.replaceChildren();
  paneHint(sessFoot, '');
  for (const row of sessList.children) row.classList.toggle('cur', row.dataset.sid === sid);
  loadMeta(sid);
  loadMsgs();
}

// 元信息行：模型/turns/累计 tokens/cwd。装饰性数据，失败只落在本行。
async function loadMeta(sid) {
  try {
    const g = await rpc('session/get', { sid });
    if (!sel || sel.sid !== sid) return;  // 返回前已切走：丢弃
    const u = g.cumulative_usage || {};
    sessMeta.textContent = (g.header.model || '?') + ' · ' + g.turns + ' turns · '
      + ((u.prompt_tokens || 0) + (u.completion_tokens || 0)) + ' tokens · '
      + (g.header.cwd || '');
  } catch (e) { sessMeta.textContent = 'session/get 失败：' + e.message; }
}

async function loadMsgs() {
  const me = sel;
  if (!me || me.busy || me.done) return;
  me.busy = true;
  paneHint(sessFoot, me.next ? '加载中…' : '读取中…');
  try {
    const params = { sid: me.sid, limit: MSG_PAGE };
    if (me.next) params.cursor = me.next;
    const res = await rpc('session/messages', params);
    if (sel !== me) return;  // 翻页期间切了会话：旧游标作废
    for (const raw of res.messages) appendMsg(raw);
    if (res.next_cursor) {
      me.next = res.next_cursor;
      const more = document.createElement('button');
      more.type = 'button';
      more.textContent = '加载更多（已显示 ' + sessMsgs.children.length + ' 条）';
      more.addEventListener('click', loadMsgs);
      sessFoot.replaceChildren(more);
    } else {
      me.done = true;
      paneHint(sessFoot, sessMsgs.children.length ? '— 已到末尾 —' : '（无消息）');
    }
  } catch (e) {
    paneHint(sessFoot, 'session/messages 失败：' + e.message);
  }
  me.busy = false;
}

// 一条消息行：角色标签 + 工具调用摘要（参数截断）+ 正文走 renderBody。
// reasoning_content 不渲染（与聊天面 §2.5 同取舍）；tool 结果限高由 CSS 承担。
// messages 元素是服务端的 json.RawMessage——经 r.json() 已是对象；string 分支
// 只是防御（jse 一致性由 W4.2 的服务端测试钉）。
function appendMsg(raw) {
  let m;
  try { m = typeof raw === 'string' ? JSON.parse(raw) : raw; } catch (e) { return; }
  if (!m || typeof m !== 'object') return;
  const el = document.createElement('div');
  el.className = 'smsg ' + (m.role || 'other');
  const who = document.createElement('div');
  who.className = 'swho';
  who.textContent = m.role === 'tool' ? 'tool · ' + (m.tool_call_id || '') : (m.role || '?');
  el.appendChild(who);
  if (Array.isArray(m.tool_calls)) {
    for (const tc of m.tool_calls) {
      const t = document.createElement('div');
      t.className = 'stool';
      const fn = tc.function || {};
      let args = fn.arguments || '';
      if (args.length > 120) args = args.slice(0, 120) + '…';
      t.textContent = '⚙ ' + (fn.name || '?') + '(' + args + ')';
      el.appendChild(t);
    }
  }
  if (m.content) {
    const body = document.createElement('div');
    body.className = 'sbody';
    renderBody(body, m.content);
    el.appendChild(body);
  }
  sessMsgs.appendChild(el);
}

const memBtn = document.getElementById('mem-btn');
const statBtn = document.getElementById('stat-btn');
browseBtn.addEventListener('click', () => togglePane('sessions', browseBtn, '📚 会话'));
memBtn.addEventListener('click', () => togglePane('memory', memBtn, '🧠 记忆'));
statBtn.addEventListener('click', () => togglePane('stats', statBtn, '📊 统计'));

// 三面板共用的开合闸（W4.5 把 W4.4 的 browsing 一位类拆成「browsing=隐聊天
// + 恰好一个 *-view 亮面板」）：再点当前面板的按钮回聊天面。进面板即重拉
// 数据（磁盘世界会变旧，与 loadSessions 同一取舍）。
const panes = {
  sessions: { btn: browseBtn, label: '📚 会话', cls: 'sess-view', load: loadSessions },
  memory:   { btn: memBtn,    label: '🧠 记忆', cls: 'mem-view',   load: loadMemPane },
  stats:    { btn: statBtn,   label: '📊 统计', cls: 'stat-view',  load: loadStatPane },
};
function togglePane(name, btn, label) {
  const active = !document.body.classList.contains(panes[name].cls);
  for (const p of Object.values(panes)) {
    document.body.classList.toggle(p.cls, false);
    p.btn.textContent = p.label;
  }
  if (active) {
    document.body.classList.add(panes[name].cls, 'browsing');
    btn.textContent = '💬 聊天';
    panes[name].load();
  } else {
    document.body.classList.remove('browsing');
  }
}

// ---- 记忆浏览器（W4.5 资产面 UI·二）----
// 消费 W4.3 的 memory/projects|list|get：项目下拉（memory/projects，新→旧）
// 挑 project_id，列表出该项目的条目（memory/list，含 stale 标记），点开
// 单条详情（memory/get，正文走聊天面同一 renderBody）。渲染纪律不变：
// textContent-only。memSel 防「响应回来前已切走」的串台（与 sel 同构）。
const memProj = document.getElementById('mem-proj');
const memCnt = document.getElementById('mem-cnt');
const memList = document.getElementById('mem-list');
const memMeta = document.getElementById('mem-meta');
const memTags = document.getElementById('mem-tags');
const memContent = document.getElementById('mem-content');
let memSel = null;  // {proj, name} 当前打开的详情；null = 未开

async function loadMemPane() {
  paneHint(memList, '加载中…');
  try {
    const res = await rpc('memory/projects', {});
    memProj.replaceChildren();
    if (!res.projects.length) {
      memCnt.textContent = '';
      memSel = null;
      memMeta.textContent = ''; memTags.replaceChildren(); memContent.replaceChildren();
      return paneHint(memList, '（磁盘上没有项目——先在终端里用 seek 跑一阵）');
    }
    for (const p of res.projects) {
      const opt = document.createElement('option');
      opt.value = p.project_id;
      opt.textContent = p.project_id.slice(0, 8) + ' · ' + p.memories + ' 条 · '
        + new Date(p.last_active_at).toLocaleDateString();
      memProj.appendChild(opt);
    }
    loadMemList(memProj.value);
  } catch (e) { paneHint(memList, 'memory/projects 失败：' + e.message); }
}

async function loadMemList(proj) {
  memSel = null;
  memMeta.textContent = ''; memTags.replaceChildren(); memContent.replaceChildren();
  paneHint(memList, '加载中…');
  try {
    const res = await rpc('memory/list', { project_id: proj });
    memList.replaceChildren();
    memCnt.textContent = res.memories.length + ' 条记忆';
    if (!res.memories.length) return paneHint(memList, '（这个项目还没有记忆）');
    for (const m of res.memories) {
      const row = document.createElement('button');
      row.type = 'button';
      row.className = 'mem-row';
      row.dataset.name = m.name;
      const t1 = document.createElement('span');
      t1.className = 't1';
      t1.textContent = (m.pinned ? '📌 ' : '') + m.name;
      const t2 = document.createElement('span');
      t2.className = 't2';
      t2.textContent = (m.stale ? '⚠ 过期 · ' : '') + (m.tagline || '')
        + ' · ' + new Date(m.updated_at).toLocaleDateString();
      row.appendChild(t1);
      row.appendChild(t2);
      row.addEventListener('click', () => openMem(proj, m.name));
      memList.appendChild(row);
    }
  } catch (e) { paneHint(memList, 'memory/list 失败：' + e.message); }
}

async function openMem(proj, name) {
  memSel = { proj, name };
  memMeta.textContent = '读取中…';
  memTags.replaceChildren();
  memContent.replaceChildren();
  for (const row of memList.children) row.classList.toggle('cur', row.dataset.name === name);
  try {
    const m = await rpc('memory/get', { project_id: proj, name });
    if (!memSel || memSel.proj !== proj || memSel.name !== name) return;  // 已切走：丢弃
    const bits = [m.name, m.tagline || ''];
    bits.push('建于 ' + new Date(m.created_at).toLocaleString());
    bits.push('更新 ' + new Date(m.updated_at).toLocaleString());
    bits.push('召回 ' + m.recall_count + ' 次');
    if (m.pinned) bits.push('📌 常驻');
    if (m.stale) bits.push('⚠ 过期待回收');
    if (m.auto_sourced) bits.push('auto');
    memMeta.textContent = bits.join(' · ');
    for (const t of (m.tags || [])) {
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.textContent = '#' + t;
      memTags.appendChild(chip);
    }
    renderBody(memContent, m.content || '（无正文）');
  } catch (e) {
    memMeta.textContent = 'memory/get 失败：' + e.message;
  }
}

memProj.addEventListener('change', () => loadMemList(memProj.value));

// ---- 统计视图（W4.5 资产面 UI·二）----
// 消费 W4.3 的 stats/cache（cost_usd 服务端算——「client never prices」，
// 页面永不带费率卡）+ W4.2 的 session/list 当会话选择器（缺省最新）。
// 命中率条宽经 CSSOM（el.style.width）设置——style 属性才归 CSP 管，
// CSSOM 不受 style-src 限制，且宽度只可能是数字。
const statSess = document.getElementById('stat-sess');
const statBody = document.getElementById('stat-body');

// 与服务端成本展示同刻度的格式化（只排版数值，不携带任何费率——费率
// 只住在服务端的费率表里）：
// $0 / 4 位小数（分以下）/ 3 位（一美元内）/ 2 位。
function fmtUSD(c) {
  if (!c) return '$0';
  if (c < 0.01) return '$' + c.toFixed(4);
  if (c < 1) return '$' + c.toFixed(3);
  return '$' + c.toFixed(2);
}

async function loadStatPane() {
  paneHint(statBody, '加载中…');
  try {
    const res = await rpc('session/list', {});
    statSess.replaceChildren();
    if (!res.sessions.length) {
      return paneHint(statBody, '（没有历史会话——先在终端里用 seek 跑一阵）');
    }
    for (const s of res.sessions) {
      const opt = document.createElement('option');
      opt.value = s.sid;
      const when = s.last_at ? new Date(s.last_at).toLocaleString() : '';
      opt.textContent = (s.title || s.sid.slice(0, 8)) + (when ? ' · ' + when : '');
      statSess.appendChild(opt);
    }
    showStats(statSess.value);
  } catch (e) { paneHint(statBody, 'session/list 失败：' + e.message); }
}

async function showStats(sid) {
  if (!sid) return;
  const me = sid;
  paneHint(statBody, '读取中…');
  try {
    const r = await rpc('stats/cache', { sid });
    if (statSess.value !== me) return;  // 响应回来前已切走：丢弃
    const u = r.usage || {};
    statBody.replaceChildren();

    const cache = document.createElement('div');
    cache.className = 'stat-card';
    cache.appendChild(cardTitle('前缀缓存 · ' + r.sid.slice(0, 8) + ' · ' + (r.model || '?')));
    const hit = u.prompt_cache_hit_tokens || 0, miss = u.prompt_cache_miss_tokens || 0;
    const prompt = (u.prompt_tokens != null ? u.prompt_tokens : hit + miss);
    const ratio = (typeof r.hit_ratio === 'number') ? r.hit_ratio : 0;
    cache.appendChild(statRow('命中 / 未命中', hit.toLocaleString() + ' / ' + miss.toLocaleString()));
    cache.appendChild(statRow('命中率', (ratio * 100).toFixed(1) + '%'));
    const bar = document.createElement('div');
    bar.className = 'stat-bar';
    const fill = document.createElement('div');
    fill.className = 'hit';
    fill.style.width = (Math.min(1, Math.max(0, ratio)) * 100).toFixed(1) + '%';
    bar.appendChild(fill);
    cache.appendChild(bar);
    statBody.appendChild(cache);

    const tok = document.createElement('div');
    tok.className = 'stat-card';
    tok.appendChild(cardTitle('累计 tokens'));
    tok.appendChild(statRow('输入（prompt）', prompt.toLocaleString()));
    tok.appendChild(statRow('输出（completion）', (u.completion_tokens || 0).toLocaleString()));
    tok.appendChild(statRow('合计', (u.total_tokens || prompt + (u.completion_tokens || 0)).toLocaleString()));
    statBody.appendChild(tok);

    const cost = document.createElement('div');
    cost.className = 'stat-card';
    cost.appendChild(cardTitle('成本（按当前时段费率估算）'));
    cost.appendChild(statRow('累计花费', fmtUSD(r.cost_usd), true));
    statBody.appendChild(cost);
  } catch (e) { paneHint(statBody, 'stats/cache 失败：' + e.message); }
}

function cardTitle(text) {
  const h = document.createElement('h3');
  h.textContent = text;
  return h;
}
function statRow(k, v, usd) {
  const row = document.createElement('div');
  row.className = 'stat-row';
  const key = document.createElement('span');
  key.textContent = k;
  const val = document.createElement('span');
  val.className = 'v' + (usd ? ' usd' : '');
  val.textContent = v;
  row.appendChild(key);
  row.appendChild(val);
  return row;
}

statSess.addEventListener('change', () => showStats(statSess.value));

// 探测式启动（W1.2）：是否有有效凭证（cookie 或 URL token）由 /state 的
// 响应判定；未鉴权就不挂 SSE——EventSource 对 401 会无限重连刷屏。
refreshState().then(ok => { if (ok) listen(); });
</script>
