    if (ev.key === 'ArrowUp')   { ev.preventDefault(); moveHl(-1); return; }
    if (ev.key === 'Escape')    { ev.preventDefault(); closeMenu(); return; }
    if (ev.key === 'Tab' || (ev.key === 'Enter' && !ev.shiftKey && !ev.isComposing)) {
      ev.preventDefault();
      pick(menuHl);
      return;
    }
  }
  if (ev.key === 'Escape') { closeMenu(); return; }   // 无处可关 = 空操作，不放 preventDefault
  if (ev.key === 'Enter' && !ev.shiftKey && !ev.isComposing) {
    ev.preventDefault();                              // Shift+Enter 走原生换行
    closeMenu();
    // Enter 不另起发送路径（pitfall：enter-发送别自己再写一条）——收口到
    // 唯一的 submit 链，附件门 / '/' 参数规则保持单源。
    form.requestSubmit();
  }
});

// 生成中的发送键=停止键（c_5m3fm6）：分岔放在 click 层——submit 事件无法
// 区分按钮点击与回车（Enter 的隐式提交 submitter 同是本键），点击先于
// submit 触发，preventDefault 吞掉提交后只发 /cancel（草稿不动）。回车带
// 草稿仍走上面的 submit 原路：conv 闸排队是既有语义，本卡不收窄。
// （c_7lsngm 的 Enter 走 form.requestSubmit()，不经按钮 click——与这条
//   停止分岔天然互不触发。）
send.addEventListener('click', ev => {
  if (!runs.size) return;            // 非生成中：照常提交（发送）
  ev.preventDefault();               // 生成中：本次点击=停止，不进 submit
  if (!send.disabled) sendText('/cancel', false);
});

// 点击选择（📎）。
const attachBtn = document.getElementById('attach-btn');
const fileInput = document.getElementById('file');
attachBtn.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', async () => {
  const files = [...fileInput.files];
  fileInput.value = '';               // 允许重复选同一个文件
  await addFiles(files);
});

// 拖放：整页接收。dragenter/dragover 必须 preventDefault，否则浏览器
// 把 drop 当成导航、直接打开文件。
['dragenter', 'dragover'].forEach(name => {
  document.addEventListener(name, ev => {
    if (!dragHasFiles(ev)) return;
    ev.preventDefault();
    document.body.classList.add('dropping');
  });
});
document.addEventListener('dragleave', ev => {
  if (ev.relatedTarget) return;       // 仍在页面内移动，别闪
  document.body.classList.remove('dropping');
});
document.addEventListener('drop', async ev => {
  if (!dragHasFiles(ev)) return;
  ev.preventDefault();
  document.body.classList.remove('dropping');
  await addFiles(ev.dataTransfer.files);
});

// 粘贴：只吃文件，纯文本粘贴留给输入框。
document.addEventListener('paste', async ev => {
  const cd = ev.clipboardData;
  if (!cd || !cd.files || !cd.files.length) return;
  ev.preventDefault();
  await addFiles(cd.files);
});

// 指令快捷按钮（W2.2）：零参指令（/projects /new /cancel）直发；带参指令
// （/bind /switch）预填输入框并聚焦等路径——按钮只是「发送同款指令文本」
// 的快捷方式，不另造协议。
function wireCmd(id, text) {
  document.getElementById(id).addEventListener('click', () => {
    if (send.disabled) return;
    if (text.endsWith(' ')) {           // 带参指令：预填，光标移到末尾
      input.value = text;
      input.setSelectionRange(text.length, text.length);
      grow();                           // 多行输入（c_7lsngm）：预填后高度回落到一行
      input.focus();
      return;
    }
    sendText(text, false);
    input.focus();
  });
}
wireCmd('cmd-bind', '/bind ');
wireCmd('cmd-switch', '/switch ');
wireCmd('cmd-projects', '/projects');
wireCmd('cmd-new', '/new');
wireCmd('cmd-cancel', '/cancel');

// ＋新建（W5 侧栏）：与顶栏 /new 完全同一条指令文本、同一个 POST /msg 透传
// ——不另造协议。项目不变、会话重置；落地后刷新绑定与侧栏当前项（/new 的
// 回复也会走 onmessage 的 refreshState，两处幂等）。
document.getElementById('side-new').addEventListener('click', async () => {
  if (send.disabled) return;
  await sendText('/new', false);
  refreshState();
  loadSessions();
  input.focus();
});

// ---- 按住说话（voice V2 入站，PRD feature-deepseek-app-api §4.3）----
// 流程：按住 🎤 → getUserMedia + MediaRecorder；松开（或 120s 到点自动
// 收口）→ decodeAudioData 解任意容器 → OfflineAudioContext 重采样 16 kHz
// 单声道 → 本地编 16-bit PCM WAV → POST /voice。设备身份与录音身份都是
// 浏览器自铸 uuid（与 CONV 同源的 mint），一次按下一个录音 id——服务端
// 拿它当 EventID 去重，同一次录音怎么重传都只进一条。转写文本与回复都
// 从本页 web conv 的 SSE 下行（voice/voice-error 命名事件 + 默认 reply）。
// 麦克风要 secure context：localhost 天然是；tailnet IP 走明文 http 不是
// （浏览器拒发 getUserMedia）——手机远端请用 https 前置（tailscale serve）。
const mic = document.getElementById('mic');
const DEVICE_KEY = 'seek-voice-device';
let DEVICE = null;
try {
  DEVICE = localStorage.getItem(DEVICE_KEY);
  if (!DEVICE) { DEVICE = mintConv(); localStorage.setItem(DEVICE_KEY, DEVICE); }
} catch (e) { /* 隐私模式等：DEVICE 留空，上传时提示 */ }

function micAvailable() {
  return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia
            && window.MediaRecorder && window.isSecureContext !== false);
}
if (!micAvailable()) {
  mic.disabled = true;
  mic.title = '此环境不可用麦克风（需 localhost 或 https）';
}

let rec = null;       // 进行中的一次录音 {mr, chunks, stopped, timer, stream}
let voiceBusy = false;  // 编码+上传进行中：按钮语义上仍可再按，但排队没必要

async function startRec() {
  if (!micAvailable() || voiceBusy || rec) return;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const mr = new MediaRecorder(stream);
    const chunks = [];
    mr.ondataavailable = ev => { if (ev.data && ev.data.size) chunks.push(ev.data); };
    const stopped = new Promise(res => { mr.onstop = res; });
    mr.start();
    const timer = setTimeout(stopRec, 120000);  // ASR 硬上限：到点等同松开
    rec = { mr, chunks, stopped, timer, stream };
    mic.classList.add('rec');
    mic.textContent = '⏺';
  } catch (e) {
    addMsg('hint', '（麦克风不可用：' + e + '）');
  }
}

function stopRec() {
  if (!rec) return;
  clearTimeout(rec.timer);
  if (rec.mr.state !== 'inactive') rec.mr.stop();
}

async function endRec() {
  if (!rec) return;
  const s = rec;
  rec = null;
  mic.classList.remove('rec');
  mic.textContent = '🎤';
  s.stream.getTracks().forEach(t => t.stop());
  await s.stopped;
  if (!s.chunks.length) return;
  voiceBusy = true;
  try {
    const wav = await toWav16k(await new Blob(s.chunks).arrayBuffer());
    await uploadVoice(wav);
  } catch (e) {
    addMsg('hint', '（语音失败：' + e + '）');
  }
  voiceBusy = false;
}

// 任意容器音频 → 16 kHz 单声道 16-bit PCM WAV（ASR 的输入形状；16k 单声道
// 下 120s ≈ 3.8 MiB，稳在 8 MiB 上限内）。两步都是纯标准 API：decodeAudioData
// 吃 webm/ogg，OfflineAudioContext 一次性重采样混单声道。
async function toWav16k(buf) {
  const ac = new (window.AudioContext || window.webkitAudioContext)();
  let decoded;
  try { decoded = await ac.decodeAudioData(buf); } finally { ac.close(); }
  const rate = 16000;
  const frames = Math.max(1, Math.ceil(decoded.duration * rate));
  const off = new OfflineAudioContext(1, frames, rate);
  const src = off.createBufferSource();
  src.buffer = decoded;
  src.connect(off.destination);
  src.start();
  const pcm = (await off.startRendering()).getChannelData(0);
  const dv = new DataView(new ArrayBuffer(44 + pcm.length * 2));
  const w = (o, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); dv.setUint32(4, 36 + pcm.length * 2, true); w(8, 'WAVE');
  w(12, 'fmt '); dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
  dv.setUint32(24, rate, true); dv.setUint32(28, rate * 2, true);
  dv.setUint16(32, 2, true); dv.setUint16(34, 16, true);
  w(36, 'data'); dv.setUint32(40, pcm.length * 2, true);
  let o = 44;
  for (let i = 0; i < pcm.length; i++, o += 2) {
    const x = Math.max(-1, Math.min(1, pcm[i]));
    dv.setInt16(o, x < 0 ? x * 0x8000 : x * 0x7fff, true);
  }
  return dv.buffer;
}

async function uploadVoice(wav) {
  if (!DEVICE) { addMsg('hint', '（无法生成本地设备 id（localStorage 不可用），语音未发送）'); return; }
  const ev = mintConv();  // 录音会话 id：一次按下一个，服务端按它去重
  try {
    const r = await fetch(q('/voice'), {
      method: 'POST',
      headers: {
        'Content-Type': 'audio/wav',
        'X-Seek-Conversation': CONV,
        'X-Seek-Device': DEVICE,
        'X-Seek-Voice-Event': ev,
      },
      body: wav,
    });
    if (r.status === 401) addMsg('hint', '（token 无效，语音未送达）');
    else if (r.status === 413) addMsg('hint', '（语音过长（>8 MiB），说短一点）');
    else if (!r.ok) addMsg('hint', '（语音上传失败：HTTP ' + r.status + '）');
    // 202 之后转写异步进行：结果从 SSE 的 voice / voice-error 事件回来
  } catch (e) {
    addMsg('hint', '（语音上传失败：' + e + '）');
  }
}

// 按下/松开走 pointer 事件（鼠标触摸统一）；pointerleave 兜底「拖出按钮」，
// contextmenu 拦掉长按弹菜单。preventDefault 防 touch 长按的文本选择/滚动。
mic.addEventListener('pointerdown', ev => { ev.preventDefault(); startRec(); });
mic.addEventListener('pointerup', endRec);
mic.addEventListener('pointerleave', endRec);
mic.addEventListener('contextmenu', ev => ev.preventDefault());

// ---- 会话侧栏（W5 卡 c_txz6vz——W4.4 📚 弹出面板在此常驻化）----
// 消费 W4.2 已合并的 /rpc method 集：session/list 驱动侧栏列表（updated
// 倒序、标题子串过滤、30 条一页「加载更多」）、session/get 出元信息行、
// session/messages 沿 next_cursor 逐页翻（50/页，「加载更多」追加）。
// W5 c_rqcuaa 增写面：session/rename（行内改名，Enter 提交）+
// session/archive（归档=列表过滤位；归档行默认隐藏，侧栏脚「显示归档」
// 切换，切开后归档行沉底 + 变淡 + ⤴ 取消归档）。
// DOM 只装已翻进的页——长 transcript 的常驻渲染量级与虚拟滚动同级，
// 服务端与页面都不整读。渲染纪律与聊天面同源：textContent-only。
const sessList = document.getElementById('sess-list');
const sessMeta = document.getElementById('sess-meta');
const sessMsgs = document.getElementById('sess-msgs');
const sessFoot = document.getElementById('sess-foot');
const sideFoot = document.getElementById('side-foot');
const sideToggle = document.getElementById('side-toggle');
const sideSearch = document.getElementById('side-search');
const sessBack = document.getElementById('sess-back');
const MSG_PAGE = 50;
// 调用树登记表（c_ux7lvk，随 sel 同生命周期——openSession 清空）：
// 行按 call id（assistant 的 tool_calls[].id ↔ tool 消息的 tool_call_id，
// 同一 deepseek.ToolCall.ID）；结果全文存 JS 表——DOM 只装摘要（复制全文
// 从这里取，超长不进 DOM 是硬界）。
const treeRows = new Map();     // call id → {row, rs, args}
const treeResults = new Map();  // call id → 结果全文（string；空串=空结果）
const TREE_SUMMARY_MAX = 4000;  // 进 DOM 的摘要字符上限
const SESS_PAGE = 30;   // 侧栏一页行数（「加载更多」累加，与消息页独立）
let sel = null;         // 打开中的会话分页游标 {sid, next, done, busy}
let allSessions = [];   // session/list 当前快照（过滤 + 分页的唯一来源）
let shownSessions = SESS_PAGE;
// 归档可见位（c_rqcuaa）：默认隐藏；记忆进 localStorage，刷新后保持——
// 与收起位同款退化（隐私模式走内存值）。
const ARCH_KEY = 'seek-show-archived';
function readShowArch() {
  try { return localStorage.getItem(ARCH_KEY) === '1'; } catch (e) { return false; }
}
let showArchived = readShowArch();

// 收起状态记忆（验收②）：bit 落 localStorage，刷新后保持。首次访问按
// 视口宽度定缺省（<1024px 窄屏默认收起，与 notes-dsh-ui-spec 的
// SIDEBAR_AUTO_COLLAPSE 同断点）；存储不可用（隐私模式）时退化为本次
// 页面生命周期的内存值——不因存储异常让侧栏失去可操作性。
const SIDE_KEY = 'seek-side-collapsed';
function readSideCollapsed() {
  try {
    const v = localStorage.getItem(SIDE_KEY);
    if (v === '0' || v === '1') return v === '1';
  } catch (e) { /* 隐私模式：走宽度缺省 */ }
  return window.innerWidth < 1024;
}
let sideCollapsed = readSideCollapsed();
function applySide() {
  document.body.classList.toggle('side-collapsed', sideCollapsed);
  sideToggle.textContent = sideCollapsed ? '⟩' : '⟨';
  sideToggle.title = sideCollapsed ? '展开会话侧栏' : '收起会话侧栏';
  sideSearch.tabIndex = sideCollapsed ? -1 : 0;  // 收起态搜索不可见，焦点别落进去
}
function setSideCollapsed(v) {
  sideCollapsed = !!v;
  applySide();
  try { localStorage.setItem(SIDE_KEY, sideCollapsed ? '1' : '0'); } catch (e) { /* 内存态即可 */ }
}
sideToggle.addEventListener('click', () => setSideCollapsed(!sideCollapsed));
applySide();

// 窄屏抽屉化（c_lqtt2m）：≤480px 展开态是覆盖式抽屉（样式表断点块），
// 遮罩点击、选中会话都要收抽屉——否则抽屉盖住刚打开的正文。断点数值
// 与样式表的 max-width 保持同一个 480，别各写各的数。
const sideMQ = window.matchMedia ? window.matchMedia('(max-width: 480px)') : null;
document.getElementById('side-scrim').addEventListener('click', () => setSideCollapsed(true));
function drawerClose() {
  if (sideMQ && sideMQ.matches && !sideCollapsed) setSideCollapsed(true);
}

// 🗄 归档可见切换（c_rqcuaa）：头部图标钮——侧栏脚留给「加载更多」
// （c_txz6vz 无头断言探的就是 #side-foot button，别占位）。点按翻转
// showArchived 并整表重拉（include_archived 走服务端过滤口径）。
const sideArch = document.getElementById('side-arch');
function applyArchBtn() {
  sideArch.classList.toggle('on', showArchived);
  sideArch.title = showArchived ? '隐藏归档会话' : '显示归档会话';
}
sideArch.addEventListener('click', () => {
  showArchived = !showArchived;
  try { localStorage.setItem(ARCH_KEY, showArchived ? '1' : '0'); } catch (e) { /* 内存态即可 */ }
  applyArchBtn();
  loadSessions();
});
applyArchBtn();

// 标题过滤（子串、忽略大小写）+ updated 倒序。服务端已按最新在前给，
// 页面再排一次只为「过滤后顺序稳定」——不引入第二套排序口径。归档行
// （仅在「显示归档」开时由服务端带回）同序过滤后沉底——活跃会话永远
// 占视口上部。
function filteredSessions() {
  const term = sideSearch.value.trim().toLowerCase();
  const rows = allSessions.filter(s => !term || (s.title || '').toLowerCase().includes(term));
  rows.sort((a, b) => new Date(b.last_at || 0) - new Date(a.last_at || 0));
  return rows.filter(s => !s.archived).concat(rows.filter(s => s.archived));
}
// 当前项 = 主区打开的那条，退化为已绑定的会话（两者都是「你正在看的」）。
function curSid() { return (sel && sel.sid) || boundSession; }
function markCur() {
  const cur = curSid();
  for (const row of sessList.children) {
    row.classList.toggle('cur', !!row.dataset.sid && row.dataset.sid === cur);
  }
}

function renderSessRows() {
  const rows = filteredSessions();
  sessList.replaceChildren();
  sideFoot.replaceChildren();
  if (!rows.length) {
    paneHint(sessList, allSessions.length ? '（没有匹配的会话）' : '（没有历史会话）');
    return;
  }
  const upto = Math.min(rows.length, Math.max(shownSessions, SESS_PAGE));
  shownSessions = upto;
  for (const s of rows.slice(0, upto)) {
    // div 承载（CSS 注）：行内要装操作钮/输入框，button 嵌套不合法；
    // 键盘路径 Enter/Space 开会话，与 click 同一条 openSession。
    const row = document.createElement('div');
    row.className = 'sess-row' + (s.archived ? ' arch' : '');
    row.dataset.sid = s.sid;
    row.tabIndex = 0;
    if (s.sid === curSid()) row.classList.add('cur');
    const t1 = document.createElement('span');
    t1.className = 't1';
    t1.textContent = s.title || '（无标题）';
    const t2 = document.createElement('span');
    t2.className = 't2';
    const when = s.last_at ? new Date(s.last_at).toLocaleString() : '';
    t2.textContent = (s.archived ? '已归档 · ' : '') + when + ' · ' + s.turns + ' turns · ' + (s.model || '?');
    row.appendChild(t1);
    row.appendChild(t2);
    const acts = document.createElement('span');
    acts.className = 'sess-acts';
    const ren = document.createElement('button');
    ren.type = 'button';
    ren.title = '重命名（Enter 提交，Esc 取消）';
    ren.textContent = '✏';
    ren.addEventListener('click', ev => { ev.stopPropagation(); startRename(row, s); });
    const arc = document.createElement('button');
    arc.type = 'button';
    if (s.archived) { arc.title = '取消归档'; arc.textContent = '⤴'; }
    else { arc.title = '归档（列表隐藏，不删文件）'; arc.textContent = '🗄'; }
    arc.addEventListener('click', ev => {
      ev.stopPropagation();
      rpc('session/archive', { sid: s.sid, archived: !s.archived })
        .then(() => loadSessions())
        .catch(e => sideErr((s.archived ? '取消归档' : '归档') + '失败：' + e.message));
    });
    acts.appendChild(ren);
    acts.appendChild(arc);
    row.appendChild(acts);
    row.addEventListener('click', () => openSession(s.sid));
    row.addEventListener('keydown', ev => {
      if (ev.target !== row || (ev.key !== 'Enter' && ev.key !== ' ')) return;
      ev.preventDefault();
      openSession(s.sid);
    });
    sessList.appendChild(row);
  }
  if (upto < rows.length) {
    const more = document.createElement('button');
    more.type = 'button';
    more.textContent = '加载更多（已显示 ' + upto + ' 条）';
    more.addEventListener('click', () => { shownSessions = upto + SESS_PAGE; renderSessRows(); });
    sideFoot.appendChild(more);
  }
}

// 侧栏写面错误位：落在侧栏脚（下一次渲染自然清空），不动列表本体。
function sideErr(msg) {
  const d = document.createElement('div');
  d.className = 'pane-hint';
  d.textContent = msg;
  sideFoot.prepend(d);
}

// 行内改名（c_rqcuaa）：✏ 把行切进编辑态，Enter 提交（改了才发
// session/rename，成功后整表刷新——排序键是 last_at，改名原位更新）、
// Esc/失焦取消。输入框 click/keydown 都拦冒泡，别触发「点行开会话」。
function startRename(row, s) {
  if (row.classList.contains('editing')) return;
  row.classList.add('editing');
  const inp = document.createElement('input');
  inp.type = 'text';
  inp.className = 'sess-edit';
  inp.value = s.title || '';
  row.appendChild(inp);
  inp.focus();
  inp.select();
  let done = false;
  const finish = commit => {
    if (done) return;
    done = true;
    const v = inp.value.trim();
    inp.remove();
    row.classList.remove('editing');
    if (!commit || !v || v === (s.title || '')) return;
    rpc('session/rename', { sid: s.sid, title: v })
      .then(() => loadSessions())
      .catch(e => sideErr('改名失败：' + e.message));
  };
  inp.addEventListener('keydown', ev => {
    ev.stopPropagation();
    if (ev.key === 'Enter') { ev.preventDefault(); finish(true); }
    else if (ev.key === 'Escape') finish(false);
  });
  inp.addEventListener('click', ev => ev.stopPropagation());
  inp.addEventListener('blur', () => finish(false));
}

async function loadSessions() {
  if (!allSessions.length) paneHint(sessList, '加载中…');
  try {
    const res = await rpc('session/list', showArchived ? { include_archived: true } : {});
    allSessions = res.sessions || [];
    shownSessions = SESS_PAGE;
    renderSessRows();
  } catch (e) { paneHint(sessList, 'session/list 失败：' + e.message); }
}

// 搜索框：输入即过滤（本地子串，不打服务端）；每次过滤从第一页重开。
sideSearch.addEventListener('input', () => { shownSessions = SESS_PAGE; renderSessRows(); });

// 打开一条：主区切到会话正文（聊天面/输入框让位），三个资产面板同时收起
// ——「同时只亮一个面」的口径从四面板闸沿用到这里。
async function openSession(sid) {
  sel = { sid, next: '', done: false, busy: false };
  treeRows.clear();      // 调用树登记表随会话同生命周期（c_ux7lvk）
  treeResults.clear();
  closePanes();
  document.body.classList.add('sess-detail');
  drawerClose();   // 窄屏抽屉态下选中会话即收抽屉，正文才露出来（c_lqtt2m）
  sessMeta.textContent = '';
  sessMsgs.replaceChildren();
  paneHint(sessFoot, '');
  markCur();
  loadMeta(sid);
  loadMsgs();
}

// 💬 聊天：回到聊天面（侧栏不动，sel 保留——当前项高亮随会话走）。
sessBack.addEventListener('click', () => {
  document.body.classList.remove('sess-detail');
  input.focus();
});

// JSON-RPC 2.0 envelope（W4.1）：一次 POST 一个调用；错误以异常上抛，
// 由各窗格自行展示。id 用自增整数——浏览器不重投，无需全局唯一。
let rpcSeq = 1;
async function rpc(method, params) {
  const r = await fetch(q('/rpc'), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ jsonrpc: '2.0', id: rpcSeq++, method, params }),
  });
  if (r.status === 401) throw new Error('token 无效——用带 ?token= 的地址打开');
  const j = await r.json();
  if (j.error) throw new Error('[' + j.error.code + '] ' + j.error.message);
  return j.result;
}

function paneHint(el, text) {
  const d = document.createElement('div');
  d.className = 'pane-hint';
  d.textContent = text;
  el.replaceChildren(d);
}

// 元信息行：模型/turns/累计 tokens/cwd。装饰性数据，失败只落在本行。
async function loadMeta(sid) {
  try {
    const g = await rpc('session/get', { sid });
    if (!sel || sel.sid !== sid) return;  // 返回前已切走：丢弃
    const u = g.cumulative_usage || {};
    sessMeta.textContent = (g.header.model || '?') + ' · ' + g.turns + ' turns · '
      + ((u.prompt_tokens || 0) + (u.completion_tokens || 0)) + ' tokens · '
      + (g.header.cwd || '');
  } catch (e) { sessMeta.textContent = 'session/get 失败：' + e.message; }
}

async function loadMsgs() {
  const me = sel;
  if (!me || me.busy || me.done) return;
  me.busy = true;
  paneHint(sessFoot, me.next ? '加载中…' : '读取中…');
  try {
    const params = { sid: me.sid, limit: MSG_PAGE };
    if (me.next) params.cursor = me.next;
    const res = await rpc('session/messages', params);
    if (sel !== me) return;  // 翻页期间切了会话：旧游标作废
    for (const raw of res.messages) appendMsg(raw);
    if (res.next_cursor) {
      me.next = res.next_cursor;
      const more = document.createElement('button');
      more.type = 'button';
      more.textContent = '加载更多（已显示 ' + sessMsgs.children.length + ' 条）';
      more.addEventListener('click', loadMsgs);
      sessFoot.replaceChildren(more);
    } else {
      me.done = true;
      paneHint(sessFoot, sessMsgs.children.length ? '— 已到末尾 —' : '（无消息）');
    }
  } catch (e) {
    paneHint(sessFoot, 'session/messages 失败：' + e.message);
  }
  me.busy = false;
}

// 一条消息行（c_ux7lvk 升级为调用树渲染）。逐条降级：树渲染抛错 → 老形态
// （appendMsgPlain，升级前的工具行摘要+独立结果泡）→ 再抛 → 占位行——
// 单条消息的渲染异常绝不断整页（不白屏）。耗时不在历史线里（transcript
// 无逐消息时间戳）——名称+耗时在流式面（toolTreeRow），历史行的行尾给
// 结果规模。messages 元素是服务端的 json.RawMessage——经 r.json() 已是
// 对象；string 分支只是防御（jse 一致性由 W4.2 的服务端测试钉）。
function appendMsg(raw) {
  try {
    appendMsgTree(raw);
    return;
  } catch (e) { /* 树渲染异常：整条退老形态 */ }
  try {
    appendMsgPlain(raw);
  } catch (e) {
    const d = document.createElement('div');
    d.className = 'smsg other';
    d.textContent = '（消息渲染失败）';
    sessMsgs.appendChild(d);
  }
}

// 老形态（升级前 verbatim）：工具摘要行 + tool 结果独立成泡（限高由 CSS）。
function appendMsgPlain(raw) {
  let m;
  try { m = typeof raw === 'string' ? JSON.parse(raw) : raw; } catch (e) { return; }
  if (!m || typeof m !== 'object') return;
  const el = document.createElement('div');
  el.className = 'smsg ' + (m.role || 'other');
  const who = document.createElement('div');
  who.className = 'swho';
  who.textContent = m.role === 'tool' ? 'tool · ' + (m.tool_call_id || '') : (m.role || '?');
  el.appendChild(who);
  if (Array.isArray(m.tool_calls)) {
    for (const tc of m.tool_calls) {
      const t = document.createElement('div');
      t.className = 'stool';
      const fn = tc.function || {};
      let args = fn.arguments || '';
      if (args.length > 120) args = args.slice(0, 120) + '…';
      t.textContent = '⚙ ' + (fn.name || '?') + '(' + args + ')';
      el.appendChild(t);
    }
  }
  if (m.content) {
    const body = document.createElement('div');
    body.className = 'sbody';
    renderBody(body, m.content);
    el.appendChild(body);
  }
  sessMsgs.appendChild(el);
}

// 树形态：助手消息的 tool_calls → 调用树（每次调用一行，点行展开参数/
// 结果摘要）。tool 角色消息按 tool_call_id 把结果登记进对应行（展开面板
// 与行尾规模读它）——消息本身仍按 W4.4 逐条渲染契约独立成泡（nmsgs=页内
// 消息数的断言口径不动，零回归）。落 DOM 是收尾动作——此前任何异常都
// 未沾页面，appendMsgPlain 可整条重来（不双渲染）。
function appendMsgTree(raw) {
  let m;
  try { m = typeof raw === 'string' ? JSON.parse(raw) : raw; } catch (e) { return; }
  if (!m || typeof m !== 'object') return;

  if (m.role === 'tool') {
    const id = m.tool_call_id || '';
    if (id && treeRows.has(id)) {
      treeResults.set(id, typeof m.content === 'string' ? m.content : '');
      try { refreshTreeRow(id); } catch (e) { /* 行态刷新失败不升级：结果已入表 */ }
    }
    // 孤儿（无对应行）只走通用渲染；有行的也继续成泡（下方通用路径）
  }

  const el = document.createElement('div');
  el.className = 'smsg ' + (m.role || 'other');
  const who = document.createElement('div');
  who.className = 'swho';
  who.textContent = m.role === 'tool' ? 'tool · ' + (m.tool_call_id || '') : (m.role || '?');
  el.appendChild(who);
  const made = [];   // 本条消息建出的调用行（落 DOM 后才登记——中途异常不残留）
  if (Array.isArray(m.tool_calls) && m.tool_calls.length) {
    const tree = document.createElement('div');
    tree.className = 'ttree';
    for (const tc of m.tool_calls) {
      const node = callNode(tc);
      made.push(node);
      tree.appendChild(node.frag);
    }
    el.appendChild(tree);
  }
  if (m.content) {
    const body = document.createElement('div');
    body.className = 'sbody';
    renderBody(body, m.content);
    el.appendChild(body);
  }
  sessMsgs.appendChild(el);   // 收尾动作：此前任何异常都未沾页面，老路径可整条重来
  for (const node of made) {
    if (!node.id) continue;
    treeRows.set(node.id, node.entry);
    refreshTreeRow(node.id);   // 结果已先入表的顺序异常防御
  }
}

// 一个调用节点 = 行按钮 + 懒建展开面板（首点才装内容——长结果不进 DOM
// 直到用户要看）。textContent-only 纪律与全页一致（模型产物零 HTML 面）。
// 只构建、不登记——登记由 appendMsgTree 在落 DOM 后统一做。
function callNode(tc) {
  const fn = (tc && typeof tc === 'object' && tc.function) || {};
  const id = (tc && tc.id) || '';
  const name = fn.name || '?';
  const args = typeof fn.arguments === 'string' ? fn.arguments : '';

  const row = document.createElement('button');
  row.type = 'button';
  row.className = 'tnode';
  const nm = document.createElement('span');
  nm.className = 'nm';
  nm.textContent = '⚙ ' + name;
  const sm = document.createElement('span');
  sm.className = 'sm';
  sm.textContent = clipOneLine(args, 72) || '（无参数）';
  const rs = document.createElement('span');
  rs.className = 'rs';
  row.appendChild(nm);
  row.appendChild(sm);
  row.appendChild(rs);

  const detail = document.createElement('div');
  detail.className = 'tdetail';
  detail.hidden = true;
  row.addEventListener('click', () => {
    if (detail.hidden) { buildTreeDetail(detail, id, args); detail.hidden = false; }
    else detail.hidden = true;
  });

  const frag = document.createDocumentFragment();
  frag.appendChild(row);
  frag.appendChild(detail);
  return { frag, id, entry: { row, rs, args } };
}

// 行尾结果态：未到=「…」，已并入=字符规模（全文只在 treeResults）。
function refreshTreeRow(id) {
  const n = treeRows.get(id);
  if (!n) return;
  n.rs.textContent = treeResults.has(id)
    ? '· ' + treeResults.get(id).length + ' 字符'
    : '· 结果…';
}

// 展开面板：参数节 + 结果节。结果未随页载入（跨页）给指引文案。
function buildTreeDetail(detail, id, args) {
  detail.replaceChildren();
  detail.appendChild(treeDetailSec('参数', args, !args && '（无参数）'));
  const got = treeResults.has(id) ? treeResults.get(id) : undefined;
  detail.appendChild(treeDetailSec('结果', got,
    got === undefined ? '（结果未载入——跨页时先「加载更多」再展开）'
    : got === '' ? '（空结果）' : null));
}

// 一节 = 标签行（名+规模+复制全文）+ 摘要 pre。复制拿闭包里的整串。
function treeDetailSec(label, text, emptyNote) {
  const box = document.createElement('div');
  const lab = document.createElement('div');
  lab.className = 'tlabel';
  const nm = document.createElement('span');
  nm.textContent = label;
  lab.appendChild(nm);
  if (typeof text === 'string' && text) {
    const cnt = document.createElement('span');
    cnt.textContent = '共 ' + text.length + ' 字符';
    lab.appendChild(cnt);
    lab.appendChild(copyBtn(text));
  }
  box.appendChild(lab);
  const pre = document.createElement('pre');
  pre.className = 'tpre';
  pre.textContent = emptyNote || clipText(text, TREE_SUMMARY_MAX);
  box.appendChild(pre);
  return box;
}

// 摘要截断：超长尾部换提示行（复制全文得完整内容）。
function clipText(text, max) {
  if (typeof text !== 'string' || text.length <= max) return text || '';
  return text.slice(0, max) + '\n…（已截断，共 ' + text.length + ' 字符——「复制全文」得完整内容）';
}

function clipOneLine(text, max) {
  if (typeof text !== 'string' || !text) return '';
  const t = text.replace(/\s+/g, ' ').trim();
  return t.length <= max ? t : t.slice(0, max) + '…';
}

// 复制全文：secure context 走 clipboard API；tailnet 明文 http 不是
// secure context（页头 voice 段同一条纪律——getUserMedia/clipboard 同源
// 限制），退 execCommand 兜底。按钮文案即时反馈，1.5s 后还原。
function copyBtn(text) {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'tcopy';
  b.textContent = '复制全文';
  b.addEventListener('click', ev => {
    ev.stopPropagation();   // 不触发行的展开/收起
    copyText(text, b);
  });
  return b;
}
function copyText(text, btn) {
  const done = ok => {
    btn.textContent = ok ? '已复制' : '复制失败';
    setTimeout(() => { btn.textContent = '复制全文'; }, 1500);
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(() => done(true),
                                            () => done(fallbackCopy(text)));
  } else {
    done(fallbackCopy(text));
  }
}
function fallbackCopy(text) {
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  } catch (e) { return false; }
}

// ---- 任务面板（W3.3 编排 P1 可视化）----
// 消费 W3.1 的 GET /subagents（列表 + ?sub= 详情）与 W3.2 的 SSE topic。
// 面板协议 = 先订阅、再取快照：专用 /events 连接带 ?topic=subagents 且
// 只 addEventListener('subagents')、不设 onmessage——同连接上捎带的聊天帧
// 被浏览器静默丢弃，不会与主连接重复渲染。推送按 sub_sid 合并（列表序
// = 服务端 newest-first，新行 unshift）；终态推送顺手刷新打开中的详情。
const agentsBtn = document.getElementById('agents-btn');
const agList = document.getElementById('ag-list');
const agMeta = document.getElementById('ag-meta');
const agFields = document.getElementById('ag-fields');
const agLast = document.getElementById('ag-last');
let agRows = [];      // 折叠行（GET 快照 + topic 推送合并后的当前态）
let agOpen = null;    // 详情打开中的 sub_sid
let topicES = null;   // 面板专用 SSE 连接（进入面板且已绑定时才开）
let topicProject = null;

const memBtn = document.getElementById('mem-btn');
const statBtn = document.getElementById('stat-btn');
const setBtn = document.getElementById('set-btn');
const hkBtn = document.getElementById('hk-btn');
memBtn.addEventListener('click', () => togglePane('memory'));
statBtn.addEventListener('click', () => togglePane('stats'));
agentsBtn.addEventListener('click', () => togglePane('agents'));
setBtn.addEventListener('click', () => togglePane('settings'));

// 三面板共用的开合闸（W4.5 的「browsing=隐聊天 + 恰好一个 *-view 亮面板」；
// W3.3 的任务面板并入同一闸）。W5 侧栏卡把 sessions 从这组闸里摘出去——
// 会话列表现在是常驻左栏，不再抢中栏。中栏面板互斥：会话正文
// （sess-detail）、记忆/统计/后台/审计任选其一、或聊天面（默认）。
const panes = {
  memory:   { btn: memBtn,    label: '🧠 记忆', cls: 'mem-view',      load: loadMemPane },
  stats:    { btn: statBtn,   label: '📊 统计', cls: 'stat-view',     load: loadStatPane },
  agents:   { btn: agentsBtn, label: '🤖 后台', cls: 'agents-view',   load: loadAgentsPane },
  settings: { btn: setBtn,    label: '⚙ 设置',  cls: 'settings-view', load: loadSetPane },
  hooks:  { btn: hkBtn,     label: '🪝 审计', cls: 'hooks-view', load: loadHooksPane },
};
function closePanes() {
  for (const p of Object.values(panes)) {
    document.body.classList.toggle(p.cls, false);
    p.btn.textContent = p.label;
  }
  document.body.classList.remove('browsing');
}
function togglePane(name) {
  const active = !document.body.classList.contains(panes[name].cls);
  closePanes();
  if (active) {
    document.body.classList.add(panes[name].cls, 'browsing');
    document.body.classList.remove('sess-detail');  // 会话正文让位（中栏一个面）
    panes[name].btn.textContent = '💬 聊天';
    panes[name].load();
  } else {
    input.focus();   // 收起回聊天面
  }
  syncTopicStream();
  syncAgentRefresh();
  syncHooksStream();
}

// 进任务面板（原三视图 setView 的 agents 分支，随四面板闸并入
// togglePane）：先订阅再取快照（W3.2 协议序——锚点在订阅时刻，订阅→GET
// 之间的追加靠推送补、不靠快照重读）。卡 c_4doebx 起数据源换成 /rpc 的
// subagent/list|get（inspect-rpc §6 #12 收口）；旧 GET /subagents 仍是
// 兼容口（同一份磁盘折叠，别的消费者照旧可用）。
function loadAgentsPane() {
  syncTopicStream();
  loadAgents();
  if (!agOpen) {
    agMeta.textContent = '';
    agFields.replaceChildren();
    paneHint(agLast, '（在左侧选一条记录看末条输出）');
  }
}

// 状态徽标三态（卡 c_4doebx）：running / done / error。颜色由类名承载
// （CSS 一处定义），dataset.status 保留折叠原值——验收与用户读到同一份
// 状态。细分标签仍按折叠状态给：killed 是用户主动终止，算 done 不算
// error；orphaned 是 owner 崩了，算 error。
// merge main（2026-11-20）：本卡早先的「JS 里直接给 var(--seek-*)」写法
// 被 c_4doebx 的类名承载结构取代——色源仍在 CSS token 层，没有第二套。
const AG_STATUS = {
  active:    { label: '在跑',   cls: 'st-running', kind: 'running' },
  completed: { label: '完成',   cls: 'st-done',    kind: 'done' },
  promoted:  { label: '已晋升', cls: 'st-done',    kind: 'done' },
  killed:    { label: '已终止', cls: 'st-done',    kind: 'done' },
  failed:    { label: '失败',   cls: 'st-error',   kind: 'error' },
  orphaned:  { label: '失联',   cls: 'st-error',   kind: 'error' },
};
const agStatusView = s => AG_STATUS[s] || { label: s || '?', cls: 'st-error', kind: 'error' };

// 面板刷新（卡 c_4doebx 的「定时刷新或事件驱动刷新」，两条都要）：
//   事件驱动 = W3.2 的 subagents topic（live 追加的推送，下面的
//   syncTopicStream）；定时 = 本 ticker 兜底，因为推送只在订阅之后、
//   且跨进程写盘没有 in-process 信号（Follower 本身也是 1s 轮询）。
// 面板关掉即停——后台 tab 不空转。10s 对任务面板是零感知成本（一次
// 磁盘折叠），比 SSE 断流后一直显示旧状态好。
const AG_REFRESH_MS = 10000;
let agTimer = null;
let agLoads = 0;      // 快照重载计数（无头验收读它证明定时器真的在跑）
function syncAgentRefresh() {
  const want = document.body.classList.contains('agents-view') && !!boundProjectID;
  if (agTimer && !want) { clearInterval(agTimer); agTimer = null; }
  if (want && !agTimer) {
    agTimer = setInterval(() => {
      if (document.body.classList.contains('agents-view')) loadAgents();
    }, AG_REFRESH_MS);
  }
}

function agTokensText(t) {
  if (!t) return '';
  const n = (t.prompt || 0) + (t.completion || 0) + (t.cache_hit || 0);
  return n ? 'p' + t.prompt + ' c' + t.completion + ' ch' + t.cache_hit : '';
}

async function loadAgents() {
  if (!boundProjectID) {
    return paneHint(agList, '未绑定项目——聊天里发 /bind <项目路径> 后再来');
  }
  agLoads++;
  try {
    const res = await rpc('subagent/list', { project_id: boundProjectID });
    agRows = res.subagents || [];
    renderAgList();
    // 打开中的详情跟着列表态走（同一行刷新徽标/元信息，transcript 尾读
    // 交给 openAgent 自己按需重读）。
    if (agOpen) {
      const row = agRows.find(x => x.sub_sid === agOpen);
      if (row) renderAgDetail({ sub: row, last_assistant: null, _keepLast: true });
      else { agOpen = null; agFields.replaceChildren(); paneHint(agLast, '（这条记录已不在索引里）'); }
    }
  } catch (e) { paneHint(agList, 'subagent/list 失败：' + e.message); }
}

// 列表全量重画（面板量级几十行，无所谓）；textContent-only 纪律同聊天面。
function renderAgList() {
  agList.replaceChildren();
  if (!agRows.length) return paneHint(agList, '（还没有子代理记录）');
  for (const s of agRows) {
    const row = document.createElement('button');
    row.type = 'button';
    row.className = 'ag-row';
    row.dataset.sid = s.sub_sid;
    row.dataset.status = s.status || '';
    if (agOpen === s.sub_sid) row.classList.add('cur');
    const t1 = document.createElement('span');
    t1.className = 't1';
    const badge = document.createElement('span');
    const st = agStatusView(s.status);
    badge.className = 'ag-badge ' + st.cls;
    badge.dataset.kind = st.kind;
    badge.dataset.status = s.status || '';
    badge.textContent = (s.background ? 'bg·' : '') + st.label + (s.notified ? '✓' : '');
    const desc = document.createElement('span');
    desc.className = 'desc';
    desc.textContent = s.description || '（无描述）';
    t1.appendChild(badge);
    t1.appendChild(desc);
    const t2 = document.createElement('span');
    t2.className = 't2';
    const toks = agTokensText(s.tokens);
    t2.textContent = (s.type || '?') + ' · '
      + (s.started_at ? new Date(s.started_at).toLocaleString() : '')
      + (toks ? ' · ' + toks : '');
    row.appendChild(t1);
    row.appendChild(t2);
    row.addEventListener('click', () => openAgent(s.sub_sid));
    agList.appendChild(row);
  }
}

// 详情（卡 c_4doebx「详情展开」）：/rpc subagent/get —— 折叠行 + 子
// transcript 末条 assistant，与旧 /subagents?sub= 同信息量（summary 单源：
// 索引不带 summary，子自己的 transcript 才是全文）。
async function openAgent(sid) {
  agOpen = sid;
  for (const row of agList.children) row.classList.toggle('cur', row.dataset.sid === sid);
  agMeta.textContent = '读取中…';
  agFields.replaceChildren();
  agLast.replaceChildren();
  try {
    const d = await rpc('subagent/get', { sub_sid: sid, project_id: boundProjectID });
    if (agOpen !== sid) return;  // 返回前已切走：丢弃
    renderAgDetail(d);
  } catch (e) { agMeta.textContent = '详情读取失败：' + e.message; }
}

// renderAgDetail 画详情栏：#ag-meta 一行摘要 + #ag-fields 字段表 +
// #ag-last transcript 尾。d._keepLast=true 时（定时刷新带回来的行）不动
// transcript 尾——那是 openAgent 的活，刷新只更新状态。
function renderAgDetail(d) {
  const s = d.sub || {};
  const st = agStatusView(s.status);
  const toks = agTokensText(s.tokens);
  agMeta.textContent = (s.background ? '后台 ' : '同步 ') + st.label + ' · ' + (s.type || '?')
    + ' · ' + (s.description || '') + (toks ? ' · ' + toks : '')
    + (s.reason ? ' · reason=' + s.reason : '');
  agFields.replaceChildren();
  const fields = [
    ['sub_sid', s.sub_sid],
    ['parent_sid', s.parent_sid],
    ['状态', s.status + (st.kind !== 'running' ? '' : '（进行中）')],
    ['类型', s.type],
    ['模式', s.background ? '后台（结果经通知回到父会话）' : '同步'],
    ['开始', s.started_at ? new Date(s.started_at).toLocaleString() : ''],
    ['结束', s.ended_at ? new Date(s.ended_at).toLocaleString() : ''],
    ['tokens', toks ? toks + '（p/cache_hit）' : ''],
    ['worktree', s.worktree_path || ''],
    ['resumed_from', s.resumed_from || ''],
    ['失败原因', s.reason || ''],
    ['通知已送达', s.notified ? '是' : ''],
    ['项目', d.project_root || ''],
  ];
  for (const [k, v] of fields) {
    if (v === undefined || v === null || v === '') continue;
    const line = document.createElement('div');
    line.className = 'ag-field';
    const key = document.createElement('span');
    key.className = 'k';
    key.textContent = k;
    const val = document.createElement('span');
    val.className = 'v';
    val.textContent = String(v);
    line.appendChild(key);
    line.appendChild(val);
    agFields.appendChild(line);
  }
  if (d._keepLast) return;
  if (d.last_assistant) renderBody(agLast, d.last_assistant);  // 纯 DOM 构建
  else paneHint(agLast, s.status === 'active'
    ? '（子代理还在跑——尚无已落盘的输出）' : '（没有可读的 transcript）');
}

// topic 订阅生命周期：面板开着且已绑定才连；面板关掉即断；换绑项目后
// 重连跟随新项目（服务端口径：订阅锚定订阅时的项目，重订阅才跟新）。
// 未绑定时不开——W3.2 对未绑定 conv 的 topic 请求是 400，EventSource 会
// 无限重连刷屏（与 W1.2 不挂未鉴权 SSE 同一条纪律）。
function syncTopicStream() {
  const want = document.body.classList.contains('agents-view') && boundProject;
  if (topicES && topicProject !== boundProject) { topicES.close(); topicES = null; }
  if (want && !topicES) {
    topicProject = boundProject;
    topicES = new EventSource(q('/events?conv=' + encodeURIComponent(CONV) + '&topic=subagents'));
    topicES.addEventListener('subagents', ev => {
      try {
        const m = JSON.parse(ev.data);
        if (!m.sub || !m.sub.sub_sid) return;
        const i = agRows.findIndex(x => x.sub_sid === m.sub.sub_sid);
        if (i >= 0) agRows[i] = m.sub; else agRows.unshift(m.sub);
        renderAgList();
        if (agOpen === m.sub.sub_sid) openAgent(m.sub.sub_sid);  // 终态推送刷新详情
      } catch (e) { /* 单条坏帧不毁面板 */ }
    });
    // onerror 不处理：EventSource 自动重连；面板关闭由 close() 收口。
  }
  if (!want && topicES) { topicES.close(); topicES = null; topicProject = null; }
}

// ---- hooks 审计面板（W5 c_xz2bey 实时审计视图）----
// 消费 /events 的 hooks topic（webfrontend_hookstopic.go：全局审计日志
// tail-follow，帧=审计行 verbatim）+ /rpc hooks/audit/tail 快照。协议与任务
// 面板同序：先订阅（锚点在订阅时刻）、再取快照；期间到达的推送先入队，
// 快照落地后补放（hkSeen 整行去重——审计行没有行内唯一 id，断线重连的
// 补拉快照与实时推送靠整行相等折叠；真正的全同重复行会被误折，这是
// method 面契约的边界，不是本视图能修的）。
// 三交互：滚动追加（贴底自动跟随，上翻不拽回、计数提示，点计数或滚回
// 贴底即补渲染漏掉的行）、暂停/恢复（冻结渲染不冻结积累，恢复即补齐）、
// 按 hook 名子串过滤（大小写不敏感）。
const hkLog = document.getElementById('hk-log');
const hkFilterEl = document.getElementById('hk-filter');
const hkPauseBtn = document.getElementById('hk-pause');
const hkCnt = document.getElementById('hk-cnt');
const HK_CAP = 500;    // 持有窗口上限（快照/补拉同 limit，与服务端 max 1000 内）
let hkRows = [];       // 持有行（旧→新）；渲染来源（暂停时渲染 hkFreeze）
let hkFreeze = null;   // 暂停时刻的行快照：null=未暂停
let hkSeen = new Set();  // 持有行整行 JSON 键（去重 + 重连补拉折叠）
let hkLiveQueue = [];  // 快照/补拉在途时缓存的实时推送
let hkFetchBusy = false;
let hkSyncChain = Promise.resolve();
let hooksES = null;    // 面板专用 SSE 连接（面板开着才连；无需绑定项目）
let hkEverOpened = false;
let hkUnread = 0;      // 未贴底期间错过渲染的新行数（回贴底清零）

// 一行审计的可视元素：时间/hook/事件/其余元数据，textContent-only 纪律。
function hkRowEl(r) {
  const el = document.createElement('div');
  el.className = 'hk-row' + (r.denied ? ' denied' : '');
  const ts = document.createElement('span');
  ts.className = 'hk-ts';
  ts.textContent = (r.ts || '').replace('T', ' ').slice(5, 19);
  const hook = document.createElement('span');
  hook.className = 'hk-hook';
  hook.textContent = r.hook || '?';
  const ev = document.createElement('span');
  ev.className = 'hk-ev';
  ev.textContent = r.event || '';
  const rest = document.createElement('span');
  rest.className = 'hk-rest';
  const bits = [r.tool || '', (r.duration_ms || 0) + 'ms', 'exit' + (r.exit_code || 0)];
  if (r.injected_bytes) bits.push('+' + r.injected_bytes + 'B');
  if (r.denied) bits.push('denied');
  rest.textContent = bits.filter(Boolean).join(' · ');
  if (r.reason) el.title = r.reason;  // 超时/static-skip 等原因悬停可读
  el.appendChild(ts); el.appendChild(hook); el.appendChild(ev); el.appendChild(rest);
  return el;
}

function hkMatches(r) {
  const f = hkFilterEl.value.trim().toLowerCase();
  return !f || (r.hook || '').toLowerCase().includes(f);
}

function hkAtBottom() {
  return hkLog.scrollHeight - hkLog.scrollTop - hkLog.clientHeight < 24;
}

// 全量重画（≤500 行，面板量级无所谓）。过滤变化/补拉/恢复后走这里；
// 实时追加在贴底时也走全量重画后回贴底（行数小，简单胜过增量拼接）。
function hkRender(stick) {
  const rows = hkFreeze || hkRows;
  hkLog.replaceChildren();
  let shown = 0;
  for (const r of rows) {
    if (!hkMatches(r)) continue;
    hkLog.appendChild(hkRowEl(r));
    shown++;
  }
  if (!rows.length) paneHint(hkLog, '（还没有 hooks 审计记录——hooks 在子进程 seek 里执行后落审计日志）');
  else if (!shown) paneHint(hkLog, '（过滤后无匹配行）');
  if (stick) { hkLog.scrollTop = hkLog.scrollHeight; hkUnread = 0; }
  hkUpdateCnt();
}

// 计数行：显示「匹配/持有 · N 新行」。N = 暂停冻结后的积累，或未贴底时
// 错过渲染的新行（回贴底自动清零）；fresh 态可点跳底。
function hkUpdateCnt() {
  const backlog = hkFreeze ? hkRows.length - hkFreeze.length : hkUnread;
  const rows = hkFreeze || hkRows;
  let shown = 0;
  for (const r of rows) if (hkMatches(r)) shown++;
  hkCnt.classList.toggle('fresh', backlog > 0);
  const base = shown === rows.length ? rows.length + ' 行' : shown + '/' + rows.length + ' 行';
  hkCnt.textContent = base + (backlog ? ' · ' + backlog + ' 新行' : '');
}

hkCnt.addEventListener('click', () => {  // 有积压时可点跳底（fresh 态才有意义）
  if ((hkFreeze ? hkRows.length - hkFreeze.length : hkUnread) > 0) hkJump();
});
// 跳底必须走补渲染而非只设 scrollTop：上翻期间的新行只入了 hkRows 不在
// DOM（hkAppend 不贴底不渲染），纯滚到底滚的是旧内容的底，漏行要等下一
// 次推送才出现。hkRender(true) 从持有行全量补画并贴底（行已在客户端，
// 无需重拉；冻结态则渲染冻结快照，跳到冻结视图的底，语义不变）。
function hkJump() { hkRender(true); }

// 追加若干行（推送/快照补放共用）：整行去重入窗，贴底即渲染跟随，否则
// 只积累并计「新行」数。暂停时不动渲染（积压=冻结差，见 hkUpdateCnt）。
function hkAppend(rows) {
  let added = 0;
  for (const r of rows) {
    const k = JSON.stringify(r);
    if (hkSeen.has(k)) continue;
    hkSeen.add(k);
    hkRows.push(r);
    added++;
  }
  while (hkRows.length > HK_CAP) hkRows.shift();
  if (!added) return;
  if (!hkFreeze && hkAtBottom()) hkRender(true);
  else {
    if (!hkFreeze) hkUnread += added;
    hkUpdateCnt();
  }
}

// 快照/补拉落库：整窗替换为服务端 tail（与服务端「锚点后推送」拼起来无
// 洞无重：见函数尾注释），再补放在途推送。
function hkSeed(rows) {
  hkRows = rows.slice(-HK_CAP);
  hkSeen = new Set(hkRows.map(JSON.stringify));
  if (!hkFreeze) hkRender(true);
}

// 取快照并整窗重播（首次打开与断线重连共用——EventSource 的 retry:3000
// 自动重连后 onopen 再触发一次，补拉即把断线窗口漏掉的行捞回来，验收②
// 「断线重连不丢行」的页面半边）。在途期间推送入队，落地后 hkAppend 补放：
// 队里的行要么晚于快照末行（直接追加，序不变），要么已在快照里（整行
// 去重折叠）——两条路都不乱序不重复。
function hkSync() {
  hkFetchBusy = true;
  hkSyncChain = hkSyncChain.then(async () => {
    try {
      const res = await rpc('hooks/audit/tail', { limit: HK_CAP });
      hkSeed(res.entries || []);
    } catch (e) {  // 已持有行不因取快照失败而被抹掉；只在空窗时亮错
      if (!hkRows.length) paneHint(hkLog, 'hooks/audit/tail 失败：' + e.message);
    }
    hkFetchBusy = false;
    const queued = hkLiveQueue; hkLiveQueue = [];
    hkAppend(queued);
  });
  return hkSyncChain;
}

// 面板专用 SSE 生命周期：面板开着才连（无需绑定项目——审计日志全局），
// 关掉即断；重开/重连都经 onopen → hkSync 补拉，状态跨面板开合不断档。
function syncHooksStream() {
  const want = document.body.classList.contains('hooks-view');
  if (want && !hooksES) {
    hooksES = new EventSource(q('/events?conv=' + encodeURIComponent(CONV) + '&topic=hooks'));
    hooksES.addEventListener('hooks', ev => {
      try {
        const row = JSON.parse(ev.data);
        if (hkFetchBusy) hkLiveQueue.push(row); else hkAppend([row]);
      } catch (e) { /* 单条坏帧不毁面板 */ }
    });
    hooksES.onopen = () => { hkSync(); hkEverOpened = true; };
    // onerror 不处理：EventSource 自动重连（retry:3000）；面板关闭由 close() 收口。
  }
  if (!want && hooksES) { hooksES.close(); hooksES = null; }
}

function loadHooksPane() {
  syncHooksStream();
  if (!hkEverOpened) paneHint(hkLog, '连接中…');
}

// 暂停/恢复：冻结的是渲染（快照 hkFreeze），不是积累——期间推送照常入
// hkRows，恢复即全量补齐。上翻浏览不被新行拽走由「不贴底不渲染」承担。
hkPauseBtn.addEventListener('click', () => {
  if (hkFreeze) {
    hkFreeze = null;
    hkPauseBtn.textContent = '⏸ 暂停';
    hkPauseBtn.classList.remove('held');
    hkRender(true);  // 恢复：补齐到最新并回贴底
  } else {
    hkFreeze = hkRows.slice();
    hkPauseBtn.textContent = '▶ 恢复';
    hkPauseBtn.classList.add('held');
    hkUpdateCnt();
  }
});

hkFilterEl.addEventListener('input', () => hkRender(hkAtBottom()));
// 手动滚回贴底与点计数跳底同一条纪律：hkUnread>0 即 DOM 缺行，须补渲染
// （hkRender(true) 渲染后重设 scrollTop 会再触发本监听器，届时 hkUnread
// 已被清零，无循环）。冻结态不补——恢复按钮才解冻。
hkLog.addEventListener('scroll', () => {
  if (hkAtBottom() && !hkFreeze && hkUnread) hkRender(true);
});

// ---- 记忆浏览器（W4.5 资产面 UI·二）----
// 消费 W4.3 的 memory/projects|list|get：项目下拉（memory/projects，新→旧）
// 挑 project_id，列表出该项目的条目（memory/list，含 stale 标记），点开
// 单条详情（memory/get，正文走聊天面同一 renderBody）。渲染纪律不变：
// textContent-only。memSel 防「响应回来前已切走」的串台（与 sel 同构）。
const memProj = document.getElementById('mem-proj');
const memCnt = document.getElementById('mem-cnt');
const memList = document.getElementById('mem-list');
const memMeta = document.getElementById('mem-meta');
const memTags = document.getElementById('mem-tags');
const memContent = document.getElementById('mem-content');
let memSel = null;  // {proj, name} 当前打开的详情；null = 未开

async function loadMemPane() {
  paneHint(memList, '加载中…');
  try {
    const res = await rpc('memory/projects', {});
    memProj.replaceChildren();
    if (!res.projects.length) {
      memCnt.textContent = '';
      memSel = null;
      memMeta.textContent = ''; memTags.replaceChildren(); memContent.replaceChildren();
      return paneHint(memList, '（磁盘上没有项目——先在终端里用 seek 跑一阵）');
    }
    for (const p of res.projects) {
      const opt = document.createElement('option');
      opt.value = p.project_id;
      opt.textContent = p.project_id.slice(0, 8) + ' · ' + p.memories + ' 条 · '
        + new Date(p.last_active_at).toLocaleDateString();
      memProj.appendChild(opt);
    }
    loadMemList(memProj.value);
  } catch (e) { paneHint(memList, 'memory/projects 失败：' + e.message); }
}

async function loadMemList(proj) {
  memSel = null;
  memMeta.textContent = ''; memTags.replaceChildren(); memContent.replaceChildren();
  paneHint(memList, '加载中…');
  try {
    const res = await rpc('memory/list', { project_id: proj });
    memList.replaceChildren();
    memCnt.textContent = res.memories.length + ' 条记忆';
    if (!res.memories.length) return paneHint(memList, '（这个项目还没有记忆）');
    for (const m of res.memories) {
      const row = document.createElement('button');
      row.type = 'button';
      row.className = 'mem-row';
      row.dataset.name = m.name;
      const t1 = document.createElement('span');
      t1.className = 't1';
      t1.textContent = (m.pinned ? '📌 ' : '') + m.name;
      const t2 = document.createElement('span');
      t2.className = 't2';
      t2.textContent = (m.stale ? '⚠ 过期 · ' : '') + (m.tagline || '')
        + ' · ' + new Date(m.updated_at).toLocaleDateString();
      row.appendChild(t1);
      row.appendChild(t2);
      row.addEventListener('click', () => openMem(proj, m.name));
      memList.appendChild(row);
    }
  } catch (e) { paneHint(memList, 'memory/list 失败：' + e.message); }
}

async function openMem(proj, name) {
  memSel = { proj, name };
  memMeta.textContent = '读取中…';
  memTags.replaceChildren();
  memContent.replaceChildren();
  for (const row of memList.children) row.classList.toggle('cur', row.dataset.name === name);
  try {
    const m = await rpc('memory/get', { project_id: proj, name });
    if (!memSel || memSel.proj !== proj || memSel.name !== name) return;  // 已切走：丢弃
    const bits = [m.name, m.tagline || ''];
    bits.push('建于 ' + new Date(m.created_at).toLocaleString());
    bits.push('更新 ' + new Date(m.updated_at).toLocaleString());
    bits.push('召回 ' + m.recall_count + ' 次');
    if (m.pinned) bits.push('📌 常驻');
    if (m.stale) bits.push('⚠ 过期待回收');
    if (m.auto_sourced) bits.push('auto');
    memMeta.textContent = bits.join(' · ');
    for (const t of (m.tags || [])) {
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.textContent = '#' + t;
      memTags.appendChild(chip);
    }
    renderBody(memContent, m.content || '（无正文）');
  } catch (e) {
    memMeta.textContent = 'memory/get 失败：' + e.message;
  }
}

memProj.addEventListener('change', () => loadMemList(memProj.value));

// ---- 统计视图（W4.5 资产面 UI·二）----
// 消费 W4.3 的 stats/cache（cost_usd 服务端算——「client never prices」，
// 页面永不带费率卡）+ W4.2 的 session/list 当会话选择器（缺省最新）。
// 命中率条宽经 CSSOM（el.style.width）设置——style 属性才归 CSP 管，
// CSSOM 不受 style-src 限制，且宽度只可能是数字。
const statSess = document.getElementById('stat-sess');
const statBody = document.getElementById('stat-body');

// 与服务端成本展示同刻度的格式化（只排版数值，不携带任何费率——费率
// 只住在服务端的费率表里）：
// $0 / 4 位小数（分以下）/ 3 位（一美元内）/ 2 位。
function fmtUSD(c) {
  if (!c) return '$0';
  if (c < 0.01) return '$' + c.toFixed(4);
  if (c < 1) return '$' + c.toFixed(3);
  return '$' + c.toFixed(2);
}

async function loadStatPane() {
  paneHint(statBody, '加载中…');
  try {
    const res = await rpc('session/list', {});
    statSess.replaceChildren();
    if (!res.sessions.length) {
      return paneHint(statBody, '（没有历史会话——先在终端里用 seek 跑一阵）');
    }
    for (const s of res.sessions) {
      const opt = document.createElement('option');
      opt.value = s.sid;
      const when = s.last_at ? new Date(s.last_at).toLocaleString() : '';
      opt.textContent = (s.title || s.sid.slice(0, 8)) + (when ? ' · ' + when : '');
      statSess.appendChild(opt);
    }
    showStats(statSess.value);
  } catch (e) { paneHint(statBody, 'session/list 失败：' + e.message); }
}

async function showStats(sid) {
  if (!sid) return;
  const me = sid;
  paneHint(statBody, '读取中…');
  try {
    const r = await rpc('stats/cache', { sid });
    if (statSess.value !== me) return;  // 响应回来前已切走：丢弃
    const u = r.usage || {};
    statBody.replaceChildren();

    const cache = document.createElement('div');
    cache.className = 'stat-card';
    cache.appendChild(cardTitle('前缀缓存 · ' + r.sid.slice(0, 8) + ' · ' + (r.model || '?')));
    const hit = u.prompt_cache_hit_tokens || 0, miss = u.prompt_cache_miss_tokens || 0;
    const prompt = (u.prompt_tokens != null ? u.prompt_tokens : hit + miss);
    const ratio = (typeof r.hit_ratio === 'number') ? r.hit_ratio : 0;
    cache.appendChild(statRow('命中 / 未命中', hit.toLocaleString() + ' / ' + miss.toLocaleString()));
    cache.appendChild(statRow('命中率', (ratio * 100).toFixed(1) + '%'));
    const bar = document.createElement('div');
    bar.className = 'stat-bar';
    const fill = document.createElement('div');
    fill.className = 'hit';
    fill.style.width = (Math.min(1, Math.max(0, ratio)) * 100).toFixed(1) + '%';
    bar.appendChild(fill);
    cache.appendChild(bar);
    statBody.appendChild(cache);

    const tok = document.createElement('div');
    tok.className = 'stat-card';
    tok.appendChild(cardTitle('累计 tokens'));
    tok.appendChild(statRow('输入（prompt）', prompt.toLocaleString()));
    tok.appendChild(statRow('输出（completion）', (u.completion_tokens || 0).toLocaleString()));
    tok.appendChild(statRow('合计', (u.total_tokens || prompt + (u.completion_tokens || 0)).toLocaleString()));
    statBody.appendChild(tok);

    const cost = document.createElement('div');
    cost.className = 'stat-card';
    cost.appendChild(cardTitle('成本（按当前时段费率估算）'));
    cost.appendChild(statRow('累计花费', fmtUSD(r.cost_usd), true));
    statBody.appendChild(cost);
  } catch (e) { paneHint(statBody, 'stats/cache 失败：' + e.message); }
}

function cardTitle(text) {
  const h = document.createElement('h3');
  h.textContent = text;
  return h;
}
function statRow(k, v, usd) {
  const row = document.createElement('div');
  row.className = 'stat-row';
  const key = document.createElement('span');
  key.textContent = k;
  const val = document.createElement('span');
  val.className = 'v' + (usd ? ' usd' : '');
  val.textContent = v;
  row.appendChild(key);
  row.appendChild(val);
  return row;
}

// ---- 主题运行时（W5 卡 c_ni7mzw）----
// 首屏那一步在 <head> 的内联 bootstrap 里（防 FOUC：样式表解析前
// data-theme 已落定）。这里只管「用户点切换」与「system 态跟随系统」：
// 三态选择 = light / dark / 不写记忆位（跟随系统）。属性是唯一开关，
// 颜色全在 CSS 变量层（:root / :root[data-theme="light"]）。
const THEME_KEY = 'seek-theme';
const themeMQ = window.matchMedia ? window.matchMedia('(prefers-color-scheme: light)') : null;

// 读记忆位：'light' / 'dark' / null（= 跟随系统）。隐私模式抛异常按
// 「跟随系统」处理，与 bootstrap 同一口径。
function storedTheme() {
  try {
    const v = localStorage.getItem(THEME_KEY);
    return (v === 'light' || v === 'dark') ? v : null;
  } catch (e) { return null; }
}

// 解析后的实际主题（记忆位优先，否则按系统）。
function effectiveTheme() {
  const v = storedTheme();
  if (v) return v;
  return (themeMQ && themeMQ.matches) ? 'light' : 'dark';
}

function applyTheme() {
  document.documentElement.setAttribute('data-theme', effectiveTheme());
  for (const b of document.querySelectorAll('#set-theme button')) {
    b.classList.toggle('on', b.dataset.mode === (storedTheme() || 'system'));
  }
  syncThemeNote();   // 说明行随每次应用翻新（面板未开/未建 note 时它自 no-op；
                     // 收在这里而非 setThemeMode，system 态的实时跟随也同步刷）
}

// 三态切换：写记忆位（system = 删掉记忆位）→ 立刻应用 → 重绘画设置行。
function setThemeMode(mode) {
  try {
    if (mode === 'system') localStorage.removeItem(THEME_KEY);
    else localStorage.setItem(THEME_KEY, mode);
  } catch (e) { /* 隐私模式：本次会话仍切，刷新回系统 */ }
  applyTheme();
}

// system 态下系统主题变了要跟着翻（浏览器只在有监听器时才通知）。
if (themeMQ) {
  const onSystemTheme = () => { if (!storedTheme()) applyTheme(); };
  if (themeMQ.addEventListener) themeMQ.addEventListener('change', onSystemTheme);
  else if (themeMQ.addListener) themeMQ.addListener(onSystemTheme);
}

// ---- 设置面板（W5 卡 c_ni7mzw）----
// 三段：外观（三态主题，纯前端，立即生效并记忆） / serve 侧配置（只读，
// 来自 /rpc settings/get —— serve 进程把启动时生效的配置投影成快照，
// 页面不读文件也不猜默认值） / 关于（版本 + 入口 token 短显）。
// 只读口径写在卡面：可写面要配置写入 + 重启路径，超本卡配额，故本轮
// 只展示「现在生效的是什么」，改配置 = 编辑 ~/.seek/config.json 后重启。
const setBody = document.getElementById('set-body');

function setCard(title) {
  const c = document.createElement('div');
  c.className = 'set-card';
  const h = document.createElement('h3');
  h.textContent = title;
  c.appendChild(h);
  return c;
}
function setRow(card, k, v) {
  const row = document.createElement('div');
  row.className = 'set-row';
  const kk = document.createElement('span');
  kk.className = 'k';
  kk.textContent = k;
  const vv = document.createElement('span');
  vv.className = 'v';
  vv.textContent = v;
  // 长值带全文 title（c_lqtt2m）：窄屏 value 按 ellipsis 折（断点块），
  // 悬停提示里全文仍可读——路径/版本 hash 不因折叠丢信息
  if (v.length > 24) vv.title = v;
  row.appendChild(kk);
  row.appendChild(vv);
  card.appendChild(row);
}
function setNote(card, text) {
  const d = document.createElement('div');
  d.className = 'set-note';
  d.textContent = text;
  card.appendChild(d);
  return d;
}

// 外观卡：三态按钮 + 一句「当前实际颜色」的说明（system 态下用户要知道
// 现在真的是亮还是暗）。
function renderAppearance() {
  const c = setCard('外观');
  const group = document.createElement('div');
  group.id = 'set-theme';
  for (const [mode, label] of [['light', '☀ 亮'], ['dark', '🌙 暗'], ['system', '🖥 跟随系统']]) {
    const b = document.createElement('button');
    b.type = 'button';
    b.dataset.mode = mode;
    b.textContent = label;
    b.addEventListener('click', () => setThemeMode(mode));
    group.appendChild(b);
  }
  c.appendChild(group);
  const note = document.createElement('div');
  note.className = 'set-note';
  note.id = 'set-theme-note';
  c.appendChild(note);
  setBody.appendChild(c);
  applyTheme();   // 末尾顺带把说明行刷成当前态（note 刚建好）
}

function syncThemeNote() {
  const note = document.getElementById('set-theme-note');
  if (!note) return;
  const stored = storedTheme();
  note.textContent = (stored ? '记忆位：' + stored : '跟随系统（无记忆位）')
    + ' · 当前生效：' + effectiveTheme()
    + (stored ? '' : '（系统切换会自动跟随）');
}

async function loadSetPane() {
  setBody.replaceChildren();
  renderAppearance();
  try {
    const r = await rpc('settings/get', {});
    const cfg = setCard('serve 侧配置（只读）');
    setRow(cfg, '默认 provider', r.default_provider || '（未设 —— 子进程按已配 key 自动选车道）');
    setRow(cfg, '默认模型', r.model || '（无配置项 —— serve 子进程用车道默认）');
    setRow(cfg, '温度', '（无配置项 —— 用车道默认）');
    setRow(cfg, '并发上限', String(r.max_concurrency));
    setRow(cfg, 'yolo（子进程权限）', r.yolo ? '开（全放行）' : '关（受权限闸，默认）');
    setRow(cfg, 'web 监听', r.web_addr);
    setRow(cfg, '自动压缩', r.auto_compact || '关');
    setRow(cfg, '候选项目', String((r.projects || []).length));
    for (const p of r.projects || []) setRow(cfg, '·', p);
    setNote(cfg, '改这些值 = 编辑 ~/.seek/config.json 的 serve / default_provider / auto_compact 段后重启 seek serve。'
      + '本轮设置面板按卡面口径只读：写口要配置写入 + 重启路径，超本卡配额，不在范围内。');

    const about = setCard('关于');
    setRow(about, '版本', r.version || 'unknown');
    setRow(about, '入口 token（短显）', r.token_tail ? '…' + r.token_tail + '（后 6 位）' : '（未取到）');
    setRow(about, '会话 id（短显）', CONV ? CONV.slice(0, 8) : '?');
    setNote(about, '完整 token 只在 ~/.seek/serve/web.token（0600）与启动 banner 里；本页只显示后 6 位供核对。');
    // 两卡挂载：setCard 只建不挂（外观卡由 renderAppearance 自己挂），
    // 这里漏挂是真实踩过的坑——卡建好填好却从不上树，面板只见外观卡。
    setBody.appendChild(cfg);
    setBody.appendChild(about);
  } catch (e) {
    const c = setCard('设置读取失败');
    setNote(c, 'settings/get 失败：' + e.message + '（serve 侧未挂设置方法时属预期）');
    setBody.appendChild(c);
  }
}

statSess.addEventListener('change', () => showStats(statSess.value));

// 探测式启动（W1.2）：是否有有效凭证（cookie 或 URL token）由 /state 的
// 响应判定；未鉴权就不挂 SSE——EventSource 对 401 会无限重连刷屏。侧栏
// 是常驻面（W5），鉴权通过后即拉一次 session/list（不再等用户点按钮）。
refreshState().then(ok => { if (ok) { listen(); loadSessions(); } });
</script>
