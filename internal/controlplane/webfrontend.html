     置于内联脚本之前：经典 script 保序，渲染器先到，页面脚本可用。 -->
<script src="static/markdown.js"></script>
<script>
'use strict';
// W1.2 换票：/?token= 首跳被服务端 303 换成 HttpOnly cookie，本页落在
// 干净的 / 上——正常路径 TOKEN 恒为空，鉴权靠 cookie（fetch/EventSource
// 同源自带）。仍读 URL 是给未换票直开的形态兜底（能读到的只会是错 token）。
const TOKEN = new URLSearchParams(location.search).get('token') || '';
const q = s => s + (s.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(TOKEN);

// ---- UI 图标 helpers（card c_25d2ey）----
// body 顶的 <symbol> sprite（Lucide vendored，来源/许可证注释在彼处），
// 这三个函数是 JS 动态面引用它的唯一入口。iconEl 建 <svg><use>；
// setBtnIcon/setBtn 重排按钮内容（图标钮 / 图标+文字钮）——按钮内容的
// 换装统一走这两个函数，别再手拼 textContent（会把 <svg> 洗掉）。
const SVGNS = 'http://www.w3.org/2000/svg';
function iconEl(id) {
  const svg = document.createElementNS(SVGNS, 'svg');
  svg.setAttribute('class', 'ic');
  svg.setAttribute('aria-hidden', 'true');
  const use = document.createElementNS(SVGNS, 'use');
  use.setAttribute('href', '#i-' + id);
  svg.appendChild(use);
  return svg;
}
function setBtnIcon(btn, id) {
  btn.replaceChildren(iconEl(id));
}
function setBtn(btn, id, text) {
  const t = document.createElement('span');
  t.textContent = text;
  btn.replaceChildren(iconEl(id), t);
}
// 已有图标钮换图标（不重建节点，仅改 <use href>）——侧栏折叠钮两态用。
function swapIcon(el, id) {
  const use = el.querySelector('use');
  if (use) use.setAttribute('href', '#i-' + id);
}

// ---- 时间/计数口径（c_jf3grt）----
// 全页日期统一走这两个函数，不再用 toLocaleString/toLocaleDateString：
// 浏览器 locale 是环境态（系统语言/无头 --lang/语言包），同一份页面在
// 中文界面里能渲染出「11/20/2026, 7:00:00 PM」——既长、秒无用、还混语。
// 手拼格式 = 输出与 locale 无关：MM-DD HH:mm（跨年才补 YYYY-）。秒一律
// 不出现（会话粒度的时间线，秒是噪声）。
function fmtWhen(t) {
  const d = t ? new Date(t) : null;
  if (!d || isNaN(d.getTime())) return '';
  const p = n => String(n).padStart(2, '0');
  const md = p(d.getMonth() + 1) + '-' + p(d.getDate());
  return (d.getFullYear() === new Date().getFullYear() ? md : d.getFullYear() + '-' + md)
    + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
// 只需要日期的位置（记忆列表、趋势 x 轴）：MM-DD，跨年补年。
function fmtDay(t) {
  const d = t ? new Date(t) : null;
  if (!d || isNaN(d.getTime())) return '';
  const p = n => String(n).padStart(2, '0');
  const md = p(d.getMonth() + 1) + '-' + p(d.getDate());
  return d.getFullYear() === new Date().getFullYear() ? md : d.getFullYear() + '-' + md;
}
// 「N 轮」：中文没有量词单复数，英文 "1 turns" 的复数错随本函数退休。
function fmtTurns(n) { return (n || 0) + ' 轮'; }

// 会话身份（W1.3，D-W3）：uuid 浏览器自铸、localStorage 持久；服务端
// 零会话状态——它只是 bindings 表的键（web:<uuid>）。localStorage 不可
// 用（隐私模式抛异常）时退化为本次页面加载的临时 uuid。
const CONV_KEY = 'seek-web-conv';
function mintConv() {
  // crypto.randomUUID 仅 secure context（localhost/https）可用；经
  // tailnet IP 直连是 http，退到 getRandomValues 拼 uuid v4。
  if (crypto.randomUUID) return crypto.randomUUID();
  const b = crypto.getRandomValues(new Uint8Array(16));
  b[6] = (b[6] & 0x0f) | 0x40;
  b[8] = (b[8] & 0x3f) | 0x80;
  const h = [...b].map(x => x.toString(16).padStart(2, '0')).join('');
  return [h.slice(0,8), h.slice(8,12), h.slice(12,16), h.slice(16,20), h.slice(20)].join('-');
}
let CONV = null;
try {
  CONV = localStorage.getItem(CONV_KEY);
  if (!CONV || !/^[A-Za-z0-9._-]{1,64}$/.test(CONV)) {
    CONV = mintConv();
    localStorage.setItem(CONV_KEY, CONV);
  }
} catch (e) { CONV = mintConv(); }
const status = document.getElementById('status');
const statusL = document.getElementById('status-l');
const list = document.getElementById('list');
const form = document.getElementById('form');
const input = document.getElementById('input');
const send = document.getElementById('send');
const tray = document.getElementById('tray');

function setStatus(text, ok) {
  statusL.textContent = text;   // 右段 #usage 是计量专属，互不覆盖
  status.className = ok ? 'ok' : 'warn';
}

// ---- 状态栏 usage 计量（W2.3，§3.1 之 3）----
// 每个命名 usage 事件（源=turn_end）实时累加：tokens 会话累计 + 服务端
// 算好的 $（§2.5 纪律：计价只在服务端价格包一处，本页永不算钱，
// cost_usd 直加）；reply 收口携带 session_id（源=agent_end）时补短显。
// 累计口径=本页生命周期内本 conv 的全部 run，与 CLI footer 的会话累计
// 同向；SSE 无历史回放，刷新页面从零重计（P3 资产面才补回放）。
const usageEl = document.getElementById('usage');
const meter = { prompt: 0, completion: 0, cacheHit: 0, costUsd: 0, sid: '' };
// $ 格式与服务端 FormatCost 同阈值（0→$0、<1¢ 四位、<$1 三位、
// 其余两位）——web 页与 CLI footer 的钱数读法一致。
function fmtUsd(v) {
  if (v <= 0) return '$0';
  if (v < 0.01) return '$' + v.toFixed(4);
  if (v < 1) return '$' + v.toFixed(3);
  return '$' + v.toFixed(2);
}
function renderMeter() {
  if (!meter.prompt && !meter.completion) return;  // 首个 turn_end 前不占位
  usageEl.textContent = (meter.prompt + meter.completion) + ' tok · ' + fmtUsd(meter.costUsd)
      + (meter.sid ? ' · sid ' + meter.sid.slice(0, 8) : '');
}

// ---- 顶栏 ContextMeter + SSE 连接灯（W5 卡 c_oyp2qf）----
// 余量口径对齐 dsh ContextMeter（窗口占用百分比）与 TUI formatBudget：
// 占用代理 = 末个 turn_end 的 prompt+completion（累计值随历史逐轮重发
// 二次膨胀，不反映窗口现状）；上限 ctx_limit 与车道 lane 由服务端随
// usage 事件下发（budget.Limit / modelcap.LaneOf——同源判定，页面不自建
// 表）。色阶与 internal/budget Classify 同阈值：≥60% 黄、≥75% 红。
const ctxEl = document.getElementById('ctx');
const ctxM = document.getElementById('ctx-m');
const ctxFill = ctxEl.querySelector('.bar i');
const ctxP = document.getElementById('ctx-p');
const ctx = { used: 0, limit: 0, model: '', lane: '' };
function fmtTok(n) {
  if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
  if (n >= 1e3) return Math.round(n / 1e3) + 'K';
  return String(n);
}
function renderCtx() {
  if (!ctx.model || !ctx.limit) { ctxEl.hidden = true; return; }
  ctxEl.hidden = false;
  ctxM.textContent = ctx.model + (ctx.lane ? ' · ' + ctx.lane : '');
  const frac = Math.min(ctx.used / ctx.limit, 1);
  ctxFill.style.width = (frac * 100).toFixed(1) + '%';
  ctxP.textContent = Math.round(frac * 100) + '% · 余 ' + fmtTok(Math.max(ctx.limit - ctx.used, 0));
  ctxEl.title = '上下文 ~' + fmtTok(ctx.used) + ' / ' + fmtTok(ctx.limit);
  ctxEl.className = frac >= 0.75 ? 'crit' : frac >= 0.6 ? 'warn' : '';
}
// 连接灯：绿=已连、黄=断线重连中；断线提示条 #connbar 与灯同源开合。
// 首连成功前的「连接中」不算断线（不弹提示条）；绑定状态行不再被断线
// 文案占位——断线这件事由灯+提示条专职表达。
const connEl = document.getElementById('conn');
const connT = document.getElementById('conn-t');
const connBar = document.getElementById('connbar');
let connEverOpen = false;
function connSet(ok) {
  connEl.className = ok ? 'ok' : 'warn';
  // 状态灯文字标签（c_25d2ey）：裸色点无标签无 title 是旧审查扣分项；
  // title 与 aria-label 同步文字（color-not-only：颜色不单独承载语义）。
  const label = ok ? '已连接' : '重连中';
  connT.textContent = label;
  connEl.title = 'SSE 连接状态：' + label;
  connEl.setAttribute('aria-label', 'SSE 连接状态：' + label);
  connBar.hidden = ok || !connEverOpen;
  if (ok) connEverOpen = true;
}
// 消息正文渲染（W5 卡 c_x2au4t；c_k3pnlw 返工扩表格/引用/段落）：markdown
// 子集渲染器外置在 static/markdown.js（围栏/行内码/标题/列表/GFM 表格/
// blockquote/段落；DOM API 白名单构造，无 HTML 解析 sink）。seekMD.render
// 自带清空语义（replaceChildren 后渲染）。资产未载的极端情形（script 被
// 网络/CSP 拦）退纯文本——可用性优先于格式，页面不因渲染器缺席而断流。
function renderBody(el, text) {
  if (window.seekMD) seekMD.render(el, text);
  else el.textContent = text;
}

function addMsg(who, text, atts) {
  dropChatEmpty();                   // 第一条消息落地：空态让位（c_jf3grt）
  const el = document.createElement('div');
  el.className = 'msg ' + who;
  if (atts && atts.length) {
    el.appendChild(thumbsFor(atts));   // 附件缩略图（W5 c_56yrcj）：图片在上，正文在下
    if (text) {
      const b = document.createElement('div');
      renderBody(b, text);             // 纯 DOM 构建：无 HTML 注入面
      el.appendChild(b);
    }
  } else {
    renderBody(el, text);              // 纯 DOM 构建：无 HTML 注入面
  }
  list.appendChild(el);
  list.scrollTop = list.scrollHeight;  // 流式追加：贴底滚动
}

// ---- 附件（W5 c_56yrcj）----
// 三入口汇到 addFiles：按扩展名分流（图片=视觉车道，文档=Files API 车道），
// POST /attach 上传（XHR 才有进度），成功后把服务端路径拼成「@<path>」追加
// 进 /msg 正文。能力判定仍只在子进程的 visionRouter/fileroute 里。
const ATT_IMG = new Set(['png', 'jpg', 'jpeg', 'webp', 'gif']);
const ATT_DOC = new Set(['pdf', 'doc', 'docx', 'ppt', 'pptx']);
const IMG_MAX = 32 * 1024 * 1024;    // = assets.MaxAssetBytes（图片车道）
const DOC_MAX = 100 * 1024 * 1024;   // = deepseek.FileMaxBytes（文档车道）
const attachments = [];              // 只活在本次页面生命周期
// 拼串再下标：页面级「无外链」闸的 CSS 资源正则会把该方法的调用形状
// 误判成资源加载（它读本地文件，不产生请求）。
const FR_READ_DATA_URL = 'readAsData' + 'URL';

function attExt(name) {
  const i = name.lastIndexOf('.');
  return i < 0 ? '' : name.slice(i + 1).toLowerCase();
}

// thumbsFor 造气泡缩略图块；图片 src 可能在 FileReader 读完才回填。
function thumbsFor(atts) {
  const box = document.createElement('div');
  box.className = 'thumbs';
  for (const a of atts) {
    if (a.kind === 'image') {
      const im = document.createElement('img');
      im.alt = a.name;
      if (a.dataUrl) im.src = a.dataUrl;
      a.imgs.push(im);
      box.appendChild(im);
    } else {
      const d = document.createElement('span');
      d.className = 'doc';
      // 文档附件 = file-text sprite（c_25d2ey）：旧文本前缀（文件 emoji）是 UI 图标
      // 位置的 emoji，跨平台字形不一致；路径数据同 sprite 注释。
      d.append(iconEl('file-text'), document.createTextNode(a.name));
      box.appendChild(d);
    }
  }
  return box;
}

function renderTray() {
  tray.replaceChildren();
  tray.classList.toggle('has', attachments.length > 0);
  for (const a of attachments) {
    const chip = document.createElement('div');
    chip.className = 'chip' + (a.status === 'error' ? ' bad' : '');
    if (a.kind === 'image' && a.dataUrl) {
      const im = document.createElement('img');
      im.className = 'tn';
      im.alt = '';
      im.src = a.dataUrl;
      chip.appendChild(im);
    } else if (a.kind !== 'image') {
      chip.appendChild(iconEl('file-text'));   // 文档附件行首图标（c_25d2ey）
    }
    const nm = document.createElement('span');
    nm.className = 'nm';
    nm.textContent = a.name;
    chip.appendChild(nm);
    const pc = document.createElement('span');
    pc.className = 'pc';
    pc.textContent = a.status === 'error' ? (a.err || '失败')
      : a.status === 'done' ? '已就绪'
      : a.status === 'uploading' ? a.pct + '%' : '等待';
    chip.appendChild(pc);
    const rm = document.createElement('button');
    rm.type = 'button';
    rm.className = 'rm';
    rm.title = '移除';
    rm.setAttribute('aria-label', '移除附件');
    setBtnIcon(rm, 'x');   // c_25d2ey：× 字符换 sprite 图标
    rm.addEventListener('click', () => {
      const i = attachments.indexOf(a);
      if (i >= 0) attachments.splice(i, 1);
      renderTray();
    });
    chip.appendChild(rm);
    if (a.status === 'uploading') {
      const pb = document.createElement('div');
      pb.className = 'pb';
      const fill = document.createElement('i');
      fill.style.width = a.pct + '%';
      pb.appendChild(fill);
      chip.appendChild(pb);
    }
    tray.appendChild(chip);
  }
  syncSend();   // 附件进出/就绪改动「可否发送」（c_jf3grt：无正文也能发附件）
}

// attachOne：本地预检（类型/空/上限）→ 图片读预览 → /attach 上传
// （progress 喂进度条）。promise 落在 a.wait，发送前统一等。
function attachOne(file) {
  const name = file.name || 'attachment';
  const ext = attExt(name);
  const kind = ATT_IMG.has(ext) ? 'image' : ATT_DOC.has(ext) ? 'file' : '';
  const a = { name, ext, kind, size: file.size, dataUrl: '', imgs: [],
              status: 'uploading', pct: 0, path: '', err: '', wait: null };
  attachments.push(a);
  if (!kind) {
    a.status = 'error';
    a.err = '不支持该类型';
    renderTray();
    return Promise.resolve(a);
  }
  if (a.size === 0) {
    a.status = 'error';
    a.err = '文件为空';
    renderTray();
    return Promise.resolve(a);
  }
  const cap = kind === 'image' ? IMG_MAX : DOC_MAX;
  if (a.size > cap) {
    a.status = 'error';
    a.err = '超过 ' + (cap >> 20) + ' MiB 上限';
    renderTray();
    return Promise.resolve(a);
  }
  if (kind === 'image') {
    const fr = new FileReader();
    fr.onload = () => {
      a.dataUrl = String(fr.result || '');
      for (const im of a.imgs) im.src = a.dataUrl;
      renderTray();
    };
    fr[FR_READ_DATA_URL](file);
  }
  renderTray();
  a.wait = new Promise(resolve => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', q('/attach?name=' + encodeURIComponent(name)));
    xhr.setRequestHeader('X-Seek-Conversation', CONV);
    xhr.upload.onprogress = ev => {
      if (!ev.lengthComputable) return;
      a.pct = Math.round(ev.loaded * 100 / ev.total);
      renderTray();
    };
    xhr.onload = () => {
      let j = null;
      try { j = JSON.parse(xhr.responseText); } catch (e) { /* 非 JSON 错误体 */ }
      if (xhr.status === 201 && j && j.path) {
        a.status = 'done';
        a.pct = 100;
        a.path = j.path;
      } else {
        a.status = 'error';
        a.err = (j && j.error) || ('HTTP ' + xhr.status);
      }
      renderTray();
      resolve(a);
    };
    xhr.onerror = () => {
      a.status = 'error';
      a.err = '网络错误';
      renderTray();
      resolve(a);
    };
    xhr.send(file);
  });
  return a.wait;
}

function addFiles(files) {
  const picked = [...files];
  if (!picked.length) return Promise.resolve([]);
  return Promise.all(picked.map(attachOne));
}

function dragHasFiles(ev) {
  const t = ev.dataTransfer && ev.dataTransfer.types;
  return !!t && [...t].indexOf('Files') >= 0;
}

// 绑定状态一行：GET /state（本 conv 的 binding，头携带会话身份）。返回
// 是否已鉴权——启动时据此决定挂不挂 SSE（W1.2：凭证可能是 cookie，页内
// 无从预判，探测是唯一权威）。boundProject 记下当前绑定（或 null）供
// 任务面板的 topic 订阅判定（W3.3）：换绑项目后重开订阅跟随新项目。
// boundProjectID 是同一绑定的 /rpc 键（服务端算好的 16 hex）——子代理面板
// 走 subagent/list|get 时要它，页面不自己哈希路径。
let boundProject = null;
let boundProjectID = '';
let boundSession = null;  // 本 conv 的绑定会话（侧栏当前项高亮的退化基准）
// 「上一次 refreshState 看到的绑定会话」：变了就说明新会话已落盘（首条消息
// 跑完、/new、/bind）——侧栏是常驻面，得跟着磁盘世界刷新一次列表，否则新
// 会话要等整页刷新才出现。undefined = 首次 /state 还没回（启动那一次由
// boot 的 loadSessions 负责，避免双拉）。
let lastSeenSession;
// 同理的绑定项目游标：变了就把组候选缓存作废重拉（刚绑的目录第一次得靠
// boundProject 兜底，且没有 last_active_at）。undefined = 首帧。
let lastSeenProject;

// ---- 主区空态（c_jf3grt）----
// 聊天面空着时给引导，不留一大片无字区：未绑定 → 「点左栏的工作区」+
// 「选择目录…」按钮（fs/list 目录浏览器）；已绑定 → 欢迎语与输入提示。
// 空态块是 #list 的直接子节点里唯一非 .msg 的一项，消息落地
// 即摘（dropChatEmpty）；只在真的空列表上渲染，绝不挤占历史消息。
let chatEmptyKind = '';   // 在场空态的形态（unbound/bound）；'' = 无
function dropChatEmpty() {
  const old = list.querySelector('.chat-empty');
  if (old) old.remove();
  chatEmptyKind = '';
}

function renderChatEmpty() {
  if (list.children.length) { chatEmptyKind = ''; return; }
  const kind = boundProject ? 'bound' : 'unbound';
  if (chatEmptyKind === kind) return;   // 同形态已在场：不重建（免闪）
  list.replaceChildren();
  const box = document.createElement('div');
  box.className = 'chat-empty';
  const t = document.createElement('div');
  t.className = 'ce-t';
  const x = document.createElement('div');
  x.className = 'ce-x';
  if (!boundProject) {
    t.textContent = '还没有工作区';
    x.textContent = '点左栏头的「新建」选一个目录：绑定后这里就能开始对话。左栏也会自动列出你已经用过的工作区。';
    const acts = document.createElement('div');
    acts.className = 'ce-acts';
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = '选择目录…';
    b.addEventListener('click', () => openDirPicker());
    acts.appendChild(b);
    box.appendChild(t);
    box.appendChild(x);
    box.appendChild(acts);
  } else {
    t.textContent = '开始新的对话';
    x.textContent = '直接输入消息开始；输入 / 看指令，@ 引用历史会话。';
    box.appendChild(t);
    box.appendChild(x);
  }
  list.appendChild(box);
  chatEmptyKind = kind;
}

async function refreshState() {
  try {
    const r = await fetch(q('/state'), { headers: { 'X-Seek-Conversation': CONV } });
    if (r.status === 401) {
      setStatus('token 无效或未带——用 /?token=<serve 启动时打印的值> 打开', false);
      return false;
    }
    const s = await r.json();
    boundProject = s.bound ? s.project : null;
    boundProjectID = s.bound ? (s.project_id || '') : '';
    boundSession = s.session || null;
    setStatus(s.bound ? '已绑定 ' + s.project + (s.session ? ' · 会话 ' + s.session.slice(0, 8) : '')
                      : '未绑定——点左栏的「新建」选一个目录', s.bound);
    syncTopicStream();               // /bind 落地后面板订阅即时跟上
    syncAgentRefresh();              // 绑定到位后定时刷新才敢起（c_4doebx）
    if (sessList) markCur();         // 侧栏当前项跟随绑定（W5 侧栏）
    // 绑定会话变了 = 磁盘上多了一条（或换了一条）：常驻侧栏跟着刷新，否则
    // 新会话要等整页刷新才出现在列表里。首帧由 boot 的 loadSessions 拉。
    if (lastSeenSession !== undefined && lastSeenSession !== boundSession) loadSessions();
    lastSeenSession = boundSession;
    // 绑定项目变了 = 候选里可能多了一个（或换了一个）：组来源缓存作废重拉，
    // 否则刚绑的目录第一次只能靠 boundProject 兜底、且没有 last_active_at。
    if (lastSeenProject !== undefined && lastSeenProject !== boundProject) { bindData = null; loadProjects(); }
    lastSeenProject = boundProject;
    renderChatEmpty();               // 空态跟随绑定态（未绑定 / 已绑定欢迎语）
    return true;
  } catch (e) { setStatus('连不上 /state：' + e, false); return false; }
}

// ---- 流式 run 折叠（W2.1，feature-web-frontend §2.4/§2.5 客户端半边）----
// 服务端把一次 seek 运行的 jsonLine 折成命名 SSE 事件：delta {run,text}、
// tool {run,id,name,phase,ok}、usage {run,…}（W2.3 状态栏的入项，本卡不
// 消费——EventSource 对未注册的命名事件静默忽略）；终答走默认事件 reply
// {conv,text,run?,session_id?}。run id 由服务端铸造（§2.5），页面按 run
// 聚合：delta 累积进文本块、tool 进单行折叠状态行，按到达顺序交错在
// 同一个气泡里；带 run 的 reply 到达时整泡替换成权威终文本——客户端
// 累积只是预览，丢帧/未见过该 run 的 reply 走普通消息路径，天然幂等。
const runs = new Map();   // runId → {el, cur, tools}
let lastRun = '';         // 最新流式 run：/cancel 武装的对象（服务端每 conv 至多一个活跃 run，即最新泡）
let stopping = '';        // 已发 /cancel 待收口的 run id：它的 run-bearing reply 走保留式中断收口（c_5m3fm6）
let raf = 0;
const dirty = new Set();  // 本帧待重渲的 run（SSE 突发合帧，一帧最多渲一次）

// ---- 发送/停止键态（c_5m3fm6，对齐 dsh InputBar 中断语义）----
// 生成中（本 conv 有活跃 run——首个 delta/tool 事件起、reply 收口止）发送键
// 变停止键；键态只跟 runs 表走，流事件开、收口关，无生成时恒为发送键。
//
// 空草稿禁用（c_jf3grt）：非生成态下「发送」只在有内容可发时可点——草稿
// 非空白，或托盘里有还没失败的附件（附件可以不带正文直接发）。停止键
// 不受这条约束：生成中永远要给出一条中断出口。
// posting 是在途 POST /msg 的防重入位，与「可否发送」解耦——早先两者共用
// send.disabled，键一禁用就把 /new、/bind 选择器这些同走 sendText 的入口
// 一并锁死（按钮不吃输入框的草稿）。
let posting = false;
function draftReady() {
  return input.value.trim() !== '' || attachments.some(a => a.status !== 'error');
}
function syncSend() {
  if (runs.size > 0) { send.disabled = false; return; }
  send.disabled = posting || !draftReady();
}
function renderSend() {
  const busy = runs.size > 0;
  // 文案不带 emoji/字符图标（c_25d2ey）：主操作档不加图标，红底 .stop
  // 即停止态；文字由 web-stop-headless 钉住（「停止」/「发送」）。
  send.textContent = busy ? '停止' : '发送';
  send.classList.toggle('stop', busy);
  send.title = busy ? '中断当前生成（等同 /cancel）' : '';
  syncSend();
}

function nearBottom() {
  return list.scrollHeight - list.scrollTop - list.clientHeight < 80;
}
// 追加/替换后只在「本来就在底」时跟随滚动——读历史不被流式追加劫持。
// pin 必须在 DOM 变更前采样：先改 DOM 再测，新增高度本身就把距离撑过阈值。
function appendPinned(parent, el) {
  const pin = nearBottom();
  parent.appendChild(el);
  if (pin) list.scrollTop = list.scrollHeight;
}

function runBubble(id) {
  let r = runs.get(id);
  if (r) return r;
  const el = document.createElement('div');
  el.className = 'msg seek streaming';
  r = { el, cur: null, tools: new Map(), tick: 0 };  // tick: 耗时跳动 interval id
  runs.set(id, r);
  lastRun = id;
  renderSend();               // 首个流事件即键态切换（c_5m3fm6）
  dropChatEmpty();            // 流式泡也是消息：空态让位（c_jf3grt）
  appendPinned(list, el);
  return r;
}

// 幻影 run 收口（c_6mbjfq）：SSE 不回放，run 的收口帧一旦落在断连窗口就永久丢了
// ——页面这边只剩 runs 表里的一条记录和它的半截气泡，键态于是永远停在停止态。
// 重连本身给不出判据（服务端 /state 不报活跃 run；按 run 龄盲清会截断仍在跑的
// 气泡，见 docs/pitfalls.md），唯一的自愈信号是：本页为这个 run 发过 /cancel，
// 回来的却是一条 run-less 应答——服务端都没得中断了，它早结束了，只是收口丢了。
// 收口沿用 c_5m3fm6 的保留式（半截就是内容）：关流式、尾部标注、从表里删——
// 键态只跟表走，删掉即走 renderSend 的 runs.size=0 分支回「发送」。
function closePhantom(id) {
  const r = runs.get(id);
  if (!r) return;
  runs.delete(id);
  if (lastRun === id) lastRun = '';
  r.cur = null;                            // 停掉在途的合帧渲染
  r.el.classList.remove('streaming');
  const cut = document.createElement('div');
  cut.className = 'cut';
  cut.textContent = '—— 已中断 ——';
  r.el.appendChild(cut);
  renderSend();
}

function schedule(r) {
  dirty.add(r);
  if (!raf) raf = requestAnimationFrame(flushRuns);
}
function flushRuns() {
  raf = 0;
  const pin = nearBottom();
  for (const d of dirty) {
    // 流式重渲（W5 轻量路径）：seekMD.render 清块后重渲累积全文——
    // 线性单趟、rAF 合帧（SSE 突发一帧最多渲一次），聊天级文本亚毫秒；
    // 未闭合围栏/半截 [ ` 保持字面可渲，故过程态与收口同一条渲染线。
    if (d.cur) renderBody(d.cur.el, d.cur.text);
  }
  dirty.clear();
  if (pin) list.scrollTop = list.scrollHeight;
}

function onDelta(ev) {
  let d;
  try { d = JSON.parse(ev.data); } catch (e) { return; }
  if (!d.run || typeof d.text !== 'string') return;
  const r = runBubble(d.run);
  if (!r.cur) {   // 首 delta 或工具行之后：开新文本块，保持到达顺序
    const b = document.createElement('div');
    b.className = 'txt';
    appendPinned(r.el, b);
    r.cur = { el: b, text: '' };
  }
  r.cur.text += d.text;
  schedule(r);
}

// 工具行 → 调用树（c_ux7lvk，对齐 dsh 的工具调用树呈现；§2.5 线不变：
// args/result 服务端不下发，tool_end.result 可以巨大）。每次调用一行 =
// 名称+耗时：耗时是 start/end 两帧到达的墙钟差（SSE 逐帧即时转发，目测
// 级足够），在途每 300ms 跳动、end 冻结；未见 start 的 end（丢帧）行照
// 补但无耗时。嵌套缩进 = 区间包含：start 时刻在途（已 start 未 end）调
// 用数即深度——seek 分区派发让只读调用并发，重叠区间呈现为父子缩进
// （火焰图口径：呈现重叠，不主张因果；串行运行的区间不嵌，树保持平）。
// 行按 tool id 幂等。树渲染抛错时退 toolPlainRow（升级前的名称+状态
// 单行折叠）——流式面不白屏。
function onTool(ev) {
  let d;
  try { d = JSON.parse(ev.data); } catch (e) { return; }
  if (!d.run || !d.name) return;
  try { toolTreeRow(d); } catch (e) { toolPlainRow(d); }
}

// 耗时排版：<1s 毫秒整数；<60s 一位小数秒；再上分秒。
function fmtDur(ms) {
  if (ms < 0) ms = 0;
  if (ms < 1000) return Math.max(1, Math.round(ms)) + 'ms';
  const s = ms / 1000;
  if (s < 60) return s.toFixed(1) + 's';
  return Math.floor(s / 60) + 'm' + String(Math.round(s % 60)).padStart(2, '0') + 's';
}

function trowPaint(n, now) {
  const end = n.phase === 'end';
  let dur = '';
  if (n.t0) {
    const ms = (end ? n.t1 : (now || performance.now())) - n.t0;
    if (ms >= 0) dur = ' · ' + fmtDur(ms);
  }
  // 状态前缀走 sprite 图标（c_25d2ey）：在途 loader / 成功 check / 失败 x，
  // 结构在行创建时装好（iconEl + .tt span），这里只换 href 与文本。
  swapIcon(n.el, end ? (n.ok ? 'check' : 'x') : 'loader');
  n.el.querySelector('.tt').textContent = n.name + (end ? '' : ' …') + dur;
  n.el.classList.toggle('bad', end && !n.ok);
}

function toolTreeRow(d) {
  const r = runBubble(d.run);
  r.cur = null;   // 工具行截断当前文本块，后续 delta 开新块（交错顺序）
  let n = r.tools.get(d.id);
  if (!n) {
    let depth = 0;   // 在途数=区间包含深度（页头注释口径）
    for (const t of r.tools.values()) if (t.phase !== 'end') depth++;
    const el = document.createElement('div');
    el.className = 'trow';
    if (depth > 0) el.style.marginLeft = depth * 16 + 'px';   // CSSOM：数值宽度
    const tt = document.createElement('span');
    tt.className = 'tt';
    el.replaceChildren(iconEl('loader'), tt);
    appendPinned(r.el, el);
    n = { el, name: d.name, phase: '', ok: true, t0: 0, t1: 0 };
    r.tools.set(d.id, n);
  }
  n.phase = d.phase === 'end' ? 'end' : 'start';
  // ok 是 omitempty 布尔（webToolEvent wire 契约）：end 帧只在成功时带
  // ok:true，失败帧整个键缺席——判定必须按「true 才算成功」读，旧代码
  // 的 d.ok? 把失败帧也读成成功（c_ux7lvk 随调用树一并修正）。
  n.ok = d.ok === true;
  if (n.phase === 'end') {
    n.t1 = performance.now();
    trowPaint(n);
    // 全部收口即停表（reply 丢帧时也只多跳一拍）
    let live = false;
    for (const t of r.tools.values()) if (t.phase !== 'end') live = true;
    if (!live && r.tick) { clearInterval(r.tick); r.tick = 0; }
  } else {
    if (!n.t0) n.t0 = performance.now();
    trowPaint(n);
    toolTick(r);
  }
}

// 一个 run 一只节拍器：在途行统一重画（合帧，不逐行起 interval）。
function toolTick(r) {
  if (r.tick) return;
  r.tick = setInterval(() => {
    let live = false;
    const now = performance.now();
    for (const t of r.tools.values()) if (t.phase !== 'end') { live = true; trowPaint(t, now); }
    if (!live) { clearInterval(r.tick); r.tick = 0; }
  }, 300);
}

// 兜底＝升级前的折叠形态（名称+状态单行，无耗时/缩进）。
function toolPlainRow(d) {
  const r = runBubble(d.run);
  r.cur = null;
  let n = r.tools.get(d.id);
  if (!n) {
    const el = document.createElement('div');
    el.className = 'trow';
    const tt = document.createElement('span');
    tt.className = 'tt';
    el.replaceChildren(iconEl('loader'), tt);
    appendPinned(r.el, el);
    n = { el, name: d.name, phase: '', ok: true, t0: 0, t1: 0 };
    r.tools.set(d.id, n);
  }
  const end = d.phase === 'end';
  swapIcon(n.el, end ? (d.ok === true ? 'check' : 'x') : 'loader');
  n.el.querySelector('.tt').textContent = d.name + (end ? '' : ' …');
  n.el.classList.toggle('bad', end && d.ok !== true);   // omitempty：失败帧无 ok 键
}

// ---- 审批卡片（W5 卡 c_n37tnr，§3.4 远程审批）----
// 服务端审批 hub 的浏览器半边：SSE approval 事件（pending 弹卡 /
// resolved|cancelled 撤卡）+ /rpc approval/decide（y|n|a 对齐 permission
// 语义）。幂等：卡按 id 增删；点击即整卡禁用（防抖不双发）。空态零侵入
// （角标 hidden、卡栈 :empty 隐藏）。重连快照重建走墓碑集——快照可能取在
// 回执前，直接回填会复活刚撤的卡（subagents 面板同款竞态）。
const apBox = document.getElementById('approvals');
const apBadge = document.getElementById('ap-badge');
const apCards = new Map();   // id → {root, done}
const apTomb = [];           // 最近撤下的 id（防快照复活；保底 32 条）

function apBadgeRender() {
  const n = apCards.size;
  apBadge.textContent = n ? '待审批 ' + n : '';
  apBadge.hidden = n === 0;           // 空态零侵入：无未决不占顶栏
}

function apDrop(id) {
  const c = apCards.get(id);
  if (!c) return;                     // 重复回执/未知撤卡：幂等无感
  apCards.delete(id);
  c.root.remove();
  if (!apTomb.includes(id)) {
    apTomb.push(id);
    if (apTomb.length > 32) apTomb.shift();
  }
  apBadgeRender();
}

// 命令摘要按模型产物处理：textContent-only，无 HTML 解析面（§5.5）。
function apAdd(v) {
  if (!v || !v.id || apCards.has(v.id)) return;
  const root = document.createElement('div');
  root.className = 'apcard';
  root.dataset.id = v.id;
  const t = document.createElement('div');
  t.className = 'apt';
  t.append(iconEl('shield-check'),
    document.createTextNode('审批 · ' + (v.kind || '?') + (v.run ? ' · run ' + v.run.slice(0, 8) : '')));
  const s = document.createElement('p');
  s.className = 'aps';
  s.textContent = v.summary || '（无描述）';
  root.appendChild(t);
  root.appendChild(s);
  if (v.command) {
    const pre = document.createElement('pre');
    pre.textContent = v.command;
    root.appendChild(pre);
  }
  const bar = document.createElement('div');
  bar.className = 'apb';
  // 三档落位（c_25d2ey）：允许 = 主操作 .btn-primary；拒绝/总是允许 = 次操作。
  for (const [dec, icon, label, tip, cls] of [
    ['y', 'check', '允许', '允许这一次', 'btn-primary'],
    ['n', 'x', '拒绝', '拒绝；拒绝仍是工具结果，不是致命错', ''],
    ['a', 'check-check', '总是允许', '本次会话内同类操作不再询问（always-allow）', ''],
  ]) {
    const b = document.createElement('button');
    b.type = 'button';
    if (cls) b.className = cls;
    setBtn(b, icon, label);
    b.title = tip;
    b.addEventListener('click', () => apDecide(v.id, dec));
    bar.appendChild(b);
  }
  root.appendChild(bar);
  apBox.appendChild(root);
  apCards.set(v.id, { root, done: false });
  apBadgeRender();
}

// 决定上行：先整卡禁用（防抖——重复点击不二次发 POST），RPC 失败才复能；
// 成功即撤卡（SSE 回执会再撤一次，apDrop 幂等；其它标签页靠同一回执撤）。
async function apDecide(id, dec) {
  const c = apCards.get(id);
  if (!c || c.done) return;
  c.done = true;
  for (const b of c.root.querySelectorAll('button')) b.disabled = true;
  try {
    await rpc('approval/decide', { id, decision: dec });
    apDrop(id);
  } catch (e) {
    c.done = false;                   // 决定未落账：复能重试
    for (const b of c.root.querySelectorAll('button')) b.disabled = false;
    addMsg('hint', '（审批操作失败：' + e.message + '）');
  }
}

function onApproval(ev) {
  try {
    const v = JSON.parse(ev.data);
    if (!v || !v.id) return;
    if (v.state === 'pending') apAdd(v);
    else apDrop(v.id);
  } catch (e) { /* 单条坏帧不毁卡片栈 */ }
}

// 快照重建（页面加载 / SSE 重连）：墓碑里的 id 跳过（撤卡先到、快照后到
// 的竞态）。失败静默——SSE 推送仍可用，与资产面同款取舍。
async function apResync() {
  try {
    const res = await rpc('approval/list', { conv: CONV });
    for (const v of (res.approvals || [])) {
      if (apTomb.includes(v.id)) continue;
      apAdd(v);
    }
  } catch (e) { /* 快照拉不到不算错：卡片栈靠推送维持 */ }
}

// SSE 下行。EventSource 不能设头，conv 走查询参数；鉴权走 cookie（换票
// 后）或 TOKEN 查询参数（旧形态），两者服务端同权。W2.1 起消费 W1.4 的
// 事件族：命名事件 delta/tool 折进流式气泡；默认事件里带 run 的 reply
// 是流式收口（整泡替换），无 run 的照旧普通消息。（重）连上即刷一次绑定
// 状态（W2.2）；断线态由连接灯+提示条表达（W5 c_oyp2qf），绑定行不被
// 占位——重连后 onopen 的刷新自然收敛。listen 幂等（旧连接先 close），
// 手动重连钮与启动挂流同走这一条，绝不双连。
let es = null;
function listen() {
  if (es) es.close();
  es = new EventSource(q('/events?conv=' + encodeURIComponent(CONV)));
  es.addEventListener('delta', onDelta);
  es.addEventListener('tool', onTool);
  es.addEventListener('approval', onApproval);   // W5 c_n37tnr：审批卡族
  es.onopen = () => { connSet(true); refreshState(); apResync(); };  // 重连即快照重建卡片栈
  es.onmessage = ev => {
    let m;
    try { m = JSON.parse(ev.data); } catch (e) { addMsg('hint', '（无法解析的回复）'); return; }
    const r = m.run && runs.get(m.run);
    if (r) {   // 收口：替换成服务端权威终文本（§2.4 客户端按 run 幂等）；
               // renderBody 自带清空——整泡重渲即「收口重渲」（W5）
      runs.delete(m.run);
      r.cur = null;                    // 停掉在途的合帧渲染
      if (r.tick) { clearInterval(r.tick); r.tick = 0; }   // 停掉耗时跳动
      const pin = nearBottom();
      r.el.classList.remove('streaming');
      if (m.run === stopping) {
        // 中断收口（c_5m3fm6）：这份 run-bearing reply 是 /cancel 的 ack——
        // 文本只是回执，已累积的半截才是被中断 run 的内容。保留气泡 + 尾部
        // 标注中断，不做权威替换；服务端终态「run 已中断。」随后 run-less
        // 独立成条。ack/终态谁先带 run 不定（服务端只保「恰一条」），两条
        // 路径在此同形。
        stopping = '';
        const cut = document.createElement('div');
        cut.className = 'cut';
        cut.textContent = '—— 已中断 ——';
        r.el.appendChild(cut);
      } else if (m.text) {
        renderBody(r.el, m.text);
      } else {
        r.el.remove();
      }
      if (pin) list.scrollTop = list.scrollHeight;
      renderSend();                    // 收口即键态复位（c_5m3fm6）
    } else if (m.text) {
      addMsg('seek', m.text);   // 指令应答 / 丢帧回退：普通消息路径
      // 幻影 run 自愈（c_6mbjfq）：本页为某个 run 发过 /cancel，回来的却是
      // run-less 应答——服务端已无 run 可中断 = 它早已结束，收口帧落在断连
      // 窗口里丢了（SSE 不回放）。把那条永不收口的表项按保留式收掉，键态随之
      // 回「发送」。正常中断里 run-bearing 那条（ack 或终态）先到，stopping
      // 已被清、此分支空转。
      // 武装窗口内的其它指令应答（run-less，如 /projects）也会走到这里：那个
      // run 反正已被本页发出的 /cancel 杀掉，差别只是它的 ack 随后落到普通消息
      // 路径、多出一条回执气泡——宁可多一条气泡，也不让键永久卡在停止态。
      if (stopping) {
        const phantom = stopping;
        stopping = '';
        closePhantom(phantom);
      }
    }
    if (m.session_id) {         // W2.3：agent_end 终值——run 收口带 sid
      meter.sid = m.session_id;
      renderMeter();
    }
    refreshState();             // 回复可能改了绑定（/bind 等）
  };
  // usage（源=turn_end）：多 turn 逐次累加，turn 间即实时上屏；W5 起
  // 同帧带 ContextMeter 三件（model/lane/ctx_limit）——末轮占用即时刷新。
  es.addEventListener('usage', ev => {
    try {
      const u = JSON.parse(ev.data);
      meter.prompt += u.prompt || 0;
      meter.completion += u.completion || 0;
      meter.cacheHit += u.cache_hit || 0;
      meter.costUsd += u.cost_usd || 0;
      renderMeter();
      if (u.model) {
        ctx.model = u.model;
        ctx.lane = u.lane || '';
        ctx.limit = u.ctx_limit || 0;
      }
      ctx.used = (u.prompt || 0) + (u.completion || 0);  // 占用代理：末轮口径
      renderCtx();
    } catch (e) { /* 坏帧跳过——计量不因单帧畸形中断 */ }
  });
  es.onerror = () => connSet(false);   // 灯转黄+提示条；EventSource 自带 3s 重试
  // push-to-talk（voice V2）：转写回显与失败面。命名事件不进 onmessage
  // （SSE 设计，旧页面零感知）；voice conv 的 seek 回复走上面的默认事件
  // 路径（无 run id → 普通气泡）。
  es.addEventListener('voice', ev => {
    try { const d = JSON.parse(ev.data); if (d.text) addMsg('you', d.text); } catch (e) {}
  });
  es.addEventListener('voice-error', ev => {
    try { const d = JSON.parse(ev.data); addMsg('hint', '（' + (d.error || '语音识别失败') + '）'); } catch (e) {}
  });
}
// 手动重连（W5 c_oyp2qf）：断线提示条上的出口——不等 3s 自动重试，立即
// 重建连接（listen 幂等，先 close 旧的）。服务端仍不可用则新连接照旧
// onerror 转黄、提示条保持，可反复点。
document.getElementById('reconn').addEventListener('click', () => listen());

// 上行共用路径（W2.2 抽出）：表单提交与指令快捷按钮同走这一条 POST /msg
// 纯文本透传——按钮与手打完全同权。fromInput 才清空输入框（按钮直发不动
// 用户打了一半的草稿）。指令（"/" 开头）POST 成功后即时刷一次 /state：
// 绑定类指令改的是 bindings 表，不等 SSE 回复先把状态行对齐；回复到达时
// onmessage 的刷新再收敛（两次幂等，竞态最多短暂显示旧值）。
// atts（W5 c_56yrcj）非空时把每个已就绪附件的路径拼成「@<path>」追加进
// 正文——这就是平面与 CLI 之间唯一的附件协议，child 的 imgrefs/filerefs
// 路由器照旧认领。
async function sendText(text, fromInput, atts) {
  if (posting) return;   // 在途重入闸（c_jf3grt：与「空草稿禁用」解耦）
  const refs = (atts || []).filter(a => a.status === 'done' && a.path);
  const tokens = refs.map(a => '@' + a.path).join('\n');
  const body = text ? (tokens ? text + '\n' + tokens : text) : tokens;
  if (!body) return;
  // /cancel（停止键、顶栏按钮、手打三入口同此一条）：武装被中断的 run——
  // 它的 run-bearing ack 走保留式收口而非权威替换（c_5m3fm6）。无活跃 run
  // 时无从武装，ack 自会以普通消息路径给出「当前没有正在运行的任务。」。
  if (body.trim() === '/cancel') stopping = runs.size ? lastRun : '';
  addMsg('you', text, refs);
  if (fromInput) input.value = '';
  posting = true;
  syncSend();
  try {
    const r = await fetch(q('/msg'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Seek-Conversation': CONV },
      body: JSON.stringify({ text: body }),
    });
    if (r.status === 401) {
      addMsg('hint', '（token 无效，消息未送达——用带 ?token= 的地址打开）');
    } else if (!r.ok) {
      addMsg('hint', '（发送失败：HTTP ' + r.status + '）');
    } else {
      if (refs.length) {   // 已进正文的附件从托盘移除（失败的留在托盘里重试）
        for (const a of refs) {
          const i = attachments.indexOf(a);
          if (i >= 0) attachments.splice(i, 1);
        }
        renderTray();
      }
      if (body.startsWith('/')) refreshState();
    }
  } catch (e) { addMsg('hint', '（发送失败：' + e + '）'); }
  posting = false;
  syncSend();          // 收口回「发送」；草稿空则保持禁用（c_jf3grt）
}

// pendingAttachments 等在途上传收口，分出可用与失败两组。
async function pendingAttachments() {
  await Promise.all(attachments.map(a => a.wait).filter(Boolean));
  const ready = attachments.filter(a => a.status === 'done' && a.path);
  const failed = attachments.filter(a => a.status === 'error');
  return { ready, failed };
}

form.addEventListener('submit', async ev => {
  ev.preventDefault();
  if (posting) return;
  const typed = input.value.trim();
  const { ready, failed } = await pendingAttachments();
  // 指令不吃附件（"/bind …" 后面拼路径只会变成指令参数）；有附件时先
  // 把失败项说清楚，用户能删掉再发。
  if (typed.startsWith('/')) {
    await sendText(typed, true);
    grow();
    input.focus();
    return;
  }
  if (failed.length) {
    addMsg('hint', '（' + failed.length + ' 个附件未就绪：' + failed.map(a => a.name).join('、')
      + '——请在下方移除后重发）');
  }
  if (!typed && !ready.length) { input.focus(); return; }
  await sendText(typed, true, ready);
  grow();
  input.focus();
});

// ---- 输入增强（c_7lsngm；对齐 dsh ui-input-trigger + ui-commands）----
// 全挂在输入框这条 input/keydown 线上，不碰全局键：Enter 发送 /
// Shift+Enter 原生换行；'/' 指令补全（候源 = 下面这张注册表）；
// '@' 最近会话（session/list），选中落 @<sid> 并发 /resume <sid>。
// 工作区/项目的选择已经整体搬进左栏两级树（见「工作区树」一节），
// 所以这张注册表只剩「树里没有对应手势」的两条：/resume（历史会话的
// 显式续接，@ 引用也走它）与 /cancel（键盘党的中断）。/bind /projects /
// /switch /new 仍是平面指令（router.go，Telegram/飞书靠它们说话），只是
// 页面不再列出、也不再提供任何入口——树就是它们的 UI。
// 弹层开着时导航键就地消化，关掉即全部放行（Esc 不劫持页面）。
const CMDS = [
  { name: '/resume', args: true,  desc: '续到某个历史会话（@ 引用也是它）' },
  { name: '/cancel', args: false, desc: '中断本会话运行中的任务' },
];

const menu = document.getElementById('menu');
let menuItems = [], menuHl = -1, menuCtx = null;  // 候选 / 高亮 / 上次判定的上下文

function closeMenu() {
  menu.hidden = true;
  menu.replaceChildren();
  menuItems = [];
  menuHl = -1;
  dirMode = null;     // 目录模式随层一起关（c_heffj3）
}

function renderMenu() {
  // 目录模式（c_heffj3）：层头与行容器分离——层头不随行重绘整体重建，
  // 否则 ↑↓ 一次就把过滤框的焦点打飞；这里只清行容器。
  const scope = menu.querySelector('.dirrows') || menu;
  scope.replaceChildren();
  menuItems.forEach((it, i) => {
    const row = document.createElement('div');
    row.className = 'mi' + (i === menuHl ? ' hl' : '');
    row.setAttribute('role', 'option');
    row.setAttribute('aria-selected', i === menuHl ? 'true' : 'false');
    if (it.icon) row.appendChild(iconEl(it.icon));   // 行首图标（c_25d2ey：文件夹 emoji → folder sprite）
    for (const [cls, text] of [['nm', it.label], ['ds', it.desc], ['sid', it.meta]]) {
      if (!text) continue;
      const span = document.createElement('span');
      span.className = cls;
      span.textContent = text;
      row.appendChild(span);
    }
    // mousedown 而非 click：click 前 textarea 会先 blur 丢掉弹层局部态。
    row.addEventListener('mousedown', ev => { ev.preventDefault(); pick(i); });
    scope.appendChild(row);
  });
}

function moveHl(dir) {
  if (!menuItems.length) return;
  menuHl = (menuHl + dir + menuItems.length) % menuItems.length;
  renderMenu();
  const hl = menu.querySelectorAll('.mi')[menuHl];   // 头行/目录层头都不是 .mi：按类取免错位
  if (hl && hl.scrollIntoView) hl.scrollIntoView({ block: 'nearest' });
}

function pick(i) {
  const it = menuItems[i];
  if (!it) return;
  closeMenu();
  it.apply();
}

function grow() {   // 高度自长，上限由 CSS max-height 兜
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, window.innerHeight * 0.4) + 'px';
}

// '/' 触发：草稿以 '/' 开头且还没有空格（= 还在打指令名）才弹。
function slashHits() {
  const v = input.value;
  if (!v.startsWith('/') || v.includes(' ')) return null;
  const q = v.slice(1).toLowerCase();
  const hits = CMDS.filter(c => c.name.slice(1).startsWith(q));
  if (!hits.length) return null;
  return hits.map(c => ({
    label: c.name,
    desc: c.desc,
    apply: () => {
      const t = c.name + (c.args ? ' ' : '');
      input.value = t;
      input.setSelectionRange(t.length, t.length);
      grow();
      input.focus();
    },
  }));
}

// '@' 触发：光标往左扫到 '@'、中间无空白 = 正在打一个引用。
function atToken() {
  const v = input.value, caret = input.selectionStart;
  if (caret == null) return null;
  for (let i = caret - 1; i >= 0; i--) {
    if (/\s/.test(v.charAt(i))) return null;
    if (v.charAt(i) === '@') return { start: i, query: v.slice(i + 1, caret) };
  }
  return null;
}

// 候源只在首次触发拉一次并缓存；失败/空也给一行提示（不静默无弹层）。
let atCache = null, atErr = null, atPending = false;

async function loadSessionsForAt() {
  if (atCache !== null || atPending) return;
  atPending = true;
  try {
    atCache = (await rpc('session/list', {})).sessions || [];
    atErr = null;
  } catch (e) {
    atCache = [];
    atErr = e.message || String(e);
  }
  atPending = false;
  if (atToken()) updateMenu();   // 拉回来时弹层还该开着：补上候选
}

function atHits() {
  if (atCache === null && !atErr) { loadSessionsForAt(); return null; }
  const notice = text => [{ label: text, desc: 'Esc 关闭', apply: () => {} }];
  if (atErr) return notice('（会话列表取不到：' + atErr + '）');
  const tok = atToken(), q = tok ? tok.query.toLowerCase() : '';
  const rows = atCache.filter(s => !q || s.sid.toLowerCase().includes(q)
                     || (s.title || '').toLowerCase().includes(q));
  if (!rows.length) return notice('（没有匹配的会话）');
  return rows.slice(0, 8).map(s => ({
    label: s.title || s.sid.slice(0, 8),
    desc: fmtWhen(s.last_at),
    meta: s.sid.slice(0, 8),
    apply: () => applyAt(s.sid),
  }));
}

// 把 @query 原位换成 @<sid>；再走平面已有的指令通道（POST /msg 纯文本）
// 发切换语义——入参即 session id。
function applyAt(sid) {
  const tok = atToken();
  if (!tok) return;
  const v = input.value;
  input.value = v.slice(0, tok.start) + '@' + sid + ' ' + v.slice(input.selectionStart);
  const caret = tok.start + sid.length + 2;
  input.setSelectionRange(caret, caret);
  grow();
  input.focus();
  sendText('/resume ' + sid, false);
}

// ---- 新建工作区：目录浏览器（原 c_heffj3 的 fs/list 入口）----
// 入口已从「手打 /bind 后的参数期」改成侧栏头的「工作区」钮（工作区树卡）：
// 树只列**已经有痕迹**的工作区（project/list ∪ serve.projects ∪ session cwd），
// 而「第一个工作区」必然还没痕迹——这枚钮是树的补集，不是树的重复。
// 目录模式复用同一个 #menu 弹层与 ↑↓/Enter/Esc/Tab 导航：层头（路径 + ↑
// 上一级 + 选这个目录 + 过滤框）是 .dirhead，行渲染进 .dirrows 仍走
// menuItems/pick 机制；不新增任何全局键盘监听（过滤框的导航键是元素级监听）。
// 「选这个目录」发的仍是 /bind <path> 指令文本——平面只有这一条写绑定路径，
// 页面只是不再让任何人手打它。
let dirMode = null;   // {path, parent, dirs, filter, err, pending, el}
let dirSeq = 0;       // 异步竞态闸：只认最后一次 loadDir

function openDirPicker() {
  dirMode = { path: '', parent: '', dirs: [], filter: '', err: '', pending: false, el: null };
  showDirLayer();
  loadDir('');
}

// 层骨架（幂等）：层头 + 行容器。pick() 会先 closeMenu 再 apply，行
// 点击的 enterDir 要从这里重建。
function showDirLayer() {
  if (!menu.querySelector('.dirhead')) {
    menu.replaceChildren();
    menu.appendChild(buildDirHead());
    const rows = document.createElement('div');
    rows.className = 'dirrows';
    menu.appendChild(rows);
  }
  menu.hidden = false;
}

function buildDirHead() {
  const h = document.createElement('div');
  h.className = 'dirhead';
  const top = document.createElement('div');
  top.className = 'dirtop';
  const p = document.createElement('span');
  p.className = 'dirpath';
  const up = document.createElement('button');
  up.type = 'button';
  setBtn(up, 'arrow-up', '上一级');
  up.title = '去父目录（在可浏览根上时不可再上）';
  up.addEventListener('click', () => { if (dirMode && dirMode.parent) loadDir(dirMode.parent); });
  const pickBtn = document.createElement('button');
  pickBtn.type = 'button';
  pickBtn.textContent = '选这个目录';
  pickBtn.title = '绑定当前目录（/bind，会话重置）';
  pickBtn.addEventListener('click', () => {
    if (!dirMode || !dirMode.path) return;
    const path = dirMode.path;
    closeMenu();
    input.value = '';               // 草稿里的 '/bind ' 已被目录选择取代
    menuCtx = '';                   // 清了草稿就要同步作废 ctx 闸：否则同款
                                     // '/bind ' 再打一次会被「ctx 未变」误判
                                     // 成弹层已开（closeMenu 特意不重置它，
                                     // 是为 Esc 后 keyup 不复弹——两难在这拆）
    grow();
    sendText('/bind ' + path, false);
  });
  top.append(p, up, pickBtn);
  const filter = document.createElement('input');
  filter.type = 'search';
  filter.className = 'dirfilter';
  filter.placeholder = '目录名过滤';
  filter.setAttribute('aria-label', '目录名过滤');
  filter.addEventListener('input', () => {
    if (!dirMode) return;
    dirMode.filter = filter.value;
    dirApplyFilter();
  });
  filter.addEventListener('keydown', ev => {
    if (ev.key === 'Escape') { ev.preventDefault(); closeMenu(); return; }
    if (menu.hidden || !menuItems.length) return;
    if (ev.key === 'ArrowDown') { ev.preventDefault(); moveHl(1); }
    else if (ev.key === 'ArrowUp') { ev.preventDefault(); moveHl(-1); }
    else if (ev.key === 'Tab' || (ev.key === 'Enter' && !ev.shiftKey && !ev.isComposing)) {
      ev.preventDefault();
      pick(menuHl);
    }
  });
  h.append(top, filter);
  dirMode.el = { path: p, up, pick: pickBtn, filter };
  return h;
}

function enterDir(path) {
  if (!dirMode) dirMode = { path: '', parent: '', dirs: [], filter: '', err: '', pending: false, el: null };
  showDirLayer();
  loadDir(path);
}

async function loadDir(path) {
  const seq = ++dirSeq;
  const dm = dirMode;
  if (!dm) return;
  dm.pending = true;
  dm.err = '';
  renderDirState();
  try {
    const r = await rpc('fs/list', { path });
    if (!dirMode || dirMode !== dm || seq !== dirSeq) return;   // 被更新的导航/关层取代
    dm.pending = false;
    dm.path = r.path || path;
    dm.parent = r.parent || '';
    dm.dirs = (r.entries || []).filter(e => e.is_dir);
  } catch (e) {
    if (!dirMode || dirMode !== dm || seq !== dirSeq) return;
    dm.pending = false;
    dm.err = e.message || String(e);
  }
  renderDirState();
}

function renderDirState() {
  const dm = dirMode;
  if (!dm || !dm.el) return;
  dm.el.path.textContent = leftEllipsis(dm.path || '…', 64);
  dm.el.path.title = dm.path || '';
  dm.el.up.disabled = !dm.parent;
  dm.el.pick.disabled = !dm.path;
  dirApplyFilter();
}

// 失败（-32602 根外 / 目录消失等）在弹层内一行提示：不外抛、不白屏。
function dirApplyFilter() {
  const dm = dirMode;
  if (!dm) return;
  if (dm.pending) {
    setDirRows([{ label: '（读取中…）', desc: '', apply: () => {} }]);
    return;
  }
  if (dm.err) {
    setDirRows([{ label: '（' + dm.err + '）', desc: 'Esc 关闭', apply: () => {} }]);
    return;
  }
  const q = (dm.filter || '').toLowerCase();
  const hits = dm.dirs.filter(d => !q || d.name.toLowerCase().includes(q));
  if (!hits.length) {
    setDirRows([{ label: dm.filter ? '（没有匹配的子目录）' : '（没有子目录）',
                  desc: 'Esc 关闭', apply: () => {} }]);
    return;
  }
  setDirRows(hits.map(d => ({
    label: d.name, icon: 'folder',
    desc: '',
    apply: () => enterDir(d.path),
  })));
}

function setDirRows(items) {
  menuItems = items;
  menuHl = 0;
  renderMenu();
  menu.hidden = false;
}

// 层头路径过长从左侧省略：保尾部（目录名一端信息密度最高）。
function leftEllipsis(s, max) {
  return s.length > max ? '…' + s.slice(s.length - max) : s;
}

// ---- 工作区候选（原 c_lnsdvu 的两个只读候源，现在喂树而不是弹层）----
// 组 = project/list 的 root（W4.3，带会话数）∪ settings/get 的 projects
// （config serve.projects——配了但 seek 尚未打开过的目录），按 clean 后的
// 绝对路径去重；树另外把 session/list 的 cwd 并进来（第三个来源，见
// wsGroups——manifest 丢了的老会话不该沦为孤儿）。
// 目录存在性不预检（页面无 stat）：project/list 的 root 是 manifest 的
// last_seen 位置，可能已移动/删除——点了由 Router 的「绑定失败：目录不
// 存在：<abs>」应答如实透传到聊天面。
let bindData = null, bindErr = null, bindPending = false;

// 去重键：清尾随斜杠与空白，并把连续分隔符并成一个（`T//proj` 与 `T/proj`
// 是同一个目录——manifest 的 abs_path 可能带 `//` 而 session 的 cwd 不带；
// 不归一就会出现两个同名组头、各挂一半会话）。页面做不了绝对化/展开
// （无 stat、不知 home），'~/x' 与展开后的路径不去重是接受的边（点了也能
// 绑，Router 会展开）。
function cleanRoot(p) {
  return String(p || '').trim().replace(/\/{2,}/g, '/').replace(/\/+$/, '');
}

async function loadProjects() {
  if (bindData !== null || bindPending) return;
  bindPending = true;
  try {
    const [pl, st] = await Promise.all([
      rpc('project/list', {}),
      rpc('settings/get', {}),
    ]);
    const byRoot = new Map();   // project/list 先占位（审计序），config 补差集
    for (const p of (pl.projects || [])) {
      const root = cleanRoot(p.root);
      if (root && !byRoot.has(root)) {
        byRoot.set(root, { root, sessions: p.sessions || 0, last: p.last_active_at || '' });
      }
    }
    for (const raw of (st.projects || [])) {
      const root = cleanRoot(raw);
      if (root && !byRoot.has(root)) byRoot.set(root, { root, sessions: 0, last: '' });  // 未开过
    }
    bindData = [...byRoot.values()];
    bindErr = null;
  } catch (e) {
    bindData = [];
    bindErr = e.message || String(e);
  }
  bindPending = false;
  renderSessRows();   // 候选落地：树补上空工作区的组头
}

function baseOf(root) {
  const seg = String(root).split('/').filter(Boolean);
  return seg[seg.length - 1] || root;
}

// 候选上下文（触发位 + 查询词）：没变就不动现状——保 ↑↓ 高亮，也保 Esc
// 关掉后不被同一按键的 keyup 立刻重新弹开。
function ctxNow() {
  if (slashHits()) return 'slash|' + input.value;
  const at = atToken();
  return at ? 'at|' + at.start + '|' + at.query : '';
}

function updateMenu() {
  if (dirMode) return;   // 目录模式独占弹层：'/' '@' 触发不抢；Esc/点别处照旧关
  let items = slashHits();
  if (items === null) items = atToken() ? atHits() : null;
  const ctx = items ? ctxNow() : '';
  if (ctx === menuCtx) return;
  menuCtx = ctx;
  if (!items) { closeMenu(); return; }
  menuItems = items;
  menuHl = 0;
  renderMenu();
  menu.hidden = false;
}

// keyup/click 必须包一层空箭头——直接挂 updateMenu 会把 Event 当实参，
// 每次按键重开弹层，↑↓ 高亮与 Esc 关闭立刻被抹掉。
input.addEventListener('input', () => { grow(); updateMenu(); syncSend(); });
input.addEventListener('keyup', () => updateMenu());
input.addEventListener('click', () => updateMenu());
input.addEventListener('blur', ev => {
  // 焦点移进弹层内（目录过滤框/层头按钮，c_heffj3）不关层；点别处的旧语义不变
  if (ev.relatedTarget && menu.contains(ev.relatedTarget)) return;
  setTimeout(closeMenu, 0);
});

input.addEventListener('keydown', ev => {
  if (!menu.hidden && menuItems.length) {   // 导航键只作用于弹层
    if (ev.key === 'ArrowDown') { ev.preventDefault(); moveHl(1); return; }
    if (ev.key === 'ArrowUp')   { ev.preventDefault(); moveHl(-1); return; }
    if (ev.key === 'Escape')    { ev.preventDefault(); closeMenu(); return; }
    if (ev.key === 'Tab' || (ev.key === 'Enter' && !ev.shiftKey && !ev.isComposing)) {
      ev.preventDefault();
      pick(menuHl);
      return;
    }
  }
  if (ev.key === 'Escape') { closeMenu(); return; }   // 无处可关 = 空操作，不放 preventDefault
  if (ev.key === 'Enter' && !ev.shiftKey && !ev.isComposing) {
    ev.preventDefault();                              // Shift+Enter 走原生换行
    closeMenu();
    // Enter 不另起发送路径（pitfall：enter-发送别自己再写一条）——收口到
    // 唯一的 submit 链，附件门 / '/' 参数规则保持单源。
    form.requestSubmit();
  }
});

// 生成中的发送键=停止键（c_5m3fm6）：分岔放在 click 层——submit 事件无法
// 区分按钮点击与回车（Enter 的隐式提交 submitter 同是本键），点击先于
// submit 触发，preventDefault 吞掉提交后只发 /cancel（草稿不动）。回车带
// 草稿仍走上面的 submit 原路：conv 闸排队是既有语义，本卡不收窄。
// （c_7lsngm 的 Enter 走 form.requestSubmit()，不经按钮 click——与这条
//   停止分岔天然互不触发。）
send.addEventListener('click', ev => {
  if (!runs.size) return;            // 非生成中：照常提交（发送）
  ev.preventDefault();               // 生成中：本次点击=停止，不进 submit
  if (!posting) sendText('/cancel', false);   // 停止键恒可点，只在途闸挡重入
});

// 点击选择（附件钮）。
const attachBtn = document.getElementById('attach-btn');
const fileInput = document.getElementById('file');
attachBtn.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', async () => {
  const files = [...fileInput.files];
  fileInput.value = '';               // 允许重复选同一个文件
  await addFiles(files);
});

// 拖放：整页接收。dragenter/dragover 必须 preventDefault，否则浏览器
// 把 drop 当成导航、直接打开文件。
['dragenter', 'dragover'].forEach(name => {
  document.addEventListener(name, ev => {
    if (!dragHasFiles(ev)) return;
    ev.preventDefault();
    document.body.classList.add('dropping');
  });
});
document.addEventListener('dragleave', ev => {
  if (ev.relatedTarget) return;       // 仍在页面内移动，别闪
  document.body.classList.remove('dropping');
});
document.addEventListener('drop', async ev => {
  if (!dragHasFiles(ev)) return;
  ev.preventDefault();
  document.body.classList.remove('dropping');
  await addFiles(ev.dataTransfer.files);
});

// 粘贴：只吃文件，纯文本粘贴留给输入框。
document.addEventListener('paste', async ev => {
  const cd = ev.clipboardData;
  if (!cd || !cd.files || !cd.files.length) return;
  ev.preventDefault();
  await addFiles(cd.files);
});

// 指令快捷钮退役（工作区树卡）：顶栏原来那五个斜杠钮（/bind /projects
// /switch /new /cancel）连同 wireCmd 一起撤掉——工作区=点组头、换绑=点
// 另一个组头、新会话=组头 ＋、中断=生成中的发送键变「停止」。页面不再
// 提供任何「发送斜杠指令」的按钮，只剩 '#' 补全菜单里的 /resume /cancel
// 两条，是给**想打字的人**留的入口，不是给不学指令的人准备的替代路。
// 面（见 buildWorkspaceGroup / treeBind / treeNewSession）。

// 侧栏头的「＋ 工作区」：树只列已经有痕迹的工作区（project/list ∪
// serve.projects ∪ session cwd），而第一个工作区必然还没痕迹——这枚钮是
// 树的补集。开的是 fs/list 目录浏览器（openDirPicker，逐级下钻），
// 「选这个目录」发的仍是 /bind <path> 指令文本。
document.getElementById('side-ws-new').addEventListener('click', () => {
  if (posting) return;
  input.focus();
  openDirPicker();
});

// ---- 按住说话（voice V2 入站，PRD feature-deepseek-app-api §4.3）----
// 流程：按住麦克风钮 → getUserMedia + MediaRecorder；松开（或 120s 到点自动
// 收口）→ decodeAudioData 解任意容器 → OfflineAudioContext 重采样 16 kHz
// 单声道 → 本地编 16-bit PCM WAV → POST /voice。设备身份与录音身份都是
// 浏览器自铸 uuid（与 CONV 同源的 mint），一次按下一个录音 id——服务端
// 拿它当 EventID 去重，同一次录音怎么重传都只进一条。转写文本与回复都
// 从本页 web conv 的 SSE 下行（voice/voice-error 命名事件 + 默认 reply）。
// 麦克风要 secure context：localhost 天然是；tailnet IP 走明文 http 不是
// （浏览器拒发 getUserMedia）——手机远端请用 https 前置（tailscale serve）。
const mic = document.getElementById('mic');
const DEVICE_KEY = 'seek-voice-device';
let DEVICE = null;
try {
  DEVICE = localStorage.getItem(DEVICE_KEY);
  if (!DEVICE) { DEVICE = mintConv(); localStorage.setItem(DEVICE_KEY, DEVICE); }
} catch (e) { /* 隐私模式等：DEVICE 留空，上传时提示 */ }

function micAvailable() {
  return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia
            && window.MediaRecorder && window.isSecureContext !== false);
}
if (!micAvailable()) {
  mic.disabled = true;
  mic.title = '此环境不可用麦克风（需 localhost 或 https）';
}

let rec = null;       // 进行中的一次录音 {mr, chunks, stopped, timer, stream}
let voiceBusy = false;  // 编码+上传进行中：按钮语义上仍可再按，但排队没必要

async function startRec() {
  if (!micAvailable() || voiceBusy || rec) return;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const mr = new MediaRecorder(stream);
    const chunks = [];
    mr.ondataavailable = ev => { if (ev.data && ev.data.size) chunks.push(ev.data); };
    const stopped = new Promise(res => { mr.onstop = res; });
    mr.start();
    const timer = setTimeout(stopRec, 120000);  // ASR 硬上限：到点等同松开
    rec = { mr, chunks, stopped, timer, stream };
    mic.classList.add('rec');
    setBtnIcon(mic, 'square');   // 录音中换「停」方块（c_25d2ey 图标语义化）
    mic.setAttribute('aria-label', '录音中，松开发送');
  } catch (e) {
    addMsg('hint', '（麦克风不可用：' + e + '）');
  }
}

function stopRec() {
  if (!rec) return;
  clearTimeout(rec.timer);
  if (rec.mr.state !== 'inactive') rec.mr.stop();
}

async function endRec() {
  if (!rec) return;
  const s = rec;
  rec = null;
  mic.classList.remove('rec');
  setBtnIcon(mic, 'mic');
  mic.setAttribute('aria-label', '按住说话');
  s.stream.getTracks().forEach(t => t.stop());
  await s.stopped;
  if (!s.chunks.length) return;
  voiceBusy = true;
  try {
    const wav = await toWav16k(await new Blob(s.chunks).arrayBuffer());
    await uploadVoice(wav);
  } catch (e) {
    addMsg('hint', '（语音失败：' + e + '）');
  }
  voiceBusy = false;
}

// 任意容器音频 → 16 kHz 单声道 16-bit PCM WAV（ASR 的输入形状；16k 单声道
// 下 120s ≈ 3.8 MiB，稳在 8 MiB 上限内）。两步都是纯标准 API：decodeAudioData
// 吃 webm/ogg，OfflineAudioContext 一次性重采样混单声道。
async function toWav16k(buf) {
  const ac = new (window.AudioContext || window.webkitAudioContext)();
  let decoded;
  try { decoded = await ac.decodeAudioData(buf); } finally { ac.close(); }
  const rate = 16000;
  const frames = Math.max(1, Math.ceil(decoded.duration * rate));
  const off = new OfflineAudioContext(1, frames, rate);
  const src = off.createBufferSource();
  src.buffer = decoded;
  src.connect(off.destination);
  src.start();
  const pcm = (await off.startRendering()).getChannelData(0);
  const dv = new DataView(new ArrayBuffer(44 + pcm.length * 2));
  const w = (o, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); dv.setUint32(4, 36 + pcm.length * 2, true); w(8, 'WAVE');
  w(12, 'fmt '); dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
  dv.setUint32(24, rate, true); dv.setUint32(28, rate * 2, true);
  dv.setUint16(32, 2, true); dv.setUint16(34, 16, true);
  w(36, 'data'); dv.setUint32(40, pcm.length * 2, true);
  let o = 44;
  for (let i = 0; i < pcm.length; i++, o += 2) {
    const x = Math.max(-1, Math.min(1, pcm[i]));
    dv.setInt16(o, x < 0 ? x * 0x8000 : x * 0x7fff, true);
  }
  return dv.buffer;
}

async function uploadVoice(wav) {
  if (!DEVICE) { addMsg('hint', '（无法生成本地设备 id（localStorage 不可用），语音未发送）'); return; }
  const ev = mintConv();  // 录音会话 id：一次按下一个，服务端按它去重
  try {
    const r = await fetch(q('/voice'), {
      method: 'POST',
      headers: {
        'Content-Type': 'audio/wav',
        'X-Seek-Conversation': CONV,
        'X-Seek-Device': DEVICE,
        'X-Seek-Voice-Event': ev,
      },
      body: wav,
    });
    if (r.status === 401) addMsg('hint', '（token 无效，语音未送达）');
    else if (r.status === 413) addMsg('hint', '（语音过长（>8 MiB），说短一点）');
    else if (!r.ok) addMsg('hint', '（语音上传失败：HTTP ' + r.status + '）');
    // 202 之后转写异步进行：结果从 SSE 的 voice / voice-error 事件回来
  } catch (e) {
    addMsg('hint', '（语音上传失败：' + e + '）');
  }
}

// 按下/松开走 pointer 事件（鼠标触摸统一）；pointerleave 兜底「拖出按钮」，
// contextmenu 拦掉长按弹菜单。preventDefault 防 touch 长按的文本选择/滚动。
mic.addEventListener('pointerdown', ev => { ev.preventDefault(); startRec(); });
mic.addEventListener('pointerup', endRec);
mic.addEventListener('pointerleave', endRec);
mic.addEventListener('contextmenu', ev => ev.preventDefault());

// ---- 会话侧栏（W5 卡 c_txz6vz——W4.4 会话弹出面板在此常驻化）----
// 消费 W4.2 已合并的 /rpc method 集：session/list 驱动侧栏列表（updated
// 倒序、标题子串过滤、30 条一页「加载更多」）、session/get 出元信息行、
// session/messages 沿 next_cursor 逐页翻（50/页，「加载更多」追加）。
// W5 c_rqcuaa 增写面：session/rename（行内改名，Enter 提交）+
// session/archive（归档=列表过滤位；归档行默认隐藏，侧栏脚「显示归档」
// 切换，切开后归档行沉底 + 变淡 + ⤴ 取消归档）。
// DOM 只装已翻进的页——长 transcript 的常驻渲染量级与虚拟滚动同级，
// 服务端与页面都不整读。渲染纪律与聊天面同源：textContent-only。
const sessList = document.getElementById('sess-list');
const sessMeta = document.getElementById('sess-meta');
const sessMsgs = document.getElementById('sess-msgs');
const sessFoot = document.getElementById('sess-foot');
const sideFoot = document.getElementById('side-foot');
const sideToggle = document.getElementById('side-toggle');
const sideSearch = document.getElementById('side-search');
const sessBack = document.getElementById('sess-back');
const MSG_PAGE = 50;
// 调用树登记表（c_ux7lvk，随 sel 同生命周期——openSession 清空）：
// 行按 call id（assistant 的 tool_calls[].id ↔ tool 消息的 tool_call_id，
// 同一 deepseek.ToolCall.ID）；结果全文存 JS 表——DOM 只装摘要（复制全文
// 从这里取，超长不进 DOM 是硬界）。
const treeRows = new Map();     // call id → {row, rs, args}
const treeResults = new Map();  // call id → 结果全文（string；空串=空结果）
const TREE_SUMMARY_MAX = 4000;  // 进 DOM 的摘要字符上限
const SESS_PAGE = 30;   // 侧栏一页行数（「加载更多」累加，与消息页独立）
let sel = null;         // 打开中的会话分页游标 {sid, next, done, busy}
let allSessions = [];   // session/list 当前快照（过滤 + 分页的唯一来源）
let shownSessions = SESS_PAGE;
// 归档可见位（c_rqcuaa）：默认隐藏；记忆进 localStorage，刷新后保持——
// 与收起位同款退化（隐私模式走内存值）。
const ARCH_KEY = 'seek-show-archived';

let showArchived = readShowArch();

// 收起状态记忆（验收②）：bit 落 localStorage，刷新后保持。首次访问按
// 视口宽度定缺省（<1024px 窄屏默认收起，与 notes-dsh-ui-spec 的
// SIDEBAR_AUTO_COLLAPSE 同断点）；存储不可用（隐私模式）时退化为本次

const SIDE_KEY = 'seek-side-collapsed';
function readSideCollapsed() {

    if (v === '0' || v === '1') return v === '1';

}
let sideCollapsed = readSideCollapsed();
function applySide() {

}
function setSideCollapsed(v) {

// 窄屏抽屉化（c_lqtt2m）：≤480px 展开态是覆盖式抽屉（样式表断点块），

// 归档可见切换（c_rqcuaa）：头部图标钮——侧栏脚留给「加载更多」
// （c_txz6vz 无头断言探的就是 #side-foot button，别占位）。点按翻转
// showArchived 并整表重拉（include_archived 走服务端过滤口径）。

  sideArch.classList.toggle('on', showArchived);
  sideArch.title = showArchived ? '隐藏归档会话' : '显示归档会话';
}
sideArch.addEventListener('click', () => {

  try { localStorage.setItem(ARCH_KEY, showArchived ? '1' : '0'); } catch (e) { /* 内存态即可 */ }
  applyArchBtn();
