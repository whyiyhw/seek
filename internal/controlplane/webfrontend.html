<!doctype html>
<!-- seek web MVP (card c_qucxtu) — single page, zero build chain.
     Message rendering: minimal markdown per feature-web-frontend §2.6
     — fenced ``` blocks → <pre>, `inline` → <code>, everything else
     verbatim plain text; DOM API only (§5.5), no HTML-parsing sink.
     Conversation identity (W1.3, D-W3): uuid minted by the browser,
     persisted in localStorage, carried as X-Seek-Conversation on
     fetches and ?conv= on the SSE stream (EventSource cannot set
     headers); the server keeps zero session state.
     Auth (W1.2): the /?token= first hop 303-exchanges the token into
     an HttpOnly cookie and scrubs the URL; this page rides the cookie
     (fetch/EventSource send it same-origin) — the token never reaches
     JS. The write side clears the server's Origin gate for free
     (browsers attach Origin to every POST).
     Status meter (W2.3): the header's right segment accumulates
     tokens/$ from each named usage event (source: turn_end; the $ is
     the SERVER-priced cost_usd, the page never computes money) and
     shows the session id short once the reply close-out carries it
     (source: agent_end). Page-lifetime cumulative — SSE has no
     replay, a reload restarts the meter at zero.
     Sessions browser (W4.4, asset plane UI #1): a master-detail view
     over POST /rpc — session/list drives the list pane, a click opens
     session/get (meta line) + session/messages walked page by page via
     next_cursor (50/page, "load more" appends; the DOM only ever holds
     what was paged in, so a long transcript stays at virtual-scroll
     order of magnitude). Same textContent-only discipline as chat.
     Streaming bubble (W2.1): the W1.4 named SSE events fold
     client-side per run id — deltas accumulate into text blocks,
     tool calls render as single folded status rows (args/results
     stay server-side by wire contract), interleaved in arrival
     order; the run-bearing reply replaces the whole bubble with
     the authoritative final text (a reply whose run was never seen —
     dropped frames — falls back to the plain message path, which is
     what makes the fold idempotent). usage events are W2.3's (the
     token/$ status bar), deliberately unlistened here.
     Task panel (W3.3, orchestration P1 visualisation): subagent
     master-detail over GET /subagents + the SSE topic — a SECOND
     /events connection opts into ?topic=subagents and listens ONLY
     for the named event (no onmessage: the conv frames riding the
     same connection are dropped by the browser, so chat never
     double-renders). Protocol: subscribe first, then GET /subagents
     for the snapshot; pushes merge by sub_sid. A detail row reads
     the sub transcript's LAST assistant entry (?sub=, summary 单源).
     Memory browser + stats view (W4.5, asset plane UI #2): memory/
     projects drives the project picker, memory/list the entry list,
     memory/get the detail (rendered by the chat renderer); the stats
     view rides stats/cache (session picker from session/list) — the
     cache/cost card shows hit ratio + cost_usd, priced SERVER-side
     (the client never prices; §2.5).
     Command quick buttons (W2.2): /bind /projects /switch /new /cancel
     in the top bar — zero-arg ones send the SAME command text through
     the shared POST /msg passthrough; /bind /switch prefill the input
     for the path argument. Binding status stays pinned in the status
     line: refreshed immediately after a command POST (202) settles on
     the wire, again on every SSE reply, and again on SSE (re)connect.
     Push-to-talk (voice V2, feature-deepseek-app-api §4.3): hold 🎤,
     speak ≤120 s, release — MediaRecorder → decodeAudioData → 16 kHz
     mono 16-bit WAV (the ASR input shape, resampled via
     OfflineAudioContext) → POST /voice with a per-BROWSER device uuid
     (X-Seek-Device) and a per-PRESS recording uuid (X-Seek-Voice-Event,
     the server's dedup key). The transcript echoes back as the named
     SSE event "voice" (a `you` bubble); ASR failures as "voice-error".
     The conversation it opens is voice:<device-id> — its OWN binding,
     separate from this page's web:<uuid> chat conv. Microphone needs
     a secure context: localhost is one; a tailnet IP over plain http
     is NOT (browsers deny getUserMedia) — front it with an HTTPS
     proxy (tailscale serve) to talk from a phone.
     Deliberately out of scope: multi-tab sync, history persistence,
     FULL markdown rendering (P3 §4.2 vendor evaluation),
     mobile, real auth (design card c_7pptol owns the full UI). -->
<html lang="zh">

<title>seek</title>
<style>

  body { margin: 0; font: 14px/1.5 ui-monospace, Menlo, monospace;

  /* 按住说话（voice V2）：按下即录音中——红点态一目了然；user-select 关掉

  #mic { padding: 8px 12px; user-select: none; -webkit-user-select: none; touch-action: none; }

  body:not(.sess-view) #browser { display: none; }
  body.browsing #list, body.browsing form { display: none; }
  #browser-body { flex: 1; display: flex; min-height: 0; }
  #sess-list { width: 320px; flex: none; overflow-y: auto;
               border-right: 1px solid #2a2e36; }
  .sess-row { display: block; width: 100%; text-align: left; border-radius: 0;
              border-bottom: 1px solid #22252c; padding: 8px 12px; }
  .sess-row .t1 { display: block; overflow: hidden; text-overflow: ellipsis;
                  white-space: nowrap; }

                  margin-top: 2px; }

  #sess-detail { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #sess-meta { padding: 6px 14px; border-bottom: 1px solid #2a2e36;
               color: #7a8089; white-space: nowrap; overflow: hidden;
               text-overflow: ellipsis; }
  #sess-msgs { flex: 1; overflow-y: auto; padding: 14px; }
  .smsg { margin: 6px 0; padding: 8px 12px; border-radius: 8px;
          background: #242830; white-space: pre-wrap; word-break: break-word; }
  .smsg.user { background: #2c3d5f; }
  .smsg.tool { background: #1b1e24; color: #9aa0a8; }
  .smsg.tool pre { background: #14161a; }
  .swho { font-size: 11px; color: #7a8089; margin-bottom: 4px; }
  .stool { color: #d8a657; }
  /* 工具结果限高：单条大输出不把整页 paint 撑爆（分页外的第二道界） */
  .smsg.tool .sbody { max-height: 260px; overflow-y: auto; }
  #sess-foot { padding: 8px 14px; text-align: center; border-top: 1px solid #2a2e36;
               color: #7a8089; }
  #sess-foot button { width: 100%; }
  .pane-hint { color: #7a8089; font-style: italic; padding: 14px; }

  /* ---- 任务面板（W3.3 编排 P1 可视化）---- */
  /* 与三个资产面板同一开合闸（browsing=隐聊天 + 恰好一个 *-view 亮面板），
     故这里只负责「本面板亮」；隐聊天/互斥由 body.browsing 与各 body:not(.x-view)

             border-right: 1px solid #2a2e36; }

             text-overflow: ellipsis; }
  #ag-last { flex: 1; overflow-y: auto; padding: 14px; }
  #ag-last pre { background: #14161a; border: 1px solid #2a2e36; border-radius: 6px;
                 padding: 8px 10px; margin: 6px 0; overflow-x: auto;

  /* ---- 记忆浏览器 + 统计视图（W4.5 资产面 UI·二）---- */
  .pane { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  body:not(.mem-view) #memory { display: none; }
  body:not(.stat-view) #stats { display: none; }
  .pane-head { display: flex; gap: 8px; align-items: center; padding: 6px 14px;
               border-bottom: 1px solid #2a2e36; }

                      border-radius: 6px; padding: 4px 8px; font: inherit;

  #mem-body { flex: 1; display: flex; min-height: 0; }
  #mem-list { width: 320px; flex: none; overflow-y: auto;
              border-right: 1px solid #2a2e36; }
  .mem-row { display: block; width: 100%; text-align: left; border-radius: 0;
             border-bottom: 1px solid #22252c; padding: 8px 12px; }
  .mem-row.cur { background: #2c3d5f; }
  .mem-row .t1 { display: block; overflow: hidden; text-overflow: ellipsis;
                 white-space: nowrap; }
  .mem-row .t2 { display: block; color: #7a8089; font-size: 12px; margin-top: 2px;

                     padding: 8px 10px; margin: 6px 0; overflow-x: auto;
                     white-space: pre; font: inherit; }

<body>
<header id="status" class="warn"><span id="status-l">连接中…</span><span id="usage"></span></header>
<nav id="bar">
  <!-- 指令快捷按钮（W2.2）：发的是与手打完全同款的指令文本（POST /msg 纯文本
       透传）；带参的 /bind /switch 只预填输入框，路径由用户补全后回车。 -->
  <button id="cmd-bind" class="cmd" type="button" title="绑定/重绑项目，会话重置（需补路径）">/bind</button>
  <button id="cmd-projects" class="cmd" type="button" title="列出候选项目与当前绑定">/projects</button>
  <button id="cmd-switch" class="cmd" type="button" title="切换到另一项目（需补路径）">/switch</button>
  <button id="cmd-new" class="cmd" type="button" title="项目不变，开新会话">/new</button>
  <button id="cmd-cancel" class="cmd" type="button" title="中断本会话运行中的任务">/cancel</button>
  <button id="browse-btn" type="button">📚 会话</button>
  <button id="mem-btn" type="button">🧠 记忆</button>
  <button id="stat-btn" type="button">📊 统计</button>
  <button id="agents-btn" type="button">🤖 后台</button>
</nav>
<main id="list"></main>
<section id="browser">
  <div id="browser-body">
    <div id="sess-list"></div>
    <div id="sess-detail">
      <div id="sess-meta"></div>
      <div id="sess-msgs"></div>
      <div id="sess-foot"></div>
    </div>
  </div>
</section>
<section id="agents">
  <div id="agents-body">
    <div id="ag-list"></div>
    <div id="ag-detail">
      <div id="ag-meta"></div>
      <div id="ag-last"></div>
    </div>
  </div>
</section>
<section id="memory" class="pane">
  <div class="pane-head">
    <select id="mem-proj" aria-label="项目"></select>
    <span class="cnt" id="mem-cnt"></span>
  </div>
  <div id="mem-body">
    <div id="mem-list"></div>

</section>
<form id="form">
  <input id="input" autocomplete="off" placeholder="/bind <项目路径> 或直接发消息" autofocus>
  <button id="mic" type="button" title="按住说话，松开发送（≤120 秒）">🎤</button>
  <button id="send">发送</button>
</form>
<script>
'use strict';
// W1.2 换票：/?token= 首跳被服务端 303 换成 HttpOnly cookie，本页落在
// 干净的 / 上——正常路径 TOKEN 恒为空，鉴权靠 cookie（fetch/EventSource
// 同源自带）。仍读 URL 是给未换票直开的形态兜底（能读到的只会是错 token）。
const TOKEN = new URLSearchParams(location.search).get('token') || '';
const q = s => s + (s.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(TOKEN);

// 会话身份（W1.3，D-W3）：uuid 浏览器自铸、localStorage 持久；服务端
// 零会话状态——它只是 bindings 表的键（web:<uuid>）。localStorage 不可
// 用（隐私模式抛异常）时退化为本次页面加载的临时 uuid。
const CONV_KEY = 'seek-web-conv';
function mintConv() {
  // crypto.randomUUID 仅 secure context（localhost/https）可用；经
  // tailnet IP 直连是 http，退到 getRandomValues 拼 uuid v4。
  if (crypto.randomUUID) return crypto.randomUUID();
  const b = crypto.getRandomValues(new Uint8Array(16));
  b[6] = (b[6] & 0x0f) | 0x40;
  b[8] = (b[8] & 0x3f) | 0x80;
  const h = [...b].map(x => x.toString(16).padStart(2, '0')).join('');
  return [h.slice(0,8), h.slice(8,12), h.slice(12,16), h.slice(16,20), h.slice(20)].join('-');
}
let CONV = null;
try {
  CONV = localStorage.getItem(CONV_KEY);
  if (!CONV || !/^[A-Za-z0-9._-]{1,64}$/.test(CONV)) {
    CONV = mintConv();
    localStorage.setItem(CONV_KEY, CONV);
  }
} catch (e) { CONV = mintConv(); }
const status = document.getElementById('status');
const statusL = document.getElementById('status-l');
const list = document.getElementById('list');
const form = document.getElementById('form');
const input = document.getElementById('input');
const send = document.getElementById('send');

function setStatus(text, ok) {
  statusL.textContent = text;   // 右段 #usage 是计量专属，互不覆盖
  status.className = ok ? 'ok' : 'warn';
}

// ---- 状态栏 usage 计量（W2.3，§3.1 之 3）----
// 每个命名 usage 事件（源=turn_end）实时累加：tokens 会话累计 + 服务端
// 算好的 $（§2.5 纪律：计价只在服务端价格包一处，本页永不算钱，
// cost_usd 直加）；reply 收口携带 session_id（源=agent_end）时补短显。
// 累计口径=本页生命周期内本 conv 的全部 run，与 CLI footer 的会话累计
// 同向；SSE 无历史回放，刷新页面从零重计（P3 资产面才补回放）。
const usageEl = document.getElementById('usage');
const meter = { prompt: 0, completion: 0, cacheHit: 0, costUsd: 0, sid: '' };
// $ 格式与服务端 FormatCost 同阈值（0→$0、<1¢ 四位、<$1 三位、
// 其余两位）——web 页与 CLI footer 的钱数读法一致。
function fmtUsd(v) {
  if (v <= 0) return '$0';
  if (v < 0.01) return '$' + v.toFixed(4);
  if (v < 1) return '$' + v.toFixed(3);
  return '$' + v.toFixed(2);
}
function renderMeter() {
  if (!meter.prompt && !meter.completion) return;  // 首个 turn_end 前不占位
  usageEl.textContent = (meter.prompt + meter.completion) + ' tok · ' + fmtUsd(meter.costUsd)
      + (meter.sid ? ' · sid ' + meter.sid.slice(0, 8) : '');
}
// 行内码：`code` → <code>，未配对反引号原样保留。文本只走
// createTextNode/textContent——模型输出永远不被当 HTML 解析（§5.5）。
function appendInline(parent, text) {
  for (;;) {
    const i = text.indexOf('`');
    if (i < 0) break;
    if (i > 0) parent.appendChild(document.createTextNode(text.slice(0, i)));
    const j = text.indexOf('`', i + 1);
    if (j < 0) { parent.appendChild(document.createTextNode(text.slice(i))); return; }
    const code = document.createElement('code');
    code.textContent = text.slice(i + 1, j);
    parent.appendChild(code);
    text = text.slice(j + 1);
  }
  if (text) parent.appendChild(document.createTextNode(text));
}

// 最小 markdown 渲染（§2.6 MVP，卡 c_iha3fr）：行首 ``` 围栏 → <pre>，
// 其余纯文本原样（换行交给 .msg 的 pre-wrap）。未闭合围栏吞到文本末尾。
// 只用 createElement/createTextNode——整页不存在 HTML 字符串解析路径。
function renderBody(el, text) {
  const lines = text.split('\n');
  let i = 0, plain = '';
  const flush = () => { if (plain) { appendInline(el, plain); plain = ''; } };
  while (i < lines.length) {
    if (lines[i].startsWith('```')) {
      flush();
      const buf = [];
      i++;
      while (i < lines.length && !lines[i].startsWith('```')) { buf.push(lines[i]); i++; }
      i++;  // 越过闭合围栏；到 EOF 即未闭合——吞到末尾（已定义行为）
      const pre = document.createElement('pre');
      pre.textContent = buf.join('\n');
      el.appendChild(pre);
    } else {
      plain += lines[i] + (i < lines.length - 1 ? '\n' : '');
      i++;
    }
  }
  flush();
}

function addMsg(who, text) {
  const el = document.createElement('div');
  el.className = 'msg ' + who;
  renderBody(el, text);                // 纯 DOM 构建：无 HTML 注入面
  list.appendChild(el);
  list.scrollTop = list.scrollHeight;  // 流式追加：贴底滚动
}

// 绑定状态一行：GET /state（本 conv 的 binding，头携带会话身份）。返回
// 是否已鉴权——启动时据此决定挂不挂 SSE（W1.2：凭证可能是 cookie，页内
// 无从预判，探测是唯一权威）。boundProject 记下当前绑定（或 null）供
// 任务面板的 topic 订阅判定（W3.3）：换绑项目后重开订阅跟随新项目。
let boundProject = null;
async function refreshState() {
  try {
    const r = await fetch(q('/state'), { headers: { 'X-Seek-Conversation': CONV } });
    if (r.status === 401) {
      setStatus('token 无效或未带——用 /?token=<serve 启动时打印的值> 打开', false);
      return false;
    }
    const s = await r.json();
    boundProject = s.bound ? s.project : null;
    setStatus(s.bound ? '已绑定 ' + s.project + (s.session ? ' · 会话 ' + s.session.slice(0, 8) : '')
                      : '未绑定——发 /bind <项目路径>（或 /projects 看候选）', s.bound);
    syncTopicStream();               // /bind 落地后面板订阅即时跟上
    return true;
  } catch (e) { setStatus('连不上 /state：' + e, false); return false; }
}

// ---- 流式 run 折叠（W2.1，feature-web-frontend §2.4/§2.5 客户端半边）----
// 服务端把一次 seek 运行的 jsonLine 折成命名 SSE 事件：delta {run,text}、
// tool {run,id,name,phase,ok}、usage {run,…}（W2.3 状态栏的入项，本卡不
// 消费——EventSource 对未注册的命名事件静默忽略）；终答走默认事件 reply
// {conv,text,run?,session_id?}。run id 由服务端铸造（§2.5），页面按 run
// 聚合：delta 累积进文本块、tool 进单行折叠状态行，按到达顺序交错在
// 同一个气泡里；带 run 的 reply 到达时整泡替换成权威终文本——客户端
// 累积只是预览，丢帧/未见过该 run 的 reply 走普通消息路径，天然幂等。
const runs = new Map();   // runId → {el, cur, tools}
let raf = 0;
const dirty = new Set();  // 本帧待重渲的 run（SSE 突发合帧，一帧最多渲一次）

function nearBottom() {
  return list.scrollHeight - list.scrollTop - list.clientHeight < 80;
}
// 追加/替换后只在「本来就在底」时跟随滚动——读历史不被流式追加劫持。
// pin 必须在 DOM 变更前采样：先改 DOM 再测，新增高度本身就把距离撑过阈值。
function appendPinned(parent, el) {
  const pin = nearBottom();
  parent.appendChild(el);
  if (pin) list.scrollTop = list.scrollHeight;
}

function runBubble(id) {
  let r = runs.get(id);
  if (r) return r;
  const el = document.createElement('div');
  el.className = 'msg seek streaming';
  r = { el, cur: null, tools: new Map() };
  runs.set(id, r);
  appendPinned(list, el);
  return r;
}

function schedule(r) {
  dirty.add(r);
  if (!raf) raf = requestAnimationFrame(flushRuns);
}
function flushRuns() {
  raf = 0;
  const pin = nearBottom();
  for (const d of dirty) {
    if (d.cur) {
      d.cur.el.replaceChildren();   // 流式重渲：清块再渲累积全文
      renderBody(d.cur.el, d.cur.text);
    }
  }
  dirty.clear();
  if (pin) list.scrollTop = list.scrollHeight;
}

function onDelta(ev) {
  let d;
  try { d = JSON.parse(ev.data); } catch (e) { return; }
  if (!d.run || typeof d.text !== 'string') return;
  const r = runBubble(d.run);
  if (!r.cur) {   // 首 delta 或工具行之后：开新文本块，保持到达顺序
    const b = document.createElement('div');
    b.className = 'txt';
    appendPinned(r.el, b);
    r.cur = { el: b, text: '' };
  }
  r.cur.text += d.text;
  schedule(r);
}

// 工具行折叠（§2.5：args/result 服务端不下发，名称+状态就是折叠形态）：
// start →「⚙ name …」，end →「✔ name」/「✘ name」。行按 tool id 幂等——
// 未见 start 的 end（SSE 丢帧）也补得出行。
function onTool(ev) {
  let d;
  try { d = JSON.parse(ev.data); } catch (e) { return; }
  if (!d.run || !d.name) return;
  const r = runBubble(d.run);
  r.cur = null;   // 工具行截断当前文本块，后续 delta 开新块（交错顺序）
  let row = r.tools.get(d.id);
  if (!row) {
    row = document.createElement('div');
    row.className = 'trow';
    appendPinned(r.el, row);
    r.tools.set(d.id, row);
  }
  const end = d.phase === 'end';
  row.textContent = (end ? (d.ok ? '✔ ' : '✘ ') : '⚙ ') + d.name + (end ? '' : ' …');
  row.classList.toggle('bad', end && !d.ok);
}

// SSE 下行。EventSource 不能设头，conv 走查询参数；鉴权走 cookie（换票
// 后）或 TOKEN 查询参数（旧形态），两者服务端同权。W2.1 起消费 W1.4 的
// 事件族：命名事件 delta/tool 折进流式气泡；默认事件里带 run 的 reply
// 是流式收口（整泡替换），无 run 的照旧普通消息。（重）连上即刷一次绑定
// 状态（W2.2）：断线期间状态行被「SSE 断开」占位，重连后绑定常显自己
// 回来，不等下一条回复。
function listen() {
  const es = new EventSource(q('/events?conv=' + encodeURIComponent(CONV)));
  es.addEventListener('delta', onDelta);
  es.addEventListener('tool', onTool);
  es.onopen = () => refreshState();
  es.onmessage = ev => {
    let m;
    try { m = JSON.parse(ev.data); } catch (e) { addMsg('hint', '（无法解析的回复）'); return; }
    const r = m.run && runs.get(m.run);
    if (r) {   // 收口：替换成服务端权威终文本（§2.4 客户端按 run 幂等）
      runs.delete(m.run);
      r.cur = null;                    // 停掉在途的合帧渲染
      const pin = nearBottom();
      r.el.classList.remove('streaming');
      r.el.replaceChildren();
      if (m.text) renderBody(r.el, m.text); else r.el.remove();
      if (pin) list.scrollTop = list.scrollHeight;
    } else if (m.text) {
      addMsg('seek', m.text);   // 指令应答 / 丢帧回退：普通消息路径
    }
    if (m.session_id) {         // W2.3：agent_end 终值——run 收口带 sid
      meter.sid = m.session_id;
      renderMeter();
    }
    refreshState();             // 回复可能改了绑定（/bind 等）
  };
  // usage（源=turn_end）：多 turn 逐次累加，turn 间即实时上屏。
  es.addEventListener('usage', ev => {
    try {
      const u = JSON.parse(ev.data);
      meter.prompt += u.prompt || 0;
      meter.completion += u.completion || 0;
      meter.cacheHit += u.cache_hit || 0;
      meter.costUsd += u.cost_usd || 0;
      renderMeter();
    } catch (e) { /* 坏帧跳过——计量不因单帧畸形中断 */ }
  });
  es.onerror = () => setStatus('SSE 断开，自动重连中…', false);
  // push-to-talk（voice V2）：转写回显与失败面。命名事件不进 onmessage
  // （SSE 设计，旧页面零感知）；voice conv 的 seek 回复走上面的默认事件
  // 路径（无 run id → 普通气泡）。
  es.addEventListener('voice', ev => {
    try { const d = JSON.parse(ev.data); if (d.text) addMsg('you', d.text); } catch (e) {}
  });
  es.addEventListener('voice-error', ev => {
    try { const d = JSON.parse(ev.data); addMsg('hint', '（' + (d.error || '语音识别失败') + '）'); } catch (e) {}
  });
}

// 上行共用路径（W2.2 抽出）：表单提交与指令快捷按钮同走这一条 POST /msg
// 纯文本透传——按钮与手打完全同权。fromInput 才清空输入框（按钮直发不动
// 用户打了一半的草稿）。指令（"/" 开头）POST 成功后即时刷一次 /state：
// 绑定类指令改的是 bindings 表，不等 SSE 回复先把状态行对齐；回复到达时
// onmessage 的刷新再收敛（两次幂等，竞态最多短暂显示旧值）。
async function sendText(text, fromInput) {
  if (!text || send.disabled) return;
  addMsg('you', text);
  if (fromInput) input.value = '';
  send.disabled = true;
  try {
    const r = await fetch(q('/msg'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Seek-Conversation': CONV },
      body: JSON.stringify({ text }),
    });
    if (r.status === 401) addMsg('hint', '（token 无效，消息未送达——用带 ?token= 的地址打开）');
    else if (!r.ok) addMsg('hint', '（发送失败：HTTP ' + r.status + '）');
    else if (text.startsWith('/')) refreshState();
  } catch (e) { addMsg('hint', '（发送失败：' + e + '）'); }
  send.disabled = false;
}

form.addEventListener('submit', async ev => {
  ev.preventDefault();
  await sendText(input.value.trim(), true);
  input.focus();
});

// 指令快捷按钮（W2.2）：零参指令（/projects /new /cancel）直发；带参指令
// （/bind /switch）预填输入框并聚焦等路径——按钮只是「发送同款指令文本」
// 的快捷方式，不另造协议。
function wireCmd(id, text) {
  document.getElementById(id).addEventListener('click', () => {
    if (send.disabled) return;
    if (text.endsWith(' ')) {           // 带参指令：预填，光标移到末尾
      input.value = text;
      input.setSelectionRange(text.length, text.length);
      input.focus();
      return;
    }
    sendText(text, false);
    input.focus();
  });
}
wireCmd('cmd-bind', '/bind ');
wireCmd('cmd-switch', '/switch ');
wireCmd('cmd-projects', '/projects');
wireCmd('cmd-new', '/new');
wireCmd('cmd-cancel', '/cancel');

// ---- 按住说话（voice V2 入站，PRD feature-deepseek-app-api §4.3）----
// 流程：按住 🎤 → getUserMedia + MediaRecorder；松开（或 120s 到点自动
// 收口）→ decodeAudioData 解任意容器 → OfflineAudioContext 重采样 16 kHz
// 单声道 → 本地编 16-bit PCM WAV → POST /voice。设备身份与录音身份都是
// 浏览器自铸 uuid（与 CONV 同源的 mint），一次按下一个录音 id——服务端
// 拿它当 EventID 去重，同一次录音怎么重传都只进一条。转写文本与回复都
// 从本页 web conv 的 SSE 下行（voice/voice-error 命名事件 + 默认 reply）。
// 麦克风要 secure context：localhost 天然是；tailnet IP 走明文 http 不是
// （浏览器拒发 getUserMedia）——手机远端请用 https 前置（tailscale serve）。
const mic = document.getElementById('mic');
const DEVICE_KEY = 'seek-voice-device';
let DEVICE = null;
try {
  DEVICE = localStorage.getItem(DEVICE_KEY);
  if (!DEVICE) { DEVICE = mintConv(); localStorage.setItem(DEVICE_KEY, DEVICE); }
} catch (e) { /* 隐私模式等：DEVICE 留空，上传时提示 */ }

function micAvailable() {
  return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia
            && window.MediaRecorder && window.isSecureContext !== false);
}
if (!micAvailable()) {
  mic.disabled = true;
  mic.title = '此环境不可用麦克风（需 localhost 或 https）';
}

let rec = null;       // 进行中的一次录音 {mr, chunks, stopped, timer, stream}
let voiceBusy = false;  // 编码+上传进行中：按钮语义上仍可再按，但排队没必要

async function startRec() {
  if (!micAvailable() || voiceBusy || rec) return;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const mr = new MediaRecorder(stream);
    const chunks = [];
    mr.ondataavailable = ev => { if (ev.data && ev.data.size) chunks.push(ev.data); };
    const stopped = new Promise(res => { mr.onstop = res; });
    mr.start();
    const timer = setTimeout(stopRec, 120000);  // ASR 硬上限：到点等同松开
    rec = { mr, chunks, stopped, timer, stream };
    mic.classList.add('rec');
    mic.textContent = '⏺';
  } catch (e) {
    addMsg('hint', '（麦克风不可用：' + e + '）');
  }
}

function stopRec() {
  if (!rec) return;
  clearTimeout(rec.timer);
  if (rec.mr.state !== 'inactive') rec.mr.stop();
}

async function endRec() {
  if (!rec) return;
  const s = rec;
  rec = null;
  mic.classList.remove('rec');
  mic.textContent = '🎤';
  s.stream.getTracks().forEach(t => t.stop());
  await s.stopped;
  if (!s.chunks.length) return;
  voiceBusy = true;
  try {
    const wav = await toWav16k(await new Blob(s.chunks).arrayBuffer());
    await uploadVoice(wav);
  } catch (e) {
    addMsg('hint', '（语音失败：' + e + '）');
  }
  voiceBusy = false;
}

// 任意容器音频 → 16 kHz 单声道 16-bit PCM WAV（ASR 的输入形状；16k 单声道
// 下 120s ≈ 3.8 MiB，稳在 8 MiB 上限内）。两步都是纯标准 API：decodeAudioData
// 吃 webm/ogg，OfflineAudioContext 一次性重采样混单声道。
async function toWav16k(buf) {
  const ac = new (window.AudioContext || window.webkitAudioContext)();
  let decoded;
  try { decoded = await ac.decodeAudioData(buf); } finally { ac.close(); }
  const rate = 16000;
  const frames = Math.max(1, Math.ceil(decoded.duration * rate));
  const off = new OfflineAudioContext(1, frames, rate);
  const src = off.createBufferSource();
  src.buffer = decoded;
  src.connect(off.destination);
  src.start();
  const pcm = (await off.startRendering()).getChannelData(0);
  const dv = new DataView(new ArrayBuffer(44 + pcm.length * 2));
  const w = (o, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); dv.setUint32(4, 36 + pcm.length * 2, true); w(8, 'WAVE');
  w(12, 'fmt '); dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
  dv.setUint32(24, rate, true); dv.setUint32(28, rate * 2, true);
  dv.setUint16(32, 2, true); dv.setUint16(34, 16, true);
  w(36, 'data'); dv.setUint32(40, pcm.length * 2, true);
  let o = 44;
  for (let i = 0; i < pcm.length; i++, o += 2) {
    const x = Math.max(-1, Math.min(1, pcm[i]));
    dv.setInt16(o, x < 0 ? x * 0x8000 : x * 0x7fff, true);
  }
  return dv.buffer;
}

async function uploadVoice(wav) {
  if (!DEVICE) { addMsg('hint', '（无法生成本地设备 id（localStorage 不可用），语音未发送）'); return; }
  const ev = mintConv();  // 录音会话 id：一次按下一个，服务端按它去重
  try {
    const r = await fetch(q('/voice'), {
      method: 'POST',
      headers: {
        'Content-Type': 'audio/wav',
        'X-Seek-Conversation': CONV,
        'X-Seek-Device': DEVICE,
        'X-Seek-Voice-Event': ev,
      },
      body: wav,
    });
    if (r.status === 401) addMsg('hint', '（token 无效，语音未送达）');
    else if (r.status === 413) addMsg('hint', '（语音过长（>8 MiB），说短一点）');
    else if (!r.ok) addMsg('hint', '（语音上传失败：HTTP ' + r.status + '）');
    // 202 之后转写异步进行：结果从 SSE 的 voice / voice-error 事件回来
  } catch (e) {
    addMsg('hint', '（语音上传失败：' + e + '）');
  }
}

// 按下/松开走 pointer 事件（鼠标触摸统一）；pointerleave 兜底「拖出按钮」，
// contextmenu 拦掉长按弹菜单。preventDefault 防 touch 长按的文本选择/滚动。
mic.addEventListener('pointerdown', ev => { ev.preventDefault(); startRec(); });
mic.addEventListener('pointerup', endRec);
mic.addEventListener('pointerleave', endRec);
mic.addEventListener('contextmenu', ev => ev.preventDefault());

// ---- 会话浏览器（W4.4 资产面 UI·一）----
// 消费 W4.2 已合并的 /rpc method 集：session/list 驱动列表、session/get
// 出元信息行、session/messages 沿 next_cursor 逐页翻（50/页，「加载更多」
// 追加）。DOM 只装已翻进的页——长 transcript 的常驻渲染量级与虚拟滚动同
// 级，服务端与页面都不整读。渲染纪律与聊天面同源：textContent-only。
const browseBtn = document.getElementById('browse-btn');
const sessList = document.getElementById('sess-list');
const sessMeta = document.getElementById('sess-meta');
const sessMsgs = document.getElementById('sess-msgs');
const sessFoot = document.getElementById('sess-foot');
const MSG_PAGE = 50;
let sel = null;  // 打开中的会话分页游标 {sid, next, done, busy}

// JSON-RPC 2.0 envelope（W4.1）：一次 POST 一个调用；错误以异常上抛，
// 由各窗格自行展示。id 用自增整数——浏览器不重投，无需全局唯一。
let rpcSeq = 1;
async function rpc(method, params) {
  const r = await fetch(q('/rpc'), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ jsonrpc: '2.0', id: rpcSeq++, method, params }),
  });
  if (r.status === 401) throw new Error('token 无效——用带 ?token= 的地址打开');
  const j = await r.json();
  if (j.error) throw new Error('[' + j.error.code + '] ' + j.error.message);
  return j.result;
}

function paneHint(el, text) {
  const d = document.createElement('div');
  d.className = 'pane-hint';
  d.textContent = text;
  el.replaceChildren(d);
}

async function loadSessions() {
  paneHint(sessList, '加载中…');
  try {
    const res = await rpc('session/list', {});
    sessList.replaceChildren();
    if (!res.sessions.length) return paneHint(sessList, '（没有历史会话）');
    for (const s of res.sessions) {
      const row = document.createElement('button');
      row.type = 'button';
      row.className = 'sess-row';
      row.dataset.sid = s.sid;
      if (sel && sel.sid === s.sid) row.classList.add('cur');
      const t1 = document.createElement('span');
      t1.className = 't1';
      t1.textContent = s.title || '（无标题）';
      const t2 = document.createElement('span');
      t2.className = 't2';
      const when = s.last_at ? new Date(s.last_at).toLocaleString() : '';
      t2.textContent = when + ' · ' + s.turns + ' turns · ' + (s.model || '?');
      row.appendChild(t1);
      row.appendChild(t2);
      row.addEventListener('click', () => openSession(s.sid));
      sessList.appendChild(row);
    }
  } catch (e) { paneHint(sessList, 'session/list 失败：' + e.message); }
}

async function openSession(sid) {
  sel = { sid, next: '', done: false, busy: false };
  sessMeta.textContent = '';
  sessMsgs.replaceChildren();
  paneHint(sessFoot, '');
  for (const row of sessList.children) row.classList.toggle('cur', row.dataset.sid === sid);
  loadMeta(sid);
  loadMsgs();
}

// 元信息行：模型/turns/累计 tokens/cwd。装饰性数据，失败只落在本行。
async function loadMeta(sid) {
  try {
    const g = await rpc('session/get', { sid });
    if (!sel || sel.sid !== sid) return;  // 返回前已切走：丢弃
    const u = g.cumulative_usage || {};
    sessMeta.textContent = (g.header.model || '?') + ' · ' + g.turns + ' turns · '
      + ((u.prompt_tokens || 0) + (u.completion_tokens || 0)) + ' tokens · '
      + (g.header.cwd || '');
  } catch (e) { sessMeta.textContent = 'session/get 失败：' + e.message; }
}

async function loadMsgs() {
  const me = sel;
  if (!me || me.busy || me.done) return;
  me.busy = true;
  paneHint(sessFoot, me.next ? '加载中…' : '读取中…');
  try {
    const params = { sid: me.sid, limit: MSG_PAGE };
    if (me.next) params.cursor = me.next;
    const res = await rpc('session/messages', params);
    if (sel !== me) return;  // 翻页期间切了会话：旧游标作废
    for (const raw of res.messages) appendMsg(raw);
    if (res.next_cursor) {
      me.next = res.next_cursor;
      const more = document.createElement('button');
      more.type = 'button';
      more.textContent = '加载更多（已显示 ' + sessMsgs.children.length + ' 条）';
      more.addEventListener('click', loadMsgs);
      sessFoot.replaceChildren(more);
    } else {
      me.done = true;
      paneHint(sessFoot, sessMsgs.children.length ? '— 已到末尾 —' : '（无消息）');
    }
  } catch (e) {
    paneHint(sessFoot, 'session/messages 失败：' + e.message);
  }
  me.busy = false;
}

// 一条消息行：角色标签 + 工具调用摘要（参数截断）+ 正文走 renderBody。
// reasoning_content 不渲染（与聊天面 §2.5 同取舍）；tool 结果限高由 CSS 承担。
// messages 元素是服务端的 json.RawMessage——经 r.json() 已是对象；string 分支
// 只是防御（jse 一致性由 W4.2 的服务端测试钉）。
function appendMsg(raw) {
  let m;
  try { m = typeof raw === 'string' ? JSON.parse(raw) : raw; } catch (e) { return; }
  if (!m || typeof m !== 'object') return;
  const el = document.createElement('div');
  el.className = 'smsg ' + (m.role || 'other');
  const who = document.createElement('div');
  who.className = 'swho';
  who.textContent = m.role === 'tool' ? 'tool · ' + (m.tool_call_id || '') : (m.role || '?');
  el.appendChild(who);
  if (Array.isArray(m.tool_calls)) {
    for (const tc of m.tool_calls) {
      const t = document.createElement('div');
      t.className = 'stool';
      const fn = tc.function || {};
      let args = fn.arguments || '';
      if (args.length > 120) args = args.slice(0, 120) + '…';
      t.textContent = '⚙ ' + (fn.name || '?') + '(' + args + ')';
      el.appendChild(t);
    }
  }
  if (m.content) {
    const body = document.createElement('div');
    body.className = 'sbody';
    renderBody(body, m.content);
    el.appendChild(body);
  }
  sessMsgs.appendChild(el);
}

// ---- 任务面板（W3.3 编排 P1 可视化）----
// 消费 W3.1 的 GET /subagents（列表 + ?sub= 详情）与 W3.2 的 SSE topic。
// 面板协议 = 先订阅、再取快照：专用 /events 连接带 ?topic=subagents 且
// 只 addEventListener('subagents')、不设 onmessage——同连接上捎带的聊天帧
// 被浏览器静默丢弃，不会与主连接重复渲染。推送按 sub_sid 合并（列表序
// = 服务端 newest-first，新行 unshift）；终态推送顺手刷新打开中的详情。
const agentsBtn = document.getElementById('agents-btn');
const agList = document.getElementById('ag-list');
const agMeta = document.getElementById('ag-meta');
const agLast = document.getElementById('ag-last');
let agRows = [];      // 折叠行（GET 快照 + topic 推送合并后的当前态）
let agOpen = null;    // 详情打开中的 sub_sid
let topicES = null;   // 面板专用 SSE 连接（进入面板且已绑定时才开）
let topicProject = null;

const memBtn = document.getElementById('mem-btn');
const statBtn = document.getElementById('stat-btn');
browseBtn.addEventListener('click', () => togglePane('sessions', browseBtn, '📚 会话'));
memBtn.addEventListener('click', () => togglePane('memory', memBtn, '🧠 记忆'));
statBtn.addEventListener('click', () => togglePane('stats', statBtn, '📊 统计'));
agentsBtn.addEventListener('click', () => togglePane('agents', agentsBtn, '🤖 后台'));

// 四面板共用的开合闸（W4.5 把 W4.4 的 browsing 一位类拆成「browsing=隐
// 聊天 + 恰好一个 *-view 亮面板」；W3.3 的任务面板并入同一闸）：再点当
// 前面板的按钮回聊天面。进面板即重拉数据（磁盘世界会变旧，与
// loadSessions 同一取舍）。末尾的 syncTopicStream 是 W3.3 的接线：agents
// 面板可见且已绑定才保持专用订阅，离开/换面板即收口。
const panes = {
  sessions: { btn: browseBtn, label: '📚 会话', cls: 'sess-view', load: loadSessions },
  memory:   { btn: memBtn,    label: '🧠 记忆', cls: 'mem-view',   load: loadMemPane },
  stats:    { btn: statBtn,   label: '📊 统计', cls: 'stat-view',  load: loadStatPane },
  agents:   { btn: agentsBtn, label: '🤖 后台', cls: 'agents-view', load: loadAgentsPane },
};
function togglePane(name, btn, label) {
  const active = !document.body.classList.contains(panes[name].cls);
  for (const p of Object.values(panes)) {
    document.body.classList.toggle(p.cls, false);
    p.btn.textContent = p.label;
  }
  if (active) {
    document.body.classList.add(panes[name].cls, 'browsing');
    btn.textContent = '💬 聊天';
    panes[name].load();
  } else {
    document.body.classList.remove('browsing');
  }
  syncTopicStream();
}

// 进任务面板（原三视图 setView 的 agents 分支，随四面板闸并入
// togglePane）：先订阅再取快照（W3.2 协议序——锚点在订阅时刻，订阅→GET
// 之间的追加靠推送补、不靠快照重读）。
function loadAgentsPane() {
  syncTopicStream();
  loadAgents();
  if (!agOpen) { agMeta.textContent = ''; paneHint(agLast, '（在左侧选一条记录看末条输出）'); }
}

const AG_STATUS = {
  active:    ['在跑',   '#d8a657'],
  completed: ['完成',   '#7ec699'],
  failed:    ['失败',   '#d8756f'],
  killed:    ['已终止', '#9aa0a8'],
  orphaned:  ['失联',   '#d8756f'],
  promoted:  ['已晋升', '#7aa2f7'],
};
const agStatusView = s => AG_STATUS[s] || [s, '#9aa0a8'];

function agTokensText(t) {
  if (!t) return '';
  const n = (t.prompt || 0) + (t.completion || 0) + (t.cache_hit || 0);
  return n ? 'p' + t.prompt + ' c' + t.completion + ' ch' + t.cache_hit : '';
}

async function loadAgents() {
  paneHint(agList, '加载中…');
  try {
    const r = await fetch(q('/subagents'), { headers: { 'X-Seek-Conversation': CONV } });
    if (r.status === 400) return paneHint(agList, '未绑定项目——聊天里发 /bind <项目路径> 后再来');
    if (!r.ok) return paneHint(agList, '/subagents 失败：HTTP ' + r.status);
    agRows = await r.json();
    renderAgList();
  } catch (e) { paneHint(agList, '/subagents 失败：' + e); }
}

// 列表全量重画（面板量级几十行，无所谓）；textContent-only 纪律同聊天面。
function renderAgList() {
  agList.replaceChildren();
  if (!agRows.length) return paneHint(agList, '（还没有子代理记录）');
  for (const s of agRows) {
    const row = document.createElement('button');
    row.type = 'button';
    row.className = 'ag-row';
    row.dataset.sid = s.sub_sid;
    if (agOpen === s.sub_sid) row.classList.add('cur');
    const t1 = document.createElement('span');
    t1.className = 't1';
    const badge = document.createElement('span');
    badge.className = 'ag-badge';
    const [label, color] = agStatusView(s.status);
    badge.textContent = (s.background ? 'bg·' : '') + label + (s.notified ? '✓' : '');
    badge.style.color = color;
    const desc = document.createElement('span');
    desc.className = 'desc';
    desc.textContent = s.description || '（无描述）';
    t1.appendChild(badge);
    t1.appendChild(desc);
    const t2 = document.createElement('span');
    t2.className = 't2';
    const toks = agTokensText(s.tokens);
    t2.textContent = (s.type || '?') + ' · '
      + (s.started_at ? new Date(s.started_at).toLocaleString() : '')
      + (toks ? ' · ' + toks : '');
    row.appendChild(t1);
    row.appendChild(t2);
    row.addEventListener('click', () => openAgent(s.sub_sid));
    agList.appendChild(row);
  }
}

// 详情：GET /subagents?sub= —— 折叠行 + 子 transcript 末条 assistant
// （summary 单源：索引不带 summary，子自己的 transcript 才是全文）。
async function openAgent(sid) {
  agOpen = sid;
  for (const row of agList.children) row.classList.toggle('cur', row.dataset.sid === sid);
  agMeta.textContent = '读取中…';
  agLast.replaceChildren();
  try {
    const r = await fetch(q('/subagents?sub=' + encodeURIComponent(sid)),
                          { headers: { 'X-Seek-Conversation': CONV } });
    if (!r.ok) { agMeta.textContent = '详情读取失败：HTTP ' + r.status; return; }
    const d = await r.json();
    if (agOpen !== sid) return;  // 返回前已切走：丢弃
    const s = d.sub || {};
    const [label] = agStatusView(s.status);
    const toks = agTokensText(s.tokens);
    agMeta.textContent = (s.background ? '后台 ' : '同步 ') + label + ' · ' + (s.type || '?')
      + ' · ' + (s.description || '') + (toks ? ' · ' + toks : '');
    if (d.last_assistant) renderBody(agLast, d.last_assistant);  // 纯 DOM 构建
    else paneHint(agLast, s.status === 'active'
      ? '（子代理还在跑——尚无已落盘的输出）' : '（没有可读的 transcript）');
  } catch (e) { agMeta.textContent = '详情读取失败：' + e; }
}

// topic 订阅生命周期：面板开着且已绑定才连；面板关掉即断；换绑项目后
// 重连跟随新项目（服务端口径：订阅锚定订阅时的项目，重订阅才跟新）。
// 未绑定时不开——W3.2 对未绑定 conv 的 topic 请求是 400，EventSource 会
// 无限重连刷屏（与 W1.2 不挂未鉴权 SSE 同一条纪律）。
function syncTopicStream() {
  const want = document.body.classList.contains('agents-view') && boundProject;
  if (topicES && topicProject !== boundProject) { topicES.close(); topicES = null; }
  if (want && !topicES) {
    topicProject = boundProject;
    topicES = new EventSource(q('/events?conv=' + encodeURIComponent(CONV) + '&topic=subagents'));
    topicES.addEventListener('subagents', ev => {
      try {
        const m = JSON.parse(ev.data);
        if (!m.sub || !m.sub.sub_sid) return;
        const i = agRows.findIndex(x => x.sub_sid === m.sub.sub_sid);
        if (i >= 0) agRows[i] = m.sub; else agRows.unshift(m.sub);
        renderAgList();
        if (agOpen === m.sub.sub_sid) openAgent(m.sub.sub_sid);  // 终态推送刷新详情
      } catch (e) { /* 单条坏帧不毁面板 */ }
    });
    // onerror 不处理：EventSource 自动重连；面板关闭由 close() 收口。
  }
  if (!want && topicES) { topicES.close(); topicES = null; topicProject = null; }
}

// ---- 记忆浏览器（W4.5 资产面 UI·二）----
// 消费 W4.3 的 memory/projects|list|get：项目下拉（memory/projects，新→旧）
// 挑 project_id，列表出该项目的条目（memory/list，含 stale 标记），点开
// 单条详情（memory/get，正文走聊天面同一 renderBody）。渲染纪律不变：
// textContent-only。memSel 防「响应回来前已切走」的串台（与 sel 同构）。
const memProj = document.getElementById('mem-proj');
const memCnt = document.getElementById('mem-cnt');
const memList = document.getElementById('mem-list');
const memMeta = document.getElementById('mem-meta');
const memTags = document.getElementById('mem-tags');
const memContent = document.getElementById('mem-content');
let memSel = null;  // {proj, name} 当前打开的详情；null = 未开

async function loadMemPane() {
  paneHint(memList, '加载中…');
  try {
    const res = await rpc('memory/projects', {});
    memProj.replaceChildren();
    if (!res.projects.length) {
      memCnt.textContent = '';
      memSel = null;
      memMeta.textContent = ''; memTags.replaceChildren(); memContent.replaceChildren();
      return paneHint(memList, '（磁盘上没有项目——先在终端里用 seek 跑一阵）');
    }
    for (const p of res.projects) {
      const opt = document.createElement('option');
      opt.value = p.project_id;
      opt.textContent = p.project_id.slice(0, 8) + ' · ' + p.memories + ' 条 · '
        + new Date(p.last_active_at).toLocaleDateString();
      memProj.appendChild(opt);
    }
    loadMemList(memProj.value);
  } catch (e) { paneHint(memList, 'memory/projects 失败：' + e.message); }
}

async function loadMemList(proj) {
  memSel = null;
  memMeta.textContent = ''; memTags.replaceChildren(); memContent.replaceChildren();
  paneHint(memList, '加载中…');
  try {
    const res = await rpc('memory/list', { project_id: proj });
    memList.replaceChildren();
    memCnt.textContent = res.memories.length + ' 条记忆';
    if (!res.memories.length) return paneHint(memList, '（这个项目还没有记忆）');
    for (const m of res.memories) {
      const row = document.createElement('button');
      row.type = 'button';
      row.className = 'mem-row';
      row.dataset.name = m.name;
      const t1 = document.createElement('span');
      t1.className = 't1';
      t1.textContent = (m.pinned ? '📌 ' : '') + m.name;
      const t2 = document.createElement('span');
      t2.className = 't2';
      t2.textContent = (m.stale ? '⚠ 过期 · ' : '') + (m.tagline || '')
        + ' · ' + new Date(m.updated_at).toLocaleDateString();
      row.appendChild(t1);
      row.appendChild(t2);
      row.addEventListener('click', () => openMem(proj, m.name));
      memList.appendChild(row);
    }
  } catch (e) { paneHint(memList, 'memory/list 失败：' + e.message); }
}

async function openMem(proj, name) {
  memSel = { proj, name };
  memMeta.textContent = '读取中…';
  memTags.replaceChildren();
  memContent.replaceChildren();
  for (const row of memList.children) row.classList.toggle('cur', row.dataset.name === name);
  try {
    const m = await rpc('memory/get', { project_id: proj, name });
    if (!memSel || memSel.proj !== proj || memSel.name !== name) return;  // 已切走：丢弃
    const bits = [m.name, m.tagline || ''];
    bits.push('建于 ' + new Date(m.created_at).toLocaleString());
    bits.push('更新 ' + new Date(m.updated_at).toLocaleString());
    bits.push('召回 ' + m.recall_count + ' 次');
    if (m.pinned) bits.push('📌 常驻');
    if (m.stale) bits.push('⚠ 过期待回收');
    if (m.auto_sourced) bits.push('auto');
    memMeta.textContent = bits.join(' · ');
    for (const t of (m.tags || [])) {
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.textContent = '#' + t;
      memTags.appendChild(chip);
    }
    renderBody(memContent, m.content || '（无正文）');
  } catch (e) {
    memMeta.textContent = 'memory/get 失败：' + e.message;
  }
}

memProj.addEventListener('change', () => loadMemList(memProj.value));

// ---- 统计视图（W4.5 资产面 UI·二）----
// 消费 W4.3 的 stats/cache（cost_usd 服务端算——「client never prices」，
// 页面永不带费率卡）+ W4.2 的 session/list 当会话选择器（缺省最新）。
// 命中率条宽经 CSSOM（el.style.width）设置——style 属性才归 CSP 管，
// CSSOM 不受 style-src 限制，且宽度只可能是数字。
const statSess = document.getElementById('stat-sess');
const statBody = document.getElementById('stat-body');

// 与服务端成本展示同刻度的格式化（只排版数值，不携带任何费率——费率
// 只住在服务端的费率表里）：
// $0 / 4 位小数（分以下）/ 3 位（一美元内）/ 2 位。
function fmtUSD(c) {
  if (!c) return '$0';
  if (c < 0.01) return '$' + c.toFixed(4);
  if (c < 1) return '$' + c.toFixed(3);
  return '$' + c.toFixed(2);
}

async function loadStatPane() {
  paneHint(statBody, '加载中…');
  try {
    const res = await rpc('session/list', {});
    statSess.replaceChildren();
    if (!res.sessions.length) {
      return paneHint(statBody, '（没有历史会话——先在终端里用 seek 跑一阵）');
    }
    for (const s of res.sessions) {
      const opt = document.createElement('option');
      opt.value = s.sid;
      const when = s.last_at ? new Date(s.last_at).toLocaleString() : '';
      opt.textContent = (s.title || s.sid.slice(0, 8)) + (when ? ' · ' + when : '');
      statSess.appendChild(opt);
    }
    showStats(statSess.value);
  } catch (e) { paneHint(statBody, 'session/list 失败：' + e.message); }
}

async function showStats(sid) {
  if (!sid) return;
  const me = sid;
  paneHint(statBody, '读取中…');
  try {
    const r = await rpc('stats/cache', { sid });
    if (statSess.value !== me) return;  // 响应回来前已切走：丢弃
    const u = r.usage || {};
    statBody.replaceChildren();

    const cache = document.createElement('div');
    cache.className = 'stat-card';
    cache.appendChild(cardTitle('前缀缓存 · ' + r.sid.slice(0, 8) + ' · ' + (r.model || '?')));
    const hit = u.prompt_cache_hit_tokens || 0, miss = u.prompt_cache_miss_tokens || 0;
    const prompt = (u.prompt_tokens != null ? u.prompt_tokens : hit + miss);
    const ratio = (typeof r.hit_ratio === 'number') ? r.hit_ratio : 0;
    cache.appendChild(statRow('命中 / 未命中', hit.toLocaleString() + ' / ' + miss.toLocaleString()));
    cache.appendChild(statRow('命中率', (ratio * 100).toFixed(1) + '%'));
    const bar = document.createElement('div');
    bar.className = 'stat-bar';
    const fill = document.createElement('div');
    fill.className = 'hit';
    fill.style.width = (Math.min(1, Math.max(0, ratio)) * 100).toFixed(1) + '%';
    bar.appendChild(fill);
    cache.appendChild(bar);
    statBody.appendChild(cache);

    const tok = document.createElement('div');
    tok.className = 'stat-card';
    tok.appendChild(cardTitle('累计 tokens'));
    tok.appendChild(statRow('输入（prompt）', prompt.toLocaleString()));
    tok.appendChild(statRow('输出（completion）', (u.completion_tokens || 0).toLocaleString()));
    tok.appendChild(statRow('合计', (u.total_tokens || prompt + (u.completion_tokens || 0)).toLocaleString()));
    statBody.appendChild(tok);

    const cost = document.createElement('div');
    cost.className = 'stat-card';
    cost.appendChild(cardTitle('成本（按当前时段费率估算）'));
    cost.appendChild(statRow('累计花费', fmtUSD(r.cost_usd), true));
    statBody.appendChild(cost);
  } catch (e) { paneHint(statBody, 'stats/cache 失败：' + e.message); }
}

function cardTitle(text) {
  const h = document.createElement('h3');
  h.textContent = text;
  return h;
}
function statRow(k, v, usd) {
  const row = document.createElement('div');
  row.className = 'stat-row';
  const key = document.createElement('span');
  key.textContent = k;
  const val = document.createElement('span');
  val.className = 'v' + (usd ? ' usd' : '');
  val.textContent = v;
  row.appendChild(key);
  row.appendChild(val);
  return row;
}

statSess.addEventListener('change', () => showStats(statSess.value));

// 探测式启动（W1.2）：是否有有效凭证（cookie 或 URL token）由 /state 的
// 响应判定；未鉴权就不挂 SSE——EventSource 对 401 会无限重连刷屏。
refreshState().then(ok => { if (ok) listen(); });
</script>
</body>
