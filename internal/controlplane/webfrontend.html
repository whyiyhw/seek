<!doctype html>
<!-- seek web MVP (card c_qucxtu) — single page, zero build chain.
     Message rendering (W5, card c_x2au4t; rework c_k3pnlw added tables/
     quotes/paragraphs): markdown SUBSET renderer — fenced ``` blocks,
     `inline` code, # headings, - / 1. lists (with lazy continuation),
     GFM tables, > quotes, paragraphs, and [links](url) with a protocol
     allowlist — vendored as a handwritten DOM-API renderer in
     static/markdown.js (the first non-inline asset; marked/markdown-it
     both bust the ≤25KB quota AND their HTML-string output would need
     a parse-string-into-DOM sink, which §5.5 forbids). Model output
     NEVER enters an HTML-parsing path: text rides
     createTextNode/textContent, elements come from a fixed tag
     whitelist (PRE/CODE/UL/OL/LI/H1-6/A/BLOCKQUOTE/DIV/TABLE-family).
     Conversation identity (W1.3, D-W3): uuid minted by the browser,
     persisted in localStorage, carried as X-Seek-Conversation on
     fetches and ?conv= on the SSE stream (EventSource cannot set
     headers); the server keeps zero session state.
     Auth (W1.2): the /?token= first hop 303-exchanges the token into
     an HttpOnly cookie and scrubs the URL; this page rides the cookie
     (fetch/EventSource send it same-origin) — the token never reaches
     JS. The write side clears the server's Origin gate for free
     (browsers attach Origin to every POST).
     Status meter (W2.3): the header's right segment accumulates
     tokens/$ from each named usage event (source: turn_end; the $ is
     the SERVER-priced cost_usd, the page never computes money) and
     shows the session id short once the reply close-out carries it
     (source: agent_end). Page-lifetime cumulative — SSE has no
     replay, a reload restarts the meter at zero.
     Workspace tree (W5 follow-up card, supersedes c_txz6vz's flat list): the
     left rail is a TWO-LEVEL tree — workspace group headers over per-session
     rows. Groups come from project/list roots ∪ serve.projects (the same
     two read-only sources c_lnsdvu's picker shipped, now rendered in place
     instead of behind a modal), plus every cwd seen in session/list so a
     session whose manifest went missing is never orphaned. Clicking a group
     header BINDS there (a picked row sends the SAME '/bind <root>' text a
     hand-typed command would); the ＋ on a header resets the session inside
     it; clicking a row resumes/opens (row = openSession, "continue here" =
     /resume). session/list drives the rows (updated desc, title substring
     search, 30-row pages via "load more"), the bound session is the
     highlighted row, and the collapse bit lives in localStorage (a viewport
     under 1024px defaults to collapsed). Group open/closed state also lives
     in localStorage. A row click opens its transcript in the MAIN area:
     session/get (meta line) + session/messages walked page by page via
     next_cursor (50/page, "load more" appends; the DOM only ever holds what
     was paged in, so a long transcript stays at virtual-scroll order of
     magnitude). Same textContent-only discipline as chat.
     Streaming bubble (W2.1): the W1.4 named SSE events fold
     client-side per run id — deltas accumulate into text blocks,
     tool calls render as single folded status rows (args/results
     stay server-side by wire contract), interleaved in arrival
     order; the run-bearing reply replaces the whole bubble with
     the authoritative final text (a reply whose run was never seen —
     dropped frames — falls back to the plain message path, which is
     what makes the fold idempotent). usage events are W2.3's (the
     token/$ status bar), deliberately unlistened here.
     Task panel (W3.3, orchestration P1 visualisation): subagent
     master-detail over GET /subagents + the SSE topic — a SECOND
     /events connection opts into ?topic=subagents and listens ONLY
     for the named event (no onmessage: the conv frames riding the
     same connection are dropped by the browser, so chat never
     double-renders). Protocol: subscribe first, then GET /subagents
     for the snapshot; pushes merge by sub_sid. A detail row reads
     the sub transcript's LAST assistant entry (?sub=, summary 单源).
     Memory browser + stats view (W4.5, asset plane UI #2): memory/
     projects drives the project picker, memory/list the entry list,
     memory/get the detail (rendered by the chat renderer); the stats
     view rides stats/cache (session picker from session/list) — the
     cache/cost card shows hit ratio + cost_usd, priced SERVER-side
     (the client never prices; §2.5).
     Command surface (W2.2, retired by the workspace-tree card): the top bar
     no longer carries /bind /projects /switch /new /cancel buttons — the
     tree owns project selection and session creation, the send key forks to
     STOP while a run is live. The COMMANDS themselves stay: /bind /switch /
     /new /cancel /resume /projects are still plane commands (router.go) and
     still reachable by typing them (Telegram/Feishu rely on that, and the
     '/' completion menu lists them) — the page simply stops asking anyone to
     type one. Binding status stays pinned in the status line: refreshed
     immediately after a command POST (202) settles on the wire, again on
     every SSE reply, and again on SSE (re)connect.
     Stop key (c_5m3fm6, dsh InputBar alignment): while a streamed run
     is live the SEND key becomes the STOP key — the click is forked at
     the click layer (preventDefault; a submit event names #send as
     the submitter for Enter's implicit submission too, so click vs
     Enter cannot be told apart at submit) and sends the SAME /cancel
     command text as the top bar; Enter with a draft still submits as
     before (conv-gate queuing is prior semantics, not narrowed here).
     The armed run's close-out is a PRESERVING one: the ack reply is
     run-bearing but its text is just a receipt — the accumulated
     deltas ARE the content of an interrupted run, so a 「—— 已中断 ——」
     marker is appended instead of the authoritative replace, and the
     server's terminal 「run 已中断。」 lands run-less as its own
     bubble. Key state follows the run table: the first stream event
     flips it, close-out reverts it — no stop key when idle.
     Attachments (W5 c_56yrcj): click the paperclip / drag / paste → POST /attach
     (raw bytes), staged progress in a tray, images previewed from
     FileReader data: URLs; on send the staged paths ride the /msg text
     as "@<path>" so the child's own vision (modelcap) and document
     (filerefs) routers claim them — no new plane pipeline.
     Push-to-talk (voice V2, feature-deepseek-app-api §4.3): hold the mic button,
     speak ≤120 s, release — MediaRecorder → decodeAudioData → 16 kHz
     mono 16-bit WAV (the ASR input shape, resampled via
     OfflineAudioContext) → POST /voice with a per-BROWSER device uuid
     (X-Seek-Device) and a per-PRESS recording uuid (X-Seek-Voice-Event,
     the server's dedup key). The transcript echoes back as the named
     SSE event "voice" (a `you` bubble); ASR failures as "voice-error".
     The conversation it opens is voice:<device-id> — its OWN binding,
     separate from this page's web:<uuid> chat conv. Microphone needs
     a secure context: localhost is one; a tailnet IP over plain http
     is NOT (browsers deny getUserMedia) — front it with an HTTPS
     proxy (tailscale serve) to talk from a phone.
     Input enhancements (c_7lsngm, dsh ui-input-trigger + ui-commands):
     textarea (Enter sends / Shift+Enter newlines) + ONE candidate
     overlay — '/' commands (CMDS registry below) and '@' recent sessions
     (/rpc session/list → /resume <sid>). Navigation keys bind on the
     input only, so Escape never hijacks the page.
     Approval cards (W5, card c_n37tnr): permission y/N delivered to
     the browser — the conv stream's named `approval` events drive a
     bottom-right card stack (summary + command summary + y/N/a
     buttons, permission.Policy semantics: a = always-allow for the
     kind), decisions POST via /rpc approval/decide, receipts
     (resolved/cancelled) withdraw the card in every tab. Idempotent
     both sides: click disables the whole card (no double POST), the
     hub fires the decide callback exactly once per id. Empty state is
     zero-footprint (badge hidden, stack :empty). Reconnect resyncs
     via approval/list with a tombstone set against snapshot races.
     Tool call tree (card c_ux7lvk, dsh-aligned presentation): the two
     tool-row surfaces become call trees over their EXISTING data
     sources (no wire changes). Live bubble rows: one row per call =
     name + duration (client-measured gap between the start/end SSE
     frames — the server forwards each frame as it arrives; ticking
     while in flight, frozen at end), nested sub-calls indented by
     interval containment: depth = in-flight count at start (seek's
     partitioned dispatch runs read-only calls concurrently, so
     overlap renders as parent/child — flame-graph semantics,
     presenting overlap, not claiming causality; sequential runs stay
     flat). args/results are NOT on the /events wire (§2.5 —
     tool_end.result can be huge), so live rows stay folded
     one-liners. The expandable 参数/结果摘要 lives in the sessions
     browser: appendMsgTree pairs each assistant tool_calls[] row with
     its tool-role result by tool_call_id (ids match — both are
     deepseek.ToolCall.ID), renders summaries capped at 4000 chars in
     a scrollable pre, and 复制全文 copies the full string held in a
     JS closure (clipboard API on secure contexts, execCommand
     fallback for tailnet plain-http, which is NOT a secure context).
     Tool-role messages keep their standalone bubbles (the W4.4
     one-.smsg-per-message render contract stays untouched — zero
     regression); the tree registers their content by tool_call_id so
     the expand panel and the row's size tag read it.
     Per-message degradation: tree render throws → legacy
     folded rendering → （消息渲染失败） placeholder — never a blank
     page; the live tree degrades to the pre-tree single-line row.
     Copy & panel details (card c_jf3grt): ONE date formatter pair
     (fmtWhen MM-DD HH:mm / fmtDay MM-DD, year only across years) —
     the page never calls toLocaleString again, because the browser
     locale is environment state and had rendered English long dates
     («11/20/2026, 7:00:00 PM») inside a Chinese UI; turns read
     「N 轮」 instead of "N turns" (no plural to get wrong in
     Chinese). The chat plane gets an empty state (unbound → /bind
     guidance + the same project picker as the top bar; bound → a
     welcome line), removed on the first message so nothing but .msg
     children ever ride #list. The send key is disabled while the
     draft is empty (and re-enabled by typing/attachments; the stop
     key while a run is live is always clickable) — the in-flight
     POST guard moved to `posting` so the command buttons that share
     sendText never inherit the draft-based disabled state. Stats
     pane: session options truncate the title and carry the short
     date, cards form an auto-fit grid with one container-owned gap
     rhythm, and money gets its own token (seek-usd) so the cost
     number can no longer read as the green hit-ratio/health colour.
     Tree rows summarise args as first key=value (+N) instead of raw
     JSON; the exact args stay in the expand panel and the row title.
     Deliberately out of scope: multi-tab sync, history persistence,
     bold/italic markdown (the W5 subset — tables/quotes/paragraphs
     added by rework c_k3pnlw — covers the chat load; renderer lives
     in static/markdown.js), mobile, real auth
     (design card c_7pptol owns the full UI). -->
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>seek</title>
<!-- 首屏主题 bootstrap（W5 卡 c_ni7mzw，防 FOUC）：必须在样式表之前同步
     跑完——浏览器解析到样式表时 data-theme 已落定，首帧就是目标主题，
     不存在「先画暗再翻亮」的闪白/闪黑。三态：localStorage 里的显式选择
     （"light" / "dark"）优先；没有选择（或 localStorage 抛异常，如隐私
     模式）时跟随系统 prefers-color-scheme。全部逻辑收敛在这一个内联块里，
     页尾的主题 JS 只在用户点切换时复用同一套读写。 -->
<script>
(function () {
  var t = null;
  try { t = localStorage.getItem('seek-theme'); } catch (e) { /* 隐私模式：当作未选择 */ }
  if (t !== 'light' && t !== 'dark') {
    try {
      t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
    } catch (e) { t = 'dark'; }
  }
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<style>
  /* ---- 主题 token（W5 卡 c_ni7mzw）----
     两套值、一个属性开关：`html[data-theme="light"]` 只翻变量层，组件
     CSS 一律 var(--seek-*)，没有任何裸色值（dsh 的三层体系缩成两层：
     静态色板与语义别名在 seek 这个体量上合成一层就够）。缺省=暗色；
     色值自 W6-1（c_pozbmd）起按 dsh 页面实测重定，不再是 W5 之前的旧值。
     首屏由 <head> 里的内联 bootstrap 在样式表解析前写好 data-theme，
     故不存在「先画暗再翻亮」的闪烁；CSP 对该内联块的 sha256 由
     webfrontend_static.go 从同一份 embed 现算，手改页面不会失配。 */
  :root {
    color-scheme: dark;
    /* 字族（W6-1 c_pozbmd，口径=notes-web-w6-dsh-shell §2 的真 dsh 实测）：
       正文=系统无衬线栈（PingFang SC 全覆盖中文），等宽只给代码/日志。
       等宽栈刻意不带裸 `monospace` 尾——Windows CJK 下裸 monospace 会掉
       进 SimSun（notes-dsh-ui-spec §b）。 */
    --seek-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --seek-mono: "SF Mono", "JetBrains Mono", Menlo, Consolas;
    --seek-inset: #151517;   /* 主区底/输入框底（dsh bg-base） */
    --seek-panel: #1b1b1c;   /* 顶栏/状态栏/侧栏/表单底（dsh layer-1） */
    --seek-soft:  #232324;   /* 气泡/卡片/次级按钮底（dsh layer-2） */
    --seek-accent:#1f2a44;   /* 用户气泡底（品牌蓝低饱和，≥4.5:1） */
    --seek-sel:   rgba(255,255,255,.10);  /* 选中行/开关态（dsh selected） */
    --seek-hover: rgba(255,255,255,.08);  /* 悬停行 */
    --seek-brand:#679efe;    /* 品牌蓝：链接/选中标记/徽标（deepseek-400） */
    --seek-cta:   #679efe;   /* 发送钮底（品牌蓝，配 --seek-cta-fg 7.1:1） */
    --seek-cta-fg:#0f1115;
    /* 主按钮（单色，dsh 的 brand-primary）：彩色只留状态语义，主 CTA 不抢
       品牌色的语义位——暗=近白底黑字（18.1:1），亮=近黑底白字（18.9:1）。 */
    --seek-primary:#f9fafb;
    --seek-primary-fg:#0f1115;
    --seek-line:  rgba(255,255,255,.12);  /* 主分隔线/边框（l2） */
    --seek-line-2:rgba(255,255,255,.06);  /* 列表行分隔线（l1，更淡一档） */
    --seek-line-focus:#4b586b; /* 输入聚焦边框 */
    --seek-fg:    #f9fafb;   /* 正文（dsh bluish-50；inset 17.5:1） */
    /* 次级/三级：dsh 暗列 bluish-300/400 档，逐对压 inset/panel/soft/accent
       均 ≥4.5:1（soft #232324 上 7.3 / 5.1）。 */
    --seek-fg-soft:#b6bcc4;  /* 次级：工具行/徽标/卡片标题 */
    --seek-fg-dim:#979da6;   /* 三级：元信息/字段名 */
    --seek-ok:    #22c55e;   /* green-500 */
    --seek-warn:  #f59e0b;   /* amber-500 */
    --seek-warn-bg:#3a3222;  /* 警示条底（SSE 断线提示）——底色与前景分开
                                成对，亮色主题才好各自调值 */
    --seek-err:   #fb7575;   /* red-400 提亮一档：red-500 #f25a5a 在行内码底
                                (#2c2c2e) 只有 4.24，卡片上的错误色不达 AA */
    --seek-link:  #679efe;   /* 链接=品牌蓝（与 --seek-brand 同值） */
    --seek-rec:   #8f4a4a;   /* 录音中按钮底 */
    --seek-rec-fg:#f0d7b8;
    /* 成本数字专用色（c_jf3grt）：$ 与命中率/健康度是两套语义，早先
       共用 --seek-ok 绿——同屏一张卡里「花了多少钱」和「缓存命中多好」
       同色，读起来像同一种好坏。选信息蓝：与 ok/warn/err 三色语义不撞，
       压 soft(#2c2c2e) 6.4:1、panel(#1b1b1c) 7.9:1（AA 正文有余）。 */
    --seek-usd:   #8fb3e0;
    --seek-code-bg:#1b1b1c;     /* 代码块底（§2 表：= 侧栏底一档） */
    --seek-code-inline:#2c2c2e; /* 行内码底（§2 表：layer-3） */
    --seek-scrim: rgba(0,0,0,.5);   /* 窄屏抽屉遮罩（c_lqtt2m） */
    --seek-shadow:0 4px 14px rgba(0,0,0,.45);
  }
  /* 亮色：同一组语义名换值，快捷键只有 data-theme 一个属性。选值口径
     = 每对文字/底色 ≥4.5:1（WCAG AA 正文），面板间不靠色相只靠明度差。
     值取 dsh 亮列（notes-web-w6-dsh-shell §2 / notes-dsh-ui-spec §b）：
     主区白、侧栏 f9fafb、行内码 ebeef2、用户气泡 edf3fe（见下方各 token）。 */
  :root[data-theme="light"] {
    color-scheme: light;
    --seek-inset: #ffffff;
    --seek-panel: #f9fafb;
    --seek-soft:  #ebeef2;
    --seek-accent:#edf3fe;
    --seek-sel:   rgba(38,49,72,.06);
    --seek-hover: rgba(0,0,0,.06);
    --seek-brand:#4176e6;
    --seek-cta:   #3565d2;   /* 发送钮：品牌蓝压深一档，白字 5.3:1 */
    --seek-cta-fg:#ffffff;
    --seek-primary:#0f1115;
    --seek-primary-fg:#ffffff;
    --seek-line:  rgba(0,0,0,.10);
    --seek-line-2:rgba(0,0,0,.04);
    --seek-line-focus:#7b8798;
    --seek-fg:    #0f1115;
    /* 次级取 §2 亮列 #61666b（白/panel/soft/accent 四底最低 4.98:1）。三级
       的实测值 #81858c 在四个亮底上只有 3.2–3.7（AA 正文不达标），故取
       仍比次级浅一档、但四底都 ≥4.5 的 #666b71（最低 4.62，soft 上）。 */
    --seek-fg-soft:#61666b;
    --seek-fg-dim: #666b71;
    /* 状态色不取 §2 亮列：dsh 的 ok #22c55e / warn #f59e0b 在白底只有
       2.3 / 2.2，err #ec1313 白底 4.5 但压 panel/soft 只有 4.3 / 3.9——亮底
       上一律不过 AA，沿用 W5 的深值（白/panel/soft 三底均 ≥5:1）。暗底
       反差大，才用 dsh 的饱和档。 */
    --seek-ok:    #14703c;
    --seek-warn:  #8a5a00;
    --seek-warn-bg:#fbf0d5;
    --seek-err:   #b3261e;
    --seek-link:  #2f5fc4;   /* 链接蓝压深一档（品牌 #4176e6 在白底 4.2:1） */
    --seek-rec:   #b3261e;
    --seek-rec-fg:#ffffff;
    /* 同暗色：成本走信息蓝，压 soft 5.8:1（行内码底同档）——与 ok 绿分流 */
    --seek-usd:   #1f5ba8;
    --seek-code-bg:#f9fafb;
    --seek-code-inline:#ebeef2;
    --seek-scrim: rgba(15,17,21,.28);
    --seek-shadow:0 4px 14px rgba(0,0,0,.12);
  }
  * { box-sizing: border-box; }
  /* 正文字族 = 系统无衬线（dsh 同款），14/24。等宽只出现在 pre/code/kbd 与
     显式 .mono（路径/hash/token 数字列）——整页等宽就是「终端日志」观感，
     这是 W6-1 改动量最大的一条。 */
  body { margin: 0; font-family: var(--seek-sans); font-size: 14px; line-height: 24px;
         background: var(--seek-inset); color: var(--seek-fg); display: flex; flex-direction: column;
         height: 100vh; }
  /* 双段状态栏（W2.3）：左段绑定/连接态可截断，右段 usage 计量恒完整 */
  #status { display: flex; align-items: baseline; gap: 12px; padding: 8px 14px;
            background: var(--seek-panel); border-bottom: 1px solid var(--seek-line); }
  #status-l { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden;
              text-overflow: ellipsis; }
  #status.ok #status-l { color: var(--seek-ok); }
  #status.warn #status-l { color: var(--seek-warn); }
  #usage { flex: none; white-space: nowrap; color: var(--seek-fg-dim); }
  /* ---- SSE 连接灯 + 顶栏 ContextMeter（W5 卡 c_oyp2qf）----
     #conn：状态灯——绿=已连、黄=断线重连中；#connbar：断线提示条（带
     手动重连钮），连上即收起。#ctx：上下文余量计量——模型·车道 + 色阶
     进度条 + 百分比/余量，随 usage 事件（源=turn_end）更新，色阶对齐
     internal/budget Classify（≥60% 黄、≥75% 红）。
     merge main（2026-11-20）落进本卡时色值全改走 token：ctxmeter 是
     c_ni7mzw 之后进 main 的卡，原样留 hex 会在亮色主题下变成暗底暗字
     （TestWeb_PageThemeSettings 的裸色检查也会红）。断线条底色单开
     --seek-warn-bg（警示底不是语义前景色，压在它上面的文字仍用
     --seek-warn）。 */
  /* #conn 状态灯（c_25d2ey）：旧字符圆点换真 CSS 圆点（8px 圆，字形跨平台
     大小/基线不一致的结构性问题同 emoji）+ 可见文字标签——裸色点无
     标签无 title 是旧审查的明确扣分项。文字随态切换（connSet），
     title 与 aria-label 同步。 */
  #conn { flex: none; display: inline-flex; align-items: center; gap: 5px;
          color: var(--seek-fg-dim); font-size: 12px; }
  #conn .dot { width: 8px; height: 8px; border-radius: 999px; flex: none;
               background: var(--seek-fg-dim); }
  #conn.ok .dot { background: var(--seek-ok); }
  #conn.warn .dot { background: var(--seek-warn); }
  #conn.ok #conn-t { color: var(--seek-ok); }
  #conn.warn #conn-t { color: var(--seek-warn); }
  #connbar { display: flex; align-items: center; justify-content: center;
             gap: 10px; padding: 5px 14px; background: var(--seek-warn-bg);
             color: var(--seek-warn); border-bottom: 1px solid var(--seek-line);
             font-size: 13px; }
  #connbar[hidden] { display: none; }
  #connbar button { padding: 3px 12px; font-size: 13px; background: var(--seek-soft); }
  #ctx { flex: none; display: flex; align-items: center; gap: 6px;
         white-space: nowrap; color: var(--seek-fg-dim); }
  #ctx[hidden] { display: none; }
  #ctx .bar { width: 56px; height: 5px; flex: none; background: var(--seek-line);
              border-radius: 999px; overflow: hidden; }
  #ctx .bar i { display: block; height: 100%; width: 0; background: var(--seek-ok); }
  #ctx.warn { color: var(--seek-warn); }
  #ctx.warn .bar i { background: var(--seek-warn); }
  #ctx.crit { color: var(--seek-err); }
  #ctx.crit .bar i { background: var(--seek-err); }
  #list { flex: 1; overflow-y: auto; padding: 14px; }
  .msg { max-width: 86%; margin: 4px 0; padding: 8px 12px; border-radius: 22px;
         white-space: pre-wrap; word-break: break-word; }
  /* pre 的横滚/配色四个正文容器同款。c_k3pnlw（markdown 卡）把选择器从 .msg 扩到
     .sbody——会话正文的 markdown 产物挂在 .smsg > .sbody 下，.sbody 这条即覆盖；
     c_lqtt2m 在更早基点上补的 .smsg 命中面与之重复，且特异性 (0,1,1) 会盖掉调用树
     .tpre（(0,1,0)，元素同在 .smsg 内）的 pre-wrap/max-height，故合并取窄的那条。 */
  /* 代码/等宽场景（W6-1）：只 pre/code/kbd 与显式 .mono（路径/hash/token
     数字列）走 --seek-mono，UI 文本一律无衬线。代码 12/19（§2 档位）。 */
  .msg pre, .sbody pre, #ag-last pre, #mem-content pre, .apcard pre {
             background: var(--seek-code-bg); border: 1px solid var(--seek-line); border-radius: 8px;
             padding: 8px 10px; margin: 6px 0; overflow-x: auto;
             white-space: pre; font-family: var(--seek-mono); font-size: 12px; line-height: 19px; }
  .msg code, .sbody code, #ag-last code, #mem-content code, kbd {
             background: var(--seek-code-inline); border-radius: 8px; padding: 0 4px;
             font-family: var(--seek-mono); font-size: 12px; }
  .mono { font-family: var(--seek-mono); font-variant-numeric: tabular-nums; }
  /* ---- markdown 子集排版（W5 卡 c_x2au4t；c_k3pnlw 返工补段落/引用/表格/悬挂缩进）----
     标题在气泡内取收敛尺寸（浏览器 h1 默认 2em 会撑爆聊天行高）；
     段落 <p> 出薄边距、首末段贴泡边；引用条对齐 dsh 视觉（左竖条 +
     次级文字色）；表格横滚容器 + 行底分隔线（无竖线，窄屏不裁切）；
     列表收边距、outside 钉死悬挂缩进（UA 默认即如此——显式写出防
     漂移）；链接配色与主题同谱。四个正文容器（聊天气泡/会话正文/
     子代理末读/记忆正文）共用一套。 */
  .msg p, .sbody p, #ag-last p, #mem-content p { margin: 6px 0; }
  .msg p:first-child, .sbody p:first-child, #ag-last p:first-child, #mem-content p:first-child,
  .msg p:last-child, .sbody p:last-child, #ag-last p:last-child, #mem-content p:last-child { margin: 0; }
  .msg blockquote, .sbody blockquote, #ag-last blockquote, #mem-content blockquote {
    margin: 6px 0; padding: 2px 0 2px 12px;
    border-left: 3px solid var(--seek-line-focus); color: var(--seek-fg-soft); }
  .md-tbl { max-width: 100%; overflow-x: auto; margin: 6px 0; }
  .md-tbl table { border-collapse: collapse; font-size: 13px; line-height: 20px; }
  .md-tbl th, .md-tbl td { padding: 4px 10px; text-align: left; vertical-align: top;
    border-bottom: 1px solid var(--seek-line); white-space: normal; overflow-wrap: anywhere; }
  .md-tbl th { border-bottom-color: var(--seek-line-focus); color: var(--seek-fg-soft); font-weight: 600; }
  /* 标题阶梯（W6-1，§2）：h1 21/30、h2 19/28、h3 18/26、h4+ 14/24，
     全部 700——em 相对值在 14px 基准上落不到整数档，故写死 px。 */
  .msg h1, .sbody h1, #ag-last h1, #mem-content h1 {
    font-size: 21px; line-height: 30px; font-weight: 700; margin: 10px 0 4px; }
  .msg h2, .sbody h2, #ag-last h2, #mem-content h2 {
    font-size: 19px; line-height: 28px; font-weight: 700; margin: 10px 0 4px; }
  .msg h3, .sbody h3, #ag-last h3, #mem-content h3 {
    font-size: 18px; line-height: 26px; font-weight: 700; margin: 8px 0 4px; }
  .msg h4, .sbody h4, #ag-last h4, #mem-content h4,
  .msg h5, .sbody h5, #ag-last h5, #mem-content h5,
  .msg h6, .sbody h6, #ag-last h6, #mem-content h6 {
    font-size: 14px; line-height: 24px; font-weight: 700; margin: 8px 0 4px; }
  .msg ul, .sbody ul, #ag-last ul, #mem-content ul,
  .msg ol, .sbody ol, #ag-last ol, #mem-content ol { margin: 4px 0; padding-left: 1.6em;
    list-style-position: outside; }
  .msg a, .sbody a, #ag-last a, #mem-content a { color: var(--seek-link); }
  .you { margin-left: auto; background: var(--seek-accent); }
  .seek { background: var(--seek-soft); }
  .hint { color: var(--seek-fg-dim); font-style: italic; }

  /* ---- 流式气泡 + 工具行折叠（W2.1）---- */
  .msg.streaming > .txt:last-child::after {
    content: '▍'; color: var(--seek-fg-dim); animation: caret 1s steps(1) infinite;
  }
  @keyframes caret { 50% { opacity: 0; } }
  .trow { display: flex; align-items: center; gap: 4px; min-width: 0;
          color: var(--seek-fg-soft); font-size: 13px; line-height: 20px; padding: 1px 0; }
  .trow .tt { min-width: 0; word-break: break-word; }
  .trow.bad { color: var(--seek-warn); }
  .trow.bad .ic { color: var(--seek-err); }
  /* ---- 会话浏览器调用树（c_ux7lvk，dsh 对齐）----
     行=名称+参数摘要+结果规模；点行展开 .tdetail 看参数/结果摘要（超长
     截断进限高滚动 pre，「复制全文」从 JS 闭包取整串——DOM 只装摘要）。 */
  .ttree { display: flex; flex-direction: column; gap: 4px; margin: 6px 0 2px; }
  .tnode { display: flex; align-items: baseline; gap: 8px; width: 100%;
           text-align: left; background: var(--seek-panel); border: 1px solid var(--seek-line);
           border-radius: 8px; padding: 4px 10px; font: inherit;
           font-size: 13px; color: var(--seek-fg-soft); cursor: pointer; }
  .tnode:hover { border-color: var(--seek-line-focus); }
  .tnode .nm { flex: none; display: inline-flex; align-items: center; gap: 3px;
               color: var(--seek-warn); }
  .tnode .sm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
               white-space: nowrap; }
  .tnode .rs { flex: none; color: var(--seek-fg-dim); white-space: nowrap; }
  .tdetail { background: var(--seek-inset); border: 1px solid var(--seek-line); border-radius: 8px;
             padding: 8px 10px; }
  .tlabel { display: flex; align-items: baseline; gap: 8px; font-size: 12px;
            color: var(--seek-fg-dim); margin: 2px 0; }
  .tlabel .tcopy { margin-left: auto; padding: 1px 10px; font-size: 12px; }
  .tpre { background: var(--seek-code-bg); border-radius: 8px; padding: 6px 8px;
          margin: 2px 0 8px; overflow: auto; white-space: pre-wrap;
          word-break: break-all; max-height: 220px;
          font-family: var(--seek-mono); font-size: 12px; line-height: 19px;
          color: var(--seek-fg-soft); }
  /* 中断收口标注（c_5m3fm6）：保留的半截气泡尾部一行灰字，流状态可见地终止 */
  .msg .cut { color: var(--seek-fg-soft); font-size: 12px; padding-top: 2px; }
  /* 输入区底对齐（c_7lsngm）：按钮跟到多行输入的底边；position:relative
     是候选弹层的定位父级——贴表单上沿、宽度跟表单（窄屏自然满宽）。 */
  form { position: relative; display: flex; gap: 8px; align-items: flex-end;
         padding: 10px 14px; background: var(--seek-panel);
         border-top: 1px solid var(--seek-line); }
  /* 多行输入（c_7lsngm）：Enter 发送 / Shift+Enter 换行——textarea 才有
     换行；高度按内容长（grow() 写 style.height），上限 CSS 兜底滚动 */
  #input { flex: 1; background: var(--seek-inset); color: inherit; border: 1px solid var(--seek-line);
           border-radius: 12px; padding: 8px 10px; font: inherit; outline: none;
           resize: none; line-height: 24px; min-height: 40px; max-height: 40vh;
           overflow-y: auto; }
  #input:focus { border-color: var(--seek-line-focus); }
  /* ---- 输入增强弹层（c_7lsngm）：'/' 指令补全 + '@' 会话引用 ----
     绝对定位贴在表单上沿（form 是定位父级），文档流不位移。 */
  #menu { position: absolute; left: 14px; right: 14px; bottom: 100%;
          margin-bottom: 2px; max-height: 46vh; overflow-y: auto;
          background: var(--seek-panel); border: 1px solid var(--seek-line); border-radius: 12px;
          box-shadow: 0 -6px 18px rgba(0,0,0,.35); }
  #menu[hidden] { display: none; }
  #menu .mi { display: flex; gap: 10px; align-items: baseline;
              padding: 6px 12px; cursor: pointer;
              border-bottom: 1px solid var(--seek-line); }
  #menu .mi:last-child { border-bottom: 0; }
  #menu .mi .ic { width: 15px; height: 15px; align-self: center; flex: none; }
  #menu .mi.hl { background: var(--seek-sel); }
  /* 高亮行的次级文字升主文色（c_lbys7d）：选中层压 fg-dim 的余量本来就薄，
     升到主文色后同 .sess-row.cur 的口径；dsh 的菜单高亮行同款做法。 */
  #menu .mi.hl .nm, #menu .mi.hl .ds, #menu .mi.hl .sid { color: var(--seek-fg); }
  #menu .mi .nm { color: var(--seek-fg-soft); white-space: nowrap; }
  #menu .mi .ds { color: var(--seek-fg-dim); font-size: 12px; overflow: hidden;
                  text-overflow: ellipsis; white-space: nowrap; }
  #menu .mi .sid { color: var(--seek-fg-dim); font-size: 12px; margin-left: auto; }
  /* ---- /bind 目录浏览器层头（c_heffj3）：路径 + ↑ 上一级 + 选这个目录 + 过滤框；
     行复用上面的 .mi 样式（渲染进 .dirrows 容器）。---- */
  #menu .dirhead { padding: 8px 12px 6px; border-bottom: 1px solid var(--seek-line);
                   display: flex; flex-direction: column; gap: 6px; }
  #menu .dirtop { display: flex; gap: 8px; align-items: center; }
  #menu .dirtop .dirpath { flex: 1; min-width: 0; overflow: hidden;
                           text-overflow: ellipsis; white-space: nowrap;
                           color: var(--seek-fg-dim); font-size: 12px; }
  #menu .dirtop button { flex: none; padding: 3px 10px; font-size: 12px; }
  #menu .dirfilter { width: 100%; box-sizing: border-box; padding: 4px 8px;
                     border: 1px solid var(--seek-line); border-radius: 8px;
                     background: var(--seek-inset); color: var(--seek-fg); font-size: 12px; }
  #menu .dirfilter:focus { border-color: var(--seek-line-focus); outline: none; }
  /* 弹层头行（c_lnsdvu 项目点选候源专用）：固定告知文案，不是可点行 */
  #menu .mh { padding: 6px 12px; color: var(--seek-fg-dim); font-size: 13px;
              line-height: 20px; border-bottom: 1px solid var(--seek-line); }
  /* 窄屏降级（验收 ③）：弹层满宽、条目换行、输入 16px 防 iOS 聚焦缩放 */
  @media (max-width: 640px) {
    #menu { left: 0; right: 0; bottom: 100%; border-radius: 8px 8px 0 0; }
    #menu .mi { flex-wrap: wrap; }
    #menu .mi .sid { margin-left: 0; }
    #input { font-size: 16px; }
    form { padding: 8px; }
  }
  /* 按钮三档（c_25d2ey；与 body 顶 sprite 注释同一口径）：
     缺省 = 次操作——全页多数钮是次操作，软底（--seek-soft）即基线，
     不再逐钮覆写底色；主操作显式挂 .btn-primary（每屏唯一 CTA）；
     纯图标钮挂 .btn-icon（26×26 方框，收窄 .sm 用于行内操作）。
     状态高亮只用 .on / .held / .rec / .stop，不另造按钮样式。
     inline-flex 让图标与文字统一基线对齐（纯文字按钮不受影响）。 */
  button { background: var(--seek-soft); color: inherit; border: 0; border-radius: 12px;
           padding: 8px 16px; font: inherit; cursor: pointer;
           display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  button:disabled { opacity: .4; cursor: default; }
  button:focus-visible { outline: 2px solid var(--seek-line-focus); outline-offset: 1px; }
  /* 主按钮=单色（W6-1，dsh brand-primary）：亮=近黑底白字、暗=近白底黑字。
     彩色只留状态语义（链接/选中/发送/徽标），主 CTA 不占品牌色的语义位。 */
  .btn-primary { background: var(--seek-primary); color: var(--seek-primary-fg); }
  .btn-icon { width: 26px; height: 26px; padding: 0; flex: none;
              background: var(--seek-soft); }
  .btn-icon .ic { width: 16px; height: 16px; }
  .btn-icon.sm { width: 22px; height: 22px; }
  .btn-icon.sm .ic { width: 13px; height: 13px; }
  /* 图标通用（c_25d2ey）：.ic = <use> 引 sprite 的 svg，尺寸两档——
     按钮内 14px（配 13px 字号），图标钮内 16px（配 26px 方框）。
     线宽/端点/填充写在 .ic 上（CSS 继承进 <use> 影子树）：vendored
     path 只有 d，不带表现属性；漏了这四条会退化成黑色实心块。
     色随所在元素 currentColor 走。 */
  .sprite { display: none; }
  .ic { width: 14px; height: 14px; flex: none; vertical-align: middle;
        fill: none; stroke: currentColor; stroke-width: 2;
        stroke-linecap: round; stroke-linejoin: round; }
  /* 流式工具行里的 12px 小图标（loader/check/x 前缀）随行字号缩一档 */
  .trow .ic, .stool .ic, .tnode .ic { width: 12px; height: 12px; }
  /* 输入区图标钮（附件/麦克风，c_25d2ey）：36×36 与输入框 min-height
     对齐，同 soft 底/6px 圆角/16px 图标——不再一个深底一个浅底的
     「圆角方块」。按住说话（voice V2）：user-select 关掉防长按选中
     周围文字（touch 长按尤其会）。 */
  #attach-btn, #mic { width: 36px; height: 36px; padding: 0; background: var(--seek-soft); }
  #attach-btn .ic, #mic .ic { width: 16px; height: 16px; }
  #mic { user-select: none; -webkit-user-select: none; touch-action: none; }
  /* 录音态文字换 --seek-rec-fg 而非继承 fg：亮色继承 fg 压在 --seek-rec
     上只有 ~2.6:1（两主题对比度抽查红）；接上专用前景后两主题 ≥4.5:1
     （ap-badge 同款接线，两处共用同一对 token）。 */
  #mic.rec { background: var(--seek-rec); color: var(--seek-rec-fg); }
  /* 发送钮（W6-1）：品牌蓝实底——全页唯一被允许用品牌色的按钮（dsh 同款
     口径：蓝只出现在「业务态」）。#id 选择器压过 .btn-primary，无需 !important。 */
  #send { background: var(--seek-cta); color: var(--seek-cta-fg); }
  /* 停止键态（c_5m3fm6）：生成中 #send 变停止键——与录音态共用同一对
     --seek-rec token（同色系 + 两主题都过对比度，见上条注释） */
  #send.stop { background: var(--seek-rec); color: var(--seek-rec-fg); }

  /* ---- 审批卡片（W5 卡 c_n37tnr，§3.4 远程审批）---- */
  /* 右下角悬浮卡栈：任何视图（聊天/四面板）都能弹卡——卡的是权限决定，
     不属于某个面板。空态零侵入：容器 :empty 即 display:none，顶栏角标
     hidden 属性默认在，无未决时页面零痕迹。 */
  #approvals { position: fixed; right: 14px; bottom: 76px; z-index: 10;
               width: min(420px, calc(100vw - 28px));
               display: flex; flex-direction: column; gap: 8px;
               max-height: 60vh; overflow-y: auto; }
  #approvals:empty { display: none; }
  .apcard { background: var(--seek-panel); border: 1px solid var(--seek-line); border-radius: 12px;
            padding: 10px 12px; box-shadow: 0 4px 14px var(--seek-shadow); }
  .apcard .apt { display: flex; align-items: center; gap: 5px;
                 color: var(--seek-warn); font-size: 12px; margin-bottom: 4px; }
  .apcard .apt .ic { width: 13px; height: 13px; }
  .apcard .aps { margin: 0 0 4px; white-space: pre-wrap; word-break: break-word; }
  .apcard pre { padding: 6px 8px; margin: 4px 0; overflow: auto;
                white-space: pre-wrap; word-break: break-all;
                max-height: 120px; }
  .apcard .apb { display: flex; gap: 8px; margin-top: 8px; }
  .apcard .apb button { flex: 1; padding: 5px 8px; font-size: 13px; }
  #ap-badge { flex: none; align-self: center; background: var(--seek-rec); color: var(--seek-rec-fg);
              border-radius: 999px; padding: 2px 10px; font-size: 12px;
              white-space: nowrap; }
  #ap-badge[hidden] { display: none; }
  /* ---- 附件（W5 c_56yrcj）：托盘 + 气泡缩略图 ----
     merge main（2026-11-20）落进本卡时色值改走 token（原样留 hex 会让亮色
     主题下托盘/缩略图底仍是暗色，裸色检查也会红）。附件/麦克风两个
     图标钮的尺寸与底色统一在按钮三档块（c_25d2ey）。 */
  #tray { display: none; gap: 8px; flex-wrap: wrap; padding: 8px 14px;
          background: var(--seek-panel); border-top: 1px solid var(--seek-line); }
  #tray.has { display: flex; }
  body.browsing #tray { display: none; }
  .chip { display: flex; align-items: center; gap: 6px; max-width: 260px;
          background: var(--seek-soft); border: 1px solid var(--seek-line); border-radius: 8px;
          padding: 4px 6px; position: relative; overflow: hidden; }
  .chip .tn { width: 28px; height: 28px; object-fit: cover; border-radius: 8px;
              flex: none; background: var(--seek-inset); }
  .chip .nm { font-size: 12px; overflow: hidden; text-overflow: ellipsis;
              white-space: nowrap; }
  .chip .ic { width: 14px; height: 14px; color: var(--seek-fg-dim); }
  .chip .pc { font-size: 12px; color: var(--seek-fg-dim); flex: none; }
  .chip .rm { padding: 0 2px; background: transparent; color: var(--seek-fg-dim);
              font-size: 14px; line-height: 1; }
  .chip .rm .ic { width: 12px; height: 12px; }
  .chip .pb { position: absolute; left: 0; bottom: 0; height: 2px; width: 100%;
              background: var(--seek-inset); }
  .chip .pb i { display: block; height: 100%; width: 0; background: var(--seek-link);
                transition: width .15s linear; }
  .chip.bad { border-color: var(--seek-err); }
  .chip.bad .pc { color: var(--seek-err); }
  .msg .thumbs { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0 2px; }
  .msg .thumbs img { max-width: 220px; max-height: 180px; border-radius: 8px;
                     border: 1px solid var(--seek-line); }
  .msg .thumbs .doc { display: inline-flex; align-items: center; gap: 4px;
                      font-size: 12px; color: var(--seek-fg); background: var(--seek-panel);
                      border: 1px solid var(--seek-line); border-radius: 8px; padding: 4px 8px; }
  .msg .thumbs .doc .ic { width: 14px; height: 14px; }
  body.dropping form { outline: 2px dashed var(--seek-line-focus); outline-offset: -4px; }

  /* ---- 指令快捷按钮（W2.2）+ 会话侧栏（W5 卡 c_txz6vz——W4.4 的会话弹出面板在此退役）---- */
  #bar { display: flex; gap: 8px; padding: 6px 14px; background: var(--seek-panel);
         border-bottom: 1px solid var(--seek-line); overflow-x: auto; }
  #bar button { padding: 4px 12px; font-size: 13px; white-space: nowrap; }
  #bar .cmd { background: var(--seek-soft); }          /* 指令钮与视图钮同档（c_25d2ey），class 只留浏览面隐藏闸 */
  #mem-btn { margin-left: auto; }             /* 视图按钮组（记忆/统计/后台）靠右 */
  body.browsing #bar .cmd { display: none; }  /* 浏览面不显示聊天指令 */

  /* 布局骨架：左栏常驻 + 中栏内容。收起态 = 44px 图标轨（dsh 折叠轨同
     语言：logo/新建/搜索入轨，展开态的文字让位）。宽度过渡 150ms，与
     prefers-reduced-motion 兜底同 W5 既有口径（无动画依赖，纯装饰）。 */
  #shell { flex: 1; display: flex; min-height: 0; }
  #side { width: 260px; flex: none; display: flex; flex-direction: column;
          min-height: 0; background: var(--seek-panel); border-right: 1px solid var(--seek-line);
          transition: width .15s; }
  body.side-collapsed #side { width: 44px; }
  /* 侧栏头部（c_25d2ey 间距节奏修正）：新建/归档/折叠三钮同高 26px、
     同 gap 6px；按钮的 margin 一律 0，垂直节奏由容器 padding 统一。
     展开态「新建」是图标+文字胶囊，归档/折叠是 26×26 图标钮；
     收起态三钮同宽 26px 竖排（见下方 side-collapsed 块）。 */
  #side-head { display: flex; align-items: center; gap: 6px; padding: 8px 10px;
               border-bottom: 1px solid var(--seek-line); }
  #side-title { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap;
                color: var(--seek-fg-soft); font-size: 13px; font-weight: 500;
                letter-spacing: .02em; }
  #side-head button { height: 26px; padding: 0 8px; font-size: 13px; flex: none; }
  #side-head .btn-icon { width: 26px; padding: 0; }
  #side-head .ic { width: 16px; height: 16px; }
  #side-arch.on { background: var(--seek-sel); }  /* 归档可见位：高亮记开关态 */
  #side-ws-new { margin: 0; display: flex; gap: 6px; align-items: center;
              justify-content: center; }
  #side-search { margin: 0 10px 8px; background: var(--seek-inset); color: inherit;
                 border: 1px solid var(--seek-line); border-radius: 8px; padding: 5px 8px;
                 font: inherit; font-size: 13px; outline: none; }
  #side-search:focus { border-color: var(--seek-line-focus); }
  #sess-list { flex: 1; overflow-y: auto; min-height: 0; }
  #side-foot { border-top: 1px solid var(--seek-line); }
  #side-foot button { width: 100%; border-radius: 0; font-size: 13px; padding: 6px; }
  /* 收起态：标题/搜索/列表/翻页让位，新建与折叠钮收成图标轨 */
  body.side-collapsed #side-title, body.side-collapsed #side-search,
  body.side-collapsed #sess-list, body.side-collapsed #side-foot,
  body.side-collapsed #side-ws-new .lbl { display: none; }
  /* 图标轨竖排（c_lqtt2m 返工轮）：44px 宽 − 两侧 6px padding = 32px 内宽。
     横排时两个 26px 宽的归档/折叠钮加 8px gap 就已 60px+，必然溢出轨右缘、压到
     中栏——会话详情页与设置页下 ⟩ 被相邻列的「聊天」/标题行盖住，只露出
     一角（rect 断言看不见，元素级 hit-test 才红）。竖排后 新建/归档/折叠 三个图标
     钮各自 26px 全部落在轨内、互不重叠。 */
  body.side-collapsed #side-head { flex-direction: column; gap: 6px;
                                   padding: 8px 6px; justify-content: flex-start; }
  body.side-collapsed #side-ws-new { margin: 0; width: 26px; height: 26px; padding: 0; }
  /* 抽屉遮罩（c_lqtt2m）：默认不出场；≤480px 展开态翻成 block（断点块），
     点击关抽屉。z 在 #side（30）之下、盖住中栏。 */
  #side-scrim { display: none; position: absolute; inset: 0; z-index: 20;
                background: var(--seek-scrim); }

  #center { flex: 1; display: flex; flex-direction: column;
            min-width: 0; min-height: 0; }
  /* 会话正文（主区）：点侧栏一条即亮，聊天面/输入框让位；聊天钮收回。
     三个资产面板（记忆/统计/后台）同一个「中栏一个面」口径：browsing 时
     聊天面也让位。 */
  #browser { flex: 1; display: none; flex-direction: column; min-height: 0; }
  body.sess-detail #browser { display: flex; }
  body.sess-detail #list, body.sess-detail form,
  body.browsing #list, body.browsing form { display: none; }
  #browser-body { flex: 1; display: flex; min-height: 0; }
  /* 行元素是 div（role=button）：行内还要装改名/归档操作钮与改名输入框，
     button 套 button/input 是非法嵌套，div 承载才装得下（W5 c_rqcuaa）。
     底色仍显式透明落回 panel（别吃全局 button 的软底）；
     .cur 的选中底在各自规则里。 */
  .sess-row { display: block; width: 100%; text-align: left; border-radius: 0;
              border-bottom: 1px solid var(--seek-line-2); padding: 8px 12px;
              background: transparent; cursor: pointer; position: relative; }
  .sess-row .t1 { display: block; overflow: hidden; text-overflow: ellipsis;
                  white-space: nowrap; }
  /* t2 行是两段（左=时间/轮次/模型，右=per-session cost 列，c_6xktw4）：
     flex 让 cost 右贴不换行，左段自己省略。cost 走 --seek-usd（c_jf3grt：
     成本不是健康度，别和绿撞语义）；数字用 tabular-nums 保列宽，但字族
     跟着 body 的无衬线走（W6-1：会话列表元信息是 UI 文本，不是代码）。 */
  .sess-row .t2 { display: flex; gap: 8px; justify-content: space-between;
                  color: var(--seek-fg-dim); font-size: 13px; line-height: 20px; margin-top: 2px; }
  .sess-row .t2l { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sess-row .t2c { flex: none; color: var(--seek-usd);
                   font-variant-numeric: tabular-nums; }
  /* 悬停行（W6-1，dsh interactive-bg-hover）：列表行悬停提一档底色。
     排在 .cur 之前：选中行自己的 --seek-sel 更亮，悬停不该把它盖掉；
     .arch:not(.cur) 在更后面，归档行悬停也不翻回 normal 底。 */
  .sess-row:hover:not(.cur) { background: var(--seek-hover); }
  .sess-row.cur { background: var(--seek-sel); }
  /* 选中行仍升主文色：选中层是 alpha 叠层（不是实色），升到 fg 后两主题都
     留足余量（暗 13.3、亮 15.9）；dsh 的选中行同款做法。 */
  .sess-row.cur .t2 { color: var(--seek-fg); }
  .sess-row.cur .t2c { color: var(--seek-fg); }
  /* 归档行（c_lbys7d）：不再用整行 opacity——.55 叠在 panel 上合成后 t2
     只剩 2.61（暗）/2.29（亮）、t1 也掉到 4.51/3.68，整行读不动。改底色
     降一档（inset 是「页面底」那一档，暗更暗、亮更白，两个方向都表示
     「非活动面」），文字保持 fg/fg-dim：t1 12.9/16.7、t2 6.0/6.1。归档态
     另由 t2 的「已归档 ·」前缀与行内归档钮表达，不靠整体透明度。
     :not(.cur) 是让「归档 + 选中」仍吃选中底（.cur 与 .arch 同特异
     性，本规则在其后，不排除会盖掉选中底）。 */
  .sess-row.arch:not(.cur) { background: var(--seek-inset); }
  .sess-row:focus-visible { outline: 1px solid var(--seek-line-focus); }
  /* 悬停/聚焦才亮的行内操作组。行有了悬停层之后它不能再靠底色盖字：补丁色
     跟不了悬停层/选中层/归档底，会在提过一档的行上显出一块异色（亮偏浅、
     暗偏深）。改成行自己让位——padding 落在行上而不是 .t1/.t2 上，行内布局
     怎么改都成立。68 = 原右内边距 12 + 操作组占位 56（right 6 + 两钮 46 +
     组内边距 4）。 */
  .sess-acts { position: absolute; right: 6px; top: 50%;
               transform: translateY(-50%); display: none; gap: 2px;
               padding: 2px; border-radius: 8px; }
  .sess-row:hover, .sess-row:focus-within { padding-right: 68px; }
  .sess-row.editing { padding-right: 12px; }   /* 改名态操作组已隐藏，输入框不让位 */
  .sess-row:hover .sess-acts, .sess-row:focus-within .sess-acts { display: flex; }
  .sess-acts button { padding: 0; font-size: 12px; }
  .sess-acts .ic { width: 13px; height: 13px; }
  /* 行内改名：编辑态下标题/操作让位给输入框（Enter 提交 / Esc 取消） */
  .sess-edit { display: none; width: calc(100% - 16px); background: var(--seek-inset);
               color: inherit; border: 1px solid var(--seek-line-focus); border-radius: 8px;
               padding: 4px 8px; font: inherit; font-size: 13px; outline: none; }
  .sess-row.editing .sess-edit { display: block; }
  .sess-row.editing .t1, .sess-row.editing .t2,
  .sess-row.editing .sess-acts { display: none; }
  /* ---- 工作区树（两级：组头 + 组内会话行）----
     组头一行承载「选这个工作区」（点字面 = 把本会话绑过去），折叠是独立的
     箭头钮（点箭头 = 收/展，两件事不混）。组内行沿用 .sess-row，只缩进一档。
     组头底取 --seek-inset（「非活动面」那一档），与会话行分两层视觉。 */
  .ws-group { display: block; }
  .ws-head { display: flex; align-items: center; gap: 4px; padding: 6px 6px 6px 2px;
             background: var(--seek-inset); cursor: pointer;
             border-bottom: 1px solid var(--seek-line-2); }
  .ws-head.cur { box-shadow: inset 2px 0 0 var(--seek-brand); }  /* 选中标记=品牌蓝（dsh nav-active） */
  .ws-head .ws-caret { display: inline-flex; flex: none; padding: 2px; background: transparent; border-radius: 8px; }
  .ws-head .ic { width: 14px; height: 14px; flex: none; color: var(--seek-fg-dim); }
  .ws-head .ws-caret .ic { width: 13px; height: 13px; }
  .ws-head .ws-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
                      white-space: nowrap; color: var(--seek-fg-soft); font-size: 13px;
                      letter-spacing: .02em; }
  .ws-head .ws-cnt { flex: none; color: var(--seek-fg-dim); font-size: 12px;
                     font-variant-numeric: tabular-nums; }
  .ws-head .ws-acts { flex: none; display: none; gap: 2px; }
  .ws-head:hover .ws-acts, .ws-head:focus-within .ws-acts { display: flex; }
  .ws-head .ws-acts .btn-icon.sm { width: 20px; height: 20px; }
  .ws-head .ws-acts .ic { width: 12px; height: 12px; }
  .ws-group .sess-row { padding-left: 24px; }
  #sess-detail { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #browser-head { display: flex; gap: 10px; align-items: center; padding: 6px 10px;
                  border-bottom: 1px solid var(--seek-line); }
  #sess-back, #sess-continue { flex: none; padding: 4px 12px; font-size: 13px;
                               background: var(--seek-soft); }
  #sess-meta { flex: 1; min-width: 0; color: var(--seek-fg-dim); white-space: nowrap;
               overflow: hidden; text-overflow: ellipsis; }
  #sess-msgs { flex: 1; overflow-y: auto; padding: 14px; }
  .smsg { margin: 6px 0; padding: 8px 12px; border-radius: 22px;
          background: var(--seek-soft); white-space: pre-wrap; word-break: break-word; }
  .smsg.user { background: var(--seek-accent); }
  .smsg.user .swho { color: var(--seek-fg); }   /* 同 .cur：accent 底不压 dim */
  .smsg.tool { background: var(--seek-panel); color: var(--seek-fg-soft); }
  .smsg.tool pre { background: var(--seek-inset); }
  .swho { font-size: 12px; color: var(--seek-fg-dim); margin-bottom: 4px; }
  .stool { display: flex; align-items: center; gap: 4px; min-width: 0;
           word-break: break-word; color: var(--seek-warn); }
  /* 工具结果限高：单条大输出不把整页 paint 撑爆（分页外的第二道界） */
  .smsg.tool .sbody { max-height: 260px; overflow-y: auto; }
  #sess-foot { padding: 8px 14px; text-align: center; border-top: 1px solid var(--seek-line);
               color: var(--seek-fg-dim); }
  #sess-foot button { width: 100%; }
  .pane-hint { color: var(--seek-fg-dim); font-style: italic; padding: 14px; }

  /* ---- 任务面板（W3.3 编排 P1 可视化）---- */
  /* 与三个资产面板同一开合闸（browsing=隐聊天 + 恰好一个 *-view 亮面板），
     故这里只负责「本面板亮」；隐聊天/互斥由 body.browsing 与各 body:not(.x-view)
     选择器承担（W4.5 拆分后的口径）。 */
  #agents { flex: 1; display: none; flex-direction: column; min-height: 0; }
  body.agents-view #agents { display: flex; }
  #agents-body { flex: 1; display: flex; min-height: 0; }
  #ag-list { width: 380px; flex: none; overflow-y: auto;
             border-right: 1px solid var(--seek-line); }
  .ag-row { display: block; width: 100%; text-align: left; border-radius: 0;
            border-bottom: 1px solid var(--seek-line-2); padding: 8px 12px;
            background: transparent; }
  .ag-row.cur { background: var(--seek-sel); }
  .ag-row .t1 { display: flex; gap: 6px; align-items: baseline; }
  .ag-row .desc { flex: 1; overflow: hidden; text-overflow: ellipsis;
                  white-space: nowrap; }
  .ag-row .t2 { display: block; color: var(--seek-fg-dim); font-size: 12px; margin-top: 2px; }
  /* 选中行的 t2 升主文色（c_lbys7d）：同 .sess-row.cur——选中层压 dim 的余量
     薄，升到主文色后两主题都留足。 */
  .ag-row.cur .t2 { color: var(--seek-fg); }
  .ag-badge { display: inline-flex; align-items: center; gap: 2px;
              font-size: 12px; flex: none; white-space: nowrap; }
  .ag-badge .ic { width: 10px; height: 10px; }
  /* 三态徽标（卡 c_4doebx）：running/done/error 走类名而不是内联色——
     颜色一处定义，无头验收读 class/dataset.status 即断言面。值走 token
     （merge main 2026-11-20）：暗色谱 hex 在亮色主题下只有 ~2:1。 */
  .ag-badge.st-running { color: var(--seek-warn); }
  .ag-badge.st-done    { color: var(--seek-ok); }
  .ag-badge.st-error   { color: var(--seek-err); }
  #ag-detail { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #ag-meta { padding: 6px 14px; border-bottom: 1px solid var(--seek-line);
             color: var(--seek-fg-dim); white-space: nowrap; overflow: hidden;
             text-overflow: ellipsis; }
  /* 详情字段表（卡 c_4doebx）：与 /subagents?sub= 同信息量的可读面。 */
  #ag-fields { padding: 6px 14px; border-bottom: 1px solid var(--seek-line); }
  #ag-fields:empty { display: none; }
  .ag-field { display: flex; gap: 10px; font-size: 12px; padding: 1px 0; }
  .ag-field .k { color: var(--seek-fg-dim); flex: none; min-width: 96px; }
  .ag-field .v { color: var(--seek-fg); overflow: hidden; text-overflow: ellipsis;
                 white-space: nowrap; }
  #ag-last { flex: 1; overflow-y: auto; padding: 14px; }

  /* ---- 记忆浏览器 + 统计视图（W4.5 资产面 UI·二）---- */
  .pane { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  body:not(.mem-view) #memory { display: none; }
  body:not(.stat-view) #stats { display: none; }
  .pane-head { display: flex; gap: 8px; align-items: center; padding: 6px 14px;
               border-bottom: 1px solid var(--seek-line); }
  .pane-head select { background: var(--seek-inset); color: inherit; border: 1px solid var(--seek-line);
                      border-radius: 8px; padding: 4px 8px; font: inherit;
                      max-width: 60%; }
  .pane-head .cnt { color: var(--seek-fg-dim); font-size: 12px; }
  #mem-body { flex: 1; display: flex; min-height: 0; }
  #mem-list { width: 320px; flex: none; overflow-y: auto;
              border-right: 1px solid var(--seek-line); }
  .mem-row { display: block; width: 100%; text-align: left; border-radius: 0;
             border-bottom: 1px solid var(--seek-line-2); padding: 8px 12px;
             background: transparent; }
  .mem-row.cur { background: var(--seek-sel); }
  .mem-row .t1 { display: flex; align-items: center; gap: 4px; min-width: 0;
                 overflow: hidden; }
  .mem-row .t1 .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mem-row .t1 .ic { width: 12px; height: 12px; color: var(--seek-fg-dim); flex: none; }
  .mem-row .t2 { display: flex; align-items: center; gap: 3px; color: var(--seek-fg-dim);
                 font-size: 12px; margin-top: 2px; min-width: 0; }
  .mem-row .t2 .tx { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mem-row .t2 .ic { width: 12px; height: 12px; color: var(--seek-warn); flex: none; }
  /* 选中行 t2 升主文色（c_lbys7d）：选中层压 dim 的余量薄，升到主文色同
     .sess-row.cur。.t2 .ic 的 warn 是图标位（1.4.11 的 3:1 门槛），
     它直接声明在 svg 上，不受父级这条 color 影响，语义色保留。 */
  .mem-row.cur .t2 { color: var(--seek-fg); }
  #mem-detail { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  /* 未选条目时元信息行与标签行是空的：不兜底会留下两条只有 padding 与下边框
     的空带（2026-11-27 复核实录）。 */
  #mem-meta:empty, #mem-tags:empty { display: none; }
  #mem-meta { padding: 6px 14px; border-bottom: 1px solid var(--seek-line); color: var(--seek-fg-dim); }
  #mem-tags { padding: 4px 14px; border-bottom: 1px solid var(--seek-line); }
  #mem-tags .chip { display: inline-block; background: var(--seek-panel); border: 1px solid var(--seek-line);
                    border-radius: 999px; padding: 0 8px; margin: 2px 4px 2px 0;
                    font-size: 12px; color: var(--seek-fg-soft); }
  #mem-content { flex: 1; overflow-y: auto; padding: 14px;
                 white-space: pre-wrap; word-break: break-word; }
  /* 统计面板节奏（c_jf3grt）：卡片间距/内边距原本靠每张卡 12px margin 堆，
     末卡还多一截尾巴、三张快照卡竖排到 1/3 屏以下。改成「容器管间隙、
     卡不管外边距」的单一节奏（column gap 12 + 面板 padding 14，与设置面板
     同刻），三张快照卡用 auto-fit 网格——宽屏一行排开、390px 自然落回
     单列（minmax 下限 220px）。 */
  #stat-body { flex: 1; overflow-y: auto; padding: 14px;
               display: flex; flex-direction: column; gap: 12px; }
  .stat-card { background: var(--seek-soft); border-radius: 8px; padding: 12px 14px; }
  #stat-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
                gap: 12px; align-items: start; }
  #stat-cards > .pane-hint { grid-column: 1 / -1; padding: 0 2px; }
  .stat-card h3 { margin: 0 0 8px; font-size: 14px; color: var(--seek-fg-soft); font-weight: 600; }
  .stat-row { display: flex; justify-content: space-between; gap: 12px;
              padding: 3px 0; }
  .stat-row .v { color: var(--seek-fg); font-variant-numeric: tabular-nums; }
  /* 成本数字走 --seek-usd（c_jf3grt）：命中率条/趋势的绿是「健康度」，
     钱不是健康度——同色会让「花了 $3」读成「缓存命得好」。 */
  .stat-row .v.usd { color: var(--seek-usd); }
  .stat-bar { height: 10px; border-radius: 999px; background: var(--seek-line); overflow: hidden;
              margin-top: 8px; }
  .stat-bar .hit { height: 100%; background: var(--seek-ok); }
  /* ---- 主区空态（c_jf3grt）----
     未绑定/新会话时主区原本整片空白：给一块居中的引导（标题 + 一行操作
     说明 + 未绑定时一个点选按钮）。只在 #list 真的空着时出场——消息落地
     即摘除（JS dropChatEmpty），不占消息列表的任何选择器口径。 */
  .chat-empty { display: flex; flex-direction: column; align-items: center;
                justify-content: center; gap: 10px; min-height: 100%;
                padding: 24px 16px; text-align: center; }
  .chat-empty .ce-t { color: var(--seek-fg-soft); font-size: 21px; line-height: 30px; font-weight: 600; }
  .chat-empty .ce-x { color: var(--seek-fg-dim); font-size: 13px; line-height: 20px;
                      max-width: 46ch; }
  .chat-empty .ce-x code { background: var(--seek-panel); border: 1px solid var(--seek-line);
                           border-radius: 8px; padding: 0 4px; color: var(--seek-fg-soft); }
  .chat-empty .ce-acts { margin-top: 2px; }
  .chat-empty .ce-acts button { font-size: 13px; padding: 6px 14px; }

  /* ---- 跨会话趋势图（W5 卡 c_6xktw4）----
     三条曲线共用一条 x 轴，但各自归一到自己那一行；颜色全部走
     --seek-* token（两主题同一组语义名换值，裸 hex 会破亮色主题）：
     $ = --seek-usd（与 .usd 同源，c_jf3grt 起资金不再是绿），
     tokens = fg 中性，缓存 = warn 琥珀。 */
  #trend-tools { display: flex; gap: 12px; flex-wrap: wrap; }
  .tseg { display: inline-flex; gap: 4px; }
  /* 窗口钮长在软底统计卡内：同 #set-theme，取 panel 一档留边界。 */
  .tbtn { color: var(--seek-fg-soft); background: var(--seek-panel);
          border-radius: 12px; padding: 2px 8px; font: inherit; font-size: 12px; }
  .tbtn.on { color: var(--seek-fg); background: var(--seek-sel); }
  #trend-plot { position: relative; min-height: 96px; margin-top: 8px; }
  #trend-plot svg { display: block; width: 100%; height: 96px; }
  .axis { stroke: var(--seek-line); stroke-width: 1; }
  .tline { fill: none; stroke: var(--seek-usd); stroke-width: 1.6; }
  .tline.tokens { stroke: var(--seek-fg); }
  .tline.cache { stroke: var(--seek-warn); }
  .tdot { fill: var(--seek-usd); }
  .tdot.tokens { fill: var(--seek-fg); }
  .tdot.cache { fill: var(--seek-warn); }
  .tguide { stroke: var(--seek-fg-dim); stroke-width: 1; stroke-dasharray: 2 2; }
  /* 轴标签（c_lbys7d）：9px 是全文件最小字号，任何 DPR 下都读不动；
     11px 与 .tlabel（工具详情的字段标签）同档，是次级文字的最小可读档。 */
  .tlab { fill: var(--seek-fg-dim); font-size: 12px; }
  #trend-tip { position: absolute; z-index: 2; background: var(--seek-inset);
               border: 1px solid var(--seek-line); border-radius: 8px; padding: 4px 8px;
               font-size: 12px; color: var(--seek-fg); pointer-events: none;
               white-space: nowrap; }

  /* ---- 设置面板（W5 卡 c_ni7mzw：设置只读展示 + 关于区）----
     与三个资产面板同一副「中栏一个面」骨架（.pane + *-view 类），故只
     负责本面板亮；隐聊天/互斥由 body.browsing 与各 :not() 选择器承担。
     只读口径写在卡面：可写面（默认模型/温度）需要配置写入 + 重启路径，
     是一个子系统而不是本卡的一刀（本卡 ≤8KB 配额只覆盖 token/主题改写，
     实际 ~37KB 已在 PRD §13.3 如实记账），故本轮只展示 serve 侧已生效的配置。 */
  #settings { flex: 1; display: none; flex-direction: column; min-height: 0; }
  body.settings-view #settings { display: flex; }
  body:not(.settings-view) #settings { display: none; }
  #set-body { flex: 1; overflow-y: auto; padding: 14px; }
  .set-card { background: var(--seek-soft); border-radius: 8px; padding: 12px 14px;
              margin-bottom: 12px; }
  .set-card h3 { margin: 0 0 8px; font-size: 14px; color: var(--seek-fg-soft);
                 font-weight: 600; }
  .set-row { display: flex; justify-content: space-between; gap: 12px;
             padding: 3px 0; }
  .set-row .k { color: var(--seek-fg-dim); }
  /* 设置行的值（W6-1 口径）：这是 UI 文本行——provider 名、开关态、tokens
     数、路径混排，整块读的是「配置长什么样」而不是代码，故跟 body 的无衬线
     走，只有数字列用 tabular-nums 对齐。等宽只留给 pre/code/kbd/显式 .mono。 */
  .set-row .v { color: var(--seek-fg); text-align: right; word-break: break-all;
                font-variant-numeric: tabular-nums; }
  .set-note { color: var(--seek-fg-dim); font-size: 13px; margin-top: 6px;
              line-height: 20px; }
  /* 主题三态切换（亮/暗/跟随系统）：按钮组，当前态高亮。次操作钮
     在软底卡内取 panel 一档（c_25d2ey）：soft-on-soft 没有边界，
     面板底色随主题两向都留一档明度差。 */
  #set-theme { display: flex; gap: 8px; flex-wrap: wrap; }
  #set-theme button { padding: 5px 12px; font-size: 13px; background: var(--seek-panel); }
  #set-theme button.on { background: var(--seek-sel); }

  /* ---- hooks 审计面板（W5 c_xz2bey 实时审计视图）---- */
  body:not(.hooks-view) #hooks { display: none; }
  #hk-log { flex: 1; overflow-y: auto; padding: 8px 14px;
            font-family: var(--seek-mono); font-size: 12px; line-height: 19px; }
  .hk-row { display: flex; gap: 10px; white-space: nowrap; }
  .hk-row .hk-ts { color: var(--seek-fg-dim); flex: none; }
  .hk-row .hk-hook { color: var(--seek-ok); flex: none; max-width: 180px;
                     overflow: hidden; text-overflow: ellipsis; }
  .hk-row .hk-ev { color: var(--seek-warn); flex: none; }
  .hk-row .hk-rest { color: var(--seek-fg-soft); overflow: hidden; text-overflow: ellipsis; }
  .hk-row.denied .hk-rest, .hk-row.denied .hk-ev { color: var(--seek-err); }
  #hk-cnt { cursor: default; }
  #hk-cnt.fresh { color: var(--seek-warn); cursor: pointer; }
  #hk-pause { padding: 4px 12px; font-size: 13px; }
  #hk-pause.held { background: var(--seek-sel); }

  /* ---- 390px 手机宽响应式（W5 卡 c_lqtt2m）----
     单一 ≤480px 断点管全部窄屏降级（640px 块只管输入弹层，互不吞）。
     口径=「无不可达入口/不可读裁切」：双栏折叠单栏（侧栏抽屉化——展开态
     absolute 覆盖中栏 + 遮罩点击关，聊天列恒满宽；收起态 44px 图标轨
     原宽，轨内图标钮竖排让 ⟩ 留在轨内）、按钮组换行全显、长串按 ellipsis 折、
     设置面板 label/value 上下堆叠。缺省收起沿用 <1024 宽度判定
     （readSideCollapsed，dsh SIDEBAR_AUTO_COLLAPSE 同款断点），本块
     只管「展开时不挤中栏」。 */
  @media (max-width: 480px) {
    /* 状态条：计量右段允许收缩成 ellipsis（「恒完整」是桌面口径，窄屏
       让位给可读）；ctx 计量藏型号名保「条+百分比」——全名「设置」可读 */
    #usage { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    #ctx-m { display: none; }
    #ctx .bar { width: 36px; }
    /* 按钮组：换行全显代替横滚——所有入口常显可达（指令组/视图组各一
       行，390px 实测）；极端字体下装不下仍可横滚兜底（基线的 auto） */
    #bar { flex-wrap: wrap; gap: 6px; padding: 6px 8px; }
    #bar button { padding: 4px 8px; font-size: 12px; }
    #mem-btn { margin-left: 0; }
    /* 双栏→单栏：展开态抽屉化（脱离文档流覆盖中栏），收起态 44px 轨
       保持原样；遮罩同态翻出（基线 display:none） */
    #shell { position: relative; }
    body:not(.side-collapsed) #side {
      position: absolute; top: 0; bottom: 0; left: 0; z-index: 30;
      width: min(300px, 84vw); box-shadow: var(--seek-shadow);
    }
    body:not(.side-collapsed) #side-scrim { display: block; }
    /* 资产面板同款单栏化：记忆/后台的列表列（320/380px 定宽）在 390px
       会把详情列挤没——上下堆叠：列表 ≤38vh、详情占余，各自可滚 */
    #mem-body, #agents-body { flex-direction: column; }
    #mem-list, #ag-list { width: auto; flex: none; max-height: 38vh;
                          border-right: 0; border-bottom: 1px solid var(--seek-line); }
    /* 气泡放宽一档：单栏下代码块（pre 本就 overflow-x:auto，markdown
       卡同容器）多一截横向空间 */
    .msg { max-width: 94%; }
    /* 设置面板：label 上 value 下堆叠，value 满宽按 ellipsis 折——路径
       /hash 不再硬裁或碎行（全文悬停 title 可见，见 setRow） */
    .set-row { flex-direction: column; gap: 1px; padding: 5px 0; }
    .set-row .v { text-align: left; white-space: nowrap; overflow: hidden;
                  text-overflow: ellipsis; }
  }
</style>
</head>

<!-- markdown 子集渲染器（W5 卡 c_x2au4t）：static/ 拆分的第一个非内联
