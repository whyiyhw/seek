<!doctype html>
<!-- seek web MVP (card c_qucxtu) — single page, zero build chain.
     Message rendering (W5, card c_x2au4t): markdown SUBSET renderer —
     fenced ``` blocks, `inline` code, # headings, - / 1. lists, and
     [links](url) with a protocol allowlist — vendored as a handwritten
     DOM-API renderer in static/markdown.js (the first non-inline
     asset; marked/markdown-it both bust the ≤25KB quota AND their
     HTML-string output would need a parse-string-into-DOM sink, which
     §5.5 forbids). Model output NEVER enters an HTML-parsing path: text
     rides createTextNode/textContent, elements come from a fixed tag
     whitelist (PRE/CODE/UL/OL/LI/H1-6/A).
     Conversation identity (W1.3, D-W3): uuid minted by the browser,
     persisted in localStorage, carried as X-Seek-Conversation on
     fetches and ?conv= on the SSE stream (EventSource cannot set
     headers); the server keeps zero session state.
     Auth (W1.2): the /?token= first hop 303-exchanges the token into
     an HttpOnly cookie and scrubs the URL; this page rides the cookie
     (fetch/EventSource send it same-origin) — the token never reaches
     JS. The write side clears the server's Origin gate for free
     (browsers attach Origin to every POST).
     Status meter (W2.3): the header's right segment accumulates
     tokens/$ from each named usage event (source: turn_end; the $ is
     the SERVER-priced cost_usd, the page never computes money) and
     shows the session id short once the reply close-out carries it
     (source: agent_end). Page-lifetime cumulative — SSE has no
     replay, a reload restarts the meter at zero.
     Sessions sidebar (W5, card c_txz6vz): the W4.4 popup pane folded into
     a persistent, collapsible left rail — session/list drives it (updated
     desc, title substring filter, 30-row pages via "load more"), the bound
     session is the highlighted row, ＋新建 rides the SAME /new command
     passthrough, and the collapse bit lives in localStorage (a viewport
     under 1024px defaults to collapsed). A row click opens its transcript
     in the MAIN area: session/get (meta line) + session/messages walked
     page by page via next_cursor (50/page, "load more" appends; the DOM
     only ever holds what was paged in, so a long transcript stays at
     virtual-scroll order of magnitude). Same textContent-only discipline
     as chat.
     Streaming bubble (W2.1): the W1.4 named SSE events fold
     client-side per run id — deltas accumulate into text blocks,
     tool calls render as single folded status rows (args/results
     stay server-side by wire contract), interleaved in arrival
     order; the run-bearing reply replaces the whole bubble with
     the authoritative final text (a reply whose run was never seen —
     dropped frames — falls back to the plain message path, which is
     what makes the fold idempotent). usage events are W2.3's (the
     token/$ status bar), deliberately unlistened here.
     Task panel (W3.3, orchestration P1 visualisation): subagent
     master-detail over GET /subagents + the SSE topic — a SECOND
     /events connection opts into ?topic=subagents and listens ONLY
     for the named event (no onmessage: the conv frames riding the
     same connection are dropped by the browser, so chat never
     double-renders). Protocol: subscribe first, then GET /subagents
     for the snapshot; pushes merge by sub_sid. A detail row reads
     the sub transcript's LAST assistant entry (?sub=, summary 单源).
     Memory browser + stats view (W4.5, asset plane UI #2): memory/
     projects drives the project picker, memory/list the entry list,
     memory/get the detail (rendered by the chat renderer); the stats
     view rides stats/cache (session picker from session/list) — the
     cache/cost card shows hit ratio + cost_usd, priced SERVER-side
     (the client never prices; §2.5).
     Command quick buttons (W2.2): /bind /projects /switch /new /cancel
     in the top bar — zero-arg ones send the SAME command text through
     the shared POST /msg passthrough; /bind /switch prefill the input
     for the path argument. Binding status stays pinned in the status
     line: refreshed immediately after a command POST (202) settles on
     the wire, again on every SSE reply, and again on SSE (re)connect.
     Stop key (c_5m3fm6, dsh InputBar alignment): while a streamed run
     is live the SEND key becomes the STOP key — the click is forked at
     the click layer (preventDefault; a submit event names #send as
     the submitter for Enter's implicit submission too, so click vs
     Enter cannot be told apart at submit) and sends the SAME /cancel
     command text as the top bar; Enter with a draft still submits as
     before (conv-gate queuing is prior semantics, not narrowed here).
     The armed run's close-out is a PRESERVING one: the ack reply is
     run-bearing but its text is just a receipt — the accumulated
     deltas ARE the content of an interrupted run, so a 「—— 已中断 ——」
     marker is appended instead of the authoritative replace, and the
     server's terminal 「run 已中断。」 lands run-less as its own
     bubble. Key state follows the run table: the first stream event
     flips it, close-out reverts it — no stop key when idle.
     Attachments (W5 c_56yrcj): click 📎 / drag / paste → POST /attach
     (raw bytes), staged progress in a tray, images previewed from
     FileReader data: URLs; on send the staged paths ride the /msg text
     as "@<path>" so the child's own vision (modelcap) and document
     (filerefs) routers claim them — no new plane pipeline.
     Push-to-talk (voice V2, feature-deepseek-app-api §4.3): hold 🎤,
     speak ≤120 s, release — MediaRecorder → decodeAudioData → 16 kHz
     mono 16-bit WAV (the ASR input shape, resampled via
     OfflineAudioContext) → POST /voice with a per-BROWSER device uuid
     (X-Seek-Device) and a per-PRESS recording uuid (X-Seek-Voice-Event,
     the server's dedup key). The transcript echoes back as the named
     SSE event "voice" (a `you` bubble); ASR failures as "voice-error".
     The conversation it opens is voice:<device-id> — its OWN binding,
     separate from this page's web:<uuid> chat conv. Microphone needs
     a secure context: localhost is one; a tailnet IP over plain http
     is NOT (browsers deny getUserMedia) — front it with an HTTPS
     proxy (tailscale serve) to talk from a phone.
     Input enhancements (c_7lsngm, dsh ui-input-trigger + ui-commands):
     textarea (Enter sends / Shift+Enter newlines) + ONE candidate
     overlay — '/' commands (CMDS registry below) and '@' recent sessions
     (/rpc session/list → /resume <sid>). Navigation keys bind on the
     input only, so Escape never hijacks the page.
     Approval cards (W5, card c_n37tnr): permission y/N delivered to
     the browser — the conv stream's named `approval` events drive a
     bottom-right card stack (summary + command summary + y/N/a
     buttons, permission.Policy semantics: a = always-allow for the
     kind), decisions POST via /rpc approval/decide, receipts
     (resolved/cancelled) withdraw the card in every tab. Idempotent
     both sides: click disables the whole card (no double POST), the
     hub fires the decide callback exactly once per id. Empty state is
     zero-footprint (badge hidden, stack :empty). Reconnect resyncs
     via approval/list with a tombstone set against snapshot races.
     Tool call tree (card c_ux7lvk, dsh-aligned presentation): the two
     tool-row surfaces become call trees over their EXISTING data
     sources (no wire changes). Live bubble rows: one row per call =
     name + duration (client-measured gap between the start/end SSE
     frames — the server forwards each frame as it arrives; ticking
     while in flight, frozen at end), nested sub-calls indented by
     interval containment: depth = in-flight count at start (seek's
     partitioned dispatch runs read-only calls concurrently, so
     overlap renders as parent/child — flame-graph semantics,
     presenting overlap, not claiming causality; sequential runs stay
     flat). args/results are NOT on the /events wire (§2.5 —
     tool_end.result can be huge), so live rows stay folded
     one-liners. The expandable 参数/结果摘要 lives in the sessions
     browser: appendMsgTree pairs each assistant tool_calls[] row with
     its tool-role result by tool_call_id (ids match — both are
     deepseek.ToolCall.ID), renders summaries capped at 4000 chars in
     a scrollable pre, and 复制全文 copies the full string held in a
     JS closure (clipboard API on secure contexts, execCommand
     fallback for tailnet plain-http, which is NOT a secure context).
     Tool-role messages keep their standalone bubbles (the W4.4
     one-.smsg-per-message render contract stays untouched — zero
     regression); the tree registers their content by tool_call_id so
     the expand panel and the row's size tag read it.
     Per-message degradation: tree render throws → legacy
     folded rendering → （消息渲染失败） placeholder — never a blank
     page; the live tree degrades to the pre-tree single-line row.
     Deliberately out of scope: multi-tab sync, history persistence,
     bold/italic/table/quote markdown (the W5 subset covers the chat
     load; renderer lives in static/markdown.js), mobile, real auth
     (design card c_7pptol owns the full UI). -->
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>seek</title>
<!-- 首屏主题 bootstrap（W5 卡 c_ni7mzw，防 FOUC）：必须在样式表之前同步
     跑完——浏览器解析到样式表时 data-theme 已落定，首帧就是目标主题，
     不存在「先画暗再翻亮」的闪白/闪黑。三态：localStorage 里的显式选择
     （"light" / "dark"）优先；没有选择（或 localStorage 抛异常，如隐私
     模式）时跟随系统 prefers-color-scheme。全部逻辑收敛在这一个内联块里，
     页尾的主题 JS 只在用户点切换时复用同一套读写。 -->
<script>
(function () {
  var t = null;
  try { t = localStorage.getItem('seek-theme'); } catch (e) { /* 隐私模式：当作未选择 */ }
  if (t !== 'light' && t !== 'dark') {
    try {
      t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
    } catch (e) { t = 'dark'; }
  }
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<style>
  /* ---- 主题 token（W5 卡 c_ni7mzw）----
     两套值、一个属性开关：`html[data-theme="light"]` 只翻变量层，组件
     CSS 一律 var(--seek-*)，没有任何裸色值（dsh 的三层体系缩成两层：
     静态色板与语义别名在 seek 这个体量上合成一层就够）。缺省=暗色，
     与 W5 之前逐字节同色（c_ni7mzw 之前是硬编码 hex，值原样搬过来）。
     首屏由 <head> 里的内联 bootstrap 在样式表解析前写好 data-theme，
     故不存在「先画暗再翻亮」的闪烁；CSP 对该内联块的 sha256 由
     webfrontend_static.go 从同一份 embed 现算，手改页面不会失配。 */
  :root {
    color-scheme: dark;
    --seek-inset: #14161a;   /* 页面底/代码块底/输入框底 */
    --seek-panel: #1b1e24;   /* 顶栏/状态栏/侧栏/卡片/表单底 */
    --seek-soft:  #242830;   /* 气泡/统计卡/次级按钮底 */
    --seek-accent:var(--seek-accent);   /* 用户气泡/当前行/主按钮底 */
    --seek-line:  #2a2e36;   /* 主分隔线/边框 */
    --seek-line-2:#22252c;   /* 列表行分隔线（更淡一档） */
    --seek-line-focus:#4b586b; /* 输入聚焦边框 */
    --seek-fg:    #d7dae0;   /* 正文 */
    --seek-fg-dim:#8f959f;   /* 次级文字：门槛是「压得住所有常见底」——
                                panel(#1b1e24) 5.3、soft(#242830) 4.75。
                                首版 #858b93 在 soft 上 4.3 红（设置卡/
                                统计卡的 k 列都长在 soft 上）；accent 底
                                上的次级文字由组件规则升主文色，不靠这条 */
    --seek-fg-soft:var(--seek-fg-soft);  /* 工具行/徽标/卡片标题 */
    --seek-ok:    #7ec699;
    --seek-warn:  var(--seek-warn);
    --seek-warn-bg:#3a3222;  /* 警示条底（SSE 断线提示）——底色与前景分开
                                成对，亮色主题才好各自调值 */
    --seek-err:   var(--seek-err);
    --seek-link:  var(--seek-ok);
    --seek-rec:   #8f4a4a;   /* 录音中按钮底 */
    --seek-rec-fg:#f0d7b8;
    --seek-scrim: rgba(0,0,0,.5);   /* 窄屏抽屉遮罩（c_lqtt2m） */
    --seek-shadow:0 4px 14px rgba(0,0,0,.45);
  }
  /* 亮色：同一组语义名换值，快捷键只有 data-theme 一个属性。选值口径
     = 每对文字/底色 ≥4.5:1（WCAG AA 正文），面板间不靠色相只靠明度差。 */
  :root[data-theme="light"] {
    color-scheme: light;
    --seek-inset: #ffffff;
    --seek-panel: #f4f5f7;
    --seek-soft:  #eceef2;
    --seek-accent:#dbe5fb;
    --seek-line:  #d6dae1;
    --seek-line-2:#e6e9ee;
    --seek-line-focus:#7b8798;
    --seek-fg:    #1b1e24;
    --seek-fg-dim:#5b6270;
    --seek-fg-soft:#4b5361;
    --seek-ok:    #1f7a43;
    --seek-warn:  #8a5a00;
    --seek-warn-bg:#fbf0d5;
    --seek-err:   #b3261e;
    --seek-link:  #1a56c4;
    --seek-rec:   #b3261e;
    --seek-rec-fg:#ffffff;
    --seek-scrim: rgba(15,17,21,.28);
    --seek-shadow:0 4px 14px rgba(0,0,0,.12);
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 ui-monospace, Menlo, monospace;
         background: var(--seek-inset); color: var(--seek-fg); display: flex; flex-direction: column;
         height: 100vh; }
  /* 双段状态栏（W2.3）：左段绑定/连接态可截断，右段 usage 计量恒完整 */
  #status { display: flex; align-items: baseline; gap: 12px; padding: 8px 14px;
            background: var(--seek-panel); border-bottom: 1px solid var(--seek-line); }
  #status-l { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden;
              text-overflow: ellipsis; }
  #status.ok #status-l { color: var(--seek-ok); }
  #status.warn #status-l { color: var(--seek-warn); }
  #usage { flex: none; white-space: nowrap; color: var(--seek-fg-dim); }
  /* ---- SSE 连接灯 + 顶栏 ContextMeter（W5 卡 c_oyp2qf）----
     #conn：状态灯——绿=已连、黄=断线重连中；#connbar：断线提示条（带
     手动重连钮），连上即收起。#ctx：上下文余量计量——模型·车道 + 色阶
     进度条 + 百分比/余量，随 usage 事件（源=turn_end）更新，色阶对齐
     internal/budget Classify（≥60% 黄、≥75% 红）。
     merge main（2026-11-20）落进本卡时色值全改走 token：ctxmeter 是
     c_ni7mzw 之后进 main 的卡，原样留 hex 会在亮色主题下变成暗底暗字
     （TestWeb_PageThemeSettings 的裸色检查也会红）。断线条底色单开
     --seek-warn-bg（警示底不是语义前景色，压在它上面的文字仍用
     --seek-warn）。 */
  #conn { flex: none; }
  #conn::before { content: '●'; }
  #conn.ok::before { color: var(--seek-ok); }
  #conn.warn::before { color: var(--seek-warn); }
  #connbar { display: flex; align-items: center; justify-content: center;
             gap: 10px; padding: 5px 14px; background: var(--seek-warn-bg);
             color: var(--seek-warn); border-bottom: 1px solid var(--seek-line);
             font-size: 13px; }
  #connbar[hidden] { display: none; }
  #connbar button { padding: 3px 12px; font-size: 13px; background: var(--seek-accent); }
  #ctx { flex: none; display: flex; align-items: center; gap: 6px;
         white-space: nowrap; color: var(--seek-fg-dim); }
  #ctx[hidden] { display: none; }
  #ctx .bar { width: 56px; height: 5px; flex: none; background: var(--seek-line);
              border-radius: 3px; overflow: hidden; }
  #ctx .bar i { display: block; height: 100%; width: 0; background: var(--seek-ok); }
  #ctx.warn { color: var(--seek-warn); }
  #ctx.warn .bar i { background: var(--seek-warn); }
  #ctx.crit { color: var(--seek-err); }
  #ctx.crit .bar i { background: var(--seek-err); }
  #list { flex: 1; overflow-y: auto; padding: 14px; }
  .msg { max-width: 86%; margin: 4px 0; padding: 8px 12px; border-radius: 8px;
         white-space: pre-wrap; word-break: break-word; }
  /* pre 的横滚/配色四个正文容器同款——.smsg pre 是 c_lqtt2m 补的：
     markdown 卡（c_x2au4t）给会话正文也上了围栏渲染，但 overflow 规则
     只给了 .msg/#ag-last/#mem-content 三处，会话正文里的长代码行越出
     气泡被硬裁（390px 目检抓到；桌面同样越界）。 */
  .msg pre, .smsg pre { background: var(--seek-inset); border: 1px solid var(--seek-line); border-radius: 6px;
             padding: 8px 10px; margin: 6px 0; overflow-x: auto;
             white-space: pre; font: inherit; }
  .msg code { background: var(--seek-panel); border-radius: 4px; padding: 0 4px; }
  /* ---- markdown 子集排版（W5 卡 c_x2au4t）----
     标题在气泡内取收敛尺寸（浏览器 h1 默认 2em 会撑爆聊天行高）；
     列表收边距；链接配色与主题同谱。四个正文容器（聊天气泡/会话
     正文/子代理末读/记忆正文）共用一套。 */
  .msg h1, .sbody h1, #ag-last h1, #mem-content h1 { font-size: 1.3em; margin: 10px 0 4px; }
  .msg h2, .sbody h2, #ag-last h2, #mem-content h2 { font-size: 1.2em; margin: 10px 0 4px; }
  .msg h3, .sbody h3, #ag-last h3, #mem-content h3,
  .msg h4, .sbody h4, #ag-last h4, #mem-content h4,
  .msg h5, .sbody h5, #ag-last h5, #mem-content h5,
  .msg h6, .sbody h6, #ag-last h6, #mem-content h6 { font-size: 1.1em; margin: 8px 0 4px; }
  .msg ul, .sbody ul, #ag-last ul, #mem-content ul,
  .msg ol, .sbody ol, #ag-last ol, #mem-content ol { margin: 4px 0; padding-left: 1.6em; }
  .msg a, .sbody a, #ag-last a, #mem-content a { color: var(--seek-link); }
  .you { margin-left: auto; background: var(--seek-accent); }
  .seek { background: var(--seek-soft); }
  .hint { color: var(--seek-fg-dim); font-style: italic; }

  /* ---- 流式气泡 + 工具行折叠（W2.1）---- */
  .msg.streaming > .txt:last-child::after {
    content: '▍'; color: var(--seek-fg-dim); animation: caret 1s steps(1) infinite;
  }
  @keyframes caret { 50% { opacity: 0; } }
  .trow { color: var(--seek-fg-soft); font-size: 12px; padding: 1px 0; }
  .trow.bad { color: var(--seek-warn); }
  /* ---- 会话浏览器调用树（c_ux7lvk，dsh 对齐）----
     行=名称+参数摘要+结果规模；点行展开 .tdetail 看参数/结果摘要（超长
     截断进限高滚动 pre，「复制全文」从 JS 闭包取整串——DOM 只装摘要）。 */
  .ttree { display: flex; flex-direction: column; gap: 4px; margin: 6px 0 2px; }
  .tnode { display: flex; align-items: baseline; gap: 8px; width: 100%;
           text-align: left; background: var(--seek-panel); border: 1px solid var(--seek-line);
           border-radius: 6px; padding: 4px 10px; font: inherit;
           font-size: 12px; color: var(--seek-fg-soft); cursor: pointer; }
  .tnode:hover { border-color: var(--seek-line-focus); }
  .tnode .nm { flex: none; color: var(--seek-warn); }
  .tnode .sm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
               white-space: nowrap; }
  .tnode .rs { flex: none; color: var(--seek-fg-dim); white-space: nowrap; }
  .tdetail { background: var(--seek-inset); border: 1px solid var(--seek-line); border-radius: 6px;
             padding: 8px 10px; }
  .tlabel { display: flex; align-items: baseline; gap: 8px; font-size: 11px;
            color: var(--seek-fg-dim); margin: 2px 0; }
  .tlabel .tcopy { margin-left: auto; padding: 1px 10px; font-size: 11px; }
  .tpre { background: var(--seek-panel); border-radius: 4px; padding: 6px 8px;
          margin: 2px 0 8px; overflow: auto; white-space: pre-wrap;
          word-break: break-all; max-height: 220px; font: inherit;
          font-size: 12px; color: var(--seek-fg-soft); }
  /* 中断收口标注（c_5m3fm6）：保留的半截气泡尾部一行灰字，流状态可见地终止 */
  .msg .cut { color: var(--seek-fg-soft); font-size: 12px; padding-top: 2px; }
  /* 输入区底对齐（c_7lsngm）：按钮跟到多行输入的底边；position:relative
     是候选弹层的定位父级——贴表单上沿、宽度跟表单（窄屏自然满宽）。 */
  form { position: relative; display: flex; gap: 8px; align-items: flex-end;
         padding: 10px 14px; background: var(--seek-panel);
         border-top: 1px solid var(--seek-line); }
  /* 多行输入（c_7lsngm）：Enter 发送 / Shift+Enter 换行——textarea 才有
     换行；高度按内容长（grow() 写 style.height），上限 CSS 兜底滚动 */
  #input { flex: 1; background: var(--seek-inset); color: inherit; border: 1px solid var(--seek-line);
           border-radius: 6px; padding: 8px 10px; font: inherit; outline: none;
           resize: none; line-height: 1.45; min-height: 36px; max-height: 40vh;
           overflow-y: auto; }
  #input:focus { border-color: var(--seek-line-focus); }
  /* ---- 输入增强弹层（c_7lsngm）：'/' 指令补全 + '@' 会话引用 ----
     绝对定位贴在表单上沿（form 是定位父级），文档流不位移。 */
  #menu { position: absolute; left: 14px; right: 14px; bottom: 100%;
          margin-bottom: 2px; max-height: 46vh; overflow-y: auto;
          background: var(--seek-panel); border: 1px solid var(--seek-line); border-radius: 8px;
          box-shadow: 0 -6px 18px rgba(0,0,0,.35); }
  #menu[hidden] { display: none; }
  #menu .mi { display: flex; gap: 10px; align-items: baseline;
              padding: 6px 12px; cursor: pointer;
              border-bottom: 1px solid var(--seek-line); }
  #menu .mi:last-child { border-bottom: 0; }
  #menu .mi.hl { background: var(--seek-accent); }
  #menu .mi .nm { color: var(--seek-fg-soft); white-space: nowrap; }
  #menu .mi .ds { color: var(--seek-fg-dim); font-size: 12px; overflow: hidden;
                  text-overflow: ellipsis; white-space: nowrap; }
  #menu .mi .sid { color: var(--seek-fg-dim); font-size: 12px; margin-left: auto; }
  /* 窄屏降级（验收 ③）：弹层满宽、条目换行、输入 16px 防 iOS 聚焦缩放 */
  @media (max-width: 640px) {
    #menu { left: 0; right: 0; bottom: 100%; border-radius: 8px 8px 0 0; }
    #menu .mi { flex-wrap: wrap; }
    #menu .mi .sid { margin-left: 0; }
    #input { font-size: 16px; }
    form { padding: 8px; }
  }
  button { background: var(--seek-accent); color: inherit; border: 0; border-radius: 6px;
           padding: 8px 16px; font: inherit; cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  /* 按住说话（voice V2）：按下即录音中——红点态一目了然；user-select 关掉
     防长按选中周围文字（touch 长按尤其会） */
  #mic { padding: 8px 12px; user-select: none; -webkit-user-select: none; touch-action: none; }
  /* 录音态文字换 --seek-rec-fg 而非继承 fg：亮色继承 fg 压在 --seek-rec
     上只有 ~2.6:1（两主题对比度抽查红）；接上专用前景后两主题 ≥4.5:1
     （ap-badge 同款接线，两处共用同一对 token）。 */
  #mic.rec { background: var(--seek-rec); color: var(--seek-rec-fg); }
  /* 停止键态（c_5m3fm6）：生成中 #send 变停止键——与录音态共用同一对
     --seek-rec token（同色系 + 两主题都过对比度，见上条注释） */
  #send.stop { background: var(--seek-rec); color: var(--seek-rec-fg); }

  /* ---- 审批卡片（W5 卡 c_n37tnr，§3.4 远程审批）---- */
  /* 右下角悬浮卡栈：任何视图（聊天/四面板）都能弹卡——卡的是权限决定，
     不属于某个面板。空态零侵入：容器 :empty 即 display:none，顶栏角标
     hidden 属性默认在，无未决时页面零痕迹。 */
  #approvals { position: fixed; right: 14px; bottom: 76px; z-index: 10;
               width: min(420px, calc(100vw - 28px));
               display: flex; flex-direction: column; gap: 8px;
               max-height: 60vh; overflow-y: auto; }
  #approvals:empty { display: none; }
  .apcard { background: var(--seek-panel); border: 1px solid var(--seek-line); border-radius: 8px;
            padding: 10px 12px; box-shadow: 0 4px 14px var(--seek-shadow); }
  .apcard .apt { color: var(--seek-warn); font-size: 12px; margin-bottom: 4px; }
  .apcard .aps { margin: 0 0 4px; white-space: pre-wrap; word-break: break-word; }
  .apcard pre { background: var(--seek-inset); border: 1px solid var(--seek-line); border-radius: 6px;
                padding: 6px 8px; margin: 4px 0; overflow: auto;
                white-space: pre-wrap; word-break: break-all; font: inherit;
                max-height: 120px; }
  .apcard .apb { display: flex; gap: 8px; margin-top: 8px; }
  .apcard .apb button { flex: 1; padding: 5px 8px; font-size: 13px; }
  #ap-badge { flex: none; align-self: center; background: var(--seek-rec); color: var(--seek-rec-fg);
              border-radius: 10px; padding: 2px 10px; font-size: 12px;
              white-space: nowrap; }
  #ap-badge[hidden] { display: none; }
  /* ---- 附件（W5 c_56yrcj）：托盘 + 气泡缩略图 ----
     merge main（2026-11-20）落进本卡时色值改走 token（原样留 hex 会让亮色
     主题下托盘/缩略图底仍是暗色，裸色检查也会红）。 */
  #attach-btn { padding: 8px 12px; background: var(--seek-soft); }
  #tray { display: none; gap: 8px; flex-wrap: wrap; padding: 8px 14px;
          background: var(--seek-panel); border-top: 1px solid var(--seek-line); }
  #tray.has { display: flex; }
  body.browsing #tray { display: none; }
  .chip { display: flex; align-items: center; gap: 6px; max-width: 260px;
          background: var(--seek-soft); border: 1px solid var(--seek-line); border-radius: 6px;
          padding: 4px 6px; position: relative; overflow: hidden; }
  .chip .tn { width: 28px; height: 28px; object-fit: cover; border-radius: 4px;
              flex: none; background: var(--seek-inset); }
  .chip .nm { font-size: 12px; overflow: hidden; text-overflow: ellipsis;
              white-space: nowrap; }
  .chip .pc { font-size: 11px; color: var(--seek-fg-dim); flex: none; }
  .chip .rm { padding: 0 6px; background: transparent; color: var(--seek-fg-dim);
              font-size: 14px; line-height: 1; }
  .chip .pb { position: absolute; left: 0; bottom: 0; height: 2px; width: 100%;
              background: var(--seek-inset); }
  .chip .pb i { display: block; height: 100%; width: 0; background: var(--seek-link);
                transition: width .15s linear; }
  .chip.bad { border-color: var(--seek-err); }
  .chip.bad .pc { color: var(--seek-err); }
  .msg .thumbs { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0 2px; }
  .msg .thumbs img { max-width: 220px; max-height: 180px; border-radius: 6px;
                     border: 1px solid var(--seek-line); }
  .msg .thumbs .doc { font-size: 12px; color: var(--seek-fg); background: var(--seek-panel);
                      border: 1px solid var(--seek-line); border-radius: 6px; padding: 4px 8px; }
  body.dropping form { outline: 2px dashed var(--seek-line-focus); outline-offset: -4px; }

  /* ---- 指令快捷按钮（W2.2）+ 会话侧栏（W5 卡 c_txz6vz——W4.4 的 📚 弹出面板在此退役）---- */
  #bar { display: flex; gap: 8px; padding: 6px 14px; background: var(--seek-panel);
         border-bottom: 1px solid var(--seek-line); overflow-x: auto; }
  #bar button { padding: 4px 12px; font-size: 13px; white-space: nowrap; }
  #bar .cmd { background: var(--seek-soft); }          /* 指令按钮与视图按钮区分 */
  #mem-btn { margin-left: auto; }             /* 视图按钮组（记忆/统计/后台）靠右 */
  body.browsing #bar .cmd { display: none; }  /* 浏览面不显示聊天指令 */

  /* 布局骨架：左栏常驻 + 中栏内容。收起态 = 44px 图标轨（dsh 折叠轨同
     语言：logo/新建/搜索入轨，展开态的文字让位）。宽度过渡 150ms，与
     prefers-reduced-motion 兜底同 W5 既有口径（无动画依赖，纯装饰）。 */
  #shell { flex: 1; display: flex; min-height: 0; }
  #side { width: 260px; flex: none; display: flex; flex-direction: column;
          min-height: 0; background: var(--seek-panel); border-right: 1px solid var(--seek-line);
          transition: width .15s; }
  body.side-collapsed #side { width: 44px; }
  #side-head { display: flex; align-items: center; gap: 8px; padding: 8px 10px;
               border-bottom: 1px solid var(--seek-line); }
  #side-title { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap;
                color: var(--seek-fg-soft); font-size: 12px; letter-spacing: .04em; }
  #side-head button, #side-new { padding: 4px 8px; font-size: 13px;
                                 background: var(--seek-soft); }
  #side-toggle { flex: none; width: 26px; padding: 4px 0; }
  #side-arch { flex: none; width: 26px; padding: 4px 0; background: var(--seek-soft); }
  #side-arch.on { background: var(--seek-accent); }  /* 归档可见位：高亮记开关态 */
  #side-new { margin: 8px 10px 6px; display: flex; gap: 6px; align-items: center;
              justify-content: center; }
  #side-search { margin: 0 10px 8px; background: var(--seek-inset); color: inherit;
                 border: 1px solid var(--seek-line); border-radius: 6px; padding: 5px 8px;
                 font: inherit; font-size: 13px; outline: none; }
  #side-search:focus { border-color: var(--seek-line-focus); }
  #sess-list { flex: 1; overflow-y: auto; min-height: 0; }
  #side-foot { border-top: 1px solid var(--seek-line); }
  #side-foot button { width: 100%; border-radius: 0; background: var(--seek-soft);
                      font-size: 12px; padding: 6px; }
  /* 收起态：标题/搜索/列表/翻页让位，新建与折叠钮收成图标轨 */
  body.side-collapsed #side-title, body.side-collapsed #side-search,
  body.side-collapsed #sess-list, body.side-collapsed #side-foot,
  body.side-collapsed #side-new .lbl { display: none; }
  body.side-collapsed #side-head { padding: 8px 6px; justify-content: center; }
  body.side-collapsed #side-new { margin: 8px 6px; padding: 6px 0; }
  /* 抽屉遮罩（c_lqtt2m）：默认不出场；≤480px 展开态翻成 block（断点块），
     点击关抽屉。z 在 #side（30）之下、盖住中栏。 */
  #side-scrim { display: none; position: absolute; inset: 0; z-index: 20;
                background: var(--seek-scrim); }

  #center { flex: 1; display: flex; flex-direction: column;
            min-width: 0; min-height: 0; }
  /* 会话正文（主区）：点侧栏一条即亮，聊天面/输入框让位；💬 聊天收回。
     三个资产面板（记忆/统计/后台）同一个「中栏一个面」口径：browsing 时
     聊天面也让位。 */
  #browser { flex: 1; display: none; flex-direction: column; min-height: 0; }
  body.sess-detail #browser { display: flex; }
  body.sess-detail #list, body.sess-detail form,
  body.browsing #list, body.browsing form { display: none; }
  #browser-body { flex: 1; display: flex; min-height: 0; }
  /* 行元素是 div（role=button）：行内还要装 ✏/🗄 操作钮与改名输入框，
     button 套 button/input 是非法嵌套，div 承载才装得下（W5 c_rqcuaa）。
     底色仍显式透明落回 panel（别吃全局 button 的 accent 底）；
     .cur 的 accent 底在各自规则里。 */
  .sess-row { display: block; width: 100%; text-align: left; border-radius: 0;
              border-bottom: 1px solid var(--seek-line-2); padding: 8px 12px;
              background: transparent; cursor: pointer; position: relative; }
  .sess-row .t1 { display: block; overflow: hidden; text-overflow: ellipsis;
                  white-space: nowrap; }
  .sess-row .t2 { display: block; color: var(--seek-fg-dim); font-size: 12px;
                  margin-top: 2px; }
  .sess-row.cur { background: var(--seek-accent); }
  /* 选中行的 t2 升主文色：accent 底压 dim 只有 ~3.2:1（暗侧），fg 上 7.6 */
  .sess-row.cur .t2 { color: var(--seek-fg); }
  .sess-row.arch { opacity: .55; }
  .sess-row:focus-visible { outline: 1px solid var(--seek-line-focus); }
  /* 悬停/聚焦才亮的行内操作组：底色取侧栏底，盖住底下文字避免叠字 */
  .sess-acts { position: absolute; right: 6px; top: 50%;
               transform: translateY(-50%); display: none; gap: 2px;
               background: var(--seek-panel); padding: 2px; border-radius: 6px; }
  .sess-row:hover .sess-acts, .sess-row:focus-within .sess-acts { display: flex; }
  .sess-acts button { padding: 2px 7px; font-size: 12px; background: var(--seek-soft); }
  /* 行内改名：编辑态下标题/操作让位给输入框（Enter 提交 / Esc 取消） */
  .sess-edit { display: none; width: calc(100% - 16px); background: var(--seek-inset);
               color: inherit; border: 1px solid var(--seek-line-focus); border-radius: 6px;
               padding: 4px 8px; font: inherit; font-size: 13px; outline: none; }
  .sess-row.editing .sess-edit { display: block; }
  .sess-row.editing .t1, .sess-row.editing .t2,
  .sess-row.editing .sess-acts { display: none; }
  #sess-detail { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #browser-head { display: flex; gap: 10px; align-items: center; padding: 6px 10px;
                  border-bottom: 1px solid var(--seek-line); }
  #sess-back { flex: none; padding: 4px 12px; font-size: 13px; background: var(--seek-soft); }
  #sess-meta { flex: 1; min-width: 0; color: var(--seek-fg-dim); white-space: nowrap;
               overflow: hidden; text-overflow: ellipsis; }
  #sess-msgs { flex: 1; overflow-y: auto; padding: 14px; }
  .smsg { margin: 6px 0; padding: 8px 12px; border-radius: 8px;
          background: var(--seek-soft); white-space: pre-wrap; word-break: break-word; }
  .smsg.user { background: var(--seek-accent); }
  .smsg.user .swho { color: var(--seek-fg); }   /* 同 .cur：accent 底不压 dim */
  .smsg.tool { background: var(--seek-panel); color: var(--seek-fg-soft); }
  .smsg.tool pre { background: var(--seek-inset); }
  .swho { font-size: 11px; color: var(--seek-fg-dim); margin-bottom: 4px; }
  .stool { color: var(--seek-warn); }
  /* 工具结果限高：单条大输出不把整页 paint 撑爆（分页外的第二道界） */
  .smsg.tool .sbody { max-height: 260px; overflow-y: auto; }
  #sess-foot { padding: 8px 14px; text-align: center; border-top: 1px solid var(--seek-line);
               color: var(--seek-fg-dim); }
  #sess-foot button { width: 100%; }
  .pane-hint { color: var(--seek-fg-dim); font-style: italic; padding: 14px; }

  /* ---- 任务面板（W3.3 编排 P1 可视化）---- */
  /* 与三个资产面板同一开合闸（browsing=隐聊天 + 恰好一个 *-view 亮面板），
     故这里只负责「本面板亮」；隐聊天/互斥由 body.browsing 与各 body:not(.x-view)
     选择器承担（W4.5 拆分后的口径）。 */
  #agents { flex: 1; display: none; flex-direction: column; min-height: 0; }
  body.agents-view #agents { display: flex; }
  #agents-body { flex: 1; display: flex; min-height: 0; }
  #ag-list { width: 380px; flex: none; overflow-y: auto;
             border-right: 1px solid var(--seek-line); }
  .ag-row { display: block; width: 100%; text-align: left; border-radius: 0;
            border-bottom: 1px solid var(--seek-line-2); padding: 8px 12px;
            background: transparent; }
  .ag-row.cur { background: var(--seek-accent); }
  .ag-row .t1 { display: flex; gap: 6px; align-items: baseline; }
  .ag-row .desc { flex: 1; overflow: hidden; text-overflow: ellipsis;
                  white-space: nowrap; }
  .ag-row .t2 { display: block; color: var(--seek-fg-dim); font-size: 12px; margin-top: 2px; }
  .ag-badge { font-size: 11px; flex: none; white-space: nowrap; }
  /* 三态徽标（卡 c_4doebx）：running/done/error 走类名而不是内联色——
     颜色一处定义，无头验收读 class/dataset.status 即断言面。值走 token
     （merge main 2026-11-20）：暗色谱 hex 在亮色主题下只有 ~2:1。 */
  .ag-badge.st-running { color: var(--seek-warn); }
  .ag-badge.st-done    { color: var(--seek-ok); }
  .ag-badge.st-error   { color: var(--seek-err); }
  #ag-detail { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #ag-meta { padding: 6px 14px; border-bottom: 1px solid var(--seek-line);
             color: var(--seek-fg-dim); white-space: nowrap; overflow: hidden;
             text-overflow: ellipsis; }
  /* 详情字段表（卡 c_4doebx）：与 /subagents?sub= 同信息量的可读面。 */
  #ag-fields { padding: 6px 14px; border-bottom: 1px solid var(--seek-line); }
  #ag-fields:empty { display: none; }
  .ag-field { display: flex; gap: 10px; font-size: 12px; padding: 1px 0; }
  .ag-field .k { color: var(--seek-fg-dim); flex: none; min-width: 96px; }
  .ag-field .v { color: var(--seek-fg); overflow: hidden; text-overflow: ellipsis;
                 white-space: nowrap; }
  #ag-last { flex: 1; overflow-y: auto; padding: 14px; }
  #ag-last pre { background: var(--seek-inset); border: 1px solid var(--seek-line); border-radius: 6px;
                 padding: 8px 10px; margin: 6px 0; overflow-x: auto;
                 white-space: pre; font: inherit; }
  #ag-last code { background: var(--seek-panel); border-radius: 4px; padding: 0 4px; }

  /* ---- 记忆浏览器 + 统计视图（W4.5 资产面 UI·二）---- */
  .pane { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  body:not(.mem-view) #memory { display: none; }
  body:not(.stat-view) #stats { display: none; }
  .pane-head { display: flex; gap: 8px; align-items: center; padding: 6px 14px;
               border-bottom: 1px solid var(--seek-line); }
  .pane-head select { background: var(--seek-inset); color: inherit; border: 1px solid var(--seek-line);
                      border-radius: 6px; padding: 4px 8px; font: inherit;
                      max-width: 60%; }
  .pane-head .cnt { color: var(--seek-fg-dim); font-size: 12px; }
  #mem-body { flex: 1; display: flex; min-height: 0; }
  #mem-list { width: 320px; flex: none; overflow-y: auto;
              border-right: 1px solid var(--seek-line); }
  .mem-row { display: block; width: 100%; text-align: left; border-radius: 0;
             border-bottom: 1px solid var(--seek-line-2); padding: 8px 12px;
             background: transparent; }
  .mem-row.cur { background: var(--seek-accent); }
  .mem-row .t1 { display: block; overflow: hidden; text-overflow: ellipsis;
                 white-space: nowrap; }
  .mem-row .t2 { display: block; color: var(--seek-fg-dim); font-size: 12px; margin-top: 2px;
                 overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #mem-detail { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #mem-meta { padding: 6px 14px; border-bottom: 1px solid var(--seek-line); color: var(--seek-fg-dim); }
  #mem-tags { padding: 4px 14px; border-bottom: 1px solid var(--seek-line); }
  #mem-tags .chip { display: inline-block; background: var(--seek-panel); border: 1px solid var(--seek-line);
                    border-radius: 10px; padding: 0 8px; margin: 2px 4px 2px 0;
                    font-size: 12px; color: var(--seek-fg-soft); }
  #mem-content { flex: 1; overflow-y: auto; padding: 14px;
                 white-space: pre-wrap; word-break: break-word; }
  #mem-content pre { background: var(--seek-inset); border: 1px solid var(--seek-line); border-radius: 6px;
                     padding: 8px 10px; margin: 6px 0; overflow-x: auto;
                     white-space: pre; font: inherit; }
  #mem-content code { background: var(--seek-panel); border-radius: 4px; padding: 0 4px; }
  #stat-body { flex: 1; overflow-y: auto; padding: 14px; }
  .stat-card { background: var(--seek-soft); border-radius: 8px; padding: 12px 14px;
               margin-bottom: 12px; }
  .stat-card h3 { margin: 0 0 8px; font-size: 13px; color: var(--seek-fg-soft); font-weight: normal; }
  .stat-row { display: flex; justify-content: space-between; gap: 12px;
              padding: 3px 0; }
  .stat-row .v { color: var(--seek-fg); }
  .stat-row .v.usd { color: var(--seek-ok); }
  .stat-bar { height: 10px; border-radius: 5px; background: var(--seek-accent); overflow: hidden;
              margin-top: 8px; }
  .stat-bar .hit { height: 100%; background: var(--seek-ok); }

  /* ---- 设置面板（W5 卡 c_ni7mzw：设置只读展示 + 关于区）----
     与三个资产面板同一副「中栏一个面」骨架（.pane + *-view 类），故只
     负责本面板亮；隐聊天/互斥由 body.browsing 与各 :not() 选择器承担。
     只读口径写在卡面：可写面（默认模型/温度）需要配置写入 + 重启路径，
     是一个子系统而不是本卡的一刀（本卡 ≤8KB 配额只覆盖 token/主题改写，
     实际 ~37KB 已在 PRD §13.3 如实记账），故本轮只展示 serve 侧已生效的配置。 */
  #settings { flex: 1; display: none; flex-direction: column; min-height: 0; }
  body.settings-view #settings { display: flex; }
  body:not(.settings-view) #settings { display: none; }
  #set-body { flex: 1; overflow-y: auto; padding: 14px; }
  .set-card { background: var(--seek-soft); border-radius: 8px; padding: 12px 14px;
              margin-bottom: 12px; }
  .set-card h3 { margin: 0 0 8px; font-size: 13px; color: var(--seek-fg-soft);
                 font-weight: normal; }
  .set-row { display: flex; justify-content: space-between; gap: 12px;
             padding: 3px 0; }
  .set-row .k { color: var(--seek-fg-dim); }
  .set-row .v { color: var(--seek-fg); text-align: right; word-break: break-all; }
  .set-note { color: var(--seek-fg-dim); font-size: 12px; margin-top: 6px;
              line-height: 1.45; }
  /* 主题三态切换（亮/暗/跟随系统）：按钮组，当前态高亮。 */
  #set-theme { display: flex; gap: 8px; flex-wrap: wrap; }
  #set-theme button { padding: 5px 12px; font-size: 13px; background: var(--seek-soft);
                      border: 1px solid var(--seek-line); }
  #set-theme button.on { background: var(--seek-accent); border-color: var(--seek-line-focus); }

  /* ---- hooks 审计面板（W5 c_xz2bey 实时审计视图）---- */
  body:not(.hooks-view) #hooks { display: none; }
  #hk-log { flex: 1; overflow-y: auto; padding: 8px 14px;
            font: 12px/1.8 ui-monospace, Menlo, Consolas, monospace; }
  .hk-row { display: flex; gap: 10px; white-space: nowrap; }
  .hk-row .hk-ts { color: var(--seek-fg-dim); flex: none; }
  .hk-row .hk-hook { color: var(--seek-ok); flex: none; max-width: 180px;
                     overflow: hidden; text-overflow: ellipsis; }
  .hk-row .hk-ev { color: var(--seek-warn); flex: none; }
  .hk-row .hk-rest { color: var(--seek-fg-soft); overflow: hidden; text-overflow: ellipsis; }
  .hk-row.denied .hk-rest, .hk-row.denied .hk-ev { color: var(--seek-err); }
  #hk-cnt { cursor: default; }
  #hk-cnt.fresh { color: var(--seek-warn); cursor: pointer; }
  #hk-pause.held { background: var(--seek-accent); }

  /* ---- 390px 手机宽响应式（W5 卡 c_lqtt2m）----
     单一 ≤480px 断点管全部窄屏降级（640px 块只管输入弹层，互不吞）。
     口径=「无不可达入口/不可读裁切」：双栏折叠单栏（侧栏抽屉化——展开态
     absolute 覆盖中栏 + 遮罩点击关，聊天列恒满宽；收起态 44px 图标轨
     原样，side-toggle 仍常在）、按钮组换行全显、长串按 ellipsis 折、
     设置面板 label/value 上下堆叠。缺省收起沿用 <1024 宽度判定
     （readSideCollapsed，dsh SIDEBAR_AUTO_COLLAPSE 同款断点），本块
     只管「展开时不挤中栏」。 */
  @media (max-width: 480px) {
    /* 状态条：计量右段允许收缩成 ellipsis（「恒完整」是桌面口径，窄屏
       让位给可读）；ctx 计量藏型号名保「条+百分比」——全名 ⚙设置 可读 */
    #usage { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    #ctx-m { display: none; }
    #ctx .bar { width: 36px; }
    /* 按钮组：换行全显代替横滚——所有入口常显可达（指令组/视图组各一
       行，390px 实测）；极端字体下装不下仍可横滚兜底（基线的 auto） */
    #bar { flex-wrap: wrap; gap: 6px; padding: 6px 8px; }
    #bar button { padding: 4px 8px; font-size: 12px; }
    #mem-btn { margin-left: 0; }
    /* 双栏→单栏：展开态抽屉化（脱离文档流覆盖中栏），收起态 44px 轨
       保持原样；遮罩同态翻出（基线 display:none） */
    #shell { position: relative; }
    body:not(.side-collapsed) #side {
      position: absolute; top: 0; bottom: 0; left: 0; z-index: 30;
      width: min(300px, 84vw); box-shadow: var(--seek-shadow);
    }
    body:not(.side-collapsed) #side-scrim { display: block; }
    /* 资产面板同款单栏化：记忆/后台的列表列（320/380px 定宽）在 390px
       会把详情列挤没——上下堆叠：列表 ≤38vh、详情占余，各自可滚 */
    #mem-body, #agents-body { flex-direction: column; }
    #mem-list, #ag-list { width: auto; flex: none; max-height: 38vh;
                          border-right: 0; border-bottom: 1px solid var(--seek-line); }
    /* 气泡放宽一档：单栏下代码块（pre 本就 overflow-x:auto，markdown
       卡同容器）多一截横向空间 */
    .msg { max-width: 94%; }
    /* 设置面板：label 上 value 下堆叠，value 满宽按 ellipsis 折——路径
       /hash 不再硬裁或碎行（全文悬停 title 可见，见 setRow） */
    .set-row { flex-direction: column; gap: 1px; padding: 5px 0; }
    .set-row .v { text-align: left; white-space: nowrap; overflow: hidden;
                  text-overflow: ellipsis; }
  }
</style>
</head>
<body>
<header id="status" class="warn"><span id="status-l">连接中…</span><span id="conn" class="warn" role="status" aria-label="SSE 连接状态"></span><span id="ctx" hidden><span id="ctx-m"></span><span class="bar"><i></i></span><span id="ctx-p"></span></span><span id="usage"></span></header>
<div id="connbar" hidden><span>SSE 已断开——正在自动重连…</span><button id="reconn" type="button">手动重连</button></div>
<nav id="bar">
  <!-- 指令快捷按钮（W2.2）：发的是与手打完全同款的指令文本（POST /msg 纯文本
       透传）；带参的 /bind /switch 只预填输入框，路径由用户补全后回车。 -->
  <button id="cmd-bind" class="cmd" type="button" title="绑定/重绑项目，会话重置（需补路径）">/bind</button>
  <button id="cmd-projects" class="cmd" type="button" title="列出候选项目与当前绑定">/projects</button>
  <button id="cmd-switch" class="cmd" type="button" title="切换到另一项目（需补路径）">/switch</button>
  <button id="cmd-new" class="cmd" type="button" title="项目不变，开新会话">/new</button>
  <button id="cmd-cancel" class="cmd" type="button" title="中断本会话运行中的任务">/cancel</button>
  <!-- 审批未决角标（W5 c_n37tnr）：有待审批卡片时常显计数；hidden 默认在
       ——空态不占顶栏（验收③零侵入）。W5 侧栏卡（c_txz6vz）退役了顶栏
       的会话按钮——会话入口移左栏，这里不再有它。 -->
  <span id="ap-badge" hidden></span>
  <button id="mem-btn" type="button">🧠 记忆</button>
  <button id="stat-btn" type="button">📊 统计</button>
  <button id="agents-btn" type="button">🤖 后台</button>
  <button id="set-btn" type="button">⚙ 设置</button>
  <!-- hooks 实时审计（W5 c_xz2bey）：审计 tail 视图 + /events 的 hooks
       topic 实时追加。 -->
  <button id="hk-btn" type="button">🪝 审计</button>
</nav>
<!-- 布局骨架（W5 卡 c_txz6vz）：左栏常驻会话侧栏 + 中栏内容。W4.4 的
     📚 弹出面板在此退役——会话列表不再抢占整页，只是左栏；中栏仍归
     聊天面（#list + #form）或三个资产面板。 -->
<div id="shell">
  <div id="side-scrim"></div>
  <aside id="side">
    <div id="side-head">
      <span id="side-title">会话</span>
      <button id="side-new" type="button" title="项目不变，开新会话（与 /new 同一条）">＋<span class="lbl">新建</span></button>
      <button id="side-arch" type="button" title="显示归档会话">🗄</button>
      <button id="side-toggle" type="button" title="收起/展开会话侧栏">⟨</button>
    </div>
    <input id="side-search" type="search" autocomplete="off" placeholder="按标题搜索…" aria-label="按标题搜索会话">
    <div id="sess-list"></div>
    <div id="side-foot"></div>
  </aside>
  <div id="center">
    <main id="list"></main>
    <section id="browser">
      <div id="browser-body">
        <div id="sess-detail">
          <div id="browser-head">
            <button id="sess-back" type="button" title="返回聊天面">💬 聊天</button>
            <div id="sess-meta"></div>
          </div>
          <div id="sess-msgs"></div>
          <div id="sess-foot"></div>
        </div>
      </div>
    </section>
    <section id="agents">
      <div id="agents-body">
        <div id="ag-list"></div>
        <div id="ag-detail">
          <div id="ag-meta"></div>
          <div id="ag-fields"></div>
          <div id="ag-last"></div>
        </div>
      </div>
    </section>
    <section id="memory" class="pane">
      <div class="pane-head">
        <select id="mem-proj" aria-label="项目"></select>
        <span class="cnt" id="mem-cnt"></span>
      </div>
      <div id="mem-body">
        <div id="mem-list"></div>
        <div id="mem-detail">
          <div id="mem-meta"></div>
          <div id="mem-tags"></div>
          <div id="mem-content"></div>
        </div>
      </div>
    </section>
    <section id="stats" class="pane">
      <div class="pane-head">
        <select id="stat-sess" aria-label="会话"></select>
      </div>
      <div id="stat-body"></div>
    </section>
    <!-- 设置面板（W5 c_ni7mzw）：外观（主题三态，纯前端）+ serve 侧
         配置只读展示 + 关于区（版本、入口 token 短显）。数据来自
         /rpc settings/get——serve 侧把启动时生效的配置投影成一份快照，
         页面不读文件、不猜默认值。 -->
    <section id="settings" class="pane">
      <div class="pane-head"><span class="cnt">设置 · 只读展示（改配置 = 编辑 ~/.seek/config.json 后重启）</span></div>
      <div id="set-body"></div>
    </section>
    <!-- hooks 审计视图（W5 c_xz2bey）：订阅先行的 tail——专用 /events 连接带
         ?topic=hooks（审计日志是全局的，无需 /bind），快照走 POST /rpc
         hooks/audit/tail；推送逐行追加，可暂停/按 hook 名过滤。 -->
    <section id="hooks" class="pane">
      <div class="pane-head">
        <input id="hk-filter" type="search" autocomplete="off"
               placeholder="按 hook 名过滤…" aria-label="按 hook 名过滤审计行">
        <button id="hk-pause" type="button" title="暂停/恢复实时追加（暂停期间仍积累，恢复时补齐）">⏸ 暂停</button>
        <span class="cnt" id="hk-cnt" title="显示行数"></span>
      </div>
      <div id="hk-log"></div>
    </section>
    <form id="form">
      <!-- 多行输入（c_7lsngm）：Enter 发送、Shift+Enter 换行；#menu 是 '/' 指令补全
           与 '@' 会话引用共用的候选弹层（一行 DOM，两种候源），贴着表单上沿。 -->
      <textarea id="input" autocomplete="off" rows="1" spellcheck="false"
                placeholder="/bind <项目路径>，/ 看指令，@ 引用会话，或直接发消息" autofocus></textarea>
      <div id="menu" role="listbox" aria-label="候选" hidden></div>
      <input id="file" type="file" multiple hidden
             accept=".png,.jpg,.jpeg,.webp,.gif,.pdf,.doc,.docx,.ppt,.pptx">
      <button id="attach-btn" type="button" title="添加附件（也可直接拖入或粘贴）">📎</button>
      <button id="mic" type="button" title="按住说话，松开发送（≤120 秒）">🎤</button>
      <button id="send">发送</button>
    </form>
    <div id="tray"></div>
  </div>
</div>
<!-- 审批卡片栈（W5 卡 c_n37tnr）：悬浮层不进任何面板闸——权限决定要在
     任何视图弹出。卡片由 SSE approval 事件驱动增删（webfrontend_approval.go
     的服务端 hub 是单源），按钮走 POST /rpc approval/decide。 -->
<div id="approvals" aria-live="polite"></div>
<!-- markdown 子集渲染器（W5 卡 c_x2au4t）：static/ 拆分的第一个非内联
     资产，同源由 /static/ 自供——CSP 的 script-src 'self' 直接覆盖，无需
     hash 钉（内联块才钉）。相对 src，不带协议/双斜杠（无外链断言口径）。
     置于内联脚本之前：经典 script 保序，渲染器先到，页面脚本可用。 -->
<script src="static/markdown.js"></script>
<script>
'use strict';
// W1.2 换票：/?token= 首跳被服务端 303 换成 HttpOnly cookie，本页落在
// 干净的 / 上——正常路径 TOKEN 恒为空，鉴权靠 cookie（fetch/EventSource
// 同源自带）。仍读 URL 是给未换票直开的形态兜底（能读到的只会是错 token）。
const TOKEN = new URLSearchParams(location.search).get('token') || '';
const q = s => s + (s.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(TOKEN);

// 会话身份（W1.3，D-W3）：uuid 浏览器自铸、localStorage 持久；服务端
// 零会话状态——它只是 bindings 表的键（web:<uuid>）。localStorage 不可
// 用（隐私模式抛异常）时退化为本次页面加载的临时 uuid。
const CONV_KEY = 'seek-web-conv';
function mintConv() {
  // crypto.randomUUID 仅 secure context（localhost/https）可用；经
  // tailnet IP 直连是 http，退到 getRandomValues 拼 uuid v4。
  if (crypto.randomUUID) return crypto.randomUUID();
  const b = crypto.getRandomValues(new Uint8Array(16));
  b[6] = (b[6] & 0x0f) | 0x40;
  b[8] = (b[8] & 0x3f) | 0x80;
  const h = [...b].map(x => x.toString(16).padStart(2, '0')).join('');
  return [h.slice(0,8), h.slice(8,12), h.slice(12,16), h.slice(16,20), h.slice(20)].join('-');
}
let CONV = null;
try {
  CONV = localStorage.getItem(CONV_KEY);
  if (!CONV || !/^[A-Za-z0-9._-]{1,64}$/.test(CONV)) {
    CONV = mintConv();
    localStorage.setItem(CONV_KEY, CONV);
  }
} catch (e) { CONV = mintConv(); }
const status = document.getElementById('status');
const statusL = document.getElementById('status-l');
const list = document.getElementById('list');
const form = document.getElementById('form');
const input = document.getElementById('input');
const send = document.getElementById('send');
const tray = document.getElementById('tray');

function setStatus(text, ok) {
  statusL.textContent = text;   // 右段 #usage 是计量专属，互不覆盖
  status.className = ok ? 'ok' : 'warn';
}

// ---- 状态栏 usage 计量（W2.3，§3.1 之 3）----
// 每个命名 usage 事件（源=turn_end）实时累加：tokens 会话累计 + 服务端
// 算好的 $（§2.5 纪律：计价只在服务端价格包一处，本页永不算钱，
// cost_usd 直加）；reply 收口携带 session_id（源=agent_end）时补短显。
// 累计口径=本页生命周期内本 conv 的全部 run，与 CLI footer 的会话累计
// 同向；SSE 无历史回放，刷新页面从零重计（P3 资产面才补回放）。
const usageEl = document.getElementById('usage');
const meter = { prompt: 0, completion: 0, cacheHit: 0, costUsd: 0, sid: '' };
// $ 格式与服务端 FormatCost 同阈值（0→$0、<1¢ 四位、<$1 三位、
// 其余两位）——web 页与 CLI footer 的钱数读法一致。
function fmtUsd(v) {
  if (v <= 0) return '$0';
  if (v < 0.01) return '$' + v.toFixed(4);
  if (v < 1) return '$' + v.toFixed(3);
  return '$' + v.toFixed(2);
}
function renderMeter() {
  if (!meter.prompt && !meter.completion) return;  // 首个 turn_end 前不占位
  usageEl.textContent = (meter.prompt + meter.completion) + ' tok · ' + fmtUsd(meter.costUsd)
      + (meter.sid ? ' · sid ' + meter.sid.slice(0, 8) : '');
}

// ---- 顶栏 ContextMeter + SSE 连接灯（W5 卡 c_oyp2qf）----
// 余量口径对齐 dsh ContextMeter（窗口占用百分比）与 TUI formatBudget：
// 占用代理 = 末个 turn_end 的 prompt+completion（累计值随历史逐轮重发
// 二次膨胀，不反映窗口现状）；上限 ctx_limit 与车道 lane 由服务端随
// usage 事件下发（budget.Limit / modelcap.LaneOf——同源判定，页面不自建
// 表）。色阶与 internal/budget Classify 同阈值：≥60% 黄、≥75% 红。
const ctxEl = document.getElementById('ctx');
const ctxM = document.getElementById('ctx-m');
const ctxFill = ctxEl.querySelector('.bar i');
const ctxP = document.getElementById('ctx-p');
const ctx = { used: 0, limit: 0, model: '', lane: '' };
function fmtTok(n) {
  if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
  if (n >= 1e3) return Math.round(n / 1e3) + 'K';
  return String(n);
}
function renderCtx() {
  if (!ctx.model || !ctx.limit) { ctxEl.hidden = true; return; }
  ctxEl.hidden = false;
  ctxM.textContent = ctx.model + (ctx.lane ? ' · ' + ctx.lane : '');
  const frac = Math.min(ctx.used / ctx.limit, 1);
  ctxFill.style.width = (frac * 100).toFixed(1) + '%';
  ctxP.textContent = Math.round(frac * 100) + '% · 余 ' + fmtTok(Math.max(ctx.limit - ctx.used, 0));
  ctxEl.title = '上下文 ~' + fmtTok(ctx.used) + ' / ' + fmtTok(ctx.limit);
  ctxEl.className = frac >= 0.75 ? 'crit' : frac >= 0.6 ? 'warn' : '';
}
// 连接灯：绿=已连、黄=断线重连中；断线提示条 #connbar 与灯同源开合。
// 首连成功前的「连接中」不算断线（不弹提示条）；绑定状态行不再被断线
// 文案占位——断线这件事由灯+提示条专职表达。
const connEl = document.getElementById('conn');
const connBar = document.getElementById('connbar');
let connEverOpen = false;
function connSet(ok) {
  connEl.className = ok ? 'ok' : 'warn';
  connBar.hidden = ok || !connEverOpen;
  if (ok) connEverOpen = true;
}
// 消息正文渲染（W5 卡 c_x2au4t）：markdown 子集渲染器外置在
// static/markdown.js（围栏/行内码/标题/列表/链接；DOM API 白名单构造，
// 无 HTML 解析 sink）。seekMD.render 自带清空语义（replaceChildren 后渲
// 染）。资产未载的极端情形（script 被网络/CSP 拦）退纯文本——可用性
// 优先于格式，页面不因渲染器缺席而断流。
function renderBody(el, text) {
  if (window.seekMD) seekMD.render(el, text);
  else el.textContent = text;
}

function addMsg(who, text, atts) {
  const el = document.createElement('div');
  el.className = 'msg ' + who;
  if (atts && atts.length) {
    el.appendChild(thumbsFor(atts));   // 附件缩略图（W5 c_56yrcj）：图片在上，正文在下
    if (text) {
      const b = document.createElement('div');
      renderBody(b, text);             // 纯 DOM 构建：无 HTML 注入面
      el.appendChild(b);
    }
  } else {
    renderBody(el, text);              // 纯 DOM 构建：无 HTML 注入面
  }
  list.appendChild(el);
  list.scrollTop = list.scrollHeight;  // 流式追加：贴底滚动
}

// ---- 附件（W5 c_56yrcj）----
// 三入口汇到 addFiles：按扩展名分流（图片=视觉车道，文档=Files API 车道），
// POST /attach 上传（XHR 才有进度），成功后把服务端路径拼成「@<path>」追加
// 进 /msg 正文。能力判定仍只在子进程的 visionRouter/fileroute 里。
const ATT_IMG = new Set(['png', 'jpg', 'jpeg', 'webp', 'gif']);
const ATT_DOC = new Set(['pdf', 'doc', 'docx', 'ppt', 'pptx']);
const IMG_MAX = 32 * 1024 * 1024;    // = assets.MaxAssetBytes（图片车道）
const DOC_MAX = 100 * 1024 * 1024;   // = deepseek.FileMaxBytes（文档车道）
const attachments = [];              // 只活在本次页面生命周期
// 拼串再下标：页面级「无外链」闸的 CSS 资源正则会把该方法的调用形状
// 误判成资源加载（它读本地文件，不产生请求）。
const FR_READ_DATA_URL = 'readAsData' + 'URL';

function attExt(name) {
  const i = name.lastIndexOf('.');
  return i < 0 ? '' : name.slice(i + 1).toLowerCase();
}

// thumbsFor 造气泡缩略图块；图片 src 可能在 FileReader 读完才回填。
function thumbsFor(atts) {
  const box = document.createElement('div');
  box.className = 'thumbs';
  for (const a of atts) {
    if (a.kind === 'image') {
      const im = document.createElement('img');
      im.alt = a.name;
      if (a.dataUrl) im.src = a.dataUrl;
      a.imgs.push(im);
      box.appendChild(im);
    } else {
      const d = document.createElement('span');
      d.className = 'doc';
      d.textContent = '📄 ' + a.name;
      box.appendChild(d);
    }
  }
  return box;
}

function renderTray() {
  tray.replaceChildren();
  tray.classList.toggle('has', attachments.length > 0);
  for (const a of attachments) {
    const chip = document.createElement('div');
    chip.className = 'chip' + (a.status === 'error' ? ' bad' : '');
    if (a.kind === 'image' && a.dataUrl) {
      const im = document.createElement('img');
      im.className = 'tn';
      im.alt = '';
      im.src = a.dataUrl;
      chip.appendChild(im);
    }
    const nm = document.createElement('span');
    nm.className = 'nm';
    nm.textContent = a.name;
    chip.appendChild(nm);
    const pc = document.createElement('span');
    pc.className = 'pc';
    pc.textContent = a.status === 'error' ? (a.err || '失败')
      : a.status === 'done' ? '已就绪'
      : a.status === 'uploading' ? a.pct + '%' : '等待';
    chip.appendChild(pc);
    const rm = document.createElement('button');
    rm.type = 'button';
    rm.className = 'rm';
    rm.title = '移除';
    rm.textContent = '×';
    rm.addEventListener('click', () => {
      const i = attachments.indexOf(a);
      if (i >= 0) attachments.splice(i, 1);
      renderTray();
    });
    chip.appendChild(rm);
    if (a.status === 'uploading') {
      const pb = document.createElement('div');
      pb.className = 'pb';
      const fill = document.createElement('i');
      fill.style.width = a.pct + '%';
      pb.appendChild(fill);
      chip.appendChild(pb);
    }
    tray.appendChild(chip);
  }
}

// attachOne：本地预检（类型/空/上限）→ 图片读预览 → /attach 上传
// （progress 喂进度条）。promise 落在 a.wait，发送前统一等。
function attachOne(file) {
  const name = file.name || 'attachment';
  const ext = attExt(name);
  const kind = ATT_IMG.has(ext) ? 'image' : ATT_DOC.has(ext) ? 'file' : '';
  const a = { name, ext, kind, size: file.size, dataUrl: '', imgs: [],
              status: 'uploading', pct: 0, path: '', err: '', wait: null };
  attachments.push(a);
  if (!kind) {
    a.status = 'error';
    a.err = '不支持该类型';
    renderTray();
    return Promise.resolve(a);
  }
  if (a.size === 0) {
    a.status = 'error';
    a.err = '文件为空';
    renderTray();
    return Promise.resolve(a);
  }
  const cap = kind === 'image' ? IMG_MAX : DOC_MAX;
  if (a.size > cap) {
    a.status = 'error';
    a.err = '超过 ' + (cap >> 20) + ' MiB 上限';
    renderTray();
    return Promise.resolve(a);
  }
  if (kind === 'image') {
    const fr = new FileReader();
    fr.onload = () => {
      a.dataUrl = String(fr.result || '');
      for (const im of a.imgs) im.src = a.dataUrl;
      renderTray();
    };
    fr[FR_READ_DATA_URL](file);
  }
  renderTray();
  a.wait = new Promise(resolve => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', q('/attach?name=' + encodeURIComponent(name)));
    xhr.setRequestHeader('X-Seek-Conversation', CONV);
    xhr.upload.onprogress = ev => {
      if (!ev.lengthComputable) return;
      a.pct = Math.round(ev.loaded * 100 / ev.total);
      renderTray();
    };
    xhr.onload = () => {
      let j = null;
      try { j = JSON.parse(xhr.responseText); } catch (e) { /* 非 JSON 错误体 */ }
      if (xhr.status === 201 && j && j.path) {
        a.status = 'done';
        a.pct = 100;
        a.path = j.path;
      } else {
        a.status = 'error';
        a.err = (j && j.error) || ('HTTP ' + xhr.status);
      }
      renderTray();
      resolve(a);
    };
    xhr.onerror = () => {
      a.status = 'error';
      a.err = '网络错误';
      renderTray();
      resolve(a);
    };
    xhr.send(file);
  });
  return a.wait;
}

function addFiles(files) {
  const picked = [...files];
  if (!picked.length) return Promise.resolve([]);
  return Promise.all(picked.map(attachOne));
}

function dragHasFiles(ev) {
  const t = ev.dataTransfer && ev.dataTransfer.types;
  return !!t && [...t].indexOf('Files') >= 0;
}

// 绑定状态一行：GET /state（本 conv 的 binding，头携带会话身份）。返回
// 是否已鉴权——启动时据此决定挂不挂 SSE（W1.2：凭证可能是 cookie，页内
// 无从预判，探测是唯一权威）。boundProject 记下当前绑定（或 null）供
// 任务面板的 topic 订阅判定（W3.3）：换绑项目后重开订阅跟随新项目。
// boundProjectID 是同一绑定的 /rpc 键（服务端算好的 16 hex）——子代理面板
// 走 subagent/list|get 时要它，页面不自己哈希路径。
let boundProject = null;
let boundProjectID = '';
let boundSession = null;  // 本 conv 的绑定会话（侧栏当前项高亮的退化基准）
// 「上一次 refreshState 看到的绑定会话」：变了就说明新会话已落盘（首条消息
// 跑完、/new、/bind）——侧栏是常驻面，得跟着磁盘世界刷新一次列表，否则新
// 会话要等整页刷新才出现。undefined = 首次 /state 还没回（启动那一次由
// boot 的 loadSessions 负责，避免双拉）。
let lastSeenSession;
async function refreshState() {
  try {
    const r = await fetch(q('/state'), { headers: { 'X-Seek-Conversation': CONV } });
    if (r.status === 401) {
      setStatus('token 无效或未带——用 /?token=<serve 启动时打印的值> 打开', false);
      return false;
    }
    const s = await r.json();
    boundProject = s.bound ? s.project : null;
    boundProjectID = s.bound ? (s.project_id || '') : '';
    boundSession = s.session || null;
    setStatus(s.bound ? '已绑定 ' + s.project + (s.session ? ' · 会话 ' + s.session.slice(0, 8) : '')
                      : '未绑定——发 /bind <项目路径>（或 /projects 看候选）', s.bound);
    syncTopicStream();               // /bind 落地后面板订阅即时跟上
    syncAgentRefresh();              // 绑定到位后定时刷新才敢起（c_4doebx）
    if (sessList) markCur();         // 侧栏当前项跟随绑定（W5 侧栏）
    // 绑定会话变了 = 磁盘上多了一条（或换了一条）：常驻侧栏跟着刷新，否则
    // 新会话要等整页刷新才出现在列表里。首帧由 boot 的 loadSessions 拉。
    if (lastSeenSession !== undefined && lastSeenSession !== boundSession) loadSessions();
    lastSeenSession = boundSession;
    return true;
  } catch (e) { setStatus('连不上 /state：' + e, false); return false; }
}

// ---- 流式 run 折叠（W2.1，feature-web-frontend §2.4/§2.5 客户端半边）----
// 服务端把一次 seek 运行的 jsonLine 折成命名 SSE 事件：delta {run,text}、
// tool {run,id,name,phase,ok}、usage {run,…}（W2.3 状态栏的入项，本卡不
// 消费——EventSource 对未注册的命名事件静默忽略）；终答走默认事件 reply
// {conv,text,run?,session_id?}。run id 由服务端铸造（§2.5），页面按 run
// 聚合：delta 累积进文本块、tool 进单行折叠状态行，按到达顺序交错在
// 同一个气泡里；带 run 的 reply 到达时整泡替换成权威终文本——客户端
// 累积只是预览，丢帧/未见过该 run 的 reply 走普通消息路径，天然幂等。
const runs = new Map();   // runId → {el, cur, tools}
let lastRun = '';         // 最新流式 run：/cancel 武装的对象（服务端每 conv 至多一个活跃 run，即最新泡）
let stopping = '';        // 已发 /cancel 待收口的 run id：它的 run-bearing reply 走保留式中断收口（c_5m3fm6）
let raf = 0;
const dirty = new Set();  // 本帧待重渲的 run（SSE 突发合帧，一帧最多渲一次）

// ---- 发送/停止键态（c_5m3fm6，对齐 dsh InputBar 中断语义）----
// 生成中（本 conv 有活跃 run——首个 delta/tool 事件起、reply 收口止）发送键
// 变停止键；键态只跟 runs 表走，流事件开、收口关，无生成时恒为发送键。
function renderSend() {
  const busy = runs.size > 0;
  send.textContent = busy ? '⏹ 停止' : '发送';
  send.classList.toggle('stop', busy);
  send.title = busy ? '中断当前生成（等同 /cancel）' : '';
}

function nearBottom() {
  return list.scrollHeight - list.scrollTop - list.clientHeight < 80;
}
// 追加/替换后只在「本来就在底」时跟随滚动——读历史不被流式追加劫持。
// pin 必须在 DOM 变更前采样：先改 DOM 再测，新增高度本身就把距离撑过阈值。
function appendPinned(parent, el) {
  const pin = nearBottom();
  parent.appendChild(el);
  if (pin) list.scrollTop = list.scrollHeight;
}

function runBubble(id) {
  let r = runs.get(id);
  if (r) return r;
  const el = document.createElement('div');
  el.className = 'msg seek streaming';
  r = { el, cur: null, tools: new Map(), tick: 0 };  // tick: 耗时跳动 interval id
  runs.set(id, r);
  lastRun = id;
  renderSend();               // 首个流事件即键态切换（c_5m3fm6）
  appendPinned(list, el);
  return r;
}

// 幻影 run 收口（c_6mbjfq）：SSE 不回放，run 的收口帧一旦落在断连窗口就永久丢了
// ——页面这边只剩 runs 表里的一条记录和它的半截气泡，键态于是永远停在 ⏹。
// 重连本身给不出判据（服务端 /state 不报活跃 run；按 run 龄盲清会截断仍在跑的
// 气泡，见 docs/pitfalls.md），唯一的自愈信号是：本页为这个 run 发过 /cancel，
// 回来的却是一条 run-less 应答——服务端都没得中断了，它早结束了，只是收口丢了。
// 收口沿用 c_5m3fm6 的保留式（半截就是内容）：关流式、尾部标注、从表里删——
// 键态只跟表走，删掉即走 renderSend 的 runs.size=0 分支回「发送」。
function closePhantom(id) {
  const r = runs.get(id);
  if (!r) return;
  runs.delete(id);
  if (lastRun === id) lastRun = '';
  r.cur = null;                            // 停掉在途的合帧渲染
  r.el.classList.remove('streaming');
  const cut = document.createElement('div');
  cut.className = 'cut';
  cut.textContent = '—— 已中断 ——';
  r.el.appendChild(cut);
  renderSend();
}

function schedule(r) {
  dirty.add(r);
  if (!raf) raf = requestAnimationFrame(flushRuns);
}
function flushRuns() {
  raf = 0;
  const pin = nearBottom();
  for (const d of dirty) {
    // 流式重渲（W5 轻量路径）：seekMD.render 清块后重渲累积全文——
    // 线性单趟、rAF 合帧（SSE 突发一帧最多渲一次），聊天级文本亚毫秒；
    // 未闭合围栏/半截 [ ` 保持字面可渲，故过程态与收口同一条渲染线。
    if (d.cur) renderBody(d.cur.el, d.cur.text);
  }
  dirty.clear();
  if (pin) list.scrollTop = list.scrollHeight;
}

function onDelta(ev) {
  let d;
  try { d = JSON.parse(ev.data); } catch (e) { return; }
  if (!d.run || typeof d.text !== 'string') return;
  const r = runBubble(d.run);
  if (!r.cur) {   // 首 delta 或工具行之后：开新文本块，保持到达顺序
    const b = document.createElement('div');
    b.className = 'txt';
    appendPinned(r.el, b);
    r.cur = { el: b, text: '' };
  }
  r.cur.text += d.text;
  schedule(r);
}

// 工具行 → 调用树（c_ux7lvk，对齐 dsh 的工具调用树呈现；§2.5 线不变：
// args/result 服务端不下发，tool_end.result 可以巨大）。每次调用一行 =
// 名称+耗时：耗时是 start/end 两帧到达的墙钟差（SSE 逐帧即时转发，目测
// 级足够），在途每 300ms 跳动、end 冻结；未见 start 的 end（丢帧）行照
// 补但无耗时。嵌套缩进 = 区间包含：start 时刻在途（已 start 未 end）调
// 用数即深度——seek 分区派发让只读调用并发，重叠区间呈现为父子缩进
// （火焰图口径：呈现重叠，不主张因果；串行运行的区间不嵌，树保持平）。
// 行按 tool id 幂等。树渲染抛错时退 toolPlainRow（升级前的名称+状态
// 单行折叠）——流式面不白屏。
function onTool(ev) {
  let d;
  try { d = JSON.parse(ev.data); } catch (e) { return; }
  if (!d.run || !d.name) return;
  try { toolTreeRow(d); } catch (e) { toolPlainRow(d); }
}

// 耗时排版：<1s 毫秒整数；<60s 一位小数秒；再上分秒。
function fmtDur(ms) {
  if (ms < 0) ms = 0;
  if (ms < 1000) return Math.max(1, Math.round(ms)) + 'ms';
  const s = ms / 1000;
  if (s < 60) return s.toFixed(1) + 's';
  return Math.floor(s / 60) + 'm' + String(Math.round(s % 60)).padStart(2, '0') + 's';
}

function trowPaint(n, now) {
  const end = n.phase === 'end';
  let dur = '';
  if (n.t0) {
    const ms = (end ? n.t1 : (now || performance.now())) - n.t0;
    if (ms >= 0) dur = ' · ' + fmtDur(ms);
  }
  n.el.textContent = (end ? (n.ok ? '✔ ' : '✘ ') : '⚙ ') + n.name + (end ? '' : ' …') + dur;
  n.el.classList.toggle('bad', end && !n.ok);
}

function toolTreeRow(d) {
  const r = runBubble(d.run);
  r.cur = null;   // 工具行截断当前文本块，后续 delta 开新块（交错顺序）
  let n = r.tools.get(d.id);
  if (!n) {
    let depth = 0;   // 在途数=区间包含深度（页头注释口径）
    for (const t of r.tools.values()) if (t.phase !== 'end') depth++;
    const el = document.createElement('div');
    el.className = 'trow';
    if (depth > 0) el.style.marginLeft = depth * 16 + 'px';   // CSSOM：数值宽度
    appendPinned(r.el, el);
    n = { el, name: d.name, phase: '', ok: true, t0: 0, t1: 0 };
    r.tools.set(d.id, n);
  }
  n.phase = d.phase === 'end' ? 'end' : 'start';
  // ok 是 omitempty 布尔（webToolEvent wire 契约）：end 帧只在成功时带
  // ok:true，失败帧整个键缺席——判定必须按「true 才算成功」读，旧代码
  // 的 d.ok? 把失败帧也读成 ✔（c_ux7lvk 随调用树一并修正）。
  n.ok = d.ok === true;
  if (n.phase === 'end') {
    n.t1 = performance.now();
    trowPaint(n);
    // 全部收口即停表（reply 丢帧时也只多跳一拍）
    let live = false;
    for (const t of r.tools.values()) if (t.phase !== 'end') live = true;
    if (!live && r.tick) { clearInterval(r.tick); r.tick = 0; }
  } else {
    if (!n.t0) n.t0 = performance.now();
    trowPaint(n);
    toolTick(r);
  }
}

// 一个 run 一只节拍器：在途行统一重画（合帧，不逐行起 interval）。
function toolTick(r) {
  if (r.tick) return;
  r.tick = setInterval(() => {
    let live = false;
    const now = performance.now();
    for (const t of r.tools.values()) if (t.phase !== 'end') { live = true; trowPaint(t, now); }
    if (!live) { clearInterval(r.tick); r.tick = 0; }
  }, 300);
}

// 兜底＝升级前的折叠形态（名称+状态单行，无耗时/缩进）。
function toolPlainRow(d) {
  const r = runBubble(d.run);
  r.cur = null;
  let n = r.tools.get(d.id);
  if (!n) {
    const el = document.createElement('div');
    el.className = 'trow';
    appendPinned(r.el, el);
    n = { el, name: d.name, phase: '', ok: true, t0: 0, t1: 0 };
    r.tools.set(d.id, n);
  }
  const end = d.phase === 'end';
  n.el.textContent = (end ? (d.ok === true ? '✔ ' : '✘ ') : '⚙ ') + d.name + (end ? '' : ' …');
  n.el.classList.toggle('bad', end && d.ok !== true);   // omitempty：失败帧无 ok 键
}

// ---- 审批卡片（W5 卡 c_n37tnr，§3.4 远程审批）----
// 服务端审批 hub 的浏览器半边：SSE approval 事件（pending 弹卡 /
// resolved|cancelled 撤卡）+ /rpc approval/decide（y|n|a 对齐 permission
// 语义）。幂等：卡按 id 增删；点击即整卡禁用（防抖不双发）。空态零侵入
// （角标 hidden、卡栈 :empty 隐藏）。重连快照重建走墓碑集——快照可能取在
// 回执前，直接回填会复活刚撤的卡（subagents 面板同款竞态）。
const apBox = document.getElementById('approvals');
const apBadge = document.getElementById('ap-badge');
const apCards = new Map();   // id → {root, done}
const apTomb = [];           // 最近撤下的 id（防快照复活；保底 32 条）

function apBadgeRender() {
  const n = apCards.size;
  apBadge.textContent = n ? '⏳ 待审批 ' + n : '';
  apBadge.hidden = n === 0;           // 空态零侵入：无未决不占顶栏
}

function apDrop(id) {
  const c = apCards.get(id);
  if (!c) return;                     // 重复回执/未知撤卡：幂等无感
  apCards.delete(id);
  c.root.remove();
  if (!apTomb.includes(id)) {
    apTomb.push(id);
    if (apTomb.length > 32) apTomb.shift();
  }
  apBadgeRender();
}

// 命令摘要按模型产物处理：textContent-only，无 HTML 解析面（§5.5）。
function apAdd(v) {
  if (!v || !v.id || apCards.has(v.id)) return;
  const root = document.createElement('div');
  root.className = 'apcard';
  root.dataset.id = v.id;
  const t = document.createElement('div');
  t.className = 'apt';
  t.textContent = '🔑 审批 · ' + (v.kind || '?') + (v.run ? ' · run ' + v.run.slice(0, 8) : '');
  const s = document.createElement('p');
  s.className = 'aps';
  s.textContent = v.summary || '（无描述）';
  root.appendChild(t);
  root.appendChild(s);
  if (v.command) {
    const pre = document.createElement('pre');
    pre.textContent = v.command;
    root.appendChild(pre);
  }
  const bar = document.createElement('div');
  bar.className = 'apb';
  for (const [dec, label, tip] of [
    ['y', '✅ 允许', '允许这一次'],
    ['n', '❌ 拒绝', '拒绝；拒绝仍是工具结果，不是致命错'],
    ['a', '♾ 总是允许', '本次会话内同类操作不再询问（always-allow）'],
  ]) {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = label;
    b.title = tip;
    b.addEventListener('click', () => apDecide(v.id, dec));
    bar.appendChild(b);
  }
  root.appendChild(bar);
  apBox.appendChild(root);
  apCards.set(v.id, { root, done: false });
  apBadgeRender();
}

// 决定上行：先整卡禁用（防抖——重复点击不二次发 POST），RPC 失败才复能；
// 成功即撤卡（SSE 回执会再撤一次，apDrop 幂等；其它标签页靠同一回执撤）。
async function apDecide(id, dec) {
  const c = apCards.get(id);
  if (!c || c.done) return;
  c.done = true;
  for (const b of c.root.querySelectorAll('button')) b.disabled = true;
  try {
    await rpc('approval/decide', { id, decision: dec });
    apDrop(id);
  } catch (e) {
    c.done = false;                   // 决定未落账：复能重试
    for (const b of c.root.querySelectorAll('button')) b.disabled = false;
    addMsg('hint', '（审批操作失败：' + e.message + '）');
  }
}

function onApproval(ev) {
  try {
    const v = JSON.parse(ev.data);
    if (!v || !v.id) return;
    if (v.state === 'pending') apAdd(v);
    else apDrop(v.id);
  } catch (e) { /* 单条坏帧不毁卡片栈 */ }
}

// 快照重建（页面加载 / SSE 重连）：墓碑里的 id 跳过（撤卡先到、快照后到
// 的竞态）。失败静默——SSE 推送仍可用，与资产面同款取舍。
async function apResync() {
  try {
    const res = await rpc('approval/list', { conv: CONV });
    for (const v of (res.approvals || [])) {
      if (apTomb.includes(v.id)) continue;
      apAdd(v);
    }
  } catch (e) { /* 快照拉不到不算错：卡片栈靠推送维持 */ }
}

// SSE 下行。EventSource 不能设头，conv 走查询参数；鉴权走 cookie（换票
// 后）或 TOKEN 查询参数（旧形态），两者服务端同权。W2.1 起消费 W1.4 的
// 事件族：命名事件 delta/tool 折进流式气泡；默认事件里带 run 的 reply
// 是流式收口（整泡替换），无 run 的照旧普通消息。（重）连上即刷一次绑定
// 状态（W2.2）；断线态由连接灯+提示条表达（W5 c_oyp2qf），绑定行不被
// 占位——重连后 onopen 的刷新自然收敛。listen 幂等（旧连接先 close），
// 手动重连钮与启动挂流同走这一条，绝不双连。
let es = null;
function listen() {
  if (es) es.close();
  es = new EventSource(q('/events?conv=' + encodeURIComponent(CONV)));
  es.addEventListener('delta', onDelta);
  es.addEventListener('tool', onTool);
  es.addEventListener('approval', onApproval);   // W5 c_n37tnr：审批卡族
  es.onopen = () => { connSet(true); refreshState(); apResync(); };  // 重连即快照重建卡片栈
  es.onmessage = ev => {
    let m;
    try { m = JSON.parse(ev.data); } catch (e) { addMsg('hint', '（无法解析的回复）'); return; }
    const r = m.run && runs.get(m.run);
    if (r) {   // 收口：替换成服务端权威终文本（§2.4 客户端按 run 幂等）；
               // renderBody 自带清空——整泡重渲即「收口重渲」（W5）
      runs.delete(m.run);
      r.cur = null;                    // 停掉在途的合帧渲染
      if (r.tick) { clearInterval(r.tick); r.tick = 0; }   // 停掉耗时跳动
      const pin = nearBottom();
      r.el.classList.remove('streaming');
      if (m.run === stopping) {
        // 中断收口（c_5m3fm6）：这份 run-bearing reply 是 /cancel 的 ack——
        // 文本只是回执，已累积的半截才是被中断 run 的内容。保留气泡 + 尾部
        // 标注中断，不做权威替换；服务端终态「run 已中断。」随后 run-less
        // 独立成条。ack/终态谁先带 run 不定（服务端只保「恰一条」），两条
        // 路径在此同形。
        stopping = '';
        const cut = document.createElement('div');
        cut.className = 'cut';
        cut.textContent = '—— 已中断 ——';
        r.el.appendChild(cut);
      } else if (m.text) {
        renderBody(r.el, m.text);
      } else {
        r.el.remove();
      }
      if (pin) list.scrollTop = list.scrollHeight;
      renderSend();                    // 收口即键态复位（c_5m3fm6）
    } else if (m.text) {
      addMsg('seek', m.text);   // 指令应答 / 丢帧回退：普通消息路径
      // 幻影 run 自愈（c_6mbjfq）：本页为某个 run 发过 /cancel，回来的却是
      // run-less 应答——服务端已无 run 可中断 = 它早已结束，收口帧落在断连
      // 窗口里丢了（SSE 不回放）。把那条永不收口的表项按保留式收掉，键态随之
      // 回「发送」。正常中断里 run-bearing 那条（ack 或终态）先到，stopping
      // 已被清、此分支空转。
      // 武装窗口内的其它指令应答（run-less，如 /projects）也会走到这里：那个
      // run 反正已被本页发出的 /cancel 杀掉，差别只是它的 ack 随后落到普通消息
      // 路径、多出一条回执气泡——宁可多一条气泡，也不让键永久卡在 ⏹。
      if (stopping) {
        const phantom = stopping;
        stopping = '';
        closePhantom(phantom);
      }
    }
    if (m.session_id) {         // W2.3：agent_end 终值——run 收口带 sid
      meter.sid = m.session_id;
      renderMeter();
    }
    refreshState();             // 回复可能改了绑定（/bind 等）
  };
  // usage（源=turn_end）：多 turn 逐次累加，turn 间即实时上屏；W5 起
  // 同帧带 ContextMeter 三件（model/lane/ctx_limit）——末轮占用即时刷新。
  es.addEventListener('usage', ev => {
    try {
      const u = JSON.parse(ev.data);
      meter.prompt += u.prompt || 0;
      meter.completion += u.completion || 0;
      meter.cacheHit += u.cache_hit || 0;
      meter.costUsd += u.cost_usd || 0;
      renderMeter();
      if (u.model) {
        ctx.model = u.model;
        ctx.lane = u.lane || '';
        ctx.limit = u.ctx_limit || 0;
      }
      ctx.used = (u.prompt || 0) + (u.completion || 0);  // 占用代理：末轮口径
      renderCtx();
    } catch (e) { /* 坏帧跳过——计量不因单帧畸形中断 */ }
  });
  es.onerror = () => connSet(false);   // 灯转黄+提示条；EventSource 自带 3s 重试
  // push-to-talk（voice V2）：转写回显与失败面。命名事件不进 onmessage
  // （SSE 设计，旧页面零感知）；voice conv 的 seek 回复走上面的默认事件
  // 路径（无 run id → 普通气泡）。
  es.addEventListener('voice', ev => {
    try { const d = JSON.parse(ev.data); if (d.text) addMsg('you', d.text); } catch (e) {}
  });
  es.addEventListener('voice-error', ev => {
    try { const d = JSON.parse(ev.data); addMsg('hint', '（' + (d.error || '语音识别失败') + '）'); } catch (e) {}
  });
}
// 手动重连（W5 c_oyp2qf）：断线提示条上的出口——不等 3s 自动重试，立即
// 重建连接（listen 幂等，先 close 旧的）。服务端仍不可用则新连接照旧
// onerror 转黄、提示条保持，可反复点。
document.getElementById('reconn').addEventListener('click', () => listen());

// 上行共用路径（W2.2 抽出）：表单提交与指令快捷按钮同走这一条 POST /msg
// 纯文本透传——按钮与手打完全同权。fromInput 才清空输入框（按钮直发不动
// 用户打了一半的草稿）。指令（"/" 开头）POST 成功后即时刷一次 /state：
// 绑定类指令改的是 bindings 表，不等 SSE 回复先把状态行对齐；回复到达时
// onmessage 的刷新再收敛（两次幂等，竞态最多短暂显示旧值）。
// atts（W5 c_56yrcj）非空时把每个已就绪附件的路径拼成「@<path>」追加进
// 正文——这就是平面与 CLI 之间唯一的附件协议，child 的 imgrefs/filerefs
// 路由器照旧认领。
async function sendText(text, fromInput, atts) {
  if (send.disabled) return;
  const refs = (atts || []).filter(a => a.status === 'done' && a.path);
  const tokens = refs.map(a => '@' + a.path).join('\n');
  const body = text ? (tokens ? text + '\n' + tokens : text) : tokens;
  if (!body) return;
  // /cancel（停止键、顶栏按钮、手打三入口同此一条）：武装被中断的 run——
  // 它的 run-bearing ack 走保留式收口而非权威替换（c_5m3fm6）。无活跃 run
  // 时无从武装，ack 自会以普通消息路径给出「当前没有正在运行的任务。」。
  if (body.trim() === '/cancel') stopping = runs.size ? lastRun : '';
  addMsg('you', text, refs);
  if (fromInput) input.value = '';
  send.disabled = true;
  try {
    const r = await fetch(q('/msg'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Seek-Conversation': CONV },
      body: JSON.stringify({ text: body }),
    });
    if (r.status === 401) {
      addMsg('hint', '（token 无效，消息未送达——用带 ?token= 的地址打开）');
    } else if (!r.ok) {
      addMsg('hint', '（发送失败：HTTP ' + r.status + '）');
    } else {
      if (refs.length) {   // 已进正文的附件从托盘移除（失败的留在托盘里重试）
        for (const a of refs) {
          const i = attachments.indexOf(a);
          if (i >= 0) attachments.splice(i, 1);
        }
        renderTray();
      }
      if (body.startsWith('/')) refreshState();
    }
  } catch (e) { addMsg('hint', '（发送失败：' + e + '）'); }
  send.disabled = false;
}

// pendingAttachments 等在途上传收口，分出可用与失败两组。
async function pendingAttachments() {
  await Promise.all(attachments.map(a => a.wait).filter(Boolean));
  const ready = attachments.filter(a => a.status === 'done' && a.path);
  const failed = attachments.filter(a => a.status === 'error');
  return { ready, failed };
}

form.addEventListener('submit', async ev => {
  ev.preventDefault();
  if (send.disabled) return;
  const typed = input.value.trim();
  const { ready, failed } = await pendingAttachments();
  // 指令不吃附件（"/bind …" 后面拼路径只会变成指令参数）；有附件时先
  // 把失败项说清楚，用户能删掉再发。
  if (typed.startsWith('/')) {
    await sendText(typed, true);
    grow();
    input.focus();
    return;
  }
  if (failed.length) {
    addMsg('hint', '（' + failed.length + ' 个附件未就绪：' + failed.map(a => a.name).join('、')
      + '——请在下方移除后重发）');
  }
  if (!typed && !ready.length) { input.focus(); return; }
  await sendText(typed, true, ready);
  grow();
  input.focus();
});

// ---- 输入增强（c_7lsngm；对齐 dsh ui-input-trigger + ui-commands）----
// 全挂在输入框这条 input/keydown 线上，不碰全局键：Enter 发送 /
// Shift+Enter 原生换行；'/' 指令补全（候源 = 下面这张注册表）；
// '@' 最近会话（session/list），选中落 @<sid> 并发 /resume <sid>。
// 弹层开着时导航键就地消化，关掉即全部放行（Esc 不劫持页面）。
const CMDS = [
  { name: '/bind',     args: true,  desc: '绑定/重绑项目（会话重置，需补路径）' },
  { name: '/projects', args: false, desc: '列出候选项目与当前绑定' },
  { name: '/switch',   args: true,  desc: '切换到另一项目（需补路径）' },
  { name: '/new',      args: false, desc: '项目不变，开新会话' },
  { name: '/cancel',   args: false, desc: '中断本会话运行中的任务' },
  { name: '/resume',   args: true,  desc: '续到某个历史会话（@ 引用用它）' },
];

const menu = document.getElementById('menu');
let menuItems = [], menuHl = -1, menuCtx = null;  // 候选 / 高亮 / 上次判定的上下文

function closeMenu() {
  menu.hidden = true;
  menu.replaceChildren();
  menuItems = [];
  menuHl = -1;
}

function renderMenu() {
  menu.replaceChildren();
  menuItems.forEach((it, i) => {
    const row = document.createElement('div');
    row.className = 'mi' + (i === menuHl ? ' hl' : '');
    row.setAttribute('role', 'option');
    row.setAttribute('aria-selected', i === menuHl ? 'true' : 'false');
    for (const [cls, text] of [['nm', it.label], ['ds', it.desc], ['sid', it.meta]]) {
      if (!text) continue;
      const span = document.createElement('span');
      span.className = cls;
      span.textContent = text;
      row.appendChild(span);
    }
    // mousedown 而非 click：click 前 textarea 会先 blur 丢掉弹层局部态。
    row.addEventListener('mousedown', ev => { ev.preventDefault(); pick(i); });
    menu.appendChild(row);
  });
}

function moveHl(dir) {
  if (!menuItems.length) return;
  menuHl = (menuHl + dir + menuItems.length) % menuItems.length;
  renderMenu();
  const hl = menu.children[menuHl];
  if (hl && hl.scrollIntoView) hl.scrollIntoView({ block: 'nearest' });
}

function pick(i) {
  const it = menuItems[i];
  if (!it) return;
  closeMenu();
  it.apply();
}

function grow() {   // 高度自长，上限由 CSS max-height 兜
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, window.innerHeight * 0.4) + 'px';
}

// '/' 触发：草稿以 '/' 开头且还没有空格（= 还在打指令名）才弹。
function slashHits() {
  const v = input.value;
  if (!v.startsWith('/') || v.includes(' ')) return null;
  const q = v.slice(1).toLowerCase();
  const hits = CMDS.filter(c => c.name.slice(1).startsWith(q));
  if (!hits.length) return null;
  return hits.map(c => ({
    label: c.name,
    desc: c.desc,
    apply: () => {
      const t = c.name + (c.args ? ' ' : '');
      input.value = t;
      input.setSelectionRange(t.length, t.length);
      grow();
      input.focus();
    },
  }));
}

// '@' 触发：光标往左扫到 '@'、中间无空白 = 正在打一个引用。
function atToken() {
  const v = input.value, caret = input.selectionStart;
  if (caret == null) return null;
  for (let i = caret - 1; i >= 0; i--) {
    if (/\s/.test(v.charAt(i))) return null;
    if (v.charAt(i) === '@') return { start: i, query: v.slice(i + 1, caret) };
  }
  return null;
}

// 候源只在首次触发拉一次并缓存；失败/空也给一行提示（不静默无弹层）。
let atCache = null, atErr = null, atPending = false;

async function loadSessionsForAt() {
  if (atCache !== null || atPending) return;
  atPending = true;
  try {
    atCache = (await rpc('session/list', {})).sessions || [];
    atErr = null;
  } catch (e) {
    atCache = [];
    atErr = e.message || String(e);
  }
  atPending = false;
  if (atToken()) updateMenu();   // 拉回来时弹层还该开着：补上候选
}

function atHits() {
  if (atCache === null && !atErr) { loadSessionsForAt(); return null; }
  const notice = text => [{ label: text, desc: 'Esc 关闭', apply: () => {} }];
  if (atErr) return notice('（会话列表取不到：' + atErr + '）');
  const tok = atToken(), q = tok ? tok.query.toLowerCase() : '';
  const rows = atCache.filter(s => !q || s.sid.toLowerCase().includes(q)
                     || (s.title || '').toLowerCase().includes(q));
  if (!rows.length) return notice('（没有匹配的会话）');
  return rows.slice(0, 8).map(s => ({
    label: s.title || s.sid.slice(0, 8),
    desc: s.last_at ? new Date(s.last_at).toLocaleString() : '',
    meta: s.sid.slice(0, 8),
    apply: () => applyAt(s.sid),
  }));
}

// 把 @query 原位换成 @<sid>；再走平面已有的指令通道（POST /msg 纯文本）
// 发切换语义——入参即 session id。
function applyAt(sid) {
  const tok = atToken();
  if (!tok) return;
  const v = input.value;
  input.value = v.slice(0, tok.start) + '@' + sid + ' ' + v.slice(input.selectionStart);
  const caret = tok.start + sid.length + 2;
  input.setSelectionRange(caret, caret);
  grow();
  input.focus();
  sendText('/resume ' + sid, false);
}

// 候选上下文（触发位 + 查询词）：没变就不动现状——保 ↑↓ 高亮，也保 Esc
// 关掉后不被同一按键的 keyup 立刻重新弹开。
function ctxNow() {
  if (slashHits()) return 'slash|' + input.value;
  const at = atToken();
  return at ? 'at|' + at.start + '|' + at.query : '';
}

function updateMenu() {
  let items = slashHits();
  if (!items) items = atToken() ? atHits() : null;
  const ctx = items ? ctxNow() : '';
  if (ctx === menuCtx) return;
  menuCtx = ctx;
  if (!items) { closeMenu(); return; }
  menuItems = items;
  menuHl = 0;
  renderMenu();
  menu.hidden = false;
}

// keyup/click 必须包一层空箭头——直接挂 updateMenu 会把 Event 当实参，
// 每次按键重开弹层，↑↓ 高亮与 Esc 关闭立刻被抹掉。
input.addEventListener('input', () => { grow(); updateMenu(); });
input.addEventListener('keyup', () => updateMenu());
input.addEventListener('click', () => updateMenu());
input.addEventListener('blur', () => setTimeout(closeMenu, 0));  // 点别处才关

input.addEventListener('keydown', ev => {
  if (!menu.hidden && menuItems.length) {   // 导航键只作用于弹层
    if (ev.key === 'ArrowDown') { ev.preventDefault(); moveHl(1); return; }
