name: CI

# Trigger policy (2026-11-14, user decision): merges to main are gated LOCALLY
# (butler drive merge runs `go test` before landing), so a per-push matrix here
# duplicated that gate dozens of times a day. CI now runs:
#   - workflow_dispatch  — on-demand verification pass (the "验证阶段")
#   - schedule nightly   — once-a-day cross-OS drift catch (cheap middle ground)
#   - pull_request       — fork/contributor signal, unchanged (keyless, always-green)
#   - release-time full pass — owned by release.yml on v* tags (unchanged)
on:
  workflow_dispatch:
  schedule:
    - cron: '17 19 * * *'  # 03:17 Beijing daily
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...

  cross-build:
    name: cross-build (release targets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true
      - name: linux amd64
        run: GOOS=linux GOARCH=amd64 go build ./cmd/seek
      - name: linux arm64
        run: GOOS=linux GOARCH=arm64 go build ./cmd/seek
      - name: darwin amd64
        run: GOOS=darwin GOARCH=amd64 go build ./cmd/seek
      - name: darwin arm64
        run: GOOS=darwin GOARCH=arm64 go build ./cmd/seek
      - name: windows amd64
        run: GOOS=windows GOARCH=amd64 go build ./cmd/seek
      - name: windows arm64
        run: GOOS=windows GOARCH=arm64 go build ./cmd/seek

  layer-lint:
    name: layer-lint (pkg/deepseek must not import pkg/llm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: forbid pkg/deepseek -> pkg/llm imports
        run: |
          if grep -rnE 'github\.com/whyiyhw/seek/pkg/llm' pkg/deepseek; then
            echo "::error::pkg/deepseek must not import pkg/llm (see PRD §4.1)"
            exit 1
          fi

  doc-budgets:
    name: doc-budgets (AGENTS.md / CLAUDE.md must not accrete)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: verify standing docs stay within budget
        run: scripts/verify-doc-budgets.sh
