# GoReleaser v2 — invoked by .github/workflows/release.yml on `v*` tag push.
# Local dry-run:  goreleaser release --snapshot --clean --skip=publish
version: 2

project_name: seek

before:
  hooks:
    - go mod tidy

builds:
  - id: seek
    main: ./cmd/seek
    binary: seek
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      # Strip DWARF + symbol table; pure-Go, so binaries stay small.
      - -s -w
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: seek
    # Stable, predictable filenames the in-binary upgrader greps for.
    # Result: seek_<version>_<os>_<arch>.{tar.gz,zip}
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-dev"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"

release:
  github:
    owner: whyiyhw
    name: seek
  draft: false
  prerelease: auto
  name_template: "seek {{ .Tag }}"
